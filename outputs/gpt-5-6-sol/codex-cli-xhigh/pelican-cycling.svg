<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">海边骑自行车的鹈鹕</title>
  <desc id="desc">一只羽毛细腻的鹈鹕迎着海风骑复古青绿色自行车，背景有夕阳、海浪、礁石、沙滩与飞鸟。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b9d3"/>
      <stop offset=".47" stop-color="#b9d8d8"/>
      <stop offset=".78" stop-color="#f1c89f"/>
      <stop offset="1" stop-color="#f4b777"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbd9" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffd98b" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffc26c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9fb3"/>
      <stop offset=".52" stop-color="#267e95"/>
      <stop offset="1" stop-color="#125a72"/>
    </linearGradient>
    <linearGradient id="seaShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe8b7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff0b8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe1a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfbd85"/>
      <stop offset="1" stop-color="#a87545"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b99a74"/>
      <stop offset="1" stop-color="#7d654e"/>
    </linearGradient>
    <linearGradient id="framePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6f1e4"/>
      <stop offset=".3" stop-color="#289b9e"/>
      <stop offset=".68" stop-color="#08727c"/>
      <stop offset="1" stop-color="#044954"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9ffff"/>
      <stop offset=".25" stop-color="#8fa7aa"/>
      <stop offset=".48" stop-color="#eef6f2"/>
      <stop offset=".8" stop-color="#64777a"/>
      <stop offset="1" stop-color="#d9e2df"/>
    </linearGradient>
    <radialGradient id="tire" cx="35%" cy="28%">
      <stop offset="0" stop-color="#617078"/>
      <stop offset=".35" stop-color="#26333a"/>
      <stop offset="1" stop-color="#101a20"/>
    </radialGradient>
    <radialGradient id="bodyFeather" cx="37%" cy="28%">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset=".55" stop-color="#edf0e7"/>
      <stop offset="1" stop-color="#a9b3b0"/>
    </radialGradient>
    <linearGradient id="neckFeather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c2bd"/>
      <stop offset=".32" stop-color="#f9f7e8"/>
      <stop offset=".72" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#adb5af"/>
    </linearGradient>
    <linearGradient id="wingFeather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9e9"/>
      <stop offset=".5" stop-color="#cbd2cc"/>
      <stop offset="1" stop-color="#6f7d7d"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd47b"/>
      <stop offset=".42" stop-color="#f2a354"/>
      <stop offset="1" stop-color="#c6643f"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc988"/>
      <stop offset=".65" stop-color="#e88b62"/>
      <stop offset="1" stop-color="#b85345"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c27a"/>
      <stop offset="1" stop-color="#b36d4d"/>
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="cloudBlur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="objectShadow" x="-25%" y="-25%" width="160%" height="180%">
      <feDropShadow dx="9" dy="13" stdDeviation="10" flood-color="#172b32" flood-opacity=".34"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#18313b" flood-opacity=".38"/>
    </filter>
    <filter id="motionBlur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="8 2"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M671 379 C620 389 590 437 604 492 C621 556 714 582 797 548 C851 526 863 459 829 420 C790 376 731 367 671 379Z"/>
    </clipPath>
  </defs>

