const colors=['','#4b8b42','#795137','#657079','#d7d5ca','#c69a3a','#32bfe0','#2d2041'];function drawBar(){const b=document.getElementById('bar');b.innerHTML='';for(let i=1;i<=7;i++){const q=document.createElement('div');q.className='slot'+(i===selected?' on':'');q.innerHTML='<div class="cube" style="background:'+colors[i]+'"></div><span>'+i+'</span>';q.title=names[i];b.appendChild(q)}}drawBar();
function lore(){const r=Math.hypot(player.x,player.z),p=document.getElementById('place'),s=document.getElementById('story');if(Math.hypot(player.x-38,player.z+27)<14){p.textContent='云上藏书殿';s.textContent='浮空岛由神木根系托起，晶石在残破的穹顶下记录着诸界往事。'}else if(r<24){p.textContent='星陨圣庭';s.textContent='七重石台围绕天门，四座守望塔曾为远航者校准星路。'}else if(r<58){p.textContent='低语荒原';s.textContent='散落的星碑会在夜风中泛起蓝光，指向失落的云上殿堂。'}else{p.textContent='无垠边境';s.textContent='群山随脚步延伸。远离圣庭后，古老的守碑仍偶尔浮现。'}}
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.045,(now-last)/1000);last=now;updateChunks();camera.rotation.y=yaw;camera.rotation.x=pitch;if(locked){const speed=(keys.ShiftLeft||keys.ShiftRight)?8.5:5.2;let fx=0,fz=0;if(keys.KeyW)fz-=1;if(keys.KeyS)fz+=1;if(keys.KeyA)fx-=1;if(keys.KeyD)fx+=1;const len=Math.hypot(fx,fz)||1;fx/=len;fz/=len;const dx=(fx*Math.cos(yaw)+fz*Math.sin(yaw))*speed*dt,dz=(fz*Math.cos(yaw)-fx*Math.sin(yaw))*speed*dt;moveAxis('x',dx);moveAxis('z',dz);grounded=inside(player.x,player.y-.09,player.z);if(keys.Space&&grounded){velocity.y=7.4;grounded=false}velocity.y-=18.5*dt;moveAxis('y',velocity.y*dt);if(player.y<-12){player.set(.5,13,27.5);velocity.set(0,0,0)}camera.position.set(player.x,player.y+1.62,player.z)}const time=now*.000025;sun.position.set(Math.cos(time)*70,45+Math.sin(time)*30,Math.sin(time)*70);sun.intensity=1.4+Math.max(0,Math.sin(time))*1.2;clouds.position.x=(now*.0008)%80;stars.rotation.y=now*.00001;fireflies.position.y=Math.sin(now*.001)*.35;portalLight.intensity=12+Math.sin(now*.004)*4;water.material.opacity=.5+Math.sin(now*.0007)*.04;renderer.render(scene,camera);frames++;fpsClock+=dt;if(fpsClock>.7){document.getElementById('coord').textContent=Math.floor(player.x)+' / '+Math.floor(player.y)+' / '+Math.floor(player.z);document.getElementById('perf').textContent=Math.round(frames/fpsClock)+' 帧　'+chunks.size+' 区域';frames=0;fpsClock=0;lore()}}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateChunks(true);tick(performance.now());
})();
