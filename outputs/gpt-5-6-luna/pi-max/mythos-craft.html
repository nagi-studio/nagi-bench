<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>神话境界 · Mythic Frontier</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e9f3ff;background:#07101e;font-synthesis:none}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101e}
body{user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#veil{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,rgba(4,8,20,.82),rgba(16,26,55,.55));z-index:20;transition:opacity .4s ease}
#veil.off{opacity:0;pointer-events:none}
.card{width:min(680px,calc(100vw - 34px));padding:36px 40px 32px;border:1px dashed rgba(164,213,255,.45);border-radius:22px;background:rgba(9,18,39,.78);box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 0 55px rgba(88,147,255,.08);backdrop-filter:blur(14px);text-align:center}
.kicker{letter-spacing:.28em;text-transform:uppercase;color:#9bb9ef;font-size:11px}
h1{margin:12px 0 8px;font-size:clamp(34px,7vw,68px);line-height:1;color:#f1d48a;text-shadow:0 0 28px rgba(245,190,92,.35)}
.subtitle{margin:0 0 25px;color:#c9d9ef;font-size:15px;line-height:1.7}
#begin{border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(100deg,#6e53d5,#3c9bd8);color:white;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 32px rgba(83,119,229,.35)}
#begin:hover{filter:brightness(1.15);transform:translateY(-1px)}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px;color:#91a8c8;font-size:12px}
.legend span{padding:6px 10px;border:1px dashed rgba(156,191,229,.2);border-radius:8px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .35s ease}
#hud.on{opacity:1}
.panel{position:absolute;top:18px;left:18px;padding:12px 15px;border:1px dashed rgba(177,216,255,.32);border-radius:12px;background:rgba(7,15,32,.58);box-shadow:0 10px 26px rgba(0,0,0,.18);backdrop-filter:blur(8px)}
.brand{font-weight:750;color:#f0d78f;letter-spacing:.08em;font-size:14px}
#stats{margin-top:6px;color:#b1c6df;font-size:11px;line-height:1.65;white-space:pre-line}
#hint{position:absolute;right:18px;top:18px;padding:10px 13px;color:#afc6e7;border:1px dashed rgba(177,216,255,.25);border-radius:10px;background:rgba(7,15,32,.48);font-size:11px;line-height:1.7;text-align:right}
#crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(245,247,255,.88);box-shadow:0 0 5px #8bd5ff}
#crosshair:before{left:9px;top:2px;width:2px;height:16px}
#crosshair:after{left:2px;top:9px;width:16px;height:2px}
#target{position:absolute;left:50%;top:calc(50% + 25px);transform:translateX(-50%);font-size:11px;color:#c3d8f0;text-shadow:0 1px 4px #000}
#toast{position:absolute;left:50%;bottom:48px;transform:translate(-50%,20px);padding:10px 17px;border-radius:999px;background:rgba(13,23,45,.82);border:1px dashed rgba(183,217,255,.35);color:#ebf2ff;font-size:12px;opacity:0;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(1,5,15,.35) 100%)}
#help{position:absolute;bottom:18px;left:18px;color:rgba(196,214,239,.7);font-size:10px;letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage"></div>
<div id="veil">
  <div class="card">
    <div class="kicker">A WALKABLE MYTHIC WORLD</div>
    <h1>神话境界</h1>
    <p class="subtitle">在星陨圣坛、浮空群岛与古老森林之间穿行。<br>世界会随着你的脚步向远方延展。</p>
    <button id="begin">点击开始探索</button>
    <div class="legend"><span>W A S D 移动</span><span>鼠标环视</span><span>左键破坏 · 右键放置</span><span>空格跳跃</span></div>
  </div>
</div>
<div id="hud">
  <div id="vignette"></div>
  <div class="panel"><div class="brand">神话境界</div><div id="stats"></div></div>
  <div id="hint">WASD 移动　空格 跳跃<br>左键 挖掘　右键 放置　Esc 释放鼠标</div>
  <div id="crosshair"></div>
  <div id="target"></div>
  <div id="toast"></div>
  <div id="help">漫游者日志 · 远方仍有未命名的遗迹</div>
</div>

<script type="module">
import * as THREE from "three";

const stage=document.getElementById("stage");
const veil=document.getElementById("veil");
const begin=document.getElementById("begin");
const hud=document.getElementById("hud");
const stats=document.getElementById("stats");
const targetLabel=document.getElementById("target");
const toast=document.getElementById("toast");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071426);
scene.fog=new THREE.FogExp2(0x0b1b32,0.012);
const camera=new THREE.PerspectiveCamera(73,innerWidth/innerHeight,.08,360);
camera.rotation.order="YXZ";
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
stage.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0x95c6ff,0x1d1732,1.75);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffdba5,3.2);
sun.position.set(-45,70,-35);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
sun.shadow.bias=-0.0004;
scene.add(sun);
const moonLight=new THREE.DirectionalLight(0x658cff,.48);
moonLight.position.set(28,42,50);scene.add(moonLight);

const blockNames=["青苔草方块","暖土方块","古石方块","星辉水晶","黯曜石","日冕金砖","苍木","幽叶","符文砖","月辉水"];
const blockColors=[0x5d955e,0x725039,0x5b6373,0x64d9ed,0x17132c,0xd6a63f,0x785037,0x2c6b4e,0x7e5fb3,0x315b8a];
const blockMats=blockColors.map((c,i)=>new THREE.MeshStandardMaterial({color:c,roughness:i===3?0.22:.86,metalness:i===4||i===5?.58:.08,emissive:i===3?0x164f60:i===8?0x201247:0x000000,emissiveIntensity:i===3?1.15:i===8?.75:0,transparent:i===3||i===9,opacity:i===3?.88:i===9?.57:1}));
const cube=new THREE.BoxGeometry(1,1,1);
const edgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(1.015,1.015,1.015));
const edgeMat=new THREE.LineBasicMaterial({color:0xb7f3ff,transparent:true,opacity:.9});
const world=new Map();
const generated=new Set();
const meshes=[];
const typeBlocks=[];
let target=null;
let structureReady=false;
let blockCount=0;
const CHUNK=16;
const VIEW=2;
const seed=73421;

function key(x,y,z){return x+","+y+","+z}
function chunkKey(cx,cz){return cx+":"+cz}
function hash(n){const x=Math.sin(n*127.1+seed*31.7)*43758.5453123;return x-Math.floor(x)}
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function mix(a,b,t){return a+(b-a)*t}
function grad(ix,iy,iz,x,y,z){const h=Math.floor(hash(ix*157.31+iy*311.7+iz*571.9)*16);const u=h<8?x:y;const v=h<4?y:h===12||h===14?x:z;return ((h&1)?-u:u)+((h&2)?-v:v)}
function noise(x,y,z){const x0=Math.floor(x),y0=Math.floor(y),z0=Math.floor(z);const xf=x-x0,yf=y-y0,zf=z-z0;const u=fade(xf),v=fade(yf),w=fade(zf);const n000=grad(x0,y0,z0,xf,yf,zf),n100=grad(x0+1,y0,z0,xf-1,yf,zf),n010=grad(x0,y0+1,z0,xf,yf-1,zf),n110=grad(x0+1,y0+1,z0,xf-1,yf-1,zf),n001=grad(x0,y0,z0+1,xf,yf,zf-1),n101=grad(x0+1,y0,z0+1,xf-1,yf,zf-1),n011=grad(x0,y0+1,z0+1,xf,yf-1,zf-1),n111=grad(x0+1,y0+1,z0+1,xf-1,yf-1,zf-1);return mix(mix(mix(n000,n100,u),mix(n010,n110,u),v),mix(mix(n001,n101,u),mix(n011,n111,u),v),w)*.5+.5}
function terrainHeight(x,z){const a=noise(x*.035,0,z*.035)*7;const b=noise(x*.075,4.2,z*.075)*3;const c=noise(x*.16,8.8,z*.16)*1.3;const ridge=Math.max(0,noise(x*.018,12,z*.018)-.53)*11;return Math.max(3,Math.floor(7+a+b+c+ridge))}
function setBlock(x,y,z,t){if(y<0||y>55)return;world.set(key(x,y,z),t)}
function delBlock(x,y,z){world.delete(key(x,y,z))}
function addBox(x0,y0,z0,w,h,d,t){for(let x=x0;x<x0+w;x++)for(let y=y0;y<y0+h;y++)for(let z=z0;z<z0+d;z++)setBlock(x,y,z,t)}
function addPillar(x,z,y0,h,t){addBox(x,y0,z,1,h,1,t)}
function addTree(x,z){const y=terrainHeight(x,z)+1;const h=4+Math.floor(hash(x*9+z*17)*3);addBox(x,y,z,1,h,1,6);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=0;dy<3;dy++){if(Math.abs(dx)+Math.abs(dz)+dy<5&&!(dx===0&&dz===0&&dy===0))setBlock(x+dx,y+h-1+dy,z+dz,7)}}
function buildShrine(){
  const y=terrainHeight(0,-18)+1;
  addBox(-9,y-1,-27,18,1,18,8);
  addBox(-7,y,-25,14,1,14,2);
  for(let i=0;i<4;i++){const x=i<2?-6:5;const z=i%2?-24:-13;addPillar(x,z,y+1,8,2);addBox(x-1,y+8,z-1,3,1,3,5)}
  addBox(-5,y+1,-22,10,1,8,4);addBox(-3,y+2,-21,6,1,6,3);
  for(let r=0;r<5;r++){addBox(-r,y+3+r,-20-r,2*r+1,1,1,5);addBox(-r,y+3+r,-17+r,2*r+1,1,1,5)}
  addBox(-1,y+4,-20,2,6,2,3);addBox(-1,y+9,-20,2,2,2,8);
  for(let i=0;i<7;i++){const angle=i*Math.PI*2/7;const x=Math.round(Math.cos(angle)*12),z=Math.round(-18+Math.sin(angle)*12);addPillar(x,z,y,3+(i%2),2);setBlock(x,y+3+(i%2),z,3)}
}
function buildPortal(){
  const x=22,z=10,y=terrainHeight(x,z)+1;
  addBox(x-5,y-1,z-1,11,1,3,4);addBox(x-5,y,z-1,2,8,3,4);addBox(x+4,y,z-1,2,8,3,4);addBox(x-3,y+7,z-1,7,2,3,4);
  for(let i=0;i<5;i++)for(let j=0;j<5;j++)if((i===0||i===4||j===0||j===4)&&i>0&&i<4)setBlock(x-2+i,y+1+j,z,3);
  addBox(x-2,y+1,z,5,5,1,3);
  for(let i=0;i<6;i++){const px=x-9+i*4;addPillar(px,z+5,y,2+(i%3),5)}
}
function buildGrove(){
  const points=[[-24,25],[-16,31],[-30,37],[-6,38],[9,32],[31,27],[35,40]];
  for(const p of points){const [x,z]=p;addTree(x,z);addTree(x+3,z+2);setBlock(x,terrainHeight(x,z)+5,z,3);setBlock(x+1,terrainHeight(x,z)+4,z,3)}
  for(let i=0;i<13;i++){const x=-35+Math.floor(hash(i*41)*70),z=20+Math.floor(hash(i*61)*26);if(Math.abs(x)<5)continue;const y=terrainHeight(x,z)+1;addBox(x,y,z,1,2+(i%3),1,8);setBlock(x,y+2+(i%3),z,3)}
}
function buildRuins(){
  const x=-34,z=-7,y=terrainHeight(x,z)+1;
  for(let i=0;i<6;i++){addPillar(x+(i%3)*3,z+Math.floor(i/3)*4,y,2+(i%2)*3,2)}
  addBox(x,y+4,z,9,1,1,2);addBox(x+2,y+3,z+3,1,1,4,8);addBox(x+6,y+2,z+3,1,1,4,8);
  for(let i=0;i<8;i++){const px=x-2+Math.floor(hash(i*13)*14),pz=z-3+Math.floor(hash(i*33)*12);setBlock(px,y,pz,5)}
}
function buildFloatingIslands(){
  const islands=[[-30,27,31,4],[15,34,36,5],[38,43,8,4]];
  for(const [cx,cy,cz,r] of islands){for(let x=-r;x<=r;x++)for(let z=-r;z<=r;z++){const dist=x*x+z*z;if(dist>r*r)continue;const bottom=cy-Math.max(1,Math.floor((r*r-dist)/r));for(let y=bottom;y<=cy;y++)setBlock(cx+x,y,cz+z,y===cy?0:2)}for(let i=0;i<3;i++){const x=cx-Math.floor(r/2)+i*2;addBox(x,cy+1,cz,1,3+i,1,6);setBlock(x,cy+4+i,cz,3)}}
}
function generateChunk(cx,cz){
  const ck=chunkKey(cx,cz);if(generated.has(ck))return;generated.add(ck);
  for(let x=cx*CHUNK;x<cx*CHUNK+CHUNK;x++)for(let z=cz*CHUNK;z<cz*CHUNK+CHUNK;z++){
    const h=terrainHeight(x,z);
    for(let y=0;y<=h;y++){let t=2;if(y===h)t=0;else if(y>h-3)t=1;else if(y<2&&hash(x*97+z*41+y*13)>.62)t=4;setBlock(x,y,z,t)}
    const flora=hash(x*17.3+z*31.9);
    if(flora>.91&&h>8&&Math.abs(x)>7&&Math.abs(z)>7)addTree(x,z);
    if(flora>.84&&flora<.91&&h>7)setBlock(x,h+1,z,3);
  }
}
function buildWorld(){for(let cx=-VIEW;cx<=VIEW;cx++)for(let cz=-VIEW;cz<=VIEW;cz++)generateChunk(cx,cz);buildShrine();buildPortal();buildGrove();buildRuins();buildFloatingIslands();structureReady=true;rebuildMeshes()}
function rebuildMeshes(){for(const m of meshes)scene.remove(m);meshes.length=0;for(let i=0;i<typeBlocks.length;i++)typeBlocks[i]=[];for(const [k,t] of world){const p=k.split(",").map(Number);if(typeBlocks[t])typeBlocks[t].push(p)}blockCount=world.size;for(let t=0;t<typeBlocks.length;t++){const arr=typeBlocks[t];if(!arr||!arr.length)continue;const mesh=new THREE.InstancedMesh(cube,blockMats[t],arr.length);mesh.castShadow=t!==9;mesh.receiveShadow=true;mesh.userData.blocks=arr;const mat=new THREE.Matrix4();for(let i=0;i<arr.length;i++){mat.makeTranslation(arr[i][0]+.5,arr[i][1]+.5,arr[i][2]+.5);mesh.setMatrixAt(i,mat)}mesh.instanceMatrix.needsUpdate=true;scene.add(mesh);meshes.push(mesh)}}
for(let i=0;i<blockNames.length;i++)typeBlocks[i]=[];

const skyGeo=new THREE.SphereGeometry(170,32,20);
const skyMat=new THREE.MeshBasicMaterial({color:0x102b53,side:THREE.BackSide,depthWrite:false});
const sky=new THREE.Mesh(skyGeo,skyMat);scene.add(sky);
const moon=new THREE.Mesh(new THREE.SphereGeometry(7,32,20),new THREE.MeshStandardMaterial({color:0xe6efff,emissive:0x8daeff,emissiveIntensity:.55,roughness:.9}));
moon.position.set(-58,72,-92);scene.add(moon);
const halo=new THREE.Mesh(new THREE.RingGeometry(8.8,10.5,64),new THREE.MeshBasicMaterial({color:0x8ab9ff,transparent:true,opacity:.18,side:THREE.DoubleSide}));halo.position.copy(moon.position);halo.lookAt(camera.position);scene.add(halo);
const starPos=[];for(let i=0;i<720;i++){const r=130+hash(i*8.1)*30,theta=hash(i*3.7)*Math.PI*2,phi=.12+hash(i*5.9)*1.05;starPos.push(Math.cos(theta)*Math.sin(phi)*r,Math.cos(phi)*r+48,Math.sin(theta)*Math.sin(phi)*r)}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPos,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb9d8ff,size:.34,sizeAttenuation:true,transparent:true,opacity:.82}));scene.add(stars);

const player={x:0,z:4,y:0,vy:0,yaw:0,pitch:0,onGround:false};
function groundAt(x,z){return terrainHeight(Math.floor(x),Math.floor(z))+1.65}
player.y=groundAt(player.x,player.z);camera.position.set(player.x,player.y,player.z);
const keys=new Set();let locked=false;let elapsed=0;let toastTimer=0;let lastChunk="";
function showToast(text){toast.textContent=text;toast.classList.add("show");toastTimer=2.1}
function updateStats(){const cx=Math.floor(player.x/CHUNK),cz=Math.floor(player.z/CHUNK);stats.textContent=`坐标 ${Math.floor(player.x)} / ${Math.floor(player.y-1.65)} / ${Math.floor(player.z)}\n区块 ${cx}, ${cz} · 方块 ${blockCount.toLocaleString("zh-CN")}`}
function lockPointer(){renderer.domElement.requestPointerLock()}
begin.addEventListener("click",lockPointer);
renderer.domElement.addEventListener("click",()=>{if(!locked)lockPointer()});
document.addEventListener("pointerlockchange",()=>{locked=document.pointerLockElement===renderer.domElement;veil.classList.toggle("off",locked);hud.classList.toggle("on",locked)});
document.addEventListener("mousemove",e=>{if(!locked)return;player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.0022;player.pitch=Math.max(-1.48,Math.min(1.48,player.pitch));camera.rotation.y=player.yaw;camera.rotation.x=player.pitch});
addEventListener("keydown",e=>{keys.add(e.code);if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault()});
addEventListener("keyup",e=>keys.delete(e.code));
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());

const ray=new THREE.Raycaster();ray.far=8;
function findTarget(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(meshes,false);if(!hits.length){target=null;targetLabel.textContent="";return}const hit=hits[0],arr=hit.object.userData.blocks,p=arr[hit.instanceId];if(!p){target=null;return}target={p,hit};targetLabel.textContent=`${blockNames[world.get(key(p[0],p[1],p[2]))]||"方块"} · ${p[0]},${p[1]},${p[2]}`;if(!target.box){target.box=new THREE.LineSegments(edgeGeo,edgeMat);scene.add(target.box)}target.box.position.set(p[0]+.5,p[1]+.5,p[2]+.5)}
function canPlace(x,y,z){if(world.has(key(x,y,z)))return false;const px=player.x,py=player.y-1.65,pz=player.z;return !(x<px+.35&&x+1>px-.35&&y<py+1.8&&y+1>py&&z<pz+.35&&z+1>pz-.35)}
function editBlock(button){if(!locked||!target)return;const p=target.p;if(button===0){if(p[1]<=1){showToast("地基不可破坏");return}delBlock(p[0],p[1],p[2]);showToast("方块已破坏")}else if(button===2){const n=target.hit.face.normal;const x=p[0]+Math.round(n.x),y=p[1]+Math.round(n.y),z=p[2]+Math.round(n.z);if(!canPlace(x,y,z)){showToast("这里无法放置");return}const chosen=Number(keys.has("Digit1")?0:keys.has("Digit2")?1:keys.has("Digit3")?2:keys.has("Digit4")?3:keys.has("Digit5")?4:0);setBlock(x,y,z,chosen);showToast(`放置：${blockNames[chosen]}`)}rebuildMeshes()}
renderer.domElement.addEventListener("mousedown",e=>{if(e.button===0||e.button===2)editBlock(e.button)});

function move(dt){const speed=keys.has("ShiftLeft")?9.5:5.3;let fx=0,fz=0;if(keys.has("KeyW"))fz-=1;if(keys.has("KeyS"))fz+=1;if(keys.has("KeyA"))fx-=1;if(keys.has("KeyD"))fx+=1;const len=Math.hypot(fx,fz)||1;fx/=len;fz/=len;const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);const dx=(fx*cy-fz*sy)*speed*dt,dz=(fx*sy+fz*cy)*speed*dt;const nx=player.x+dx,nz=player.z+dz;const feet=Math.floor(player.y-1.65);if(!world.has(key(Math.floor(nx),feet,Math.floor(player.z)))&&!world.has(key(Math.floor(nx),feet+1,Math.floor(player.z))))player.x=nx;if(!world.has(key(Math.floor(player.x),feet,Math.floor(nz)))&&!world.has(key(Math.floor(player.x),feet+1,Math.floor(nz))))player.z=nz;if(keys.has("Space")&&player.onGround){player.vy=7.3;player.onGround=false}player.vy-=18*dt;player.y+=player.vy*dt;const floor=groundAt(player.x,player.z);if(player.y<=floor){player.y=floor;player.vy=0;player.onGround=true}if(player.y>floor+3)player.y-=Math.min(player.y-floor-3,dt*3);camera.position.set(player.x,player.y,player.z);camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}
function extendWorld(){const cx=Math.floor(player.x/CHUNK),cz=Math.floor(player.z/CHUNK);const ck=chunkKey(cx,cz);if(ck===lastChunk)return;lastChunk=ck;for(let x=cx-VIEW;x<=cx+VIEW;x++)for(let z=cz-VIEW;z<=cz+VIEW;z++)generateChunk(x,z);rebuildMeshes();showToast("新的地脉在远方生成")}
function animate(t){requestAnimationFrame(animate);const dt=Math.min(.05,(t-elapsed)/1000||.016);elapsed=t;stars.rotation.y+=dt*.002;halo.lookAt(camera.position);if(locked){move(dt);extendWorld();findTarget();updateStats();if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toast.classList.remove("show")}}renderer.render(scene,camera)}

buildWorld();
updateStats();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
showToast("数字键 1-5 可选择放置方块");
animate(0);
</script>
