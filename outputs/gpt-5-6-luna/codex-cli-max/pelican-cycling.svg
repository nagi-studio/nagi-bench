  <path d="M516 312c-19-46-19-108-5-155M536 314c-5-55 3-91 18-124M554 319c8-45 14-66 28-87" fill="none" stroke="#818d8b" stroke-width="4" opacity=".75"/>
  <path d="M489 185c19 28 35 43 57 59" fill="none" stroke="#fff7e5" stroke-width="8" opacity=".42"/>

  <!-- pelican body -->
