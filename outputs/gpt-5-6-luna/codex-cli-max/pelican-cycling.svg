  <path d="M683 154c25 0 62 11 99 31-20 11-56 15-85 11-17-2-31-8-43-17 9-13 16-21 29-25z" fill="url(#beak)" stroke="#7b4933" stroke-width="5"/>
  <path d="M686 177c30 3 61 3 93 7-20 8-47 10-73 7-15-2-27-6-37-12z" fill="#ffd46a" opacity=".64"/>
  <path d="M742 184l28 2-22 9" fill="none" stroke="#974d31" stroke-width="3" opacity=".7"/>
  <path d="M662 175c-7 20 1 51 22 73 22 24 57 28 79 4-22-11-39-28-51-49-11-19-23-31-50-28z" fill="url(#pouch)" stroke="#804531" stroke-width="5"/>
  <path d="M671 185c4 30 20 54 47 68" fill="none" stroke="#f7c15c" stroke-width="4" opacity=".63"/>
  <path d="M687 183c3 22 13 43 30 58" fill="none" stroke="#a95436" stroke-width="3" opacity=".6"/>

