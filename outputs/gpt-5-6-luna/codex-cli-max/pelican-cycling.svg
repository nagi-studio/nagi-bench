  <path d="M603 138c17-17 47-19 67-9 13 7 21 17 25 29-20-9-38-7-54-1-15 5-29 0-38-19z" fill="#fff9e9" opacity=".72"/>
  <path d="M594 170c25 9 55 7 82-5" fill="none" stroke="#a2a49c" stroke-width="4" opacity=".6"/>
  <ellipse cx="655" cy="151" rx="9" ry="11" fill="#202d31"/>
  <circle cx="658" cy="147" r="3" fill="#fffdf1"/>
  <path d="M641 137c8-5 17-5 25-1" fill="none" stroke="#687277" stroke-width="3" stroke-linecap="round"/>

