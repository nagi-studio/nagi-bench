    <path d="M796 240c38-7 72-5 103 2" stroke-width="2"/>
    <path d="M980 292c28-5 59-4 84 2" stroke-width="3"/>
  </g>

  <!-- sea and horizon -->
  <rect y="344" width="1200" height="211" fill="url(#sea)"/>
  <path d="M0 367c144-16 235 13 351-1 132-17 205 13 323-2 143-18 260 16 526-3v42H0z" fill="#9de0dd" opacity=".3"/>
  <path d="M0 398c120-19 219 6 319-2 137-11 217 20 347 1 164-24 309 16 534-3" fill="none" stroke="#dbf4e6" stroke-width="4" opacity=".7"/>
  <path d="M18 434c104-13 163 8 250-2 111-13 204 18 320 4 125-15 213 17 331 0 112-16 191 9 273 2" fill="none" stroke="#6ed0cf" stroke-width="13" opacity=".65"/>
  <path d="M0 461c102-12 159 11 258 1 131-13 219 12 337-1 127-14 234 18 368 1 88-11 151 5 237-1" fill="none" stroke="#b5e5d7" stroke-width="4" opacity=".62"/>
