    <path d="M648 514l19-41" stroke="#234d5a" stroke-width="8"/>
    <path d="M663 474c19 3 32 0 41-8M663 474c-11-3-22-3-31-1" stroke="#153643" stroke-width="7"/>
    <path d="M663 469c13-5 31-8 44-4" stroke="#f1c874" stroke-width="3"/>
    <path d="M548 514l-6-22" stroke="#224856" stroke-width="8"/>
    <path d="M526 491c14-5 30-4 42 1" stroke="#4b2d2f" stroke-width="12"/>
    <path d="M618 627l22 18M618 627l-22-17" stroke="#1b3a49" stroke-width="6"/>
    <path d="M638 645h25M571 610h-25" stroke="#d48942" stroke-width="5"/>
  </g>
  <circle cx="618" cy="627" r="13" fill="#c68a42" stroke="#173747" stroke-width="5"/>
  <circle cx="618" cy="627" r="4" fill="#f6d998"/>
  <path d="M756 549l20 78M748 551h31" stroke="#e4d8b4" stroke-width="3" opacity=".75"/>

  <!-- pelican tail, tucked behind body -->
