  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M438 627L548 514 618 627 438 627M548 514h100l-30 113M618 627l158-0M648 514l128 113M648 514l-5-22" stroke="#183d4b" stroke-width="16" opacity=".35"/>
