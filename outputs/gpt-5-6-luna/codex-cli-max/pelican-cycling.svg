  <g fill="#fff9e2" opacity=".75">
    <circle cx="194" cy="491" r="4"/><circle cx="212" cy="480" r="2.5"/><circle cx="232" cy="493" r="3"/>
    <circle cx="886" cy="493" r="3"/><circle cx="907" cy="484" r="2"/><circle cx="929" cy="491" r="4"/>
    <circle cx="1095" cy="479" r="2.5"/><circle cx="1112" cy="490" r="3"/>
