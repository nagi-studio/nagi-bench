  <g fill="none" stroke-linecap="round">
    <path d="M72 378h104M213 389h71M350 374h130M841 375h94M1013 390h126" stroke="#e7faeb" stroke-width="4" opacity=".62"/>
    <path d="M35 426h87M153 418h44M711 430h146M900 414h114M1072 436h84" stroke="#b8f0e2" stroke-width="3" opacity=".55"/>
    <path d="M266 467h112M445 453h76M756 471h132M953 458h84" stroke="#0a5d75" stroke-width="5" opacity=".5"/>
  </g>

  <!-- foamy shoreline and sand -->
  <path d="M0 506c125-20 218 15 335-1 136-19 209 13 345-3 138-16 245 17 374 2 65-7 107 3 146 2v294H0z" fill="url(#sand)"/>
  <path d="M0 506c125-20 218 15 335-1 136-19 209 13 345-3 138-16 245 17 374 2 65-7 107 3 146 2v82c-143 13-250-14-389 2-140 16-246-13-373 2-145 18-259-16-438 5z" fill="url(#wetSand)" opacity=".88"/>
  <path d="M0 525c125-23 226 15 340-2 132-20 214 14 344-1 140-16 250 17 379 1 67-8 104 3 137 0" fill="none" stroke="#f5f4d9" stroke-width="8" opacity=".9"/>
  <path d="M0 539c120-18 226 13 335-3 135-18 215 15 351-1 136-16 247 17 375 1 61-7 102 4 139 1" fill="none" stroke="#d9eee0" stroke-width="4" opacity=".9"/>
  <path d="M0 506c125-20 218 15 335-1 136-19 209 13 345-3 138-16 245 17 374 2 65-7 107 3 146 2v294H0z" fill="url(#sandGrain)" opacity=".55"/>

