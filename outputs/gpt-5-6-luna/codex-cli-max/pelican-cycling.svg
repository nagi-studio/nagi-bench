<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle by the sea</title>
  <desc id="desc">A lively, richly shaded pelican riding a vintage bicycle along a sunlit beach, with turquoise waves and sea spray behind it.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed4dc"/>
      <stop offset="0.54" stop-color="#d4edf0"/>
      <stop offset="1" stop-color="#f4c8aa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4faebd"/>
      <stop offset="0.5" stop-color="#16879e"/>
      <stop offset="1" stop-color="#075f78"/>
    </linearGradient>
    <linearGradient id="seaLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ee1dd" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#d4f5ea" stop-opacity=".7"/>
      <stop offset="0.7" stop-color="#fff6d8" stop-opacity=".4"/>
      <stop offset="1" stop-color="#9ee1dd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f6d5ae"/>
      <stop offset="0.48" stop-color="#e4ac7f"/>
      <stop offset="1" stop-color="#b86f57"/>
    </linearGradient>
    <linearGradient id="wetSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73b4aa"/>
      <stop offset="0.35" stop-color="#b4c6aa"/>
      <stop offset="1" stop-color="#d79b76"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffce7"/>
      <stop offset=".55" stop-color="#fff1bf"/>
      <stop offset="1" stop-color="#f7be8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2e4"/>
      <stop offset=".4" stop-color="#d7d3c2"/>
      <stop offset=".8" stop-color="#9b9e98"/>
      <stop offset="1" stop-color="#5e686b"/>
    </linearGradient>
    <linearGradient id="featherWarm" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset=".5" stop-color="#ddd9c8"/>
      <stop offset="1" stop-color="#a6aaa0"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2=".75">
      <stop offset="0" stop-color="#dad8c9"/>
      <stop offset=".32" stop-color="#a7aaa2"/>
      <stop offset=".74" stop-color="#687377"/>
      <stop offset="1" stop-color="#303e46"/>
    </linearGradient>
    <linearGradient id="wingLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe0"/>
      <stop offset=".45" stop-color="#bfc0b5"/>
      <stop offset="1" stop-color="#6e7778"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f8bf51"/>
      <stop offset=".42" stop-color="#e9942f"/>
      <stop offset="1" stop-color="#bc5d31"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b34a"/>
      <stop offset=".55" stop-color="#e57c36"/>
      <stop offset="1" stop-color="#a94b37"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d66c2d"/>
      <stop offset=".45" stop-color="#f0a13b"/>
      <stop offset="1" stop-color="#a9472f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e6e2"/>
      <stop offset=".22" stop-color="#6e9ba1"/>
      <stop offset=".48" stop-color="#e7d5b2"/>
      <stop offset=".7" stop-color="#3c6977"/>
      <stop offset="1" stop-color="#183a4a"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263d48"/>
      <stop offset=".5" stop-color="#0e1c29"/>
      <stop offset="1" stop-color="#435c60"/>
    </linearGradient>
    <pattern id="sandGrain" width="38" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="1.2" fill="#a96854" opacity=".22"/>
      <circle cx="19" cy="15" r=".9" fill="#fff0cb" opacity=".34"/>
      <circle cx="31" cy="4" r=".7" fill="#8a5b51" opacity=".2"/>
      <path d="M10 21l5-1M27 19l3-1" stroke="#ba775e" stroke-width=".8" opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="8" dx="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="waterSoft" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- sky and distant atmosphere -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="924" cy="140" r="116" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="924" cy="140" r="42" fill="#fff7cf" opacity=".9"/>
  <g fill="#fff" opacity=".3">
    <path d="M58 168c30-33 78-34 105-4 22-28 74-20 83 19H40c-1-5 6-12 18-15z"/>
    <path d="M764 92c18-22 51-25 68-4 19-16 50-7 57 17H744c0-5 8-10 20-13z"/>
    <path d="M246 252c31-24 69-17 80 9 27-16 60-1 65 22H215c2-13 13-24 31-31z"/>
  </g>
  <g fill="none" stroke="#fff7dc" stroke-linecap="round" opacity=".34">
