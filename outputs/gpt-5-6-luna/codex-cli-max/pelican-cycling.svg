  <g fill="none" stroke-linecap="round">
    <path d="M568 270c17 7 34 9 51 7M563 285c20 8 38 10 57 7M562 301c19 8 35 11 55 8" stroke="#b0b0a6" stroke-width="4" opacity=".7"/>
    <path d="M579 321c18 6 31 7 45 5" stroke="#fff9e9" stroke-width="5" opacity=".6"/>
