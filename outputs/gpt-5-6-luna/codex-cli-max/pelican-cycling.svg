      <path d="M396 550l84 154M480 550l-84 154"/>
    </g>
    <circle cx="776" cy="627" r="96" fill="none" stroke="#102a38" stroke-width="15"/>
    <circle cx="776" cy="627" r="84" fill="none" stroke="#b7c8bf" stroke-width="3" opacity=".9"/>
    <circle cx="776" cy="627" r="8" fill="#1b3c4d" stroke="#e2c88e" stroke-width="3"/>
    <g stroke="#a7c6c2" stroke-width="2" opacity=".7">
      <path d="M776 543v168M692 627h168M717 568l118 118M835 568L717 686"/>
      <path d="M734 550l84 154M818 550l-84 154"/>
    </g>
  </g>

