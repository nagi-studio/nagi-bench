  <path d="M467 420c35 16 76 3 111-9 30-10 60-8 89 0-21 24-73 35-126 26-32-5-57-2-74-17z" fill="#667276" opacity=".65"/>
  <path d="M477 337c25-20 53-29 80-31M483 349c36-18 61-21 93-18" fill="none" stroke="#fff9eb" stroke-width="6" stroke-linecap="round" opacity=".42"/>

