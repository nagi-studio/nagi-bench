  <path d="M562 344c37 5 72 26 101 55 14 14 26 30 35 48-22-13-45-17-67-29-30-16-57-41-74-74z" fill="#d7d7c8" opacity=".55"/>
  <g fill="none" stroke-linecap="round">
    <path d="M552 347c24 25 43 50 60 82" stroke="#f2eee0" stroke-width="7" opacity=".55"/>
    <path d="M575 339c24 30 49 60 76 90" stroke="#b8bbb1" stroke-width="6" opacity=".68"/>
    <path d="M600 346c24 29 54 55 82 73" stroke="#8c9692" stroke-width="6" opacity=".72"/>
    <path d="M621 358c22 22 48 42 73 51" stroke="#4b5b61" stroke-width="7" opacity=".75"/>
  </g>
  <path d="M624 385c22 22 41 34 67 41" stroke="#f9f2d8" stroke-width="3" opacity=".55" fill="none"/>

  <!-- breast and neck -->
  <path d="M568 361c-31-27-38-59-24-86 11-21 29-33 36-53 8-23-8-49 9-68 16-19 48-20 66-4 21 18 22 48 3 68-15 16-25 28-19 51 7 27 31 47 30 77-1 29-18 47-42 57z" fill="url(#featherWarm)" stroke="#46565a" stroke-width="5"/>
