  <path d="M315 721c111-32 310-41 526-9 35 5 67 12 96 20-178-5-424 8-622-11z" fill="#704b4a" opacity=".16"/>

  <!-- bicycle wheels behind the rider -->
  <g>
    <circle cx="438" cy="627" r="96" fill="none" stroke="#102a38" stroke-width="15"/>
    <circle cx="438" cy="627" r="84" fill="none" stroke="#b7c8bf" stroke-width="3" opacity=".9"/>
    <circle cx="438" cy="627" r="8" fill="#1b3c4d" stroke="#e2c88e" stroke-width="3"/>
    <g stroke="#a7c6c2" stroke-width="2" opacity=".7">
