<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>潮汐之后 · A voxel film</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070a; }
      body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #dbe9ff; }
      #film-title { position: absolute; left: 6vw; top: 8vh; letter-spacing: .38em; text-transform: uppercase; font-size: clamp(11px, 1.2vw, 16px); opacity: .72; }
      #chapter { position: absolute; left: 6vw; top: 12vh; font-size: clamp(11px, 1vw, 14px); letter-spacing: .16em; color: #75a6d5; opacity: .7; }
      #timecode { position: absolute; right: 6vw; top: 8vh; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .55; letter-spacing: .14em; }
      #subtitle { position: absolute; left: 50%; bottom: 7.5vh; transform: translateX(-50%); width: min(88vw, 980px); text-align: center; font-size: clamp(16px, 2vw, 27px); line-height: 1.55; letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 2px #000; opacity: 0; transition: opacity .16s ease; }
      #subtitle.visible { opacity: 1; }
      #controls { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; pointer-events: auto; opacity: .68; transition: opacity .2s ease; }
      #controls:hover { opacity: 1; }
      button { border: 1px solid rgba(180,210,240,.35); color: #dbe9ff; background: rgba(5,9,16,.58); border-radius: 2px; padding: 8px 14px; font: inherit; font-size: 12px; letter-spacing: .08em; cursor: pointer; backdrop-filter: blur(8px); }
      button:hover { border-color: #9dd2ff; background: rgba(19,39,61,.8); }
      #progress-wrap { width: min(36vw, 420px); height: 2px; background: rgba(190,220,255,.18); }
      #progress { width: 0%; height: 100%; background: #9ad6ff; box-shadow: 0 0 12px #69b6ee; }
      #hint { position: absolute; right: 6vw; bottom: 3.5vh; font-size: 11px; letter-spacing: .08em; opacity: .42; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%); }
      #fade { position: absolute; inset: 0; background: #020307; opacity: 1; transition: opacity 1.2s ease; }
      #fade.ready { opacity: 0; }
      @media (max-width: 640px) { #film-title, #chapter, #timecode { left: 5vw; right: auto; } #timecode { left: auto; right: 5vw; } #hint { display:none; } #progress-wrap { width: 32vw; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <div id="film-title">TIDAL AFTER · VOXEL FILM</div>
      <div id="chapter">00 / THE SIGNAL BELOW</div>
      <div id="timecode">00:00 / 03:00</div>
      <div id="subtitle" aria-live="polite"></div>
      <div id="controls">
        <button id="play" type="button">暂停</button>
        <div id="progress-wrap"><div id="progress"></div></div>
        <button id="sound" type="button">声音 开</button>
      </div>
      <div id="hint">点击画面 / SPACE 播放 · ← → 跳转</div>
      <div id="vignette"></div>
      <div id="fade"></div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
