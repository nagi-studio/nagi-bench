<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background:#87CEEB;">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="60%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="50%" stop-color="#039BE5"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="70%" stop-color="#E6C288"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="40%" stop-color="#F5F5F5"/>
      <stop offset="70%" stop-color="#BDBDBD"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F4A460"/>
      <stop offset="100%" stop-color="#CC5500"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0D9DD"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <style>
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- 背景天空 -->
  <rect x="0" y="0" width="800" height="310" fill="url(#skyGrad)"/>
  
  <!-- 太阳 -->
  <circle cx="680" cy="110" r="40" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="90" rx="70" ry="22"/>
    <ellipse cx="150" cy="85" rx="45" ry="15"/>
    <ellipse cx="200" cy="100" rx="55" ry="18"/>
    <ellipse cx="500" cy="70" rx="60" ry="20"/>
    <ellipse cx="540" cy="65" rx="40" ry="12"/>
  </g>

  <!-- 大海 -->
  <rect x="0" y="310" width="800" height="100" fill="url(#waterGrad)"/>
  
  <!-- 海浪 -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M0,320 Q120,312 240,322 T480,318 T720,324 L800,324"/>
    <path d="M0,332 Q100,325 200,335 T400,330 T600,336 L800,336"/>
    <path d="M0,345 Q150,338 300,348 T600,340 T800,350"/>
  </g>
  <g fill="#ffffff" opacity="0.3">
    <ellipse cx="120" cy="325" rx="30" ry="6"/>
    <ellipse cx="380" cy="322" rx="25" ry="5"/>
    <ellipse cx="620" cy="330" rx="35" ry="6"/>
  </g>

  <!-- 沙滩 -->
  <rect x="0" y="410" width="800" height="90" fill="url(#sandGrad)"/>
  <ellipse cx="400" cy="450" rx="300" ry="18" fill="#E6C288" opacity="0.6"/>
  <ellipse cx="100" cy="460" rx="120" ry="10" fill="#D4A373" opacity="0.5"/>

  <!-- 海边阴影 -->
  <ellipse cx="360" cy="416" rx="140" ry="14" fill="#000000" opacity="0.1"/>

  <!-- 主场景：鹈鹕 + 自行车（带轻微上下浮动动画） -->
  <g style="animation: bob 2s ease-in-out infinite; transform-origin: 360px 400px;">
    
    <!-- 自行车后轮 -->
    <g>
      <circle cx="300" cy="400" r="38" fill="#222" stroke="#444" stroke-width="2"/>
      <!-- 辐条 -->
      <g stroke="#777" stroke-width="0.8">
        <line x1="300" y1="400" x2="300" y2="362"/>
        <line x1="300" y1="400" x2="330" y2="382"/>
        <line x1="300" y1="400" x2="268" y2="382"/>
        <line x1="300" y1="400" x2="338" y2="416"/>
        <line x1="300" y1="400" x2="262" y2="416"/>
        <line x1="300" y1="400" x2="300" y2="438"/>
      </g>
      <circle cx="300" cy="400" r="10" fill="#333"/>
    </g>

    <!-- 自行车前轮 -->
    <g>
      <circle cx="430" cy="400" r="38" fill="#222" stroke="#444" stroke-width="2"/>
      <g stroke="#777" stroke-width="0.8">
        <line x1="430" y1="400" x2="430" y2="362"/>
        <line x1="430" y1="400" x2="460" y2="382"/>
        <line x1="430" y1="400" x2="400" y2="382"/>
        <line x1="430" y1="400" x2="468" y2="416"/>
        <line x1="430" y1="400" x2="392" y2="416"/>
        <line x1="430" y1="400" x2="430" y2="438"/>
      </g>
      <circle cx="430" cy="400" r="10" fill="#333"/>
    </g>

    <!-- 车架 -->
    <path d="M300,400 L360,335 L430,375 L430,400" fill="none" stroke="#555" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M360,335 L360,360" fill="none" stroke="#555" stroke-width="5"/> <!-- 车座管 -->
    <!-- 车座 -->
    <rect x="345" y="328" width="28" height="10" rx="3" fill="#333" stroke="#222" stroke-width="1"/>
    <!-- 车把 -->
    <line x1="430" y1="360" x2="450" y2="350" stroke="#777" stroke-width="4" stroke-linecap="round"/>
    <line x1="450" y1="350" x2="450" y2="340" stroke="#777" stroke-width="2"/>
    <line x1="450" y1="350" x2="438" y2="348" stroke="#777" stroke-width="2"/>
    <!-- 踏板 -->
    <circle cx="360" cy="400" r="7" fill="#222" stroke="#555"/>
    <line x1="360" y1="400" x2="390" y2="400" stroke="#777" stroke-width="2"/>

    <!-- 鹈鹕身体 -->
    <g filter="url(#softShadow)">
      <!-- 主身体 -->
      <ellipse cx="345" cy="345" rx="50" ry="28" fill="url(#bodyGrad)" transform="rotate(-15 345 345)"/>
      <!-- 羽毛纹理 -->
      <path d="M310,340 Q320,330 325,350" fill="none" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M320,355 Q330,345 340,360" fill="none" stroke="#BDBDBD" stroke-width="1" stroke-linecap="round"/>
      <path d="M300,345 Q295,340 305,350" fill="none" stroke="#9E9E9E" stroke-width="1"/>
    </g>

    <!-- 颈部 -->
    <path d="M360,345 Q390,310 410,300" stroke="#e8e8e8" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M360,345 Q390,310 410,300" stroke="#f0f0f0" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- 头部 -->
    <circle cx="420" cy="292" r="23" fill="#F5F5F5"/>
    <!-- 头顶羽毛 -->
    <ellipse cx="410" cy="275" rx="18" ry="10" fill="#D8D8D8" transform="rotate(-20 410 275)"/>

    <!-- 大喙 -->
    <path d="M425,295 L500,305 L505,335 L430,325 Z" fill="url(#beakGrad)" stroke="#CC5500" stroke-width="1"/>
    <!-- 喙部高光 -->
    <path d="M430,300 L475,305 L472,318 L435,314 Z" fill="#FFE082" opacity="0.6"/>
    <!-- 下喙/肉囊 -->
    <ellipse cx="465" cy="325" rx="14" ry="7" fill="#FF6347" stroke="#D84315" stroke-width="0.5"/>
    <path d="M455,325 Q465,335 475,325" fill="#FF8A65" opacity="0.7"/>

    <!-- 眼睛 -->
    <circle cx="435" cy="288" r="5" fill="#ffffff"/>
    <circle cx="436" cy="288" r="2.5" fill="#111"/>
    <circle cx="437" cy="287" r="1" fill="#ffffff"/>
    <circle cx="432" cy="290" r="0.8" fill="#EEEEEE"/>

    <!-- 翅膀（左侧） -->
    <path d="M330,350 Q260,320 285,290 Q320,270 340,310 Z" fill="url(#wingGrad)" stroke="#78909C" stroke-width="1"/>
    <path d="M330,350 Q260,320 285,290" fill="none" stroke="#90A4AE" stroke-width="3" stroke-linecap="round"/>
    <!-- 翅膀羽毛纹 -->
    <path d="M280,310 L300,315" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M290,300 L305,305" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 尾巴 -->
    <path d="M305,365 L270,380 L295,372 Z" fill="#9E9E9E" stroke="#757575" stroke-width="0.5"/>
    <path d="M300,362 L280,372 L295,367 Z" fill="#BDBDBD"/>

    <!-- 腿部（到踏板） -->
    <g stroke="#FFCC80" stroke-width="4" stroke-linecap="round">
      <line x1="340" y1="365" x2="350" y2="395"/>
      <line x1="355" y1="363" x2="365" y2="395"/>
    </g>
    <circle cx="350" cy="395" r="4" fill="#FFB74D"/>
    <circle cx="365" cy="395" r="4" fill="#FFB74D"/>
  </g>

  <!-- 背景装饰：远处的海鸥 -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M150,270 Q160,260 170,268 Q160,275 150,270"/>
    <path d="M160,275 Q170,265 180,272 Q170,278 160,275"/>
    <path d="M580,250 Q590,240 600,248 Q590,255 580,250"/>
    <path d="M590,255 Q600,245 610,252 Q600,258 590,255"/>
  </g>
  
  <!-- 前景小沙粒 -->
  <g fill="#E6C288" opacity="0.6">
    <circle cx="80" cy="470" r="2"/>
    <circle cx="720" cy="465" r="1.5"/>
    <circle cx="650" cy="475" r="1"/>
    <circle cx="200" cy="480" r="2"/>
  </g>
</svg>