      <stop offset=".43" stop-color="#a8d7d7"/>
      <stop offset=".78" stop-color="#f6d2a7"/>
      <stop offset="1" stop-color="#f9e1b4"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#fff8da" stop-opacity=".94"/>
      <stop offset=".27" stop-color="#ffe6a4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe6a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#549ca9"/>
      <stop offset=".52" stop-color="#66b7bc"/>
      <stop offset="1" stop-color="#b5d6c7"/>
    </linearGradient>
    <linearGradient id="sand" x2="0" y2="1">
      <stop stop-color="#eee0bd"/>
      <stop offset=".55" stop-color="#e8c99b"/>
      <stop offset="1" stop-color="#d5ae80"/>
