    <linearGradient id="beak" x1="0" x2=".2" y2="1">
      <stop stop-color="#ffe3a1"/>
      <stop offset=".42" stop-color="#eeb76e"/>
      <stop offset="1" stop-color="#bb7d53"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" x2=".65" y2="1">
