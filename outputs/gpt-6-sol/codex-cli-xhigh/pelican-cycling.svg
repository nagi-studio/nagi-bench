      <stop offset=".55" stop-color="#131e23"/>
      <stop offset="1" stop-color="#48575a"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" x2="1" y2="1">
      <stop stop-color="#fa8f63"/>
      <stop offset=".48" stop-color="#d65848"/>
      <stop offset="1" stop-color="#a53e37"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1" y2="1">
      <stop stop-color="#fffdf1"/>
      <stop offset=".42" stop-color="#f5edda"/>
      <stop offset=".78" stop-color="#d8d3c2"/>
      <stop offset="1" stop-color="#aeb7b1"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" x2="1" y2="1">
      <stop stop-color="#f7f1df"/>
      <stop offset=".38" stop-color="#e6e0cb"/>
      <stop offset="1" stop-color="#7c9b9b"/>
