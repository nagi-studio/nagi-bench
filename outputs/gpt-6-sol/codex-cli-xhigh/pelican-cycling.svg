      <stop offset=".38" stop-color="#ed9e87"/>
      <stop offset=".74" stop-color="#db7970"/>
      <stop offset="1" stop-color="#ad6665"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop stop-color="#0d1b1b" offset=".42"/>
      <stop stop-color="#5d7770" offset=".65"/>
      <stop stop-color="#e7d1a6" offset="1"/>
    </radialGradient>
