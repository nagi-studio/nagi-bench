<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">海边骑自行车的鹈鹕</title>
  <desc id="description">夕阳下，一只羽毛蓬松的鹈鹕骑着珊瑚红色的自行车，沿着海滩前行，身后是波光粼粼的海面。</desc>
