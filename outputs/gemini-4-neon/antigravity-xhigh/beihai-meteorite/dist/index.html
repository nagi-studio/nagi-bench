<!doctype html>
<html lang="zh-CN">

    <main id="cinema-root">

      <div id="letterbox-bottom" class="letterbox" aria-hidden="true"></div>

          <div class="scope-hud scope-hud-bl">VEL 500M/S · TOF 10.0S</div>
          <div class="scope-hud scope-hud-br" id="scope-hud-status">LOCK</div>
        </div>
      </div>

      <!-- Title & End Credits overlay (non-subtitle cinema typography) -->
      <div id="title-overlay" aria-hidden="true">
        <div class="title-card" id="opening-title">
          <div class="title-eyebrow">GEO-SYNC ORBIT · 36,000 KM</div>
          <h1 class="title-main">陨 石 雨</h1>
          <div class="title-sub">METEOR SHOWER</div>

          <h2 class="title-main">陨 石 雨</h2>
          <div class="title-sub">METEOR SHOWER</div>
          <div class="title-rule"></div>
          <div class="title-credit">终</div>
          <div class="title-meta">
            <span>程序化体素影像 · Three.js &amp; Web Audio API</span>
            <span>同步轨道 · 黄河空间站五公里外</span>
          </div>
        </div>
      </div>

      <!-- Full-frame cinema fade curtain (black or flash) -->
      <div id="fade-curtain" aria-hidden="true"></div>
    </main>
  </body>
</html>
