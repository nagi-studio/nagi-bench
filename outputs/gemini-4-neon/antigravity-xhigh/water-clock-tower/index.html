<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水运仪象台 · 北宋苏颂机械报时原理 3D 物理科普</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>

      <!-- Subtle vignette & top bar -->
      <div class="vignette"></div>

      <!-- Opening Title Card -->
      <div id="title-card" class="title-card">
        <div class="title-seal">北宋 · 元祐三年（1088）</div>
        <h1 class="title-main">水运仪象台</h1>
        <div class="title-sub">苏颂水力擒纵与自动报时机械原理</div>
      </div>

      <!-- Top-left Compact Step Indicator (Causal Chain Progress) -->
      <header class="hud-top">
        <div class="brand-tag">
          <span class="brand-dot"></span>
          <span class="brand-name">水运仪象台 · 实时物理模拟</span>
        </div>
        <nav class="chain-bar" id="chain-bar" aria-label="传动步骤">
          <button class="chain-step" data-act="1"><span class="step-num">一</span>恒压注水</button>
          <span class="chain-arrow">→</span>
          <button class="chain-step" data-act="2"><span class="step-num">二</span>天衡擒纵</button>
          <span class="chain-arrow">→</span>
          <button class="chain-step" data-act="3"><span class="step-num">三</span>齿轮传动</button>
          <span class="chain-arrow">→</span>
          <button class="chain-step" data-act="4"><span class="step-num">四</span>木阁报时</button>
          <span class="chain-arrow">→</span>
          <button class="chain-step" data-act="5"><span class="step-num">五</span>浑象观天</button>
        </nav>
      </header>

      <!-- 3D-Tracked Callout Layer -->
      <div id="callout-layer" class="callout-layer"></div>

      <!-- Live Telemetry Badge (Subtle Physics Status) -->
      <div class="telemetry-pill" id="telemetry-pill">
        <span class="tel-item"><span class="tel-label">当前时辰</span><strong id="tel-shichen">子时</strong></span>
        <span class="tel-sep"></span>
        <span class="tel-item"><span class="tel-label">擒纵步数</span><strong id="tel-ticks">0</strong></span>
      </div>

      <!-- Bottom Subtitle & Compact Cinema Controls -->
      <footer class="hud-bottom">
        <div id="subtitle-box" class="subtitle-box">
          <div id="subtitle-tag" class="subtitle-tag"></div>
          <p id="subtitle-text" class="subtitle-text"></p>
        </div>

        <div class="controls-bar">
          <button id="btn-play" class="ctrl-btn" title="播放 / 暂停">⏸</button>
          <button id="btn-replay" class="ctrl-btn" title="重播短片">↺ 重播</button>
          <div class="timeline-wrap" id="timeline-wrap">
            <div class="timeline-track">
              <div class="timeline-fill" id="timeline-fill"></div>
            </div>
            <span class="time-readout" id="time-readout">00:00 / 00:32</span>
          </div>
          <button id="btn-orbit" class="ctrl-btn" title="自由旋转观察">自由视角</button>
          <button id="btn-audio" class="ctrl-btn" title="静音 / 开启声音">🔊</button>
        </div>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
