<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北宋 · 水运仪象台 — 3D 实时物理科普短片</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <!-- Minimal museum-style title badge (top-left) -->
      <header id="title-badge" class="title-badge">
        <div class="badge-seal">宋</div>
        <div class="badge-text">
          <div class="badge-main">水运仪象台</div>
          <div class="badge-sub">公元1088年 · 苏颂 · 实时刚体物理驱动</div>
        </div>
      </header>

      <!-- Live telemetry / causal step pill (top-right, compact) -->
      <aside id="step-indicator" class="step-indicator">
        <div class="step-num" id="step-num">序</div>
        <div class="step-meta">
          <div class="step-title" id="step-title">千年水钟全貌</div>
          <div class="step-metrics" id="step-metrics">枢轮步进 0 格 · 当前时辰：子时</div>
        </div>
      </aside>

      <!-- 3D anchored leader callouts container -->
      <div id="callouts-layer" class="callouts-layer" aria-hidden="true"></div>

      <!-- Opening center title overlay (fades away cleanly after 3.2s) -->
      <div id="intro-title" class="intro-title">
        <div class="intro-era">北宋元祐三年 · 公元1088年</div>
        <h1>水运仪象台</h1>
        <div class="intro-desc">一滴恒流，如何驱动五级机械、按时撞钟报辰？</div>
      </div>

      <!-- Bottom cinematic subtitle + subtle interactive playback bar -->
      <footer id="bottom-hud" class="bottom-hud">
        <div id="subtitle-box" class="subtitle-box">
          <p id="subtitle-text"></p>
        </div>

        <div class="controls-bar">
          <button id="btn-play" class="ctrl-btn" title="播放/暂停">❚❚</button>
          <button id="btn-replay" class="ctrl-btn" title="重播短片">↻</button>

          <div class="timeline-wrap">
            <div class="chapter-pills" id="chapter-pills">
              <button data-time="0" class="chap-btn active">全貌</button>
              <button data-time="4.8" class="chap-btn">① 恒流</button>
              <button data-time="10.6" class="chap-btn">② 天衡擒纵</button>
              <button data-time="16.6" class="chap-btn">③ 齿轮立轴</button>
              <button data-time="21.6" class="chap-btn">④ 木阁报时</button>
              <button data-time="26.8" class="chap-btn">⑤ 浑象浑仪</button>
            </div>
            <div class="progress-track" id="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>

          <span id="time-readout" class="time-readout">00:00 / 00:32</span>
          <button id="btn-audio" class="ctrl-btn" title="开关声音">🔊</button>
          <button id="btn-cam" class="ctrl-btn ctrl-btn-wide" title="切换导览/自由视角">导览镜头</button>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
