<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="A pelican riding a bicycle by the sea">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ef"/>
      <stop offset="0.55" stop-color="#cdeafb"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.4" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a93c9"/>
      <stop offset="1" stop-color="#176b9c"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6b8"/>
      <stop offset="1" stop-color="#e3c887"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ec"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a623"/>
      <stop offset="1" stop-color="#e07b16"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd266"/>
      <stop offset="1" stop-color="#f2902a"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e23b3b"/>
      <stop offset="1" stop-color="#b21f1f"/>
    </linearGradient>
    <radialGradient id="tire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#2b2b2b"/>
      <stop offset="0.86" stop-color="#111111"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="130" r="120" fill="url(#sun)"/>
  <circle cx="700" cy="130" r="46" fill="#fff4cf"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="170" cy="110" rx="62" ry="26"/>
    <ellipse cx="220" cy="98" rx="46" ry="22"/>
    <ellipse cx="120" cy="100" rx="40" ry="20"/>
    <ellipse cx="470" cy="70" rx="54" ry="22"/>
    <ellipse cx="510" cy="60" rx="38" ry="18"/>
  </g>

  <!-- Seagulls -->
  <g stroke="#3a4a55" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M380 90 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M430 120 q9 -9 18 0 q9 -9 18 0"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="360" width="900" height="120" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M40 392 q30 -10 60 0 t60 0 t60 0 t60 0"/>
    <path d="M520 408 q30 -10 60 0 t60 0 t60 0 t60 0"/>
    <path d="M120 440 q30 -10 60 0 t60 0 t60 0"/>
  </g>
  <ellipse cx="700" cy="372" rx="60" ry="14" fill="#ffffff" opacity="0.45"/>

  <!-- Beach -->
  <path d="M0 470 Q230 440 450 470 T900 472 L900 600 L0 600 Z" fill="url(#sand)"/>
  <g fill="#d8b96f" opacity="0.6">
    <circle cx="120" cy="540" r="4"/>
    <circle cx="260" cy="565" r="3"/>
    <circle cx="540" cy="555" r="5"/>
    <circle cx="700" cy="575" r="3"/>
    <circle cx="820" cy="540" r="4"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#9fc7dd" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="150" y1="430" x2="210" y2="430"/>
    <line x1="135" y1="455" x2="205" y2="455"/>
    <line x1="160" y1="480" x2="215" y2="480"/>
  </g>

  <!-- Bicycle -->
  <g>
    <!-- Wheels -->
    <g>
      <circle cx="330" cy="470" r="74" fill="none" stroke="url(#tire)" stroke-width="14"/>
      <circle cx="330" cy="470" r="62" fill="none" stroke="#cfd6db" stroke-width="3"/>
      <circle cx="560" cy="470" r="74" fill="none" stroke="url(#tire)" stroke-width="14"/>
      <circle cx="560" cy="470" r="62" fill="none" stroke="#cfd6db" stroke-width="3"/>
      <g stroke="#b9c2c9" stroke-width="2">
        <line x1="330" y1="408" x2="330" y2="532"/>
        <line x1="268" y1="470" x2="392" y2="470"/>
        <line x1="286" y1="426" x2="374" y2="514"/>
        <line x1="286" y1="514" x2="374" y2="426"/>
        <line x1="560" y1="408" x2="560" y2="532"/>
        <line x1="498" y1="470" x2="622" y2="470"/>
        <line x1="516" y1="426" x2="604" y2="514"/>
        <line x1="516" y1="514" x2="604" y2="426"/>
      </g>
      <circle cx="330" cy="470" r="7" fill="#7d848a"/>
      <circle cx="560" cy="470" r="7" fill="#7d848a"/>
    </g>

    <!-- Frame -->
    <g stroke="url(#frame)" stroke-width="11" fill="none" stroke-linecap="round">
      <line x1="330" y1="470" x2="445" y2="470"/>   <!-- chain stay -->
      <line x1="445" y1="470" x2="400" y2="350"/>   <!-- seat tube -->
      <line x1="400" y1="350" x2="540" y2="345"/>   <!-- top tube -->
      <line x1="330" y1="470" x2="400" y2="350"/>   <!-- seat stay -->
      <line x1="445" y1="470" x2="540" y2="345"/>   <!-- down tube -->
      <line x1="540" y1="345" x2="560" y2="470"/>   <!-- fork -->
    </g>

    <!-- Crank + pedals -->
    <circle cx="445" cy="470" r="13" fill="#5a6066"/>
    <line x1="445" y1="470" x2="445" y2="505" stroke="#5a6066" stroke-width="7" stroke-linecap="round"/>
    <rect x="430" y="503" width="30" height="9" rx="3" fill="#333"/>

    <!-- Seat -->
    <path d="M380 348 q20 -10 44 0 q-8 8 -22 8 q-14 0 -22 -8 Z" fill="#2f2f2f"/>
    <line x1="400" y1="352" x2="400" y2="350" stroke="#5a6066" stroke-width="6"/>

    <!-- Handlebar -->
    <line x1="540" y1="345" x2="568" y2="318" stroke="#5a6066" stroke-width="8" stroke-linecap="round"/>
    <path d="M556 312 q14 -2 22 6" stroke="#2f2f2f" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Tail -->
    <path d="M335 300 q-55 -6 -92 18 q40 14 92 6 Z" fill="url(#body)" stroke="#c4ccd3" stroke-width="2"/>

    <!-- Body -->
    <path d="M340 300
             q-26 -70 44 -104
             q70 -34 120 6
             q40 34 18 92
             q-22 54 -104 58
             q-66 2 -78 -52 Z"
          fill="url(#body)" stroke="#c4ccd3" stroke-width="3"/>

    <!-- Wing -->
    <path d="M372 250 q70 -30 132 6 q-20 56 -86 62 q-44 4 -52 -32 q-4 -22 6 -36 Z"
          fill="#eef2f6" stroke="#c4ccd3" stroke-width="2"/>
    <g stroke="#c4ccd3" stroke-width="2" fill="none" opacity="0.8">
      <path d="M392 262 q52 -16 104 4"/>
      <path d="M398 282 q48 -10 92 6"/>
    </g>

    <!-- Neck -->
    <path d="M470 200
             q34 -34 70 -30
             q40 4 58 26
             q-10 22 -44 22
             q-40 0 -64 22
             q-26 -22 -20 -40 Z"
          fill="url(#body)" stroke="#c4ccd3" stroke-width="3"/>

    <!-- Head -->
    <circle cx="548" cy="196" r="30" fill="url(#body)" stroke="#c4ccd3" stroke-width="3"/>

    <!-- Eye -->
    <circle cx="560" cy="188" r="7.5" fill="#2b2b2b"/>
    <circle cx="563" cy="185" r="2.4" fill="#ffffff"/>

    <!-- Upper beak -->
    <path d="M572 188 q70 -10 150 8 q-12 16 -34 16 q-66 0 -118 -8 Z"
          fill="url(#beak)" stroke="#c96a12" stroke-width="2"/>
    <!-- Lower beak + pouch -->
    <path d="M576 200
             q66 6 142 14
             q-8 44 -54 50
             q-58 6 -92 -26
             q-14 -16 -10 -38 Z"
          fill="url(#pouch)" stroke="#c96a12" stroke-width="2"/>
    <path d="M600 214 q60 14 120 8" stroke="#c96a12" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Wing tip resting near handlebar -->
    <path d="M504 268 q44 18 78 44 q-10 16 -34 12 q-40 -8 -56 -38 Z"
          fill="#eef2f6" stroke="#c4ccd3" stroke-width="2"/>

    <!-- Legs to pedal -->
    <path d="M430 352 q6 70 12 150" stroke="#f2a93b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M460 350 q22 78 0 153" stroke="#e8962a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Webbed feet on pedal -->
    <path d="M438 502 q-14 6 -22 14 q22 6 34 -2 q4 -8 -12 -12 Z" fill="#f2a93b" stroke="#c96a12" stroke-width="1.5"/>
    <path d="M452 504 q-12 8 -18 16 q22 4 32 -4 q2 -10 -14 -12 Z" fill="#e8962a" stroke="#c96a12" stroke-width="1.5"/>
  </g>

  <!-- Small foam at wheel bases -->
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="330" cy="544" rx="40" ry="8"/>
    <ellipse cx="560" cy="544" rx="40" ry="8"/>
  </g>
</svg>
