<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三体：陨石刺杀 | Three-Body: Meteorite Assassination</title>
    <meta
      name="description"
      content="基于《三体II：黑暗森林》改编的程序化 3D 电影：章北海的陨石暗杀行动。"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #stage canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      .cinematic-letterbox {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="cinematic-letterbox"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
