      <stop offset="0" stop-color="#2d79b2"/>
      <stop offset="0.34" stop-color="#6fb3d4"/>
      <stop offset="0.66" stop-color="#ffd49b"/>
      <stop offset="1" stop-color="#ffeed0"/>
    </linearGradient>
    <radialGradient id="gSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe9ac" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd489" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4f7d"/>
      <stop offset="0.45" stop-color="#1d7fa8"/>
      <stop offset="1" stop-color="#58b6cb"/>
