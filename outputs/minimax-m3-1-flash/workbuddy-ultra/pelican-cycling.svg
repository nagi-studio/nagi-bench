    <linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mFade">
      <rect x="0" y="640" width="1200" height="160" fill="url(#gFade)"/>
    </mask>
    <radialGradient id="gVignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b1206" stop-opacity="0.36"/>
