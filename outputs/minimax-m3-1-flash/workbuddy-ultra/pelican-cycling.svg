      <stop offset="0.45" stop-color="#dcc094"/>
      <stop offset="1" stop-color="#b9976a"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.5" stop-color="#f7f1e2"/>
      <stop offset="1" stop-color="#d9cdb2"/>
    </linearGradient>
    <linearGradient id="gWing" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f6efdd"/>
      <stop offset="1" stop-color="#dccfae"/>
    </linearGradient>
    <linearGradient id="gBill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc87e"/>
      <stop offset="0.55" stop-color="#f4a044"/>
      <stop offset="1" stop-color="#d97b25"/>
