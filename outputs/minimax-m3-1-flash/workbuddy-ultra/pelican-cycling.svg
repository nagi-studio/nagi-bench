<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">鹈鹕在海边骑自行车</title>
  <desc id="dsc">一只鹈鹕骑在公路车上沿着黄昏的海滨疾行，长喙下挂着饱满的喉囊，脚踩踏板，车轮转动，湿沙上映出倒影。</desc>

  <defs>
