<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skeleton Watch · 镂空机械表</title>
<style>
:root{
  --bg:#05060800;
  --ink:#eceae5;
  --ink-dim:#9aa0a8;
  --ink-faint:#6b7178;
  --gold:#d8b26a;
  --gold-soft:rgba(216,178,106,.42);
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --panel:rgba(14,16,20,.62);
  --panel-solid:rgba(10,12,15,.90);
  --blur:saturate(150%) blur(18px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 90% at 50% 8%,#1b1f27 0%,#0d1014 42%,#05060a 100%),
    #05060a;
  color:var(--ink);
  font-family:"Inter","Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0}
#view{display:block;width:100%;height:100%}
.vig{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(78% 62% at 50% 46%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}

/* ---------- brand ---------- */
#brand{
  position:fixed;left:30px;top:26px;pointer-events:none;z-index:6;
  transition:opacity .45s ease;
}
#brand .b1{
  font-size:15px;letter-spacing:.46em;font-weight:600;color:var(--ink);
  text-transform:uppercase;
}
#brand .b2{
  margin-top:7px;font-size:11.5px;letter-spacing:.20em;color:var(--ink-faint);
}
#brand .rule{
  margin-top:12px;width:56px;height:1px;
  background:linear-gradient(90deg,var(--gold),rgba(216,178,106,0));
}

/* ---------- hint ---------- */
#hint{
  position:fixed;left:30px;bottom:26px;z-index:6;pointer-events:none;
  font-size:11px;letter-spacing:.10em;color:var(--ink-faint);
  max-width:min(46vw,420px);line-height:1.7;
}

/* ---------- toolbar ---------- */
#toolbar{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:8;
  display:flex;align-items:center;gap:8px;
  padding:8px;border-radius:14px;
  background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
}
.tb{
  display:inline-flex;align-items:center;gap:8px;
  height:34px;padding:0 13px;border-radius:9px;cursor:pointer;
  background:transparent;border:1px solid transparent;
  color:var(--ink-dim);font-size:11.5px;letter-spacing:.09em;font-family:inherit;
  transition:color .2s,background .2s,border-color .2s;
  white-space:nowrap;
}
.tb:hover{color:var(--ink);background:rgba(255,255,255,.055);border-color:var(--line)}
.tb[aria-pressed="true"]{
  color:#1a1409;background:linear-gradient(180deg,#e7c687,var(--gold));
  border-color:rgba(255,255,255,.30);font-weight:600;
  box-shadow:0 4px 16px rgba(216,178,106,.26);
}
.tb .ic{width:13px;height:13px;flex:0 0 13px;position:relative;display:block}
.tb .ic::before,.tb .ic::after{content:"";position:absolute;inset:0}
/* exploded icon: three stacked bars */
.ic-ex::before{
  background:currentColor;height:2px;top:0;bottom:auto;
  box-shadow:0 5.5px 0 currentColor,0 11px 0 currentColor;
}
.ic-ex::after{display:none}
/* rotate icon: circular arrow */
.ic-sp::before{
  border:1.6px solid currentColor;border-radius:50%;
  border-right-color:transparent;border-bottom-color:transparent;
  transform:rotate(35deg);
}
.ic-sp::after{
  inset:auto -1px -1px auto;width:0;height:0;background:none;
  border-left:3.4px solid currentColor;border-top:2.6px solid transparent;
  border-bottom:2.6px solid transparent;transform:translate(1px,1px);
}
/* labels icon: tag */
.ic-lb::before{
  border:1.5px solid currentColor;border-radius:2px 6px 6px 2px;
  transform:rotate(0deg);left:0;right:2px;
}
.ic-lb::after{
  inset:auto;width:3px;height:3px;left:2.5px;top:5px;
  background:currentColor;border-radius:50%;
}
/* reset icon: crosshair */
.ic-rs::before{
  border:1.5px solid currentColor;border-radius:50%;inset:1.5px;
}
.ic-rs::after{
  inset:auto;left:6px;top:-1px;width:1.4px;height:15px;background:currentColor;
  box-shadow:0 0 0 0 transparent;
}
.slider{
  display:flex;align-items:center;gap:9px;height:34px;padding:0 12px 0 10px;
  border-left:1px solid var(--line);margin-left:2px;
}
.slider label{font-size:10.5px;letter-spacing:.10em;color:var(--ink-faint);white-space:nowrap}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:96px;height:16px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold) var(--fill,0%),rgba(255,255,255,.14) var(--fill,0%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;margin-top:-4.5px;
  background:#f0e3c8;border:1px solid rgba(0,0,0,.5);box-shadow:0 1px 6px rgba(0,0,0,.6);
}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:2px;border-radius:2px;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:1px solid rgba(0,0,0,.5);border-radius:50%;background:#f0e3c8}

/* ---------- info panel ---------- */
#panel{
  position:fixed;right:26px;top:26px;width:326px;max-height:calc(100vh - 52px);
  z-index:7;display:flex;flex-direction:column;
  border-radius:15px;overflow:hidden;
  background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .4s cubic-bezier(.22,.9,.28,1),opacity .3s;
}
#panel.hidden{transform:translateX(calc(100% + 34px));opacity:0;pointer-events:none}
.p-head{
  padding:15px 17px 13px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.p-head .t{font-size:11px;letter-spacing:.30em;color:var(--gold);text-transform:uppercase}
.p-head .s{margin-top:6px;font-size:15px;letter-spacing:.05em;color:var(--ink);font-weight:500}
.p-head .s em{font-style:normal;color:var(--ink-faint);font-size:11.5px;letter-spacing:.14em;display:block;margin-top:4px}
.p-close{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink-faint);
  font-size:14px;line-height:1;font-family:inherit;
}
.p-close:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(255,255,255,.05)}
.p-body{padding:14px 17px 16px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.p-body::-webkit-scrollbar{width:6px}
.p-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
.sec-t{
  font-size:10px;letter-spacing:.26em;color:var(--ink-faint);text-transform:uppercase;
  margin:2px 0 10px;display:flex;align-items:center;gap:9px;
}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.desc{font-size:12.5px;line-height:1.78;color:#c9cdd3;margin-bottom:14px}
.desc .en{display:block;margin-top:6px;font-size:11px;line-height:1.66;color:var(--ink-faint)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:0 12px;margin-bottom:16px}
.spec dt{
  font-size:11px;color:var(--ink-faint);letter-spacing:.06em;
  padding:6.5px 0;border-bottom:1px solid rgba(255,255,255,.055);white-space:nowrap;
}
.spec dd{
  font-size:11.5px;color:var(--ink);text-align:right;
  padding:6.5px 0;border-bottom:1px solid rgba(255,255,255,.055);
  font-variant-numeric:tabular-nums;
}
.parts{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
.pr{
  display:flex;align-items:center;gap:10px;
  padding:7px 9px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;background:transparent;text-align:left;
  font-family:inherit;transition:background .16s,border-color .16s;
}
.pr:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.pr.on{background:rgba(216,178,106,.13);border-color:var(--gold-soft)}
.pr .n{flex:1;min-width:0}
.pr .zh{font-size:12px;color:var(--ink);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .en{font-size:9.5px;color:var(--ink-faint);letter-spacing:.11em;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex:0 0 5px}
.pr.on .dot,.pr:hover .dot{background:var(--gold);box-shadow:0 0 8px var(--gold-soft)}
.p-foot{
  padding:11px 17px;border-top:1px solid var(--line);
  font-size:10px;letter-spacing:.10em;color:var(--ink-faint);
  display:flex;justify-content:space-between;gap:8px;
}
#fps{font-variant-numeric:tabular-nums}

/* ---------- floating labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lb{
  position:absolute;left:0;top:0;will-change:transform,opacity;
  display:flex;align-items:center;gap:7px;
  transform-origin:0 50%;opacity:0;transition:opacity .3s;
  pointer-events:auto;cursor:pointer;
}
.lb .pip{
  width:7px;height:7px;flex:0 0 7px;border-radius:50%;
  background:rgba(216,178,106,.20);border:1px solid var(--gold);
  box-shadow:0 0 10px rgba(216,178,106,.35);
  transition:background .2s,transform .2s;
}
.lb .stem{width:26px;height:1px;background:linear-gradient(90deg,var(--gold-soft),rgba(216,178,106,.10))}
.lb .txt{
  padding:3.5px 9px;border-radius:6px;white-space:nowrap;
  background:rgba(8,10,13,.78);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:10.5px;letter-spacing:.09em;color:#cfd3d8;
}
.lb .txt i{font-style:normal;color:var(--ink-faint);font-size:9px;letter-spacing:.13em;margin-left:6px;text-transform:uppercase}
.lb.on .pip{background:var(--gold);transform:scale(1.35)}
.lb.on .txt{color:#fff;border-color:var(--gold-soft);background:rgba(28,22,10,.86)}
.lb:hover .txt{color:#fff;border-color:var(--line-strong)}

/* ---------- hover tooltip ---------- */
#tip{
  position:fixed;z-index:9;pointer-events:none;opacity:0;
  transform:translate(-50%,-150%);transition:opacity .16s;
  padding:5px 10px;border-radius:7px;white-space:nowrap;
  background:var(--panel-solid);border:1px solid var(--line-strong);
  font-size:11px;letter-spacing:.07em;color:var(--ink);
  box-shadow:0 10px 28px rgba(0,0,0,.6);
}
#tip.show{opacity:1}
#tip i{font-style:normal;color:var(--ink-faint);font-size:9.5px;letter-spacing:.12em;margin-left:7px}

/* ---------- boot overlay ---------- */
#boot{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(80% 60% at 50% 45%,#12151b,#05060a 75%);
  transition:opacity .7s ease;
}
#boot.gone{opacity:0;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.ring{
  width:46px;height:46px;border-radius:50%;
  border:1.5px solid rgba(216,178,106,.20);border-top-color:var(--gold);
  animation:spin 1.05s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-t{font-size:11px;letter-spacing:.26em;color:var(--ink-faint);text-transform:uppercase}
#fatal{
  position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:32px;
  background:#05060a;text-align:center;
}
#fatal.show{display:grid}
#fatal p{font-size:13px;line-height:1.9;color:var(--ink-dim);max-width:460px}

@media (max-width:1080px){
  #panel{width:290px}
}
@media (max-width:860px){
  #brand{left:18px;top:18px}
  #brand .b1{font-size:13px;letter-spacing:.34em}
  #hint{display:none}
  #panel{
    right:12px;left:12px;top:auto;bottom:82px;width:auto;max-height:44vh;
  }
  #toolbar{
    left:12px;right:12px;bottom:14px;transform:none;
    overflow-x:auto;justify-content:flex-start;border-radius:12px;
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar{display:none}
  .slider{display:none}
  .tb .tx{display:none}
  .tb{padding:0 11px}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="stage"><canvas id="view"></canvas></div>
<div class="vig"></div>

<header id="brand">
  <div class="b1">Skeleton Watch</div>
  <div class="b2">镂空机械表 · Calibre SK-288</div>
  <div class="rule"></div>
</header>

<div id="hint">
  拖拽旋转 · 滚轮缩放 · 悬停或点击零件查看结构说明<br>
  Drag to orbit · Scroll to zoom · Click a component for details
</div>

<nav id="toolbar">
  <button class="tb" id="btnExplode" aria-pressed="false"><span class="ic ic-ex"></span><span class="tx">爆炸视图 Exploded</span></button>
  <button class="tb" id="btnSpin" aria-pressed="false"><span class="ic ic-sp"></span><span class="tx">自动旋转 Orbit</span></button>
  <button class="tb" id="btnLabels" aria-pressed="true"><span class="ic ic-lb"></span><span class="tx">零件标签 Labels</span></button>
  <button class="tb" id="btnReset"><span class="ic ic-rs"></span><span class="tx">重置视角 Reset</span></button>
  <div class="slider">
    <label for="expRange">分离度</label>
    <input id="expRange" type="range" min="0" max="100" value="0" step="1">
  </div>
</nav>

<aside id="panel">
  <div class="p-head">
    <div>
      <div class="t">Movement</div>
      <div class="s" id="pTitle">Calibre SK-288<em>Skeleton · Hand-wound</em></div>
    </div>
    <button class="p-close" id="pClose" title="收起面板">&#10005;</button>
  </div>
  <div class="p-body" id="pBody"></div>
  <div class="p-foot"><span>WebGL · Three.js</span><span id="fps">—</span></div>
</aside>

<div id="labels"></div>
<div id="tip"></div>

<div id="boot"><div class="boot-in"><div class="ring"></div><div class="boot-t">Assembling the movement</div></div></div>
<div id="fatal"><p id="fatalMsg"></p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ constants ============================ */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

// Axial layer plan. +Z is the dial side, -Z is the caseback side.
const Z = {
  backGlass: -0.500,
  plate:     -0.400,   plateT: 0.100,
  wheel:     -0.255,   wheelT: 0.045,
  barrel:    -0.290,   barrelT: 0.250,
  bridge:    -0.170,   bridgeT: 0.085,
  pallet:    -0.150,   palletT: 0.050,
  balance:   -0.050,   balanceT: 0.090,
  hair:       0.065,
  cock:       0.090,   cockT: 0.070,
  chapter:    0.215,   chapterT: 0.030,
  handH:      0.255,
  handM:      0.290,
  handS:      0.325,
  crystal:    0.380
};

// Wheel-train layout in the movement plane (x right, y up). Adjacent pitch
// circles are tangent, so every stage actually meshes: the chain is walked
// outward from the center wheel at fixed angles with exact centre distances.
const TRAIN = {
  barrel:  { x: -0.4133, y:  0.6614, pitch: 0.440, tip: 0.460, teeth: 64 },
  center:  { x:  0.0000, y:  0.0000, pitch: 0.340, tip: 0.360, teeth: 64 },
  third:   { x:  0.5257, y: -0.2451, pitch: 0.240, tip: 0.255, teeth: 60 },
  fourth:  { x:  0.6728, y: -0.6491, pitch: 0.190, tip: 0.205, teeth: 60 },
  escape:  { x:  0.4124, y: -0.8676, pitch: 0.150, tip: 0.165, teeth: 15 },
  pallet:  { x:  0.1869, y: -0.9497, arm: 0.110, tail: 0.200, angle: 0.349 },
  balance: { x: -0.0588, y: -1.1218, r: 0.420 }
};

const BEAT_HZ = 4;                    // 4 Hz balance => 8 beats per second
const ESCAPE_TEETH = TRAIN.escape.teeth;

/* ============================ renderer ============================ */
const canvas = document.getElementById('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (err) {
  showFatal('当前浏览器无法初始化 WebGL，请更换支持硬件加速的浏览器后重试。');
  throw err;
}
function showFatal(msg) {
  document.getElementById('fatalMsg').textContent = msg;
  document.getElementById('fatal').classList.add('show');
  document.getElementById('boot').classList.add('gone');
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 220);
const HOME = new THREE.Vector3(3.05, 1.85, 11.4);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.062;
controls.rotateSpeed = 0.78;
controls.zoomSpeed = 0.72;
controls.panSpeed = 0.5;
controls.minDistance = 4.2;
controls.maxDistance = 26;
controls.autoRotateSpeed = 0.72;
controls.target.set(0, 0, -0.05);
controls.maxPolarAngle = Math.PI * 0.94;
controls.update();

/* ==================== procedural studio environment ==================== */
function softBlob(ctx, cx, cy, rx, ry, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0.00, color);
  g.addColorStop(0.42, color.replace(/,1\)$/, ',0.52)'));
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function studioEnvironmentCanvas() {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 512;
  const x = cv.getContext('2d');

  const base = x.createLinearGradient(0, 0, 0, 512);
  base.addColorStop(0.00, '#22262e');
  base.addColorStop(0.26, '#12151a');
  base.addColorStop(0.50, '#080a0d');
  base.addColorStop(0.74, '#05060800');
  base.addColorStop(1.00, '#0b0d11');
  x.fillStyle = base;
  x.fillRect(0, 0, 1024, 512);

  // key softbox, upper left, warm neutral
  softBlob(x, 196, 84, 268, 138, 'rgba(255,251,242,1)', 0.96);
  // secondary softbox, right, cool
  softBlob(x, 792, 140, 196, 214, 'rgba(224,236,255,1)', 0.66);
  // narrow strip along the horizon: the long specular line on polished steel
  const strip = x.createLinearGradient(0, 232, 0, 274);
  strip.addColorStop(0.00, 'rgba(255,255,255,0)');
  strip.addColorStop(0.45, 'rgba(255,247,232,0.52)');
  strip.addColorStop(0.55, 'rgba(255,247,232,0.52)');
  strip.addColorStop(1.00, 'rgba(255,255,255,0)');
  x.fillStyle = strip;
  x.fillRect(0, 232, 1024, 42);
  // small hard source for sharp jewellery highlights
  softBlob(x, 520, 58, 74, 44, 'rgba(255,255,255,1)', 0.9);
  softBlob(x, 940, 300, 60, 96, 'rgba(255,236,206,1)', 0.4);
  // warm bounce from the table below
  softBlob(x, 470, 486, 540, 92, 'rgba(255,190,132,1)', 0.20);

  return cv;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
{
  const eq = new THREE.CanvasTexture(studioEnvironmentCanvas());
  eq.mapping = THREE.EquirectangularReflectionMapping;
  eq.colorSpace = THREE.SRGBColorSpace;
  scene.environment = pmrem.fromEquirectangular(eq).texture;
  eq.dispose();
}
pmrem.dispose();
scene.environmentIntensity = 1.0;

/* ============================ lights ============================ */
scene.add(new THREE.AmbientLight(0x8fa2bd, 0.22));

const key = new THREE.SpotLight(0xfff4e2, 340, 34, 34 * DEG, 0.62, 2);
key.position.set(-5.4, 7.2, 7.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.014;
key.shadow.camera.near = 1.2;
key.shadow.camera.far = 30;
key.target.position.set(0, 0, 0);
scene.add(key, key.target);

function radialTexture(size, stops) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ==================== procedural finishing textures ==================== */
function grainCanvas(size, draw) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const x = cv.getContext('2d');
  x.fillStyle = '#8a8a8a';
  x.fillRect(0, 0, size, size);
  draw(x, size);
  return cv;
}

// Cotes de Geneve: diagonal brushed stripes on bridges.
function cotesCanvas() {
  return grainCanvas(256, (x, s) => {
    x.save();
    x.translate(s / 2, s / 2);
    x.rotate(-28 * DEG);
    x.translate(-s, -s);
    const span = 13;
    for (let i = 0; i < s * 3 / span; i++) {
      const p = i * span;
      const g = x.createLinearGradient(p, 0, p + span, 0);
      g.addColorStop(0.00, '#5e5e5e');
      g.addColorStop(0.28, '#b9b9b9');
      g.addColorStop(0.48, '#efefef');
      g.addColorStop(0.68, '#a9a9a9');
      g.addColorStop(1.00, '#5e5e5e');
      x.fillStyle = g;
      x.fillRect(p, 0, span, s * 3);
    }
    x.restore();
  });
}

// Perlage: overlapping circular graining on the main plate.
function perlageCanvas() {
  return grainCanvas(256, (x, s) => {
    const n = 8, step = s / n, r = step * 0.86;
    for (let row = 0; row < n; row++) {
      for (let col = 0; col < n; col++) {
        const cx = col * step + (row % 2 ? step / 2 : 0) + step / 2;
        const cy = row * step + step / 2;
        const g = x.createRadialGradient(cx - r * 0.30, cy - r * 0.30, 0, cx, cy, r);
        g.addColorStop(0.00, '#f2f2f2');
        g.addColorStop(0.46, '#b4b4b4');
        g.addColorStop(0.86, '#7d7d7d');
        g.addColorStop(1.00, '#6a6a6a');
        x.fillStyle = g;
        x.beginPath();
        x.arc(cx, cy, r, 0, TAU);
        x.fill();
        x.strokeStyle = 'rgba(70,70,70,0.5)';
        x.lineWidth = 1;
        x.stroke();
      }
    }
  });
}

// Sobel height -> tangent-space normal map, tiled.
function normalFromHeight(cv, strength) {
  const s = cv.width;
  const src = cv.getContext('2d').getImageData(0, 0, s, s).data;
  const out = document.createElement('canvas');
  out.width = out.height = s;
  const oc = out.getContext('2d');
  const img = oc.createImageData(s, s);
  const d = img.data;
  const h = (px, py) => src[(((py + s) % s) * s + ((px + s) % s)) * 4] / 255;
  for (let y = 0; y < s; y++) {
    for (let x = 0; x < s; x++) {
      const dx = (h(x + 1, y - 1) + 2 * h(x + 1, y) + h(x + 1, y + 1))
               - (h(x - 1, y - 1) + 2 * h(x - 1, y) + h(x - 1, y + 1));
      const dy = (h(x - 1, y + 1) + 2 * h(x, y + 1) + h(x + 1, y + 1))
               - (h(x - 1, y - 1) + 2 * h(x, y - 1) + h(x + 1, y - 1));
      let nx = -dx * strength, ny = dy * strength, nz = 1;
      const l = Math.hypot(nx, ny, nz);
      nx /= l; ny /= l; nz /= l;
      const i = (y * s + x) * 4;
      d[i]     = (nx * 0.5 + 0.5) * 255;
      d[i + 1] = (ny * 0.5 + 0.5) * 255;
      d[i + 2] = (nz * 0.5 + 0.5) * 255;
      d[i + 3] = 255;
    }
  }
  oc.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(out);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function grainSet(canvas, repeat, normalStrength) {
  const rough = new THREE.CanvasTexture(canvas);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
  rough.repeat.set(repeat, repeat);
  const nrm = normalFromHeight(canvas, normalStrength);
  nrm.repeat.set(repeat, repeat);
  return { rough, nrm };
}

/* ============================ small helpers ============================ */
function cylMesh(rTop, rBot, h, seg, mat, openEnded) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, !!openEnded), mat);
  m.rotation.x = Math.PI / 2;           // align the cylinder axis with +Z
  return m;
}

function extrude(shape, depth, mat, bevel, curveSegments) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: bevel !== false,
    bevelThickness: bevel === false ? 0 : 0.008,
    bevelSize: bevel === false ? 0 : 0.008,
    bevelOffset: 0,
    bevelSegments: bevel === false ? 0 : 2,
    curveSegments: curveSegments || 18
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function ringSectorPath(r0, r1, a0, a1) {
  const p = new THREE.Path();
  p.absarc(0, 0, r1, a0, a1, false);
  p.absarc(0, 0, r0, a1, a0, true);
  p.closePath();
  return p;
}

function circlePath(r, cx, cy) {
  const p = new THREE.Path();
  p.absarc(cx || 0, cy || 0, r, 0, TAU, true);
  return p;
}

function spiralCurve(r0, r1, turns, lift) {
  const n = Math.max(48, Math.floor(turns * 54));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const a = t * turns * TAU;
    const r = r0 + (r1 - r0) * t;
    pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, t * (lift || 0)));
  }
  return new THREE.CatmullRomCurve3(pts);
}

function spiralTube(r0, r1, turns, tube, mat, lift) {
  const g = new THREE.TubeGeometry(spiralCurve(r0, r1, turns, lift || 0), Math.max(96, turns * 54), tube, 5, false);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = false;
  return m;
}

// A faceted, countersunk blued screw.
function screw(r, mat) {
  const g = new THREE.Group();
  const head = cylMesh(r, r * 0.92, r * 0.62, 12, mat);
  head.castShadow = true;
  const slot = new THREE.Mesh(new THREE.BoxGeometry(r * 1.72, r * 0.30, r * 0.34), MAT.dark);
  slot.position.z = r * 0.20;
  g.add(head, slot);
  return g;
}

// Ruby jewel in a turned gold chaton.
function jewel(r, chatonMat) {
  const g = new THREE.Group();
  const chaton = new THREE.Mesh(new THREE.LatheGeometry([
    new THREE.Vector2(r * 0.62, -r * 0.55),
    new THREE.Vector2(r * 1.55, -r * 0.30),
    new THREE.Vector2(r * 1.62,  r * 0.18),
    new THREE.Vector2(r * 1.20,  r * 0.46),
    new THREE.Vector2(r * 0.90,  r * 0.30)
  ].reverse(), 26), chatonMat || MAT.gold);
  chaton.rotation.x = Math.PI / 2;
  chaton.castShadow = true;
  const stone = cylMesh(r * 0.98, r * 0.86, r * 0.5, 18, MAT.ruby);
  stone.position.z = r * 0.16;
  g.add(chaton, stone);
  return g;
}

/* ============================ gear geometry ============================ */
function gearShape(teeth, rRoot, rTip, toothGapRatio, hubR) {
  const s = new THREE.Shape();
  const step = TAU / teeth;
  const halfTip = step * 0.22;    // angular half width of a tooth at the tip
  const halfRoot = step * 0.36;   // angular half width of a tooth at the root
  let prevRoot = -halfRoot;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const rA = a - halfRoot, tA = a - halfTip, tB = a + halfTip, rB = a + halfRoot;
    if (i === 0) s.moveTo(Math.cos(rA) * rRoot, Math.sin(rA) * rRoot);
    else s.absarc(0, 0, rRoot, prevRoot, rA, false);   // land between teeth
    s.lineTo(Math.cos(tA) * rTip, Math.sin(tA) * rTip); // rising flank
    s.absarc(0, 0, rTip, tA, tB, false);                // tooth tip
    s.lineTo(Math.cos(rB) * rRoot, Math.sin(rB) * rRoot); // falling flank
    prevRoot = rB;
  }
  s.absarc(0, 0, rRoot, prevRoot, TAU - halfRoot, false);
  s.closePath();

  if (hubR > 0) {
    // skeletonise the wheel: leave a rim, a hub and a few spokes
    const spokes = teeth > 40 ? 6 : teeth > 24 ? 5 : 4;
    const rimIn = rRoot * 0.86;
    for (let i = 0; i < spokes; i++) {
      const a = i * TAU / spokes + TAU / spokes * 0.5;
      const w = TAU / spokes * 0.58;
      s.holes.push(ringSectorPath(hubR, rimIn, a - w / 2, a + w / 2));
    }
    s.holes.push(circlePath(hubR * 0.40));   // centre bore
  }
  return s;
}

function buildWheel(teeth, rTip, thickness, mat, opts) {
  const o = opts || {};
  const rRoot = rTip * 0.935;
  const shape = gearShape(teeth, rRoot, rTip, 0.46, rTip * (o.solid ? 0 : 0.44));
  const g = new THREE.Group();
  const rim = extrude(shape, thickness, mat, o.bevel !== false);
  rim.position.z = thickness / 2;
  g.add(rim);

  const hubR = rTip * 0.44;
  if (!o.solid) {
    const hub = cylMesh(hubR * 0.46, hubR * 0.46, thickness * 1.5, 14, mat);
    hub.position.z = thickness / 2;
    hub.castShadow = true;
    g.add(hub);
  }

  // pinion: a turned steel stem with leaves, sitting above the wheel
  if (o.pinion) {
    const pn = new THREE.Group();
    const stem = cylMesh(o.pinion.r, o.pinion.r, o.pinion.len, 12, MAT.pinion);
    stem.position.z = thickness / 2 + o.pinion.len / 2 - o.pinion.r * 0.4;
    pn.add(stem);
    const leaves = o.pinion.leaves || 8;
    for (let i = 0; i < leaves; i++) {
      const a = i * TAU / leaves;
      const leaf = new THREE.Mesh(
        new THREE.BoxGeometry(o.pinion.r * 0.62, o.pinion.len * 0.82, o.pinion.r * 0.42),
        MAT.pinion
      );
      leaf.position.set(
        Math.cos(a) * o.pinion.r * 0.86,
        Math.sin(a) * o.pinion.r * 0.86,
        thickness / 2 + o.pinion.len / 2 - o.pinion.r * 0.4
      );
      leaf.rotation.z = a;
      leaf.castShadow = true;
      pn.add(leaf);
    }
    // pinion tip jewel
    const cap = jewel(o.pinion.r * 0.34, MAT.gold);
    cap.position.z = thickness / 2 + o.pinion.len - o.pinion.r * 0.5;
    pn.add(cap);
    g.add(pn);
  }

  // spokes get a polished chamfer ring for depth
  if (!o.solid && o.chamfer) {
    const ch = new THREE.Mesh(new THREE.TorusGeometry(rRoot * 0.995, thickness * 0.16, 6, Math.max(48, teeth * 2)), mat);
    ch.position.z = thickness / 2;
    g.add(ch);
  }
  return g;
}

/* ---------- bridges over the wheel train ---------- */
// Build a rounded band that passes exactly through every pivot it carries, so
// the chamfer rings and jewels land on real bearing centres.
function bridgeBand(points, width) {
  const s = new THREE.Shape();
  const n = points.length;
  const right = [], left = [];
  for (let i = 0; i < n; i++) {
    const prev = points[Math.max(0, i - 1)];
    const next = points[Math.min(n - 1, i + 1)];
    const dir = new THREE.Vector2(next.x - prev.x, next.y - prev.y).normalize();
    const nrm = new THREE.Vector2(-dir.y, dir.x).multiplyScalar(width);
    right.push(new THREE.Vector2(points[i].x + nrm.x, points[i].y + nrm.y));
    left.push(new THREE.Vector2(points[i].x - nrm.x, points[i].y - nrm.y));
  }
  s.moveTo(right[0].x, right[0].y);
  for (let i = 1; i < n; i++) s.lineTo(right[i].x, right[i].y);
  const endA = Math.atan2(right[n - 1].y - points[n - 1].y, right[n - 1].x - points[n - 1].x);
  s.absarc(points[n - 1].x, points[n - 1].y, width, endA, endA + Math.PI, false);
  for (let i = n - 2; i >= 0; i--) s.lineTo(left[i].x, left[i].y);
  const startA = Math.atan2(left[0].y - points[0].y, left[0].x - points[0].x);
  s.absarc(points[0].x, points[0].y, width, startA, startA + Math.PI, false);
  s.closePath();
  return s;
}

function buildBridge(id, points, width, zh, en, desc, spec, explode, labelDir) {
  const g = new THREE.Group();
  const s = bridgeBand(points, width);
  // bore a pivot hole at each bearing, plus a lightening void between spans
  points.forEach(p => s.holes.push(circlePath(width * 0.46, p.x, p.y)));
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d > width * 3.4) s.holes.push(circlePath(width * 0.30, mx, my));
  }
  const b = extrude(s, Z.bridgeT, MAT.bridge, true, 14);
  b.position.z = Z.bridge;
  g.add(b);

  // gilded chamfer ring around each pivot bore
  points.forEach(p => {
    const e = new THREE.Mesh(new THREE.TorusGeometry(width * 0.46, Z.bridgeT * 0.13, 5, 24), MAT.gold);
    e.position.set(p.x, p.y, Z.bridge + Z.bridgeT / 2);
    g.add(e);
    // countersunk blued screw beside the bearing
    const a = Math.atan2(p.y, p.x) + Math.PI / 2;
    const sc = screw(0.040, MAT.blued);
    sc.position.set(p.x + Math.cos(a) * width * 0.78, p.y + Math.sin(a) * width * 0.78, Z.bridge + Z.bridgeT * 0.5);
    sc.rotation.z = p.x * 2.7 + p.y * 1.3;

    const j = jewel(0.040, MAT.gold);
    j.position.set(p.x, p.y, Z.bridge - Z.bridgeT * 0.44);
    g.add(j);
  });

  movement.add(g);
  const lab = new THREE.Vector3(points[0].x, points[0].y, Z.bridge + Z.bridgeT);
  if (labelDir) { lab.x += labelDir.x; lab.y += labelDir.y; }
  part(id, {
    group: g, zh, en,
    home: new THREE.Vector3(0, 0, Z.bridge), dir: new THREE.Vector3(0.1, 0.15, 1), explode,
    labelAt: lab,
    desc, spec
  });
  return g;
}

/* ---------- chapter ring and lume markers ---------- */
{
  const g = new THREE.Group();
  // A plain annulus (outer circle + one inner hole) — the canonical, robust
  // contour for ExtrudeGeometry. The movement shows through the open centre,
  // which is what makes the dial "skeleton".
  const rOut = 1.78, rIn = 1.60;
  const ring = new THREE.Shape();
  ring.absarc(0, 0, rOut, 0, TAU, false);
  ring.holes.push(circlePath(rIn));
  const body = extrude(ring, Z.chapterT, MAT.dark, true, 40);
  body.position.z = Z.chapter;
  g.add(body);

  // four radial gold seams scored into the ring, echoing skeleton-dial apertures
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4 + Math.PI / 4;
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.016, (rOut - rIn) * 0.92, Z.chapterT * 1.15), MAT.gold);
    seam.position.set(Math.cos(a) * (rIn + rOut) / 2, Math.sin(a) * (rIn + rOut) / 2, Z.chapter);
    seam.rotation.z = a;
    g.add(seam);
  }

  const rimTop = new THREE.Mesh(new THREE.TorusGeometry(1.782, 0.012, 6, 140), MAT.gold);
  rimTop.position.z = Z.chapter + Z.chapterT / 2;
  const rimIn = new THREE.Mesh(new THREE.TorusGeometry(1.598, 0.010, 6, 140), MAT.gold);
  rimIn.position.z = Z.chapter + Z.chapterT / 2;
  g.add(rimTop, rimIn);

  // applied baton indices with lume cores
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12 + Math.PI / 2;
    const rMid = 1.685;
    const len = i % 3 === 0 ? 0.26 : 0.17;
    const idx = new THREE.Mesh(new THREE.BoxGeometry(0.052, len, 0.030), MAT.gold);
    idx.position.set(Math.cos(a) * rMid, Math.sin(a) * rMid, Z.chapter + Z.chapterT / 2);
    idx.rotation.z = a - Math.PI / 2;
    idx.castShadow = true;
    g.add(idx);
    const core = new THREE.Mesh(new THREE.BoxGeometry(0.030, len * 0.82, 0.014), MAT.lume);
    core.position.set(Math.cos(a) * rMid, Math.sin(a) * rMid, Z.chapter + Z.chapterT / 2 + 0.020);
    core.rotation.z = a - Math.PI / 2;
    g.add(core);
  }
  // minute track
  for (let i = 0; i < 60; i++) {
    if (i % 5 === 0) continue;
    const a = i * TAU / 60 + Math.PI / 2;
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.052, 0.010), MAT.gold);
    tick.position.set(Math.cos(a) * 1.735, Math.sin(a) * 1.735, Z.chapter + Z.chapterT / 2);
    tick.rotation.z = a - Math.PI / 2;
    g.add(tick);
  }
  movement.add(g);

  part('chapterRing', {
    group: g, zh: '表盘环与夜光刻度', en: 'Chapter Ring & Lume Indices',
    home: new THREE.Vector3(0, 0, Z.chapter), dir: new THREE.Vector3(0, 0.3, 1), explode: 2.10,
    labelAt: new THREE.Vector3(-1.62, 1.24, Z.chapter),
    desc: {
      zh: '镂空表没有整块表盘，只保留一圈刻度的"表盘环"，并开四扇扇形窗让机芯露出。时标为立体贴附式，中心填充 Super-LumiNova 夜光材料，暗处可持续发光数小时。',
      en: 'With no solid dial, only a chapter ring survives, opened by four sector windows so the movement shows through. Applied indices are filled with Super-LumiNova and glow for hours in the dark.'
    },
    spec: [['时标', '12 枚贴附式'], ['夜光', 'Super-LumiNova C3'], ['分钟刻度', '60 分'], ['开窗', '4 扇扇形']]

const hands = {};
{
  const g = new THREE.Group();

  function dauphine(length, width, tail, mat, lumeMat) {
    const s = new THREE.Shape();
    s.moveTo(0, -tail);
    s.lineTo(width * 0.5, 0);
    s.lineTo(width * 0.30, length * 0.86);
    s.lineTo(0, length);
    s.lineTo(-width * 0.30, length * 0.86);
    s.lineTo(-width * 0.5, 0);
    s.closePath();
    const m = extrude(s, 0.020, mat);
    const lume = new THREE.Shape();
    lume.moveTo(0, length * 0.12);
    lume.lineTo(width * 0.20, length * 0.20);
    lume.lineTo(width * 0.13, length * 0.76);
    lume.lineTo(0, length * 0.84);
    lume.lineTo(-width * 0.13, length * 0.76);
    lume.lineTo(-width * 0.20, length * 0.20);
    lume.closePath();
    const lm = extrude(lume, 0.010, lumeMat, false);
    lm.position.z = 0.018;
    const grp = new THREE.Group();
    grp.add(m, lm);
    return grp;
  }

  const hour = dauphine(0.92, 0.19, 0.30, MAT.gold, MAT.lumeHand);
  hour.position.z = Z.handH;

  const capHand = cylMesh(0.048, 0.048, 0.030, 16, MAT.gold);

    const el = labelEls[p.id];
    if (!state.labelsOn) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; return; }
    // labelAt is stored in absolute movement space; add the same explode offset
    // applyExplode uses, then project. This keeps anchors fixed to the layout
    // instead of spinning with parts that rotate (balance, escape, pallet).
    const d = p.explode * state.explode * 1.05;
    _v.copy(p.labelAt).addScaledVector(p.dir, d).applyMatrix4(movement.matrixWorld);
    const dist = _v.distanceTo(camera.position);
    _v.project(camera);
    const behind = _v.z > 1;
    const x = (_v.x * 0.5 + 0.5) * w;
    const y = (-_v.y * 0.5 + 0.5) * h;
    const visible = !behind && x > -160 && x < w + 160 && y > -60 && y < h + 60;
    const fade = visible ? THREE.MathUtils.clamp(1 - (dist - 14) / 9, 0.18, 1) : 0;
    el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
    el.style.opacity = String(state.hovered === p.id || state.selected === p.id ? 1 : fade * 0.92);
    el.style.pointerEvents = visible ? 'auto' : 'none';
    el.classList.toggle('on', state.hovered === p.id || state.selected === p.id);
    el.style.zIndex = String(Math.round(1000 - dist * 10));
  });
}

/* ============================ highlight ============================ */
const emissiveBackup = new Map();
function tintMeshes(p, color, intensity) {
  p.meshes.forEach(m => {
    const mat = m.material;
    if (!mat || !mat.emissive) return;
    if (!emissiveBackup.has(mat)) {
      emissiveBackup.set(mat, { c: mat.emissive.clone(), i: mat.emissiveIntensity });
    }
    mat.emissive.set(color);
    mat.emissiveIntensity = intensity;
  });
}
function clearTint() {
  emissiveBackup.forEach((v, mat) => { mat.emissive.copy(v.c); mat.emissiveIntensity = v.i; });
}

let highlightId = null;
function setHighlight(id) {
  if (id === highlightId) return;
  highlightId = id;
  clearTint();
  if (id && PARTS[id]) tintMeshes(PARTS[id], 0x6a4a12, 0.62);
}

function setSelected(id) {
  state.selected = id;
  setHighlight(id);
  document.querySelectorAll('.pr').forEach(b => b.classList.toggle('on', b.dataset.part === id));
}

function selectPart(id) {
  const p = PARTS[id];
  if (!p) return;
  if (state.selected === id) { setSelected(null); renderDefault(); return; }
  setSelected(id);
  renderPart(p);
}

/* ============================ raycasting ============================ */
const ray = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tip = document.getElementById('tip');
let pointerInside = false, downAt = null, dragging = false;

renderer.domElement.addEventListener('pointermove', e => {
  pointerInside = true;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) dragging = true;
  tip.style.left = e.clientX + 'px';
  tip.style.top = e.clientY + 'px';
});
renderer.domElement.addEventListener('pointerleave', () => {
  pointerInside = false;
  state.hovered = null;
  setHighlight(state.selected);
  tip.classList.remove('show');
});
renderer.domElement.addEventListener('pointerdown', e => {
  downAt = { x: e.clientX, y: e.clientY };
  dragging = false;
});
renderer.domElement.addEventListener('pointerup', () => {
  if (downAt && !dragging && state.hovered) selectPart(state.hovered);
  else if (downAt && !dragging && !state.hovered) { setSelected(null); renderDefault(); }
  downAt = null;
});

let pickFrame = 0;
function pickTest() {
  if (!pointerInside || dragging) { tip.classList.remove('show'); return; }
  if (++pickFrame % 2) return;   // raycast every other frame
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(pickables, false);
  const id = hits.length ? hits[0].object.userData.partId : null;
  if (id !== state.hovered) {
    state.hovered = id;
    renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
    setHighlight(id || state.selected);
    if (id) {
      const p = PARTS[id];
      tip.innerHTML = `${p.zh}<i>${p.en}</i>`;
      tip.classList.add('show');
    } else {
      tip.classList.remove('show');
    }
  }
  if (!id) tip.classList.remove('show');
}

/* ============================ controls ============================ */
const btnExplode = document.getElementById('btnExplode');
const btnSpin = document.getElementById('btnSpin');
const btnLabels = document.getElementById('btnLabels');
const btnReset = document.getElementById('btnReset');
const expRange = document.getElementById('expRange');

function syncRangeUI() {
  expRange.style.setProperty('--fill', (state.explodeTarget * 100).toFixed(0) + '%');
  expRange.value = String(Math.round(state.explodeTarget * 100));
}
function setExplode(v) {
  state.explodeTarget = THREE.MathUtils.clamp(v, 0, 1);
  btnExplode.setAttribute('aria-pressed', state.explodeTarget > 0.02 ? 'true' : 'false');
  syncRangeUI();
}
btnExplode.addEventListener('click', () => setExplode(state.explodeTarget > 0.02 ? 0 : 1));
btnSpin.addEventListener('click', () => {
  state.spin = !state.spin;
  controls.autoRotate = state.spin;
  btnSpin.setAttribute('aria-pressed', state.spin ? 'true' : 'false');
});
btnLabels.addEventListener('click', () => {
  state.labelsOn = !state.labelsOn;
  btnLabels.setAttribute('aria-pressed', state.labelsOn ? 'true' : 'false');
});
expRange.addEventListener('input', () => setExplode(Number(expRange.value) / 100));
btnReset.addEventListener('click', () => {
  camera.position.copy(HOME);
  controls.target.set(0, 0, -0.05);
  controls.update();
  setExplode(0);
  setSelected(null);
  renderDefault();
});

/* ============================ animation ============================ */
// beatPhase counts full balance oscillations, and is the single time base the
// whole movement is driven from.
let beatPhase = 0;

const clock = new THREE.Clock();
let fpsAcc = 0, fpsCount = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');

// The escapement runs at TRUE 4 Hz — that beat is the whole point of the piece,
// so it is never time-scaled. Each full balance oscillation releases exactly one
// escape-wheel tooth, which is the real Swiss-lever relationship (15 teeth at
// 4 Hz => one turn every 3.75 s, and 16:1 against the fourth wheel).
const TOOTH = TAU / ESCAPE_TEETH;
let escapeAngle = 0;
let lastTooth = -1;

function stepEscapement(dt) {
  beatPhase += dt * BEAT_HZ;                 // counts full oscillations

  const toothIndex = Math.floor(beatPhase);
  if (toothIndex !== lastTooth) {
    lastTooth = toothIndex;
    escapeAngle += TOOTH;
  }
  // unlock happens early in each half oscillation, then the tooth locks again
  const t = beatPhase % 1;
  const release = t < 0.5
    ? THREE.MathUtils.smoothstep(t, 0.00, 0.10)
    : THREE.MathUtils.smoothstep(t, 0.50, 0.60);
  escapeSpin.rotation.z = -(escapeAngle + release * TOOTH);

  // balance: one full sinusoid per oscillation, 310 degrees peak to peak
  balanceSwing.rotation.z = Math.sin(beatPhase * TAU) * (155 * DEG);

  // pallet fork: snaps between its two banks, twice per oscillation,
  // dwelling against each banking pin for the rest of the half period
  const half = (beatPhase * 2) % 1;
  const snap = THREE.MathUtils.smoothstep(half, 0.02, 0.13);
  const bank = Math.floor(beatPhase * 2) % 2 ? -1 : 1;
  palletSwing.rotation.z = PALLET_BASE + Math.PI + bank * snap * 2 * (10.5 * DEG) - bank * (10.5 * DEG);
}

function applyExplode() {
  const e = state.explode;
  Object.values(PARTS).forEach(p => {
    if (!p.group) return;
    const d = p.explode * e * 1.05;
    p.group.position.set(
      p.home.x + p.dir.x * d,
      p.home.y + p.dir.y * d,
      p.home.z + p.dir.z * d
    );
  });
  // the case shell separates along Z only, so the movement stays readable
  const cs = PARTS.case;
  if (cs && cs.group) {
    cs.group.position.set(0, 0, cs.explode * e * 1.05);
    cs.group.scale.setScalar(1 + e * 0.028);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;

  // ease the exploded view
  state.explode += (state.explodeTarget - state.explode) * Math.min(1, dt * 6.2);
  applyExplode();

  stepEscapement(dt);

  // Going train, driven off the same beat counter so every stage keeps its true
  // ratio to the escapement: fourth 16:1 (one turn a minute, so the small
  // seconds hand is real time), third 8:1, center 7.5:1 (one turn an hour),
  // barrel 12:1. Alternating signs reproduce meshing direction.
  const escAngle = beatPhase * TOOTH;
  trainAngles.fourth = -escAngle / 16;
  trainAngles.third  =  escAngle / (16 * 8);
  trainAngles.center = -escAngle / (16 * 8 * 7.5);
  trainAngles.barrel =  escAngle / (16 * 8 * 7.5 * 12);
  spinners.forEach(s => {
    if (s.escape) return;                     // handled by stepEscapement
    s.obj.rotation.z = trainAngles[s.key] || 0;
  });
  barrelSpin.rotation.z = trainAngles.barrel;

  // hands read the wall clock, like a real watch on the wrist
  const now = new Date();
  const ms = now.getMilliseconds() / 1000;
  const sec = now.getSeconds() + ms;
  const min = now.getMinutes() + sec / 60;
  const hr = (now.getHours() % 12) + min / 60;
  hands.second.rotation.z = -sec / 60 * TAU;
  hands.minute.rotation.z = -min / 60 * TAU;
  hands.hour.rotation.z = -hr / 12 * TAU;

  // gentle idle breathing of the movement when not interacting
  if (!state.spin && !dragging) {
    movement.rotation.y = Math.sin(state.time * 0.16) * 0.055;
    movement.rotation.x = Math.cos(state.time * 0.13) * 0.028;
  } else {
    movement.rotation.y *= 0.94;
    movement.rotation.x *= 0.94;
  }

  // lume pulses very slightly, like real photoluminescence settling
  const glow = 1.9 + Math.sin(state.time * 0.7) * 0.22;
  MAT.lume.emissiveIntensity = glow;
  MAT.lumeHand.emissiveIntensity = glow + 0.3;

  controls.update();
  pickTest();
  updateLabels();
  renderer.render(scene, camera);

  fpsAcc += dt; fpsCount++;
  fpsTimer += dt;
  if (fpsTimer > 0.5) {
    fpsEl.textContent = Math.round(fpsCount / fpsAcc) + ' fps';
    fpsAcc = 0; fpsCount = 0; fpsTimer = 0;
  }
}

/* ============================ resize ============================ */
let resizePending = false;
window.addEventListener('resize', () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => {
    resizePending = false;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
});

/* ============================ boot ============================ */
renderer.domElement.style.cursor = 'grab';
renderDefault();
syncRangeUI();

// frame everything on the first render, then reveal
renderer.render(scene, camera);
requestAnimationFrame(() => {
  animate();
  setTimeout(() => document.getElementById('boot').classList.add('gone'), 260);
});

// keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') setExplode(state.explodeTarget > 0.02 ? 0 : 1);
  else if (e.key === 'r' || e.key === 'R') btnReset.click();
  else if (e.key === 'l' || e.key === 'L') btnLabels.click();
  else if (e.key === ' ' ) { e.preventDefault(); btnSpin.click(); }
  else if (e.key === 'Escape') { setSelected(null); renderDefault(); }
});
</script>
</body>
