<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星穹遗境</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#060916;color:#edf5ff;font:14px system-ui,"Microsoft YaHei",sans-serif}canvas{display:block}#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 0 45%,rgba(2,5,16,.52) 100%)}#top{position:fixed;top:18px;left:18px;max-width:330px;padding:14px 16px;background:rgba(8,13,31,.72);backdrop-filter:blur(10px);border:1px rgba(135,200,255,.3) solid;border-radius:14px;pointer-events:none}h1{font:600 20px Georgia,"Microsoft YaHei",serif;letter-spacing:4px;margin:0 0 6px;color:#d8f2ff;text-shadow:0 0 18px #49b5ff}p{margin:4px 0;color:#b8c9dc;line-height:1.45}#stats{font-size:12px;color:#9edfff;margin-top:10px}#aim{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}#aim:before,#aim:after{content:"";position:fixed;background:rgba(236,250,255,.95);box-shadow:0 0 5px #50c7ff}#aim:before{width:2px;height:20px;left:9px}#aim:after{height:2px;width:20px;top:9px}#bottom{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:none}.slot{width:66px;height:56px;padding:7px 4px 5px;border:1px rgba(196,233,255,.3) solid;border-radius:10px;background:rgba(7,12,28,.7);text-align:center;color:#dcecff;font-size:11px}.slot b{display:block;font-size:15px;margin-bottom:4px}.slot.on{border-color:#e8d188;box-shadow:0 0 17px rgba(248,210,111,.75);background:rgba(81,60,20,.7)}#tip{position:fixed;right:18px;bottom:18px;text-align:right;padding:12px 14px;background:rgba(8,13,31,.65);border:1px rgba(135,200,255,.24) solid;border-radius:12px;line-height:1.7;color:#c5d5e8;pointer-events:none}#message{position:fixed;left:50%;top:68%;transform:translateX(-50%);padding:9px 15px;border-radius:10px;background:rgba(4,8,20,.78);color:#d9f5ff;opacity:0;transition:opacity .3s;pointer-events:none}.show{opacity:1!important}@media(max-width:700px){#top{max-width:270px;top:10px;left:10px}#tip{display:none}.slot{width:53px;height:48px;font-size:9px}#bottom{bottom:10px}}
</style>
</head>
<body>
<div id="veil"></div>
<div id="top"><h1>星穹遗境</h1><p>穿过浮岛与月辉神殿，寻找遗落在群山之间的古老星门。</p><p id="stats">正在唤醒地脉...</p></div>
<div id="aim"></div>
<div id="bottom"><div class="slot on" data-k="0"><b>1</b>草方块</div><div class="slot" data-k="1"><b>2</b>岩石</div><div class="slot" data-k="2"><b>3</b>古木</div><div class="slot" data-k="3"><b>4</b>辉晶</div><div class="slot" data-k="4"><b>5</b>云白石</div></div>
<div id="tip">点击进入世界<br>W A S D 移动，空格跳跃<br>左键挖掘，右键放置，数字键选方块</div>
<div id="message"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
(()=>{
const T=THREE, scene=new T.Scene(), camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.06,220), renderer=new T.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.background=new T.Color(0x08132b);scene.fog=new T.FogExp2(0x08132b,.018);
const hemi=new T.HemisphereLight(0xaedcff,0x14223d,1.9);scene.add(hemi);const sun=new T.DirectionalLight(0xffe1a6,2.5);sun.position.set(-32,45,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-38;sun.shadow.camera.right=38;sun.shadow.camera.top=38;sun.shadow.camera.bottom=-38;scene.add(sun);
const moon=new T.Mesh(new T.SphereGeometry(4.2,30,20),new T.MeshBasicMaterial({color:0xe8f4ff}));moon.position.set(-39,34,-52);scene.add(moon);const glow=new T.PointLight(0x83b7ff,1.5,85);glow.position.copy(moon.position);scene.add(glow);
const yaw=new T.Object3D(), pitch=new T.Object3D();yaw.add(pitch);pitch.add(camera);scene.add(yaw);yaw.position.set(0,11,9);camera.position.set(0,0,0);
const cube=new T.BoxGeometry(1,1,1), ray=new T.Raycaster(), center=new T.Vector2(0,0), world=new T.Group();scene.add(world);
function tex(a,b,seed){const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.fillStyle=a;x.fillRect(0,0,48,48);let r=seed>>>0;for(let i=0;i<180;i++){r=(r*1664525+1013904223)>>>0;x.fillStyle=b;x.globalAlpha=.12+((r>>>24)/255)*.35;const q=(r>>>8)%46;x.fillRect(q,(r>>>16)%46,1+(r%3),1+(r%3));}x.globalAlpha=1;const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.magFilter=T.NearestFilter;t.minFilter=T.NearestFilter;return t}
const material=[new T.MeshLambertMaterial({map:tex('#5d9e4d','#c2e486',22)}),new T.MeshLambertMaterial({map:tex('#657080','#b0bdca',91)}),new T.MeshLambertMaterial({map:tex('#745239','#c79762',171)}),new T.MeshStandardMaterial({map:tex('#4c86a0','#c5f8ff',277),emissive:0x16485c,emissiveIntensity:.7,roughness:.28,metalness:.35}),new T.MeshStandardMaterial({map:tex('#d2d7df','#ffffff',413),roughness:.4,metalness:.22})];
const changes=new Map(), active=new Map(), meshes=[];let currentCell={x:999,z:999}, selected=0, elapsed=0, frames=0, fpsClock=0;
const key=(x,y,z)=>x+'|'+y+'|'+z;function hash(x,z){let n=(x*374761393+z*668265263)>>>0;n=(n^(n>>>13))*1274126177;return ((n^(n>>>16))>>>0)/4294967295}
function fade(t){return t*t*t*(t*(t*6-15)+10)}function grad(h,x,z){const u=(h&1)?-x:x,v=(h&2)?-z:z;return u+v}function pnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;function h(a,b){return ((Math.imul(a,92837111)^Math.imul(b,689287499))>>>0)&3}const u=fade(xf),v=fade(zf),a=grad(h(xi,zi),xf,zf),b=grad(h(xi+1,zi),xf-1,zf),c=grad(h(xi,zi+1),xf,zf-1),d=grad(h(xi+1,zi+1),xf-1,zf-1);return T.MathUtils.lerp(T.MathUtils.lerp(a,b,u),T.MathUtils.lerp(c,d,u),v)}
function height(x,z){let n=0,a=.62,f=.055;for(let i=0;i<5;i++){n+=pnoise(x*f,z*f)*a;a*=.5;f*=2.08}const ridge=Math.abs(pnoise(x*.021+88,z*.021-46));return Math.max(2,Math.floor(5+n*9+ridge*2.8))}
function put(a,x,y,z,type){const k=key(x,y,z), edit=changes.get(k);if(edit===0)return;if(edit!==undefined)type=edit;if(type===undefined)return;a[type].push({x,y,z});active.set(k,type)}
function column(a,x,z){const h=height(x,z);for(let y=-2;y<=h;y++){let t=y===h?0:(y>h-3?2:1);put(a,x,y,z,t)}if(h>5&&hash(x,z)>.91){for(let y=h+1;y<h+4;y++)put(a,x,y,z,2);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=0;dy<2;dy++)if(Math.abs(dx)+Math.abs(dz)+dy<4)put(a,x+dx,h+3+dy,z+dz,0)}if(h>6&&hash(x+77,z-13)>.974){for(let y=h+1;y<h+5;y++)put(a,x,y,z,3);}}
function myth(a,cx,cz,limit){function inRange(x,z){return Math.abs(x-cx)<=limit&&Math.abs(z-cz)<=limit}function b(x,y,z,t){if(inRange(x,z))put(a,x,y,z,t)}function pillar(x,z,h){const base=height(x,z);for(let y=base+1;y<=base+h;y++)b(x,y,z,4);b(x,base+h+1,z,3)}const gx=Math.round(cx/44)*44,gz=Math.round(cz/44)*44;if(Math.abs(gx-cx)<limit+8&&Math.abs(gz-cz)<limit+8){const base=height(gx,gz);for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){const edge=Math.max(Math.abs(x),Math.abs(z));if(edge===7||((x*x+z*z)<18&&(x*x+z*z)>9))for(let y=base+1;y<=base+2;y++)b(gx+x,y,gz+z,4)}for(const q of [[-6,-6],[6,-6],[-6,6],[6,6],[-3,-3],[3,-3],[-3,3],[3,3]])pillar(gx+q[0],gz+q[1],7+(Math.abs(q[0])===6?3:0));for(let y=base+3;y<11+base;y++){b(gx-3,y,gz-5,4);b(gx+3,y,gz-5,4);b(gx-3,y,gz+5,4);b(gx+3,y,gz+5,4)}for(let x=-4;x<=4;x++)b(gx+x,base+10,gz,3);for(let z=-4;z<=4;z++)b(gx,base+10,gz+z,3);for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)for(let y=base+11;y<base+15;y++)if(x*x+z*z<2)b(gx+x,y,gz+z,3);for(let x=-5;x<=5;x++){b(gx+x,base+2,gz-8,4);if(x%2===0)b(gx+x,base+3,gz-8,3)}}const ix=gx+17,iz=gz-13,ib=height(ix,iz)+11;for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++)if(x*x+z*z<23){const bottom=ib-Math.floor((25-x*x-z*z)/8);for(let y=bottom;y<=ib;y++)b(ix+x,y,iz+z,y===ib?0:1)}for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)if(x*x+z*z<10)b(ix+x,ib+1,iz+z,3);for(let y=ib+2;y<ib+9;y++){b(ix-3,y,iz,4);b(ix+3,y,iz,4);b(ix,y,iz-3,4);b(ix,y,iz+3,4)} }
function rebuild(cx,cz){active.clear();for(const m of meshes)world.remove(m);meshes.length=0;const a=[[],[],[],[],[]],r=15;for(let x=cx-r;x<=cx+r;x++)for(let z=cz-r;z<=cz+r;z++)column(a,x,z);myth(a,cx,cz,r);for(let t=0;t<a.length;t++){const list=a[t];if(!list.length)continue;const m=new T.InstancedMesh(cube,material[t],list.length);m.castShadow=t!==0;m.receiveShadow=true;const o=new T.Object3D();list.forEach((v,i)=>{o.position.set(v.x,v.y,v.z);o.updateMatrix();m.setMatrixAt(i,o.matrix);m.userData[i]=v});m.instanceMatrix.needsUpdate=true;world.add(m);meshes.push(m)}currentCell={x:cx,z:cz};toast('地脉向远方延伸');}
const keys={};let vy=0,onGround=false;addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-5]$/.test(e.code)){selected=+e.code.slice(-1)-1;document.querySelectorAll('.slot').forEach((x,i)=>x.classList.toggle('on',i===selected));}});addEventListener('keyup',e=>keys[e.code]=false);
let moving=false;addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw.rotation.y-=e.movementX*.0025;pitch.rotation.x=Math.max(-1.45,Math.min(1.45,pitch.rotation.x-e.movementY*.0025))});renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function act(button){if(document.pointerLockElement!==renderer.domElement)return;ray.setFromCamera(center,camera);const hit=ray.intersectObjects(meshes,false)[0];if(!hit||hit.distance>8)return;const v=hit.object.userData[hit.instanceId],m=new T.Matrix4();hit.object.getMatrixAt(hit.instanceId,m);const n=hit.face.normal.clone().transformDirection(new T.Matrix3().getNormalMatrix(m)).round();if(button===0){changes.set(key(v.x,v.y,v.z),0);toast('方块已采集')}else if(button===2){const x=v.x+n.x,y=v.y+n.y,z=v.z+n.z,dx=x-yaw.position.x,dz=z-yaw.position.z;if(dx*dx+dz*dz>1.8)changes.set(key(x,y,z),selected);toast('方块已放置')}rebuild(currentCell.x,currentCell.z)}renderer.domElement.addEventListener('mousedown',e=>act(e.button));
function toast(s){const m=document.getElementById('message');m.textContent=s;m.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove('show'),1100)}
function terrainY(x,z){return height(Math.round(x),Math.round(z))+1.7}function update(dt){const dir=new T.Vector3(),side=new T.Vector3();yaw.getWorldDirection(dir);dir.y=0;dir.normalize();side.crossVectors(dir,new T.Vector3(0,1,0)).normalize();const speed=(keys.ShiftLeft?8:4.3)*dt;if(keys.KeyW)yaw.position.addScaledVector(dir,speed);if(keys.KeyS)yaw.position.addScaledVector(dir,-speed);if(keys.KeyA)yaw.position.addScaledVector(side,-speed);if(keys.KeyD)yaw.position.addScaledVector(side,speed);const floor=terrainY(yaw.position.x,yaw.position.z);if(keys.Space&&onGround){vy=7;onGround=false}vy-=18*dt;yaw.position.y+=vy*dt;if(yaw.position.y<=floor){yaw.position.y=floor;vy=0;onGround=true}const cx=Math.floor(yaw.position.x),cz=Math.floor(yaw.position.z);if(Math.abs(cx-currentCell.x)>4||Math.abs(cz-currentCell.z)>4)rebuild(cx,cz);}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-(loop.last||now))/1000);loop.last=now;elapsed+=dt;frames++;fpsClock+=dt;if(fpsClock>.7){document.getElementById('stats').textContent='坐标 '+Math.floor(yaw.position.x)+' , '+Math.floor(yaw.position.y)+' , '+Math.floor(yaw.position.z)+'　'+Math.round(frames/fpsClock)+' FPS　已发现 '+changes.size+' 处遗迹';frames=0;fpsClock=0}update(dt);moon.position.x=-39+Math.sin(elapsed*.04)*7;renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});rebuild(0,9);toast('点击进入星穹遗境');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
