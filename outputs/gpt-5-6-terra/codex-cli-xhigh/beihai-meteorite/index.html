<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北海陨星 / A Signal Under Ice</title>
  <link rel="stylesheet" href="./dist/style.css" />
</head>
<body>
  <main id="film" aria-label="北海陨星 Three.js 程序化短片">
    <canvas id="stage"></canvas>
    <div id="grain"></div>
    <header id="hud">
      <div class="mark"><span class="dot"></span> BOREAL STATION / 07</div>
      <div id="clock">00:00</div>
      <div id="scene">PRELUDE</div>
    </header>
    <section id="titles" aria-live="polite">
      <div id="title-kicker">一部程序化体素短片</div>
      <h1 id="title-main">北海陨星</h1>
      <p id="title-sub">A SIGNAL UNDER ICE</p>
    </section>
    <div id="vignette"></div>
    <section id="subtitle" aria-live="polite"></section>
    <section id="start" class="visible">
      <p>请戴上耳机 · 点击开启声音</p>
      <button id="start-button">开始放映</button>
      <small>SPACE 暂停　← → 跳转镜头　M 静音　R 重播</small>
    </section>
    <section id="controls" aria-label="影片控制">
      <button id="play" title="播放或暂停">Ⅱ</button>
      <input id="scrub" type="range" min="0" max="200" step="0.01" value="0" aria-label="影片进度" />
      <button id="mute" title="静音">♬</button>
    </section>
    <section id="endcard">
      <span>献给仍在等待信号的人</span>
      <button id="replay">再次接收</button>
    </section>
  </main>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
