<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A pelican cycling beside the sea</title>
  <desc id="desc">A realistic, lively brown pelican rides a turquoise bicycle along a sunny coastal path, with waves, cliffs, clouds, and seabirds behind it.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77c9ed"/>
      <stop offset=".56" stop-color="#c5ecf2"/>
      <stop offset="1" stop-color="#f9dfad"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e9ec1"/>
      <stop offset=".55" stop-color="#39bfd0"/>
      <stop offset="1" stop-color="#76d7d2"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2=".15" y2="1">
      <stop stop-color="#f8d999"/>
      <stop offset="1" stop-color="#dca55b"/>
    </linearGradient>
    <linearGradient id="feathers" x1=".25" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff6df"/>
      <stop offset=".36" stop-color="#ded6bd"/>
      <stop offset=".72" stop-color="#8c7d68"/>
      <stop offset="1" stop-color="#51473e"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#faf2d9"/>
      <stop offset=".55" stop-color="#d4c9aa"/>
      <stop offset="1" stop-color="#998970"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5d477"/>
      <stop offset=".62" stop-color="#e8a94f"/>
      <stop offset="1" stop-color="#b66d36"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c7834a"/>
      <stop offset="1" stop-color="#9e5f35"/>
    </linearGradient>
    <radialGradient id="wheel" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#46504e"/>
      <stop offset=".78" stop-color="#1b292b"/>
      <stop offset=".8" stop-color="#bcc9c3"/>
      <stop offset=".87" stop-color="#3c4745"/>
      <stop offset="1" stop-color="#172224"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="smallSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="horizonClip"><path d="M0 310H1200V625H0Z"/></clipPath>
  </defs>

  <!-- warm late-afternoon atmosphere -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="977" cy="127" r="61" fill="#fff5c7" opacity=".92"/>
  <circle cx="977" cy="127" r="99" fill="#fff3b3" opacity=".18" filter="url(#soft)"/>
  <g fill="#fff" opacity=".74" filter="url(#smallSoft)">
    <path d="M78 155c29-43 94-45 119 0 39-22 95 7 95 48H47c-3-20 9-39 31-48z"/>
    <path d="M618 104c19-30 66-33 84 0 30-16 69 6 70 37H592c-3-16 7-31 26-37z"/>
  </g>
  <g fill="none" stroke="#45686f" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M271 194q11-12 22 0q11-12 22 0"/>
    <path d="M406 246q8-9 16 0q8-9 16 0"/>
    <path d="M1082 253q9-10 18 0q9-10 18 0"/>
  </g>

  <!-- distant coastal headlands -->
  <path d="M0 357C80 317 114 335 174 358c59 24 113-18 175-15 81 4 122 51 207 32 69-15 142-52 221-21 65 25 87 2 145-14 100-28 201-3 278 42v243H0z" fill="#5d948d" opacity=".72"/>
  <path d="M0 394c80-33 132-9 207 16 73 24 116 11 172-14 71-32 122-6 194 15 91 26 154-39 240-34 112 6 153 77 243 51 64-19 99-10 144 9v190H0z" fill="#386e72" opacity=".66"/>

  <!-- ocean and reflected sunlight -->
  <g clip-path="url(#horizonClip)">
    <rect y="358" width="1200" height="300" fill="url(#sea)"/>
    <path d="M866 360h219l-68 257H929z" fill="#f8e7ad" opacity=".22" filter="url(#soft)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M20 430q63-16 128 0t128 0t130 0t127 0t130 0t128 0t128 0t130 0" stroke="#c7f4ec" stroke-width="8" opacity=".55"/>
      <path d="M-15 477q71-20 143 0t143 0t143 0t142 0t143 0t143 0t143 0t143 0" stroke="#ddf7e7" stroke-width="6" opacity=".6"/>
      <path d="M18 530q48-11 99 0t99 0t99 0t99 0t99 0t99 0t99 0t99 0t99 0t99 0t99 0" stroke="#137c9e" stroke-width="10" opacity=".43"/>
      <path d="M0 581q69-19 141 0t141 0t142 0t142 0t141 0t142 0t142 0t142 0" stroke="#e4fbeb" stroke-width="9" opacity=".76"/>
      <path d="M91 618q41-10 82 0m78-17q38-10 75 0m278 11q58-12 114 0m113-29q48-11 97 0m75 26q51-11 103 0" stroke="#f7ffed" stroke-width="7" opacity=".8"/>
    </g>
  </g>

  <!-- beach, grass, and path -->
  <path d="M0 611c145-27 245 3 382 9 177 8 271-13 412-7 158 7 241-18 406-2v289H0z" fill="url(#sand)"/>
  <path d="M0 671c155-32 290-8 430 18 123 23 274 5 385-9 148-19 253 5 385-4v224H0z" fill="url(#path)"/>
  <path d="M0 642c95-28 173-14 251 9 44 13 88 11 132-1-74 30-138 47-211 45-66-2-117-20-172-15z" fill="#84a65d"/>
  <g stroke="#587943" stroke-width="5" stroke-linecap="round">
    <path d="M67 650l-6-31m14 30l16-36m3 41l5-39m94 35l-9-31m15 26l16-26m18 24l7-30m50 29l-11-27m19 22l16-29"/>
  </g>
  <g fill="#f2cf78" opacity=".7"><ellipse cx="93" cy="738" rx="5" ry="2"/><ellipse cx="165" cy="800" rx="7" ry="2.5"/><ellipse cx="1034" cy="755" rx="8" ry="2.5"/><ellipse cx="1089" cy="833" rx="5" ry="2"/><ellipse cx="810" cy="837" rx="8" ry="2"/></g>

  <!-- motion shadow -->
  <ellipse cx="604" cy="778" rx="365" ry="49" fill="#4c3025" opacity=".31" filter="url(#smallSoft)"/>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <g fill="url(#wheel)" stroke="#132227" stroke-width="7">
      <circle cx="393" cy="704" r="121"/><circle cx="814" cy="704" r="121"/>
    </g>
    <g fill="none" stroke="#cad8d2" stroke-width="3" opacity=".7">
      <circle cx="393" cy="704" r="97"/><circle cx="814" cy="704" r="97"/>
      <path d="M393 607v194m-97-97h194m-166-69l138 138m0-138L324 773M814 607v194m-97-97h194m-166-69l138 138m0-138L745 773"/>
    </g>
    <g fill="#edf1e8" stroke="#2e4c4c" stroke-width="9" stroke-linejoin="round">
      <path d="M393 704 509 505l94 199z" fill="none"/>
      <path d="M509 505h144L814 704 603 704z" fill="none"/>
      <path d="M509 505 474 476m145 29 24-80 67-24" fill="none"/>
      <path d="M710 401 766 389m-57 12 34 32" fill="none"/>
    </g>
    <path d="M437 474q31-21 61 1l-12 15h-50z" fill="#3d3432"/>
    <circle cx="603" cy="704" r="29" fill="#d9b347" stroke="#284647" stroke-width="7"/>
    <circle cx="603" cy="704" r="7" fill="#253f40"/>
    <path d="M603 704l58 35m-58-35-62 48" stroke="#36494a" stroke-width="10" stroke-linecap="round"/>
    <path d="M647 746h33m-157 13h34" stroke="#202d2f" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- pelican: rear wing and body -->
  <g filter="url(#shadow)">
    <path d="M468 440c-41 22-64 93-34 165 21 50 61 83 147 93 43 5 77-10 92-29-74-31-94-85-98-172-3-64-52-86-107-57z" fill="#5f564b"/>
    <path d="M452 464c-15 57 22 146 122 178 39 13 76 12 104-3-86-29-112-92-124-175-26-38-74-39-102 0z" fill="url(#feathers)"/>
    <g fill="none" stroke="#7b6d5c" stroke-width="7" stroke-linecap="round" opacity=".75">
      <path d="M470 486c6 70 46 124 122 152"/><path d="M494 475c12 80 54 127 127 151"/><path d="M522 475c18 77 56 116 125 142"/>
    </g>
    <ellipse cx="580" cy="443" rx="101" ry="124" transform="rotate(-18 580 443)" fill="url(#feathers)"/>
    <path d="M515 371c50-40 131-18 162 38 22 40 15 121-31 174-42 48-103 43-140 7-44-43-48-161 9-219z" fill="url(#feathers)"/>
    <path d="M529 389c37-42 108-26 132 16 11 21 13 59 1 88-19-30-50-43-85-32-34 10-53 37-60 66-23-42-15-99 12-138z" fill="#efe8d1" opacity=".6"/>
    <g fill="none" stroke="#776c5e" stroke-width="8" stroke-linecap="round" opacity=".65">
      <path d="M528 536q55 22 111 3"/><path d="M522 568q51 28 108 12"/><path d="M538 602q39 21 78 15"/>
    </g>

    <!-- neck and head -->
    <path d="M590 397c-2-80 9-155 58-202 31-30 89-22 102 21 9 31-10 78-37 111-29 35-41 76-35 130z" fill="url(#head)"/>
    <path d="M617 249c17-69 69-100 116-74 19 11 24 40 16 65-17-11-34-17-52-14-31 5-51 38-80 74z" fill="#665b4c"/>
    <path d="M640 251c12-25 42-52 72-43" fill="none" stroke="#f4edd7" stroke-width="13" stroke-linecap="round" opacity=".75"/>
    <ellipse cx="689" cy="251" rx="38" ry="34" fill="#eee7ce"/>
    <circle cx="703" cy="245" r="14" fill="#20292a"/>
    <circle cx="708" cy="240" r="4.5" fill="#fff"/>
    <path d="M672 221q29-19 53 2" fill="none" stroke="#4c453d" stroke-width="10" stroke-linecap="round"/>

    <!-- huge characteristic pouch and beak -->
    <path d="M677 271c40-23 114-18 183 2 50 15 118 27 161 12-27 44-86 71-161 76-71 5-136-3-187-24-28-12-23-49 4-66z" fill="url(#beak)"/>
    <path d="M688 296c67 23 210 38 315 5-32 42-92 69-167 72-63 3-125-7-159-27-21-13-14-40 11-50z" fill="#e6a95b"/>
    <path d="M688 296c84 21 215 29 315 5" fill="none" stroke="#9e6438" stroke-width="7" opacity=".8"/>
    <path d="M999 284q36-12 58-33-5 42-45 57z" fill="#774a32"/>
    <path d="M742 318q74 19 147 7" fill="none" stroke="#f6d982" stroke-width="10" stroke-linecap="round" opacity=".55"/>

    <!-- arm to handlebars -->
    <path d="M608 459c46 9 78 23 116 8 25-10 43-44 66-70 14-16 35-5 29 15-19 58-58 103-112 105-52 3-82-17-116-23z" fill="#dad0b4" stroke="#827662" stroke-width="5"/>
    <path d="M790 402q15 3 25 17l-2 15-22-7z" fill="#6f6557"/>
    <!-- legs pedaling -->
    <path d="M571 630c19 13 43 21 67 18l59 74c8 11 30 2 23-12l-68-104c-8-12-24-19-37-15l-57 16z" fill="#847968"/>
    <path d="M563 634c24 3 47 14 62 32l-63 79c-10 12 7 27 18 15l80-89c12-14 7-37-10-45-28-15-53-19-83-12z" fill="#d4c8aa"/>
    <path d="M705 709q22-7 34 7l-11 19-29-9zM538 747q20-7 32 8l-13 17-28-10z" fill="#776c5f"/>
  </g>

  <!-- foreground dust, visually tying subject to path -->
  <g fill="#eec87d" opacity=".7" filter="url(#smallSoft)"><ellipse cx="269" cy="767" rx="49" ry="10"/><ellipse cx="904" cy="768" rx="36" ry="8"/></g>
</svg>
