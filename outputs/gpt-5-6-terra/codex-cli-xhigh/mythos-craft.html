<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MYTHOS // 星陨界域</title>
  <style>
    :root { --ink:#10151a; --gold:#f3c76a; --mist:#d9e4e7; --panel:rgba(9,14,18,.68); }
    * { box-sizing:border-box; user-select:none; }
    html,body { margin:0; overflow:hidden; width:100%; height:100%; background:#101820; color:#f4f0df; font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; }
    canvas { display:block; }
    #ui { position:fixed; inset:0; pointer-events:none; }
    .brand { position:absolute; left:28px; top:24px; text-shadow:0 2px 12px #000; letter-spacing:.18em; }
    .brand b { display:block; font-family:Georgia,"Times New Roman",serif; color:#fff4ce; font-size:22px; font-weight:normal; }
    .brand span { color:#c9a762; font-size:10px; letter-spacing:.3em; }
    #stats { position:absolute; top:25px; right:28px; text-align:right; font-size:11px; line-height:1.7; color:#d7e1df; text-shadow:0 1px 5px #000; letter-spacing:.08em; }
    #stats strong { color:var(--gold); font-weight:600; }
    #crosshair { position:absolute; left:50%; top:50%; width:23px; height:23px; transform:translate(-50%,-50%); opacity:.9; }
    #crosshair:before,#crosshair:after { content:""; position:absolute; background:#fff8df; box-shadow:0 0 3px #111; }
    #crosshair:before { height:1px; width:23px; top:11px; left:0; } #crosshair:after { height:23px; width:1px; left:11px; top:0; }
    #reticle-tip { position:absolute; top:calc(50% + 25px); left:50%; transform:translateX(-50%); color:#fff6d6; font-size:10px; text-shadow:0 1px 4px #000; letter-spacing:.08em; white-space:nowrap; }
    #minimap-shell { position:absolute; left:28px; bottom:28px; width:146px; height:146px; border:1px solid rgba(241,204,120,.65); border-radius:50%; padding:6px; background:rgba(7,13,16,.34); box-shadow:0 4px 24px #0006,inset 0 0 18px #0007; overflow:hidden; }
    #minimap { width:132px; height:132px; border-radius:50%; image-rendering:pixelated; }
    #minimap-shell:after { content:"N"; position:absolute; left:66px; top:3px; color:#f4d787; font:9px Georgia; }
    #lore { position:absolute; left:192px; bottom:34px; max-width:350px; text-shadow:0 2px 8px #000; }
    #lore h2 { font:normal 17px Georgia,"Microsoft YaHei"; margin:0 0 5px; color:#ffe3a0; letter-spacing:.08em; }
    #lore p { margin:0; color:#d8e4de; font-size:11px; line-height:1.55; letter-spacing:.03em; }
    #hotbar { position:absolute; bottom:31px; left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:6px; background:rgba(7,11,14,.61); border:1px solid rgba(234,218,173,.29); box-shadow:0 5px 18px #0008; }
    .slot { position:relative; width:54px; height:54px; border:1px solid rgba(221,225,212,.32); background:rgba(23,31,35,.65); display:grid; place-items:center; }
    .slot.active { border:2px solid #ffe3a0; box-shadow:inset 0 0 13px #f3c76a55,0 0 10px #f3c76a55; }
    .slot i { position:absolute; left:4px; top:2px; color:#f5d47f; font-size:10px; font-style:normal; }
    .swatch { width:25px; height:25px; border:1px solid #0008; image-rendering:pixelated; }
    .slot label { position:absolute; bottom:3px; font-size:8px; color:#dfe8e4; }
    #hint { position:absolute; right:27px; bottom:31px; text-align:right; color:#d3dfdc; font-size:10px; line-height:1.75; text-shadow:0 1px 4px #000; }
    #toast { position:absolute; left:50%; top:14%; transform:translateX(-50%); color:#fff2bf; font:14px Georgia,"Microsoft YaHei"; letter-spacing:.12em; text-shadow:0 2px 7px #000; opacity:0; transition:opacity .3s; }
    #start { pointer-events:auto; position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(ellipse at center,transparent 0%,rgba(4,10,14,.33) 44%,rgba(3,7,10,.82) 100%); transition:opacity .55s; }
    .card { width:min(480px,calc(100vw - 40px)); text-align:center; padding:38px 38px 31px; background:linear-gradient(135deg,rgba(16,28,32,.77),rgba(8,14,18,.72)); border:1px solid rgba(240,204,126,.56); box-shadow:0 16px 60px #000b,inset 0 0 60px #a4792815; }
    .sigil { color:#f2c870; font:30px Georgia; line-height:1; margin-bottom:11px; text-shadow:0 0 20px #e9b75a; }
    .card h1 { margin:0; color:#fff1c8; font:normal 35px Georgia,"Microsoft YaHei"; letter-spacing:.16em; text-indent:.16em; }
    .card h1 small { display:block; color:#bfcfc8; font:10px Inter,sans-serif; letter-spacing:.48em; margin-top:11px; }
    .rule { width:140px; height:1px; margin:22px auto 18px; background:linear-gradient(90deg,transparent,#e9c46b,transparent); }
    .card p { margin:4px 0; color:#d4ded9; font-size:12px; letter-spacing:.08em; line-height:1.6; }
    button { margin-top:22px; padding:12px 30px; cursor:pointer; background:linear-gradient(135deg,#f7d981,#b98332); color:#1c1a16; border:1px solid #ffe8a5; font-weight:700; letter-spacing:.16em; box-shadow:0 3px 17px #d9a84955; }
    button:hover { filter:brightness(1.15); transform:translateY(-1px); }
    #loading { position:absolute; bottom:18%; left:50%; transform:translateX(-50%); font-size:10px; color:#e6cc84; letter-spacing:.22em; }
    @media(max-width:720px) { #lore,#minimap-shell,#hint { display:none; } .brand{left:16px;top:15px} #stats{right:16px;top:15px} .slot{width:44px;height:44px} }
  </style>
</head>
<body>
  <div id="ui">
    <div class="brand"><b>MYTHOS</b><span>THE STARFALL REALM</span></div>
    <div id="stats"><strong id="zone">星陨圣坛</strong><br><span id="coords">X 0  Y 0  Z 0</span><br><span id="fps">正在唤醒界域</span></div>
    <div id="crosshair"></div><div id="reticle-tip">远望圣坛</div>
    <div id="minimap-shell"><canvas id="minimap" width="66" height="66"></canvas></div>
    <div id="lore"><h2>✦ 星陨圣坛</h2><p>古神坠落之处，漂浮的辉晶仍在低语。循着金色石阶，寻找云端之门。</p></div>
    <div id="hotbar"></div>
    <div id="hint">W A S D　移动　　SPACE　跃起<br>左键　开采　　右键　塑形　　1–5　选材</div>
    <div id="toast"></div>
    <div id="start"><div class="card"><div class="sigil">✧</div><h1>星 陨 界 域<small>MYTHOS · A VOXEL FABLE</small></h1><div class="rule"></div><p>群山由古老的柏林噪声编织而成</p><p>在神祇遗下的圣坛中，开采、塑造与探索</p><button id="enter">进入界域</button></div><div id="loading">正在铺展群山与星尘…</div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script>
  (() => {
    'use strict';
    const THREE = window.THREE;
    if (!THREE) { document.body.innerHTML = '<p style="padding:2rem;color:white">无法加载 Three.js。请检查网络连接后刷新。</p>'; return; }
    const SIZE = 16, RENDER_RADIUS = 2, SEA = 5, WORLD_SEED = 82371;
    const T = { AIR:0, GRASS:1, DIRT:2, STONE:3, COBBLE:4, MOSS:5, OBSIDIAN:6, GOLD:7, CRYSTAL:8, MARBLE:9, LEAVES:10, WOOD:11, CLOUD:12 };
    const NAMES = {1:'苔原草地',2:'赤陶泥土',3:'月纹石',4:'古老圆石',5:'灵苔石',6:'曜岩',7:'日铸金块',8:'辉晶',9:'天穹白石',10:'月桂叶',11:'神木'};
    const usable = [T.GRASS,T.DIRT,T.STONE,T.MOSS,T.CRYSTAL];
    const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8eafb8); scene.fog = new THREE.FogExp2(0x8eafb8,.018);
    const camera = new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,160);
    const player = new THREE.Object3D(), head = new THREE.Object3D(); player.add(head); head.add(camera); scene.add(player); camera.position.y=1.58;
    const hemi = new THREE.HemisphereLight(0xc7e7ed,0x425036,1.8); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffefbd,3.0); sun.position.set(-36,62,24); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-45; sun.shadow.camera.right=45; sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45; scene.add(sun);
    const warm = new THREE.PointLight(0xf7ba5d,16,28,2); warm.position.set(0,27,0); scene.add(warm);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(4.5,24,16),new THREE.MeshBasicMaterial({color:0xffe9b5,fog:false})); moon.position.set(48,47,-66); scene.add(moon);
    const clouds = new THREE.Group(); scene.add(clouds);

    // Deterministic Perlin noise – the terrain's foundational spell.
    const perm = new Uint8Array(512);
    (() => { let a=new Uint8Array(256); for(let i=0;i<256;i++)a[i]=i; let s=WORLD_SEED>>>0; for(let i=255;i;i--){s=(s*1664525+1013904223)>>>0;let j=s%(i+1),q=a[i];a[i]=a[j];a[j]=q;} for(let i=0;i<512;i++)perm[i]=a[i&255]; })();
    const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+(b-a)*t;
    function grad(h,x,y){ const u=(h&1)?-x:x, v=(h&2)?-y:y; return u+v; }
    function perlin(x,y){ const X=Math.floor(x)&255,Y=Math.floor(y)&255,xf=x-Math.floor(x),yf=y-Math.floor(y),u=fade(xf),v=fade(yf); const aa=perm[X+perm[Y]],ab=perm[X+perm[Y+1]],ba=perm[X+1+perm[Y]],bb=perm[X+1+perm[Y+1]]; return lerp(lerp(grad(aa,xf,yf),grad(ba,xf-1,yf),u),lerp(grad(ab,xf,yf-1),grad(bb,xf-1,yf-1),u),v); }
    function fbm(x,z){ let v=0,a=.54,f=.045; for(let i=0;i<5;i++){v+=perlin(x*f,z*f)*a;f*=2.04;a*=.5;} return v; }
    function ridge(x,z){ return 1-Math.abs(perlin(x*.019,z*.019)); }
    function hash(x,z){ const h=Math.sin(x*127.1+z*311.7+WORLD_SEED)*43758.5453; return h-Math.floor(h); }
    function terrainHeight(x,z){ const d=Math.hypot(x,z), sanctuary=Math.max(0,1-d/34); let h=SEA+8+fbm(x,z)*12+ridge(x,z)*4; h=lerp(h,16,sanctuary*.86); return Math.max(3,Math.min(31,Math.floor(h))); }
    function baseTerrain(x,y,z){ if(y<0) return T.OBSIDIAN; const h=terrainHeight(x,z); if(y>h) return T.AIR; if(y===h){ if(h>23) return T.MARBLE; return (Math.abs(fbm(x+77,z-19))>.49)?T.MOSS:T.GRASS; } if(y>h-3) return T.DIRT; return y<7?T.COBBLE:T.STONE; }
    function inCircle(x,z,r){return x*x+z*z<=r*r;}
    function structureBlock(x,y,z) {
      const ax=Math.abs(x),az=Math.abs(z), d=Math.hypot(x,z);
      // Sanctuary terrace, engraved like a celestial compass
      if (y===16 && d<15.5) { const ring=Math.floor(d); return (ring===4||ring===10||((x+z)%7===0))?T.GOLD:T.MARBLE; }
      if (y===17 && d<14.6 && d>13.1) return T.COBBLE;
      if (y===18 && d<12.1 && d>11.2) return T.MOSS;
      // Four stairways emerging from the plateau
      if ((ax<3&&az>14&&az<25)||(az<3&&ax>14&&ax<25)) { const q=Math.floor((Math.max(ax,az)-14)/3); if(y===15-q) return T.MARBLE; }
      // Central portal: obsidian arch, gilded threshold and shimmering core
      if (z>=-1&&z<=1&&ax<=3&&y>=17&&y<=28) {
        if(ax===3 || y===17 || (y>=26&&ax<=3)) return (y===17&&ax<3)?T.GOLD:T.OBSIDIAN;
        if(ax<3&&y<26) return T.CRYSTAL;
      }
      // Temple columns and their capitals
      const cols=[[8,8],[-8,8],[8,-8],[-8,-8],[8,0],[-8,0],[0,8],[0,-8]];
      for(const c of cols){ if(Math.abs(x-c[0])<=1&&Math.abs(z-c[1])<=1&&y>=17&&y<=27) { if((x+c[0]+z+c[1]+y)%5===0)return T.MOSS; return T.MARBLE; } if(Math.abs(x-c[0])<=2&&Math.abs(z-c[1])<=2&&y===28)return T.GOLD; }
      // Halo ring above the shrine
      if(y>=30&&y<=32&&d>11.2&&d<12.5) return (Math.floor((Math.atan2(z,x)+Math.PI)*8)%5===0)?T.GOLD:T.MARBLE;
      // Constellation bridges: thin levitating cardinal rays
      if(y===31&&((ax<1&&az>12&&az<31)||(az<1&&ax>12&&ax<31))) return T.GOLD;
      if(y===30&&((ax<2&&az>12&&az<31)||(az<2&&ax>12&&ax<31))) return T.OBSIDIAN;
      // Floating crystal heart and the broken sky-islets encircling it
      if(y>=34&&y<=42&&Math.abs(x)<=2&&Math.abs(z)<=2) return (Math.abs(x)+Math.abs(z)+y)%4===0?T.GOLD:T.CRYSTAL;
      const islands=[[18,16,36],[-19,12,34],[15,-20,38],[-17,-18,35]];
      for(const it of islands){ const dx=x-it[0],dz=z-it[1],dd=dx*dx+dz*dz; if(dd<18 && y>=it[2]-2 && y<=it[2]+(dd<5?2:0)) return y===it[2]+2?T.MOSS:(dd<5?T.CRYSTAL:T.COBBLE); }
      // Sacred bay tree by the eastern path
      if(x>=20&&x<=22&&z>=-6&&z<=-4&&y>=16&&y<=25) return T.WOOD;
      if(Math.hypot(x-21,z+5)<6&&y>=23&&y<=30) return (y<26&&Math.hypot(x-21,z+5)>4)?T.AIR:T.LEAVES;
      return T.AIR;
    }
    const edits = new Map();
    const k3=(x,y,z)=>x+','+y+','+z;
    function voxel(x,y,z){ const edit=edits.get(k3(x,y,z)); if(edit!==undefined)return edit; const s=structureBlock(x,y,z); return s||baseTerrain(x,y,z); }

    // A hand-painted, pixel-style procedural texture atlas — no external assets needed.
    const atlas=document.createElement('canvas'); atlas.width=16*16; atlas.height=16; const ax=atlas.getContext('2d'); ax.imageSmoothingEnabled=false;
    const palette={1:['#5c9b45','#79b956','#3b712e'],2:['#9a633b','#bb7b49','#704128'],3:['#77858a','#a3adb0','#505d65'],4:['#687477','#8d9694','#485356'],5:['#4f7452','#7fa55d','#365842'],6:['#202530','#3b3d51','#11151c'],7:['#c78d2d','#ffdc65','#8e581b'],8:['#67d7e8','#d9ffff','#237ca6'],9:['#dce3d9','#ffffff','#9baea8'],10:['#3e703f','#70a753','#254c31'],11:['#6f4429','#a66c38','#412717'],12:['#e9f3ed','#ffffff','#b7d2cb']};
    function tile(id,side){const [a,b,c]=palette[id]||palette[3], ox=id*16; ax.fillStyle=a;ax.fillRect(ox,0,16,16); for(let j=0;j<48;j++){const px=ox+((j*11+id*7)%16),py=(j*7+id*3)%16; ax.fillStyle=(j%5===0?c:(j%2?b:a));ax.fillRect(px,py,j%7?1:2,1);} if(id===1&&side){ax.fillStyle='#477a32';ax.fillRect(ox,0,16,5);for(let i=0;i<9;i++){ax.fillStyle=i%2?'#6ca848':'#2d5d28';ax.fillRect(ox+(i*7)%16,4+(i*3)%4,2,3)}} if(id===11&&side){ax.fillStyle='#4e2f21';for(let x=2;x<16;x+=5)ax.fillRect(ox+x,0,2,16)} if(id===8){ax.fillStyle='#d8ffff';ax.fillRect(ox+4,2,3,9);ax.fillRect(ox+8,5,2,7);} if(id===7){ax.fillStyle='#ffe88a';ax.fillRect(ox+3,3,4,3);} }
    for(let i=1;i<=12;i++)tile(i,i===1);
    // top grass is a separate tile using the same grass palette
    tile(13,false); for(let x=0;x<16;x+=3){ax.fillStyle='#9ec961';ax.fillRect(13*16+x,(x*5)%16,2,2);}
    const atlasTex=new THREE.CanvasTexture(atlas); atlasTex.magFilter=THREE.NearestFilter; atlasTex.minFilter=THREE.NearestFilter; atlasTex.colorSpace=THREE.SRGBColorSpace;
    const mat=new THREE.MeshLambertMaterial({map:atlasTex,vertexColors:false});
    function faceTile(type,face){if(type===T.GRASS&&face===2)return 13; return type;}
    const faces=[
      {n:[1,0,0],q:(x,y,z)=>[[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]]},
      {n:[-1,0,0],q:(x,y,z)=>[[x,y,z+1],[x,y+1,z+1],[x,y+1,z],[x,y,z]]},
      {n:[0,1,0],q:(x,y,z)=>[[x,y+1,z],[x,y+1,z+1],[x+1,y+1,z+1],[x+1,y+1,z]]},
      {n:[0,-1,0],q:(x,y,z)=>[[x,y,z+1],[x,y,z],[x+1,y,z],[x+1,y,z+1]]},
      {n:[0,0,1],q:(x,y,z)=>[[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]]},
      {n:[0,0,-1],q:(x,y,z)=>[[x+1,y,z],[x,y,z],[x,y+1,z],[x+1,y+1,z]]}
    ];
    const chunks=new Map(), chunkKey=(cx,cz)=>cx+','+cz;
    function makeChunk(cx,cz){
      const p=[],n=[],u=[]; const startX=cx*SIZE,startZ=cz*SIZE;
      const add=(q,normal,tile)=>{const U=tile/16,V=0,U2=U+1/16, inds=[0,1,2,0,2,3],uv=[[U,V],[U2,V],[U2,1],[U,1]];for(const i of inds){p.push(...q[i]);n.push(...normal);u.push(...uv[i]);}};
      for(let x=startX;x<startX+SIZE;x++)for(let z=startZ;z<startZ+SIZE;z++)for(let y=0;y<49;y++){const b=voxel(x,y,z);if(!b)continue;for(let f=0;f<6;f++){const v=faces[f].n;if(!voxel(x+v[0],y+v[1],z+v[2]))add(faces[f].q(x,y,z),v,faceTile(b,f));}}
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(n,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(u,2));g.computeBoundingSphere();
      const mesh=new THREE.Mesh(g,mat);mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData={cx,cz};scene.add(mesh);chunks.set(chunkKey(cx,cz),mesh);
    }
    let pending=[], wanted=new Set();
    function requestChunks(){ const cx=Math.floor(player.position.x/SIZE),cz=Math.floor(player.position.z/SIZE); wanted.clear(); for(let x=cx-RENDER_RADIUS;x<=cx+RENDER_RADIUS;x++)for(let z=cz-RENDER_RADIUS;z<=cz+RENDER_RADIUS;z++){const k=chunkKey(x,z);wanted.add(k);if(!chunks.has(k)&&!pending.some(q=>q[0]===x&&q[1]===z))pending.push([x,z]);} for(const [k,m] of chunks){if(!wanted.has(k)){scene.remove(m);m.geometry.dispose();chunks.delete(k);}} pending.sort((a,b)=>Math.hypot(a[0]-cx,a[1]-cz)-Math.hypot(b[0]-cx,b[1]-cz)); }
    function rebuild(cx,cz){const k=chunkKey(cx,cz),old=chunks.get(k);if(old){scene.remove(old);old.geometry.dispose();chunks.delete(k);makeChunk(cx,cz);}}
    function rebuildNear(x,z){const cx=Math.floor(x/SIZE),cz=Math.floor(z/SIZE);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)rebuild(cx+dx,cz+dz);}

    // Background cloudbanks and star motes give the world a storybook depth.
    const cloudMat=new THREE.MeshLambertMaterial({map:atlasTex,transparent:true,opacity:.70,depthWrite:false});
    for(let i=0;i<26;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(7+(i%4)*3,.55,3+(i%3)*2),cloudMat);const a=i*2.399;c.position.set(Math.cos(a)*58,25+(i%5)*3,Math.sin(a)*58);clouds.add(c);}
    const stars=new THREE.BufferGeometry(),sp=[];for(let i=0;i<330;i++){let a=hash(i,8)*Math.PI*2,e=.2+hash(i,29)*.75;sp.push(Math.cos(a)*90*e,30+hash(i,15)*55,Math.sin(a)*90*e);}stars.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xfff0bc,size:.35,sizeAttenuation:true,fog:false})));

    const hotbar=document.getElementById('hotbar');let selected=0;
    function paintHotbar(){hotbar.innerHTML='';usable.forEach((t,i)=>{const d=document.createElement('div');d.className='slot '+(i===selected?'active':'');d.innerHTML='<i>'+(i+1)+'</i><div class="swatch" style="background-image:url('+atlas.toDataURL()+');background-size:400px 25px;background-position:-'+(t*25)+'px 0"></div><label>'+NAMES[t]+'</label>';d.onclick=()=>{selected=i;paintHotbar();};hotbar.appendChild(d);});}
    paintHotbar();
    const keys={};let locked=false,vy=0,grounded=false,last=performance.now(),frames=0,fpst=0;
    const spawnX=-5,spawnZ=-22;player.position.set(spawnX,terrainHeight(spawnX,spawnZ)+1,spawnZ);player.rotation.y=-2.91;
    function solidAt(x,y,z){const q=voxel(Math.floor(x),Math.floor(y),Math.floor(z));return q!==T.AIR&&q!==T.LEAVES&&q!==T.CLOUD&&q!==T.CRYSTAL;}
    function collides(px,py,pz){const r=.28;for(const x of [px-r,px+r])for(const z of [pz-r,pz+r])for(const y of [py+.05,py+1.65])if(solidAt(x,y,z))return true;return false;}
    function move(dt){if(!locked)return;const speed=(keys.ShiftLeft||keys.ShiftRight?8.8:5.1)*dt;const f=new THREE.Vector3(-Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y)),r=new THREE.Vector3(f.z,0,-f.x),dir=new THREE.Vector3();if(keys.KeyW)dir.add(f);if(keys.KeyS)dir.sub(f);if(keys.KeyD)dir.add(r);if(keys.KeyA)dir.sub(r);if(dir.lengthSq()){dir.normalize().multiplyScalar(speed);if(!collides(player.position.x+dir.x,player.position.y,player.position.z))player.position.x+=dir.x;if(!collides(player.position.x,player.position.y,player.position.z+dir.z))player.position.z+=dir.z;}
      vy-=22*dt;let ny=player.position.y+vy*dt;if(collides(player.position.x,ny,player.position.z)){if(vy<0)grounded=true;vy=0;while(collides(player.position.x,ny,player.position.z)&&ny<55)ny+=.04;}else grounded=false;player.position.y=ny;if(player.position.y<-5){player.position.set(spawnX,terrainHeight(spawnX,spawnZ)+1,spawnZ);vy=0;showToast('星尘托住了你');}}
    document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&grounded){vy=8.2;grounded=false;}const k=+e.key;if(k>=1&&k<=usable.length){selected=k-1;paintHotbar();}});
    document.addEventListener('keyup',e=>keys[e.code]=false);
    document.addEventListener('mousemove',e=>{if(locked){player.rotation.y-=e.movementX*.0023;head.rotation.x=Math.max(-1.48,Math.min(1.48,head.rotation.x-e.movementY*.0023));}});
    const ray=new THREE.Raycaster();ray.far=7;
    function mineOrPlace(place){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects([...chunks.values()],false)[0];if(!hit)return;const normal=hit.face.normal.clone();const point=hit.point.clone().addScaledVector(normal,place?.01:-.01);const x=Math.floor(point.x),y=Math.floor(point.y),z=Math.floor(point.z);if(y<0||y>48)return;if(place){if(collides(x+.5,y+.02,z+.5))return;edits.set(k3(x,y,z),usable[selected]);showToast('塑形：'+NAMES[usable[selected]]);}else{const old=voxel(x,y,z);if(!old||structureBlock(x,y,z)===T.CRYSTAL&&y>33)return;edits.set(k3(x,y,z),T.AIR);showToast('开采：'+(NAMES[old]||'遗迹方块'));}rebuildNear(x,z);}
    renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0)mineOrPlace(false);if(e.button===2)mineOrPlace(true);});
    const start=document.getElementById('start');document.getElementById('enter').onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;start.style.opacity=locked?'0':'1';if(locked)setTimeout(()=>start.style.display='none',560);else start.style.display='grid';});
    function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.opacity=0,1350);}
    const map=document.getElementById('minimap'),mc=map.getContext('2d');function drawMap(){mc.fillStyle='#192a2c';mc.fillRect(0,0,66,66);const px=Math.floor(player.position.x),pz=Math.floor(player.position.z);for(let x=-33;x<33;x+=2)for(let z=-33;z<33;z+=2){let h=terrainHeight(px+x,pz+z),c=h>23?'#d3ded6':h<9?'#476760':'#568a48';if(Math.hypot(px+x,pz+z)<18)c='#a78b58';mc.fillStyle=c;mc.fillRect((x+33)/2,(z+33)/2,1.3,1.3);}mc.fillStyle='#ffe295';mc.fillRect(32,32,3,3);mc.strokeStyle='#f3d47d';mc.strokeRect(0,0,66,66);}
    function updateHUD(dt){const c=document.getElementById('coords');c.textContent='X '+player.position.x.toFixed(0)+'   Y '+(player.position.y+1.58).toFixed(0)+'   Z '+player.position.z.toFixed(0);const d=Math.hypot(player.position.x,player.position.z);document.getElementById('zone').textContent=d<35?'✦ 星陨圣坛':d<82?'雾松荒原':'无名远境';const look=ray;look.setFromCamera(new THREE.Vector2(0,0),camera);let h=look.intersectObjects([...chunks.values()],false)[0];document.getElementById('reticle-tip').textContent=h?'瞄准：'+(NAMES[voxel(Math.floor(h.point.x-h.face.normal.x*.01),Math.floor(h.point.y-h.face.normal.y*.01),Math.floor(h.point.z-h.face.normal.z*.01))]||'遗迹'):'远望圣坛';frames++;fpst+=dt;if(fpst>.65){document.getElementById('fps').textContent=Math.round(frames/fpst)+' FPS  ·  '+chunks.size+' 界域碎片';frames=0;fpst=0;drawMap();}}
    function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;requestChunks();if(pending.length) {const q=pending.shift();if(wanted.has(chunkKey(q[0],q[1])))makeChunk(q[0],q[1]);}move(dt);clouds.rotation.y+=dt*.004;moon.position.x=Math.cos(now*.000018)*70;moon.position.z=Math.sin(now*.000018)*70;updateHUD(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}requestChunks();requestAnimationFrame(loop);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  })();
  </script>
