<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080c" />
    <meta name="description" content="《陨石雨》——一部使用 Three.js、体素几何与 Web Audio 实时生成的程序化电影。" />
    <title>陨石雨 · 程序化体素电影</title>
  </head>
  <body>
    <main id="app" aria-label="陨石雨，程序化三维电影">
      <div id="stage"></div>
      <div class="cinema-bar cinema-bar-top"></div>
      <div class="cinema-bar cinema-bar-bottom"></div>
      <div id="location" aria-hidden="true"></div>
      <div id="title-card" aria-hidden="true">
        <div class="title-kicker">一部程序化体素电影</div>
        <h1>陨石雨</h1>
        <div class="title-en">METEOR RAIN</div>
      </div>
      <div id="scope" aria-hidden="true">
        <i class="scope-h"></i><i class="scope-v"></i>
        <span class="scope-range">5 000 m&nbsp;&nbsp;·&nbsp;&nbsp;500 m/s</span>
        <span class="scope-tick scope-tick-l"></span>
        <span class="scope-tick scope-tick-r"></span>
      </div>
      <div id="hud" aria-hidden="true"><span>EVA · UNLOGGED</span><b id="hud-time">11:47:32</b></div>
      <div id="flight-clock" aria-hidden="true"><small>弹道飞行</small><strong>10.0</strong></div>
      <div id="credits" aria-hidden="true">
        <div class="credit-title">陨石雨</div>
        <p>根据刘慈欣《三体》相关篇章改编</p>
        <p>程序化导演 · 体素美术 · 实时声音</p>
        <div class="credit-rule"></div>
        <p>THREE.JS&nbsp;&nbsp; / &nbsp;&nbsp;WEB AUDIO</p>
        <strong>完</strong>
      </div>
      <div id="fade"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
