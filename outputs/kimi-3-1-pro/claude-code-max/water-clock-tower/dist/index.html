<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b20" />
    <meta name="description" content="北宋苏颂水运仪象台：一部由实时物理模拟驱动的 3D 科普短片。" />
    <title>水运仪象台 · 把流水变成时间</title>
    <script defer src="./assets/index-Rvivuxle.js"></script>
    <link rel="stylesheet" href="./assets/index-C2QC3BqP.css">
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="水运仪象台实时三维物理剖面"></canvas>
      <div class="vignette"></div>
      <div class="grain"></div>

      <header class="topbar">
        <div class="brand">
          <span class="seal">宋</span>
          <span><b>格物致知</b><small>THE WATER CLOCK · 1092</small></span>
        </div>
        <div class="controls">
          <span class="live"><i></i> 实时物理</span>
          <button id="sound" class="icon-button" aria-label="开启或关闭声音" title="声音">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12-1c1.3 1.6 1.3 6.4 0 8m3-11c3.1 3.4 3.1 10.6 0 14"/></svg>
            <span>开启声音</span>
          </button>
          <button id="pause" class="icon-button square" aria-label="暂停" title="暂停 / 继续（空格）">
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
          </button>
        </div>
      </header>

      <section id="story" class="story" aria-live="polite">
        <div class="eyebrow"><span id="chapter-number">00</span><i></i><span id="chapter-eyebrow">北宋 · 元祐七年</span></div>
        <h1 id="chapter-title">把流水，<br>变成时间</h1>
        <p id="chapter-copy">苏颂 · 水运仪象台<br>一座三层高的自动化天文钟。</p>
        <div id="story-note" class="story-note">公元 1092 年 · 开封</div>
      </section>

      <div id="labels" class="labels"></div>
      <svg id="leaders" class="leaders" aria-hidden="true"></svg>

      <div id="strike" class="strike" aria-hidden="true">
        <span>时辰到</span><b>咚</b><small>木人击鼓</small>
      </div>

      <section class="bottom-ui">
        <div id="causal-chain" class="causal-chain" aria-label="机械传动顺序">
          <div data-stage="water"><span>01</span><b>水流</b><small>提供动力</small></div><i>→</i>
          <div data-stage="wheel"><span>02</span><b>水轮</b><small>承接水力</small></div><i>→</i>
          <div data-stage="escape"><span>03</span><b>擒纵</b><small>控制节拍</small></div><i>→</i>
          <div data-stage="gear"><span>04</span><b>传动</b><small>逐层上传</small></div><i>→</i>
          <div data-stage="output"><span>05</span><b>报时 · 观天</b><small>自动运转</small></div>
        </div>
        <div class="playback-row">
          <div class="timecode"><span id="time">00:00</span><i>/</i><span>00:32</span></div>
          <div class="timeline"><div id="progress"></div><div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="footnote">结构原理演示 · 转速已加快</div>
        </div>
      </section>

      <button id="replay" class="replay"><span>↻</span> 再看一遍</button>
      <div id="loading" class="loading"><span class="loader-wheel"></span><b>水运仪象台</b><small>正在接通水力…</small></div>
      <div id="paused" class="paused-label">已暂停 <small>按空格继续</small></div>
    </main>
  </body>
</html>
