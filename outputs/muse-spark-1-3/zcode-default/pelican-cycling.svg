<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>海边骑自行车的鹈鹕</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3AA0E8"/>
      <stop offset="55%" stop-color="#8ED4F5"/>
      <stop offset="100%" stop-color="#E3F6FF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FFEC99" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFC95C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC95C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DD6D0"/>
      <stop offset="35%" stop-color="#1EA8D8"/>
      <stop offset="100%" stop-color="#0E5FA8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0C2"/>
      <stop offset="40%" stop-color="#F6D894"/>
      <stop offset="100%" stop-color="#DDB56E"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#EFF2F5"/>
      <stop offset="80%" stop-color="#C7CFD8"/>
      <stop offset="100%" stop-color="#9AA6B2"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#D8DFE7"/>
      <stop offset="100%" stop-color="#8E9AA8"/>
    </linearGradient>
    <linearGradient id="beakTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC266"/>
      <stop offset="35%" stop-color="#FF9A2B"/>
      <stop offset="100%" stop-color="#E86A0A"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9C4"/>
      <stop offset="45%" stop-color="#FF9E7A"/>
      <stop offset="100%" stop-color="#D95A3A"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="55%" stop-color="#D81B26"/>
      <stop offset="100%" stop-color="#7A0E16"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A2A4A" flood-opacity="0.35"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1200" height="460" fill="url(#sky)"/>
  <circle cx="975" cy="135" r="130" fill="url(#sunGlow)"/>
  <circle cx="975" cy="135" r="58" fill="#FFF8DC" stroke="#FFD97A" stroke-width="3"/>
  <circle cx="975" cy="135" r="58" fill="#FFFFFF" opacity="0.35"/>

  <!-- 云 -->
  <g fill="#FFFFFF" opacity="0.95">
    <g>
      <ellipse cx="210" cy="140" rx="70" ry="28"/>
      <ellipse cx="260" cy="125" rx="55" ry="26"/>
      <ellipse cx="160" cy="125" rx="45" ry="22"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="620" cy="95" rx="60" ry="22"/>
      <ellipse cx="665" cy="83" rx="45" ry="20"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="810" cy="210" rx="52" ry="18"/>
      <ellipse cx="845" cy="200" rx="35" ry="15"/>
    </g>
  </g>

  <!-- 海鸥 -->
  <g stroke="#2F3D4A" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M340 190 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M400 165 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M760 150 q10 -10 20 0 q10 -10 20 0"/>
  </g>

  <!-- 远处帆船 -->
  <g transform="translate(180,390)">
    <path d="M-35 0 L35 0 L18 16 L-18 16 Z" fill="#5D4037"/>
    <path d="M0 0 L0 -55 L30 0 Z" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2"/>
    <path d="M0 -55 L0 0 L-22 0 Z" fill="#FF8A65"/>
  </g>

  <!-- 大海 -->
  <rect x="0" y="410" width="1200" height="190" fill="url(#sea)"/>
  <!-- 海面高光波浪 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.75">
    <path d="M40 475 q25 -12 50 0 t50 0 t50 0" stroke-width="4"/>
    <path d="M280 495 q25 -12 50 0 t50 0" stroke-width="3.5" opacity="0.7"/>
    <path d="M650 465 q25 -12 50 0 t50 0 t50 0" stroke-width="4"/>
    <path d="M880 500 q25 -12 50 0 t50 0" stroke-width="3.5" opacity="0.7"/>
    <path d="M1000 470 q25 -12 50 0 t50 0" stroke-width="4"/>
    <path d="M120 525 q25 -12 50 0 t50 0 t50 0" stroke-width="3" opacity="0.55"/>
    <path d="M500 540 q25 -12 50 0 t50 0 t50 0" stroke-width="3" opacity="0.55"/>
    <path d="M800 545 q25 -12 50 0 t50 0" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- 碎浪泡沫岸线 -->
  <path d="M0 585 Q150 565 300 585 T600 585 T900 585 T1200 580 L1200 610 L0 610 Z" fill="#E8FBFF"/>
  <path d="M0 592 Q150 577 300 592 T600 592 T900 592 T1200 588 L1200 605 L0 605 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- 沙滩 -->
  <rect x="0" y="597" width="1200" height="203" fill="url(#sand)"/>
  <ellipse cx="600" cy="610" rx="520" ry="18" fill="#FFFFFF" opacity="0.35"/>
  <!-- 车轮压痕 -->
  <g stroke="#C49A5A" stroke-width="3" opacity="0.5" stroke-dasharray="14 10">
    <path d="M0 710 L1200 710"/>
    <path d="M0 735 L1200 735"/>
  </g>

  <!-- 沙滩装饰：海星 贝壳 -->
  <g>
    <g transform="translate(150,700)">
      <path d="M0 -22 L6 -7 L22 -7 L9 3 L13 19 L0 9 L-13 19 L-9 3 L-22 -7 L-6 -7 Z" fill="#FF7E5F" stroke="#D84A2E" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="4" fill="#FFD0B8"/>
    </g>
    <g transform="translate(1050,705)">
      <ellipse cx="0" cy="0" rx="20" ry="14" fill="#F8BBD0" stroke="#AD6B7E" stroke-width="2"/>
      <path d="M0 -14 L0 14 M-12 -8 L12 8 M12 -8 L-12 8" stroke="#AD6B7E" stroke-width="1.5"/>
    </g>
    <g transform="translate(950,740)" fill="#FFF" stroke="#D7B87A" stroke-width="2">
      <ellipse cx="0" cy="0" rx="12" ry="8"/>
      <ellipse cx="25" cy="4" rx="8" ry="6"/>
    </g>
    <!-- 小螃蟹 -->
    <g transform="translate(150,640)">
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#E53935" stroke="#8E0000" stroke-width="2"/>
      <circle cx="-6" cy="-8" r="4" fill="#FFF"/><circle cx="-6" cy="-8" r="2" fill="#000"/>
      <circle cx="6" cy="-8" r="4" fill="#FFF"/><circle cx="6" cy="-8" r="2" fill="#000"/>
      <path d="M-16 5 L-26 12 M16 5 L26 12 M-14 8 L-20 16 M14 8 L20 16" stroke="#8E0000" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="600" cy="698" rx="235" ry="22" fill="#5A3A15" opacity="0.28"/>

  <!-- ===== 自行车 ===== -->
  <g filter="url(#soft2)">
    <!-- 轮胎 -->
    <g>
      <circle cx="448" cy="605" r="88" fill="none" stroke="#212121" stroke-width="20"/>
      <circle cx="448" cy="605" r="88" fill="none" stroke="#3A3A3A" stroke-width="4" opacity="0.6"/>
      <circle cx="448" cy="605" r="68" fill="#F5F0E1" opacity="0.25"/>
      <circle cx="448" cy="605" r="68" fill="none" stroke="#B0BEC5" stroke-width="5"/>
      <!-- 辐条 -->
      <g stroke="#ECEFF1" stroke-width="2.5" opacity="0.95">
        <line x1="448" y1="605" x2="448" y2="541"/><line x1="448" y1="605" x2="508" y2="573"/>
        <line x1="448" y1="605" x2="508" y2="637"/><line x1="448" y1="605" x2="448" y2="669"/>
        <line x1="448" y1="605" x2="388" y2="637"/><line x1="448" y1="605" x2="388" y2="573"/>
        <line x1="448" y1="605" x2="492" y2="557"/><line x1="448" y1="605" x2="404" y2="653"/>
      </g>
      <circle cx="448" cy="605" r="12" fill="#455A64" stroke="#263238" stroke-width="3"/>
    </g>
    <g>
      <circle cx="752" cy="605" r="88" fill="none" stroke="#212121" stroke-width="20"/>
      <circle cx="752" cy="605" r="88" fill="none" stroke="#3A3A3A" stroke-width="4" opacity="0.6"/>
      <circle cx="752" cy="605" r="68" fill="none" stroke="#B0BEC5" stroke-width="5"/>
      <g stroke="#ECEFF1" stroke-width="2.5" opacity="0.95">
        <line x1="752" y1="605" x2="752" y2="541"/><line x1="752" y1="605" x2="812" y2="573"/>
        <line x1="752" y1="605" x2="812" y2="637"/><line x1="752" y1="605" x2="752" y2="669"/>
        <line x1="752" y1="605" x2="692" y2="637"/><line x1="752" y1="605" x2="692" y2="573"/>
        <line x1="752" y1="605" x2="796" y2="557"/><line x1="752" y1="605" x2="708" y2="653"/>
      </g>
      <circle cx="752" cy="605" r="12" fill="#455A64" stroke="#263238" stroke-width="3"/>
    </g>

    <!-- 车架 -->
    <g stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="448" y1="605" x2="588" y2="605"/>
      <line x1="588" y1="605" x2="533" y2="478"/>
      <line x1="533" y1="478" x2="710" y2="482"/>
      <line x1="710" y1="482" x2="752" y2="605"/>
      <line x1="588" y1="605" x2="722" y2="530"/>
      <line x1="533" y1="478" x2="448" y2="605"/>
    </g>
    <!-- 头管 把立 车把 -->
    <g>
      <line x1="710" y1="482" x2="728" y2="535" stroke="#263238" stroke-width="12" stroke-linecap="round"/>
      <line x1="728" y1="535" x2="705" y2="500" stroke="#90A4AE" stroke-width="6" stroke-linecap="round"/>
      <path d="M695 485 Q710 475 730 485 Q740 492 735 505" fill="none" stroke="#263238" stroke-width="8" stroke-linecap="round"/>
      <circle cx="735" cy="505" r="9" fill="#4E342E"/>
      <!-- 座管 座垫 -->
      <line x1="533" y1="478" x2="525" y2="455" stroke="#90A4AE" stroke-width="8" stroke-linecap="round"/>
      <path d="M495 445 Q525 435 560 445 Q565 452 555 458 L505 460 Q490 458 495 445 Z" fill="#3E2723" stroke="#1A1210" stroke-width="2"/>
      <!-- 牙盘 链条 脚踏 -->
      <circle cx="588" cy="605" r="30" fill="#37474F" stroke="#102027" stroke-width="4"/>
      <circle cx="588" cy="605" r="12" fill="#B0BEC5" stroke="#263238" stroke-width="3"/>
      <ellipse cx="517" cy="605" rx="100" ry="18" fill="none" stroke="#616161" stroke-width="4" stroke-dasharray="8 4"/>
      <line x1="588" y1="605" x2="625" y2="570" stroke="#263238" stroke-width="9" stroke-linecap="round"/>
      <line x1="588" y1="605" x2="551" y2="640" stroke="#263238" stroke-width="9" stroke-linecap="round"/>
      <rect x="610" y="560" width="38" height="14" rx="4" fill="#212121"/>
      <rect x="520" y="635" width="38" height="14" rx="4" fill="#212121"/>
      <!-- 车篮子(前面放鱼) -->
      <g>
        <path d="M745 515 L795 515 L785 570 L735 570 Z" fill="#A9743A" stroke="#6D4C1E" stroke-width="3"/>
        <g stroke="#6D4C1E" stroke-width="2">
          <line x1="748" y1="530" x2="792" y2="530"/><line x1="745" y1="545" x2="789" y2="545"/>
          <line x1="758" y1="515" x2="752" y2="570"/><line x1="773" y1="515" x2="771" y2="570"/>
        </g>
        <!-- 鱼尾露出 -->
        <path d="M760 515 Q755 495 740 490 L748 500 L738 502 Q750 510 758 520 Z" fill="#90CAF9" stroke="#2D6A9F" stroke-width="2"/>
        <path d="M775 515 Q780 493 795 488 L788 499 L798 500 Q787 510 777 520 Z" fill="#80CBC4" stroke="#2A6B64" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g filter="url(#soft)">
    <!-- 飘动的围巾 -->
    <path d="M640 330 C580 315 520 320 470 295 C440 280 410 285 395 300 C420 305 430 315 425 330 C415 350 390 355 375 350 C395 365 430 370 455 360 C510 335 580 350 635 355 Z" fill="#D81B26" stroke="#7A0E16" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="505" cy="328" r="6" fill="#FFF"/>
    <circle cx="535" cy="335" r="5" fill="#FFF"/>
    <circle cx="470" cy="330" r="5" fill="#FFF"/>
    <path d="M375 350 L360 375 L375 372 L370 388 L385 375 L395 382 L398 360 Z" fill="#D81B26" stroke="#7A0E16" stroke-width="2"/>

    <!-- 尾巴 -->
    <path d="M440 460 L380 445 L395 465 L375 470 L400 483 L390 500 L435 490 Z" fill="#8E9AA8" stroke="#5F6B78" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 腿 (在身体后面的一只) -->
    <path d="M545 510 L530 580 L525 635" fill="none" stroke="#E67E22" stroke-width="15" stroke-linecap="round"/>
    <g transform="translate(525,635)">
      <path d="M0 0 L-28 12 L-20 20 L0 12 L20 18 L26 8 Z" fill="#F39C12" stroke="#B35A00" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="560" cy="440" rx="135" ry="92" fill="url(#bodyGrad)" stroke="#7E8A97" stroke-width="2.5" transform="rotate(-10 560 440)"/>
    <!-- 肚皮阴影 -->
    <path d="M460 480 Q550 530 660 470 Q620 510 550 515 Q490 515 460 480 Z" fill="#9AA6B2" opacity="0.55"/>
    <!-- 背部羽毛纹理 -->
    <g stroke="#AAB5C1" stroke-width="2" opacity="0.7" fill="none">
      <path d="M480 420 q20 12 40 8"/>
      <path d="M500 440 q20 12 40 8"/>
      <path d="M520 400 q20 12 40 8"/>
    </g>

    <!-- 前腿 (发力踩) -->
    <path d="M590 510 L615 560 L625 568" fill="none" stroke="#F39C12" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(625,568) rotate(-10)">
      <path d="M0 0 L-28 12 L-18 22 L2 13 L24 18 L28 6 Z" fill="#FFA726" stroke="#B35A00" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-10 8 L-12 18 M5 8 L5 19" stroke="#B35A00" stroke-width="1.8"/>
    </g>

    <!-- 翅膀(手臂) 扶着车把 - 生动羽毛分层 -->
    <path d="M585 415 C630 430 675 460 705 492 L695 508 C660 485 620 460 575 455 Q555 435 585 415 Z" fill="url(#wingGrad)" stroke="#5F6B78" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M575 455 C610 465 650 485 695 508 L688 522 C645 505 605 488 568 480 Z" fill="#6E7B8A" stroke="#4A5560" stroke-width="2"/>
    <g fill="#4A5560">
      <ellipse cx="700" cy="510" rx="10" ry="6" transform="rotate(25 700 510)"/>
      <ellipse cx="688" cy="515" rx="10" ry="6" transform="rotate(25 688 515)"/>
    </g>

    <!-- 脖子 S形 -->
    <path d="M630 400 C660 370 660 340 645 310 C635 285 635 265 650 250" fill="none" stroke="#D0D7DE" stroke-width="62" stroke-linecap="round"/>
    <path d="M630 400 C660 370 660 340 645 310 C635 285 635 265 650 250" fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
    <path d="M655 380 C670 350 668 320 655 295" fill="none" stroke="#C3CCD5" stroke-width="8" opacity="0.6" stroke-linecap="round"/>

    <!-- 头 -->
    <ellipse cx="668" cy="240" rx="58" ry="50" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="2.5"/>
    <!-- 头后羽冠 -->
    <path d="M620 225 Q595 215 580 195 Q600 195 615 205 Q600 190 595 175 Q615 185 625 205 Z" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="2" stroke-linejoin="round"/>
    <!-- 脸颊粉晕 -->
    <ellipse cx="675" cy="265" rx="18" ry="12" fill="#FFAB91" opacity="0.45"/>

    <!-- 眼睛 生动 -->
    <circle cx="690" cy="232" r="14" fill="#FFFFFF" stroke="#78909C" stroke-width="2"/>
    <circle cx="692" cy="232" r="9" fill="#212121"/>
    <circle cx="695" cy="229" r="3.2" fill="#FFFFFF"/>
    <path d="M675 215 Q690 205 705 215" fill="none" stroke="#37474F" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 喙 - 长大橙色 -->
    <!-- 喉囊 -->
    <path d="M705 270 Q760 285 830 310 L895 332 Q860 360 810 365 Q750 368 705 290 Z" fill="url(#pouchGrad)" stroke="#A63A22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M730 295 Q770 325 810 345" fill="none" stroke="#A63A22" stroke-width="2" opacity="0.5"/>
    <path d="M750 290 Q785 318 820 338" fill="none" stroke="#FFD9C4" stroke-width="2" opacity="0.7"/>
    <!-- 上喙 -->
    <path d="M660 235 Q750 240 850 295 L905 325 L900 335 Q840 320 700 275 Q660 265 660 235 Z" fill="url(#beakTop)" stroke="#9C4A00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M900 323 Q910 328 905 338 Q898 345 890 340 Z" fill="#FFE0B2" stroke="#9C4A00" stroke-width="2"/>
    <line x1="700" y1="265" x2="880" y2="322" stroke="#9C4A00" stroke-width="2" opacity="0.6"/>
    <!-- 鼻线 -->
    <line x1="710" y1="248" x2="830" y2="297" stroke="#7A3300" stroke-width="2" opacity="0.5"/>

    <!-- 另一侧翅膀(后方 small) 增加动感 -->
    <path d="M520 430 Q480 450 445 490 Q475 485 505 475 Q535 465 550 445 Z" fill="#B0B9C4" stroke="#5F6B78" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- 速度线 / 动感 -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.85">
    <line x1="280" y1="520" x2="380" y2="520" stroke-width="6"/>
    <line x1="250" y1="555" x2="370" y2="555" stroke-width="5" opacity="0.7"/>
    <line x1="290" y1="590" x2="380" y2="590" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- 前景水花 -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="840" cy="680" r="8"/><circle cx="858" cy="675" r="6"/><circle cx="825" cy="685" r="5"/>
    <circle cx="360" cy="680" r="7"/><circle cx="375" cy="675" r="5"/>
  </g>

  <!-- 标题小牌 -->
  <g transform="translate(60,620)">
    <rect x="0" y="0" width="230" height="62" rx="14" fill="#0A2A4A" opacity="0.72"/>
    <text x="18" y="27" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFF">海边骑行 ing 🚲</text>
    <text x="18" y="48" font-family="sans-serif" font-size="14" fill="#BEE3FF">Pelican Beach Ride • SVG</text>
  </g>
</svg>