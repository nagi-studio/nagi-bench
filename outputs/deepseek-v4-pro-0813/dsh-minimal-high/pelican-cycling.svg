    <!-- 腿 -->
    <path d="M 300,392 C 318,430 348,480 368,520 C 372,538 371,544 369,548" fill="none" stroke="#f08a24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 318,395 C 330,425 340,455 352,470 C 360,477 365,476 368,476" fill="none" stroke="#e07818" stroke-width="7" stroke-linecap="round"/>
    <!-- 脚蹼 -->
    <path d="M 369,548 L 382,552 L 376,556 L 388,560 L 368,561 Z" fill="#f08a24"/>
    <path d="M 368,476 L 381,480 L 375,484 L 387,488 L 367,489 Z" fill="#e07818"/>

    <!-- 尾羽 -->
    <path d="M 230,340 C 200,335 185,350 172,362 C 160,372 168,382 184,378 C 200,374 218,366 238,356 Z" fill="#d8e1e6"/>
    <path d="M 224,348 C 198,345 184,358 170,368" fill="none" stroke="#aebdc6" stroke-width="2"/>

    <!-- 身体 -->
    <path d="M 188,350
             C 198,310 235,272 285,266
             C 325,261 360,282 372,310
             C 382,335 378,365 356,382
             C 338,397 308,410 282,408
             C 248,405 210,392 188,350 Z"
          fill="url(#bodyGrad)" stroke="#b8c8d0" stroke-width="1.5"/>
    <!-- 身体下方阴影 -->
    <path d="M 245,402 C 280,410 330,404 352,386 C 364,376 370,362 368,346 C 350,380 300,398 245,402 Z" fill="#b8c8d0" opacity="0.55"/>

    <!-- 颈部 -->
    <path d="M 350,318 C 372,302 390,278 400,252 C 406,238 412,234 420,230 L 410,252 C 402,276 380,305 360,330 Z" fill="#f4f8fa" stroke="#c2d0d7" stroke-width="1.5"/>
    <path d="M 356,322 C 374,306 392,282 402,256" fill="none" stroke="#d4dfe5" stroke-width="3"/>

    <!-- 头部 -->
    <ellipse cx="418" cy="228" rx="24" ry="21" fill="#fbfdfe" stroke="#c2d0d7" stroke-width="1.5"/>
    <!-- 冠羽 -->
    <path d="M 400,216 C 392,204 386,198 378,196 C 388,202 392,210 394,220" fill="#d8e1e6"/>
    <path d="M 404,210 C 398,200 394,194 388,190 C 396,197 400,205 402,214" fill="#c5d2d9"/>

    <!-- 眼睛 -->
    <circle cx="426" cy="219" r="5.5" fill="#1f2a30"/>
    <circle cx="428" cy="216.5" r="1.8" fill="#ffffff"/>
    <path d="M 416,208 Q 426,202 436,207" fill="none" stroke="#8a9aa4" stroke-width="2" stroke-linecap="round"/>

    <!-- 上喙 -->
    <path d="M 434,218 Q 500,210 568,248 Q 505,234 438,232 Z" fill="url(#beakGrad)" stroke="#c96a0b" stroke-width="1.5"/>
    <path d="M 436,224 Q 500,222 564,247" fill="none" stroke="#ffd97a" stroke-width="1.6" opacity="0.7"/>
    <path d="M 440,226 Q 500,218 566,245" fill="none" stroke="#e07b10" stroke-width="1" opacity="0.5"/>
    <!-- 喙尖钩 -->
    <path d="M 568,248 Q 574,250 572,254 Q 566,256 562,252 Z" fill="#c96a0b"/>

    <!-- 喉囊 -->
    <path d="M 438,232 Q 500,240 566,250 Q 505,278 438,254 Z" fill="url(#pouchGrad)" stroke="#d97a0f" stroke-width="1.5"/>
    <path d="M 455,246 Q 495,258 538,255" fill="none" stroke="#e0891a" stroke-width="1.4" opacity="0.6"/>
    <path d="M 448,240 Q 490,250 535,248" fill="none" stroke="#e0891a" stroke-width="1.1" opacity="0.45"/>

    <!-- 收拢的翅膀 -->
    <path d="M 332,330
             C 350,322 366,322 376,330
             C 380,336 376,344 366,350
             C 352,360 328,364 312,362
             C 296,360 282,354 276,346
             C 296,350 314,342 332,330 Z"
          fill="url(#wingGrad)" stroke="#aebdc6" stroke-width="1.4"/>
    <path d="M 312,362 C 320,352 330,346 342,340" fill="none" stroke="#9fb0bb" stroke-width="1.6"/>
    <path d="M 300,360 C 306,352 314,348 324,342" fill="none" stroke="#9fb0bb" stroke-width="1.6"/>
    <path d="M 288,356 C 294,350 302,346 312,342" fill="none" stroke="#9fb0bb" stroke-width="1.4"/>

    <!-- 伸向车把的翅膀 -->
    <path d="M 348,332 C 378,344 416,352 442,360 C 432,366 390,364 354,352 C 346,348 344,340 348,332 Z"
          fill="url(#wingGrad)" stroke="#aebdc6" stroke-width="1.3"/>
    <path d="M 360,350 C 388,356 420,360 440,361" fill="none" stroke="#9fb0bb" stroke-width="1.3"/>
  </g>

  <!-- 动感线条 -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M 130,400 L 95,400"/>
    <path d="M 150,420 L 105,420"/>
    <path d="M 125,440 L 95,440"/>
  </g>
</svg>
