<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="一只鹈鹕在海边骑自行车">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8fd4"/>
      <stop offset="45%" stop-color="#7fc4e8"/>
      <stop offset="78%" stop-color="#c9e8f5"/>
      <stop offset="100%" stop-color="#fde8b0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff9d6" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffe58f" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#176b87"/>
      <stop offset="35%" stop-color="#1f8aa8"/>
      <stop offset="75%" stop-color="#45b8d4"/>
      <stop offset="100%" stop-color="#8ad8e8"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7c88a"/>
      <stop offset="25%" stop-color="#f2d99a"/>
      <stop offset="100%" stop-color="#d9ad6b"/>
    </linearGradient>
    <linearGradient id="wetSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9ab72"/>
      <stop offset="30%" stop-color="#d9bd88"/>
      <stop offset="100%" stop-color="#b8945c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef3f5"/>
      <stop offset="100%" stop-color="#c9d6dc"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9fa"/>
      <stop offset="100%" stop-color="#b8c8d0"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffb42e"/>
      <stop offset="50%" stop-color="#f48f1d"/>
      <stop offset="100%" stop-color="#e0700f"/>
    </linearGradient>
    <radialGradient id="pouchGrad" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#ffd97a"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </radialGradient>
    <filter id="blur8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="375" fill="url(#skyGrad)"/>

  <!-- 太阳与光晕 -->
  <circle cx="655" cy="115" r="115" fill="url(#sunGlow)" filter="url(#blur8)"/>
  <circle cx="655" cy="115" r="42" fill="#fff8d9"/>
  <circle cx="655" cy="115" r="34" fill="#fffce8"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.9" filter="url(#blur2)">
    <ellipse cx="145" cy="95" rx="55" ry="20"/>
    <ellipse cx="190" cy="85" rx="42" ry="17"/>
    <ellipse cx="105" cy="88" rx="32" ry="14"/>
    <ellipse cx="355" cy="62" rx="50" ry="16"/>
    <ellipse cx="400" cy="55" rx="36" ry="14"/>
    <ellipse cx="320" cy="58" rx="28" ry="11"/>
    <ellipse cx="545" cy="150" rx="40" ry="14"/>
    <ellipse cx="585" cy="142" rx="30" ry="12"/>
    <ellipse cx="515" cy="145" rx="24" ry="10"/>
  </g>

  <!-- 海鸥 -->
  <g stroke="#3a4a52" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 140,155 Q 147,146 154,154 Q 161,146 168,155"/>
    <path d="M 215,185 Q 221,177 227,184 Q 233,177 239,185"/>
    <path d="M 95,190 Q 100,182 105,189 Q 110,182 115,190"/>
  </g>

  <!-- 海面 -->
  <rect x="0" y="350" width="800" height="130" fill="url(#seaGrad)"/>
  <g>
    <path d="M 30.0,386.1 L 76.2,390.2 L 122.5,393.9 L 168.8,391.5 L 215.0,386.7 L 261.2,387.2 L 307.5,392.2 L 353.8,393.7 L 400.0,389.3 L 446.2,386.0 L 492.5,389.0 L 538.8,393.6 L 585.0,392.5 L 631.2,387.4 L 677.5,386.5 L 723.8,391.1 L 770.0,394.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 30.0,416.8 L 79.3,420.3 L 128.7,423.7 L 178.0,425.0 L 227.3,423.6 L 276.7,420.2 L 326.0,416.7 L 375.3,415.0 L 424.7,416.1 L 474.0,419.4 L 523.3,423.0 L 572.7,424.9 L 622.0,424.2 L 671.3,421.1 L 720.7,417.4 L 770.0,415.2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 30.0,447.6 L 82.9,449.7 L 135.7,451.8 L 188.6,453.7 L 241.4,455.1 L 294.3,455.9 L 347.1,455.9 L 400.0,455.2 L 452.9,453.8 L 505.7,451.9 L 558.6,449.8 L 611.4,447.7 L 664.3,445.9 L 717.1,444.6 L 770.0,444.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- 远处帆船 -->
  <g>
    <path d="M 180,378 L 214,378 L 214,358 L 180,358 Z" fill="#ffffff" opacity="0.75"/>
    <path d="M 178,358 L 214,366 L 214,358 Z" fill="#ffffff" opacity="0.8"/>
    <line x1="178" y1="358" x2="178" y2="392" stroke="#4a4038" stroke-width="2.5"/>
  </g>

  <!-- 沙滩 -->
  <path d="M 0,468 Q 200,452 400,466 Q 620,480 800,458 L 800,600 L 0,600 Z" fill="url(#sandGrad)"/>
  <!-- 湿润沙滩 -->
  <path d="M 0,468 Q 200,452 400,466 Q 620,480 800,458 L 800,500 Q 600,492 400,490 Q 200,488 0,496 Z" fill="url(#wetSand)" opacity="0.85"/>

  <!-- 海岸泡沫 -->
  <path d="M -5,472 Q 80,458 160,463 Q 260,468 360,462 Q 480,455 600,466 Q 700,476 805,462"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
  <path d="M -5,480 Q 120,468 240,473 Q 370,478 490,471 Q 620,464 805,474"
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>

  <!-- 沙滩纹理与小贝壳 -->
  <g fill="#c8a25f" opacity="0.55">
    <ellipse cx="80" cy="530" rx="3" ry="2"/>
    <ellipse cx="150" cy="555" rx="4" ry="2"/>
    <ellipse cx="620" cy="535" rx="3" ry="2"/>
    <ellipse cx="700" cy="565" rx="4" ry="2"/>
    <ellipse cx="550" cy="575" rx="3" ry="2"/>
    <ellipse cx="120" cy="580" rx="3" ry="2"/>
    <ellipse cx="720" cy="520" rx="3" ry="2"/>
  </g>
  <g fill="#f7e9cf" stroke="#d9b87a" stroke-width="1.2">
    <path d="M 720,540 a 6 4 0 1 0 0.1,0 Z" fill="#f6dfc0"/>
    <path d="M 95,560 a 5 3.5 0 1 0 0.1,0 Z" fill="#f6dfc0"/>
    <path d="M 580,515 a 4 3 0 1 0 0.1,0 Z" fill="#f0d4b0"/>
  </g>

  <!-- 自行车与鹈鹕的影子 -->
  <ellipse cx="370" cy="578" rx="210" ry="16" fill="#7a5b2e" opacity="0.22" filter="url(#blur2)"/>

  <!-- ============ 自行车 ============ -->
  <g id="bicycle">
    <!-- 后轮 -->
    <circle cx="250" cy="500" r="65" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="250" cy="500" r="57" fill="none" stroke="#bfc9d0" stroke-width="2.5"/>
    <g stroke="#8b98a3" stroke-width="1">
      <line x1="250.0" y1="500.0" x2="306.6" y2="506.8"/>
      <line x1="250.0" y1="500.0" x2="299.7" y2="528.0"/>
      <line x1="250.0" y1="500.0" x2="285.2" y2="544.8"/>
      <line x1="250.0" y1="500.0" x2="265.4" y2="554.9"/>
      <line x1="250.0" y1="500.0" x2="243.2" y2="556.6"/>
      <line x1="250.0" y1="500.0" x2="222.0" y2="549.7"/>
      <line x1="250.0" y1="500.0" x2="205.2" y2="535.2"/>
      <line x1="250.0" y1="500.0" x2="195.1" y2="515.4"/>
      <line x1="250.0" y1="500.0" x2="193.4" y2="493.2"/>
      <line x1="250.0" y1="500.0" x2="200.3" y2="472.0"/>
      <line x1="250.0" y1="500.0" x2="214.8" y2="455.2"/>
      <line x1="250.0" y1="500.0" x2="234.6" y2="445.1"/>
      <line x1="250.0" y1="500.0" x2="256.8" y2="443.4"/>
      <line x1="250.0" y1="500.0" x2="278.0" y2="450.3"/>
      <line x1="250.0" y1="500.0" x2="294.8" y2="464.8"/>
      <line x1="250.0" y1="500.0" x2="304.9" y2="484.6"/>
    </g>
    <circle cx="250" cy="500" r="6" fill="#4a4a4a"/>
    <circle cx="250" cy="500" r="3" fill="#aab4bb"/>

    <!-- 前轮 -->
