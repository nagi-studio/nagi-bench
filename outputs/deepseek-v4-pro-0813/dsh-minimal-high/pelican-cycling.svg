    <g stroke="#8b98a3" stroke-width="1">
      <line x1="500.0" y1="500.0" x2="555.2" y2="514.1"/>
      <line x1="500.0" y1="500.0" x2="545.6" y2="534.2"/>
      <line x1="500.0" y1="500.0" x2="529.1" y2="549.0"/>
      <line x1="500.0" y1="500.0" x2="508.1" y2="556.4"/>
      <line x1="500.0" y1="500.0" x2="485.9" y2="555.2"/>
      <line x1="500.0" y1="500.0" x2="465.8" y2="545.6"/>
      <line x1="500.0" y1="500.0" x2="451.0" y2="529.1"/>
      <line x1="500.0" y1="500.0" x2="443.6" y2="508.1"/>
      <line x1="500.0" y1="500.0" x2="444.8" y2="485.9"/>
      <line x1="500.0" y1="500.0" x2="454.4" y2="465.8"/>
      <line x1="500.0" y1="500.0" x2="470.9" y2="451.0"/>
      <line x1="500.0" y1="500.0" x2="491.9" y2="443.6"/>
      <line x1="500.0" y1="500.0" x2="514.1" y2="444.8"/>
      <line x1="500.0" y1="500.0" x2="534.2" y2="454.4"/>
      <line x1="500.0" y1="500.0" x2="549.0" y2="470.9"/>
      <line x1="500.0" y1="500.0" x2="556.4" y2="491.9"/>
    </g>
    <circle cx="500" cy="500" r="6" fill="#4a4a4a"/>
    <circle cx="500" cy="500" r="3" fill="#aab4bb"/>

    <!-- 链条 -->
    <line x1="370" y1="501" x2="250" y2="493" stroke="#5a6b76" stroke-width="2.5"/>
    <line x1="370" y1="529" x2="250" y2="507" stroke="#5a6b76" stroke-width="2.5"/>
    <circle cx="370" cy="515" r="15" fill="none" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="370" cy="515" r="4" fill="#4a4a4a"/>

    <!-- 车架 -->
    <g stroke="#cf4638" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="250" y1="500" x2="370" y2="515"/>
      <line x1="370" y1="515" x2="350" y2="395"/>
      <line x1="370" y1="515" x2="475" y2="385"/>
      <line x1="350" y1="395" x2="475" y2="385"/>
      <line x1="250" y1="500" x2="350" y2="395"/>
      <line x1="475" y1="385" x2="500" y2="500"/>
    </g>
    <g stroke="#a83226" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
      <line x1="250" y1="500" x2="370" y2="515"/>
      <line x1="370" y1="515" x2="350" y2="395"/>
      <line x1="370" y1="515" x2="475" y2="385"/>
      <line x1="350" y1="395" x2="475" y2="385"/>
      <line x1="250" y1="500" x2="350" y2="395"/>
    </g>

    <!-- 座管与座垫 -->
    <line x1="350" y1="395" x2="343" y2="372" stroke="#8899a3" stroke-width="5" stroke-linecap="round"/>
    <path d="M 320,374 Q 343,366 368,374 Q 373,380 365,383 Q 340,388 318,381 Q 314,378 320,374 Z" fill="#2e2e2e"/>

    <!-- 龙头与把手 -->
    <line x1="475" y1="385" x2="480" y2="352" stroke="#8899a3" stroke-width="5" stroke-linecap="round"/>
    <path d="M 480,352 Q 458,346 443,360" fill="none" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="443" cy="361" r="5" fill="#2e2e2e"/>

    <!-- 脚踏曲柄与踏板 -->
    <line x1="370" y1="515" x2="370" y2="549" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
    <line x1="370" y1="515" x2="370" y2="481" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
    <rect x="356" y="546" width="28" height="8" rx="3" fill="#3a3a3a"/>
    <rect x="356" y="478" width="28" height="8" rx="3" fill="#3a3a3a"/>
