<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="A pelican riding a bicycle at the seaside">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f9fd6"/>
      <stop offset="0.55" stop-color="#8ecdec"/>
      <stop offset="1" stop-color="#ffedc2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c8"/>
      <stop offset="0.45" stop-color="#ffd666"/>
      <stop offset="1" stop-color="#ffb03a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="400" x2="0" y2="528" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e8fae"/>
      <stop offset="0.5" stop-color="#1a6f8f"/>
      <stop offset="1" stop-color="#0f5470"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="528" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7dd93"/>
      <stop offset="0.55" stop-color="#ecc576"/>
      <stop offset="1" stop-color="#d9a94f"/>
    </linearGradient>
    <radialGradient id="body" cx="0.45" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#f2eee4"/>
      <stop offset="1" stop-color="#d8d1c2"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#747474"/>
      <stop offset="0.55" stop-color="#4c4c4c"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#f07a24"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#f0a23a"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0525c"/>
      <stop offset="1" stop-color="#b72636"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6b3c"/>
      <stop offset="1" stop-color="#6f4626"/>
    </linearGradient>
    <linearGradient id="frond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e5f"/>
      <stop offset="1" stop-color="#1c6e3e"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="900" height="400" fill="url(#sky)"/>

  <!-- SUN -->
  <circle cx="700" cy="122" r="120" fill="url(#sunGlow)"/>
  <circle cx="700" cy="122" r="44" fill="#ffd666"/>
  <circle cx="700" cy="122" r="44" fill="url(#sunGlow)"/>

  <!-- CLOUDS -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="180" cy="90" rx="60" ry="22"/>
    <ellipse cx="235" cy="78" rx="48" ry="18"/>
    <ellipse cx="130" cy="82" rx="38" ry="15"/>
    <ellipse cx="560" cy="58" rx="52" ry="18"/>
    <ellipse cx="615" cy="50" rx="42" ry="15"/>
    <ellipse cx="515" cy="52" rx="34" ry="13"/>
  </g>

  <!-- SEAGULLS -->
  <g fill="none" stroke="#2b3a4a" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M 90 170 q 9 -12 18 0 q 9 -12 18 0"/>
    <path d="M 160 145 q 7 -9 14 0 q 7 -9 14 0"/>
    <path d="M 830 190 q 9 -12 18 0 q 9 -12 18 0"/>
  </g>

  <!-- OCEAN -->
  <rect x="0" y="400" width="900" height="128" fill="url(#ocean)"/>

  <!-- SUN REFLECTION ON WATER -->
  <g fill="#ffe9a8" opacity="0.6">
    <ellipse cx="700" cy="414" rx="70" ry="5"/>
    <ellipse cx="700" cy="430" rx="48" ry="4"/>
    <ellipse cx="700" cy="448" rx="30" ry="3"/>
    <ellipse cx="700" cy="466" rx="18" ry="2.5"/>
  </g>

  <!-- WAVES -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M 40 470 q 22 -10 44 0 t 44 0 t 44 0"/>
    <path d="M 560 488 q 22 -10 44 0 t 44 0 t 44 0 t 44 0"/>
    <path d="M 300 500 q 18 -8 36 0 t 36 0"/>
    <path d="M 60 512 q 20 -8 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
  </g>

  <!-- BEACH -->
  <rect x="0" y="528" width="900" height="72" fill="url(#sand)"/>
  <!-- wet sand edge -->
  <rect x="0" y="528" width="900" height="9" fill="#cfa855" opacity="0.7"/>

  <!-- PALM TREE -->
  <g>
    <path d="M 118 540 C 128 470, 138 370, 163 246" fill="none" stroke="url(#trunk)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 118 540 C 128 470, 138 370, 163 246" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" opacity="0.12" transform="translate(3,3)"/>
    <!-- trunk rings -->
    <g fill="none" stroke="#5c3a1e" stroke-width="1.6" opacity="0.55">
      <path d="M 122 500 q 5 3 8 0"/>
      <path d="M 128 448 q 5 3 8 0"/>
      <path d="M 134 398 q 5 3 8 0"/>
      <path d="M 140 348 q 5 3 8 0"/>
      <path d="M 148 300 q 5 3 8 0"/>
    </g>
    <!-- fronds -->
    <g fill="url(#frond)">
      <path d="M 163 246 C 140 210, 88 198, 40 216 C 88 228, 132 240, 163 246 Z"/>
      <path d="M 163 246 C 172 202, 160 158, 190 118 C 186 162, 172 210, 163 246 Z"/>
      <path d="M 163 246 C 198 226, 252 222, 296 238 C 252 244, 202 254, 163 246 Z"/>
      <path d="M 163 246 C 150 214, 116 188, 78 176 C 120 190, 148 218, 163 246 Z"/>
      <path d="M 163 246 C 176 212, 216 196, 252 196 C 220 208, 186 226, 163 246 Z"/>
      <path d="M 163 246 C 150 262, 126 282, 96 292 C 128 278, 150 262, 163 246 Z"/>
    </g>
    <!-- coconuts -->
    <circle cx="162" cy="252" r="8" fill="#7a4a21"/>
    <circle cx="174" cy="257" r="7.5" fill="#8a5830"/>
    <circle cx="168" cy="249" r="3" fill="#5c3a1e" opacity="0.5"/>
  </g>

  <!-- SHADOW UNDER BIKE -->
  <ellipse cx="500" cy="534" rx="280" ry="13" fill="#000000" opacity="0.14"/>

  <!-- ==================== BICYCLE ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- chain -->
    <g stroke="#4a4a4a" stroke-width="2" opacity="0.8">
      <line x1="350" y1="474" x2="470" y2="474"/>
      <line x1="350" y1="486" x2="470" y2="486"/>
    </g>

    <!-- frame tubes -->
    <g stroke="url(#frame)" stroke-width="9" fill="none">
      <path d="M 470 480 L 432 376"/>
      <path d="M 470 480 L 615 430"/>
      <path d="M 432 376 L 615 372"/>
      <path d="M 350 480 L 432 376"/>
      <path d="M 350 480 L 470 480"/>
      <path d="M 615 430 L 650 480"/>
    </g>
    <!-- head tube -->
    <line x1="612" y1="368" x2="618" y2="436" stroke="#8f1f2c" stroke-width="11" stroke-linecap="round"/>

    <!-- bottom bracket & chainring -->
    <circle cx="470" cy="480" r="17" fill="none" stroke="#3a3a3a" stroke-width="4"/>
    <circle cx="470" cy="480" r="6" fill="#3a3a3a"/>

    <!-- crank arms & pedals -->
    <line x1="470" y1="480" x2="470" y2="504" stroke="#3a3a3a" stroke-width="7"/>
    <line x1="470" y1="480" x2="480" y2="458" stroke="#3a3a3a" stroke-width="7"/>
    <rect x="456" y="502" width="30" height="7" rx="3" fill="#2b2b2b"/>
    <rect x="468" y="455" width="26" height="7" rx="3" fill="#2b2b2b"/>

    <!-- seat post & saddle -->
    <line x1="432" y1="376" x2="428" y2="366" stroke="#8f1f2c" stroke-width="6"/>
    <path d="M 402 368 q 12 -10 26 -6 q 14 3 20 12 l -4 4 q -6 -6 -16 -6 q -14 0 -22 8 z" fill="#2b2b2b"/>

    <!-- handlebar -->
    <path d="M 612 372 L 634 362 C 644 358, 652 356, 654 360" fill="none" stroke="#2b2b2b" stroke-width="7"/>
    <path d="M 646 354 L 658 362" stroke="#1f1f1f" stroke-width="11" stroke-linecap="round"/>

    <!-- REAR WHEEL -->
    <g>
      <circle cx="350" cy="480" r="48" fill="#1f1f1f"/>
      <circle cx="350" cy="480" r="44" fill="#2b2b2b"/>
      <circle cx="350" cy="480" r="40" fill="none" stroke="#cfd2d6" stroke-width="4"/>
      <g stroke="#a9adb3" stroke-width="1.6">
        <line x1="350" y1="440" x2="350" y2="520"/>
        <line x1="310" y1="480" x2="390" y2="480"/>
        <line x1="322" y1="452" x2="378" y2="508"/>
        <line x1="322" y1="508" x2="378" y2="452"/>
      </g>
      <circle cx="350" cy="480" r="6" fill="#6f7378"/>
    </g>

    <!-- FRONT WHEEL -->
    <g>
      <circle cx="650" cy="480" r="48" fill="#1f1f1f"/>
      <circle cx="650" cy="480" r="44" fill="#2b2b2b"/>
      <circle cx="650" cy="480" r="40" fill="none" stroke="#cfd2d6" stroke-width="4"/>
      <g stroke="#a9adb3" stroke-width="1.6">
        <line x1="650" y1="440" x2="650" y2="520"/>
        <line x1="610" y1="480" x2="690" y2="480"/>
        <line x1="622" y1="452" x2="678" y2="508"/>
        <line x1="622" y1="508" x2="678" y2="452"/>
      </g>
      <circle cx="650" cy="480" r="6" fill="#6f7378"/>
    </g>
  </g>

  <!-- ==================== PELICAN ==================== -->
  <g>
    <!-- far wing (hint behind body) -->
    <path d="M 455 300 C 485 305, 505 292, 512 276 C 500 288, 480 298, 455 300 Z" fill="#7a7a7a"/>

    <!-- tail feathers -->
    <g fill="#e4ded0">
      <path d="M 332 352 L 268 330 L 332 366 Z"/>
      <path d="M 334 340 L 278 312 L 338 352 Z"/>
      <path d="M 330 362 L 275 348 L 332 376 Z"/>
    </g>

    <!-- body -->
    <path d="M 330 352
             C 322 316, 354 276, 396 274
             C 432 272, 466 288, 476 322
             C 483 352, 462 386, 420 392
             C 384 398, 344 390, 330 352 Z"
          fill="url(#body)" stroke="#c9c2b4" stroke-width="1.5"/>

    <!-- breast highlight -->
    <path d="M 396 282 C 428 284, 456 300, 466 326 C 470 344, 464 366, 448 380 C 460 356, 458 312, 396 282 Z" fill="#ffffff" opacity="0.65"/>

    <!-- neck (S-curve) -->
    <path d="M 452 300 C 484 296, 504 278, 516 258" fill="none" stroke="#f6f2e8" stroke-width="30" stroke-linecap="round"/>
    <path d="M 452 300 C 484 296, 504 278, 516 258" fill="none" stroke="#d8d1c2" stroke-width="30" stroke-linecap="round" opacity="0.25" transform="translate(4,3)"/>

    <!-- head -->
    <circle cx="524" cy="248" r="21" fill="url(#body)" stroke="#c9c2b4" stroke-width="1.2"/>
    <!-- crest tuft -->
    <path d="M 506 240 C 496 230, 492 222, 494 214 C 500 224, 508 234, 518 238 Z" fill="#e4ded0"/>

    <!-- eye -->
    <circle cx="535" cy="240" r="4.2" fill="#1f1a14"/>
    <circle cx="536.5" cy="238.5" r="1.5" fill="#ffffff"/>
    <!-- eye ring -->
    <path d="M 530 234 C 536 232, 541 235, 541 241 C 541 246, 535 248, 531 246 Z" fill="#f0c68a" opacity="0.85"/>

    <!-- POUCH (lower mandible) -->
    <path d="M 543 253
             C 552 300, 620 320, 676 302
             C 696 294, 702 272, 700 244
             L 543 253 Z"
          fill="url(#pouch)" stroke="#d98a2b" stroke-width="1.5"/>

    <!-- UPPER BILL -->
    <path d="M 542 240
             C 580 234, 640 230, 700 230
             Q 708 232 706 238
             L 704 242
             C 660 246, 590 250, 545 254
             C 541 250, 540 244, 542 240 Z"
          fill="url(#bill)" stroke="#d9771f" stroke-width="1.5"/>
    <!-- bill tip hook -->
    <path d="M 700 230 Q 710 232 706 240 Q 704 236 700 233 Z" fill="#d96a1c"/>
    <!-- bill ridge line -->
    <path d="M 542 240 C 590 238, 650 234, 700 233" fill="none" stroke="#d9771f" stroke-width="1.2" opacity="0.6"/>

    <!-- near wing reaching handlebar -->
    <path d="M 450 310
             C 500 316, 570 332, 626 346
             C 650 352, 660 360, 652 365
             C 644 370, 628 366, 612 360
             C 556 342, 492 330, 452 326 Z"
          fill="url(#wing)" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- wing feather detail -->
    <g stroke="#242424" stroke-width="1.4" opacity="0.55">
      <path d="M 468 322 C 510 330, 560 342, 600 352"/>
      <path d="M 462 330 C 500 338, 548 348, 590 356"/>
      <path d="M 458 339 C 492 346, 536 354, 574 360"/>
    </g>
    <!-- wing tip grip on handlebar -->
    <path d="M 648 358 C 658 360, 662 366, 656 370 C 650 373, 642 369, 644 363 Z" fill="#2a2a2a"/>

    <!-- leg (near) -->
    <path d="M 405 384 L 448 436 L 464 486" fill="none" stroke="#e07a3f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- leg shading -->
    <path d="M 405 384 L 448 436 L 464 486" fill="none" stroke="#b85c2a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- webbed foot on pedal -->
    <path d="M 462 492 L 478 496 L 486 504 L 474 510 L 460 502 Z" fill="#e07a3f" stroke="#b85c2a" stroke-width="1.5"/>

    <!-- far leg hint -->
    <path d="M 418 386 L 452 440" fill="none" stroke="#b85c2a" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- BEACH DETAILS -->
  <g>
    <!-- shell -->
    <g transform="translate(710,556)">
      <path d="M -12 4 C -12 -6, 0 -12, 12 -6 C 6 0, 0 2, -12 4 Z" fill="#f5e9d6" stroke="#c9b58f" stroke-width="1.5"/>
      <path d="M -12 4 C -4 2, 4 2, 12 -6" fill="none" stroke="#c9b58f" stroke-width="1.2"/>
    </g>
    <!-- starfish -->
    <g transform="translate(560,568)">
      <path d="M 0 -12 L 4 -3 L 12 -2 L 6 4 L 8 12 L 0 7 L -8 12 L -6 4 L -12 -2 L -4 -3 Z" fill="#e8846b" stroke="#c15b44" stroke-width="1.2"/>
    </g>
    <!-- pebbles -->
    <circle cx="300" cy="566" r="4" fill="#c9a35f" opacity="0.7"/>
    <circle cx="312" cy="572" r="3" fill="#b78f52" opacity="0.7"/>
    <circle cx="820" cy="572" r="3.5" fill="#c9a35f" opacity="0.7"/>
    <circle cx="450" cy="576" r="3" fill="#b78f52" opacity="0.7"/>
    <!-- scattered sand dots -->
    <g fill="#a8843f" opacity="0.35">
      <circle cx="240" cy="552" r="1.5"/>
      <circle cx="660" cy="552" r="1.5"/>
      <circle cx="380" cy="562" r="1.5"/>
      <circle cx="520" cy="582" r="1.5"/>
      <circle cx="180" cy="578" r="1.5"/>
      <circle cx="740" cy="584" r="1.5"/>
    </g>
  </g>
</svg>
