<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A pelican riding a bicycle along the seaside">
  <defs>
    <!-- Sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4AA7F0"/>
      <stop offset="0.5" stop-color="#83C9F7"/>
      <stop offset="1" stop-color="#FFE4A6"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8D6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFE98A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD25E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF3B0"/>
      <stop offset="1" stop-color="#FFD95E"/>
    </radialGradient>
    <!-- Sea -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BD6"/>
      <stop offset="0.5" stop-color="#45B5E6"/>
      <stop offset="1" stop-color="#8FE0F2"/>
    </linearGradient>
    <!-- Sand -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E2A6"/>
      <stop offset="1" stop-color="#EBCB85"/>
    </linearGradient>
    <!-- Boardwalk -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8C39A"/>
      <stop offset="1" stop-color="#C0A778"/>
    </linearGradient>
    <!-- Pelican body -->
    <radialGradient id="body" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F4EEE2"/>
      <stop offset="1" stop-color="#D5C9B2"/>
    </radialGradient>
    <!-- Wing -->
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE9DB"/>
      <stop offset="0.6" stop-color="#CFC5AE"/>
      <stop offset="1" stop-color="#A89C82"/>
    </linearGradient>
    <!-- Beak -->
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD05A"/>
      <stop offset="0.55" stop-color="#FFB63C"/>
      <stop offset="1" stop-color="#EE8E28"/>
    </linearGradient>
    <!-- Pouch -->
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F79D40"/>
      <stop offset="1" stop-color="#D2601F"/>
    </linearGradient>
    <!-- Leg -->
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFAE4B"/>
      <stop offset="1" stop-color="#E97824"/>
    </linearGradient>
    <!-- Wheel -->
    <g id="spokes">
      <g stroke="#9AA1A8" stroke-width="1.5" opacity="0.9">
        <line x1="0" y1="0" x2="0" y2="-52"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(30)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(60)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(150)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(210)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(300)"/>
        <line x1="0" y1="0" x2="0" y2="-52" transform="rotate(330)"/>
      </g>
    </g>
    <g id="wheel">
      <circle r="68" fill="#2B2F34"/>
      <circle r="62" fill="none" stroke="#454B52" stroke-width="2"/>
      <circle r="55" fill="#E7EAED" stroke="#AEB4BA" stroke-width="2.5"/>
      <use href="#spokes"/>
      <circle r="10" fill="#7E868D" stroke="#5A626A" stroke-width="1.5"/>
      <circle r="4" fill="#33383C"/>
    </g>
  </defs>

  <!-- ============ SKY ============ -->
  <rect x="0" y="0" width="1200" height="380" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="230" cy="140" r="170" fill="url(#sunGlow)"/>
  <circle cx="230" cy="140" r="58" fill="url(#sunCore)"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <g>
      <ellipse cx="520" cy="110" rx="80" ry="26" opacity="0.85"/>
      <ellipse cx="570" cy="96" rx="60" ry="22" opacity="0.85"/>
      <ellipse cx="460" cy="100" rx="52" ry="20" opacity="0.85"/>
    </g>
    <g>
      <ellipse cx="900" cy="150" rx="70" ry="22" opacity="0.8"/>
      <ellipse cx="960" cy="136" rx="52" ry="18" opacity="0.8"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="700" cy="80" rx="46" ry="14"/>
      <ellipse cx="740" cy="70" rx="34" ry="12"/>
    </g>
  </g>

  <!-- Seagulls -->
  <g fill="none" stroke="#5A6470" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 330 190 q 11 -13 22 0 q 11 -13 22 0"/>
    <path d="M 620 230 q 9 -11 18 0 q 9 -11 18 0" stroke-width="3"/>
    <path d="M 430 150 q 8 -10 16 0 q 8 -10 16 0" stroke-width="2.6" opacity="0.8"/>
  </g>

  <!-- ============ SEA ============ -->
  <rect x="0" y="380" width="1200" height="140" fill="url(#sea)"/>

  <!-- Sun sparkle on water -->
  <g fill="#FFF6C8" opacity="0.55">
    <ellipse cx="230" cy="400" rx="90" ry="7"/>
    <ellipse cx="230" cy="425" rx="55" ry="5" opacity="0.8"/>
    <ellipse cx="230" cy="452" rx="70" ry="6" opacity="0.6"/>
    <ellipse cx="230" cy="480" rx="40" ry="4" opacity="0.5"/>
  </g>

  <!-- Waves -->
  <g fill="none" stroke="#DDF4FB" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 420 430 q 18 -8 36 0 q 18 8 36 0"/>
    <path d="M 700 470 q 16 -7 32 0 q 16 7 32 0"/>
    <path d="M 150 490 q 18 -8 36 0 q 18 8 36 0"/>
    <path d="M 860 420 q 18 -8 36 0 q 18 8 36 0"/>
    <path d="M 1000 490 q 16 -7 32 0 q 16 7 32 0"/>
  </g>

  <!-- Distant island -->
  <path d="M 1040 380 q 40 -46 96 -34 q -16 50 -58 52 Z" fill="#5B8FAF" opacity="0.6"/>

  <!-- Lighthouse on distant point -->
  <g>
    <path d="M 120 380 q 30 -26 74 -16 l 0 16 Z" fill="#7A6A4F"/>
    <rect x="140" y="322" width="18" height="58" fill="#F2EDE2"/>
    <rect x="140" y="322" width="18" height="16" fill="#D94B43"/>
    <rect x="140" y="354" width="18" height="16" fill="#D94B43"/>
    <path d="M 136 322 L 149 306 L 162 322 Z" fill="#2E3236"/>
    <circle cx="149" cy="312" r="3" fill="#FFE98A"/>
  </g>

  <!-- ============ BEACH ============ -->
  <rect x="0" y="520" width="1200" height="200" fill="url(#sand)"/>

  <!-- Foam at waterline -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M 0 520 q 40 12 80 4 q 40 -8 80 2 q 40 10 80 4 q 40 -6 80 0 q 40 6 80 0 q 40 -6 80 0 q 40 6 80 0 q 40 -6 80 0 q 40 6 80 -2 q 40 -8 80 0 q 40 8 80 -2 q 40 -10 80 0 q 40 10 80 -2 q 40 -12 80 -4 l 0 10 q -40 10 -80 4 q -40 -6 -80 0 q -40 6 -80 2 q -40 -4 -80 2 q -40 6 -80 -2 q -40 -8 -80 -2 q -40 6 -80 0 q -40 -6 -80 0 q -40 6 -80 0 q -40 -6 -80 0 q -40 6 -80 -2 q -40 -8 -80 -2 q -40 6 -80 -2 q -40 -8 -80 -4 Z"/>
  </g>

  <!-- Wet sand edge -->
  <path d="M 0 520 L 1200 520" stroke="#C9A964" stroke-width="2" opacity="0.4"/>

  <!-- Beach details -->
  <g>
    <ellipse cx="300" cy="620" rx="34" ry="8" fill="#D9B56A" opacity="0.5"/>
    <ellipse cx="980" cy="600" rx="28" ry="6" fill="#D9B56A" opacity="0.5"/>
    <path d="M 560 640 q 4 -8 12 -4 q 4 6 -2 10 q -8 2 -10 -6 Z" fill="#F4E3B6" stroke="#D3B169" stroke-width="1"/>
    <path d="M 890 660 q 3 -7 11 -3 q 3 6 -2 9 q -7 2 -9 -6 Z" fill="#F4E3B6" stroke="#D3B169" stroke-width="1"/>
  </g>
  <!-- Footprints -->
  <g fill="#D9B56A" opacity="0.55">
    <ellipse cx="160" cy="640" rx="7" ry="4"/>
    <ellipse cx="185" cy="652" rx="7" ry="4"/>
    <ellipse cx="210" cy="662" rx="7" ry="4"/>
    <ellipse cx="235" cy="670" rx="7" ry="4"/>
  </g>

  <!-- Grass tufts -->
  <g stroke="#7FA65A" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 70 690 q -4 -16 0 -26 M 76 690 q 2 -18 6 -30 M 84 690 q 8 -14 12 -22"/>
    <path d="M 1120 700 q -4 -16 0 -26 M 1126 700 q 2 -18 6 -30 M 1134 700 q 8 -14 12 -22"/>
  </g>

  <!-- ============ BOARDWALK ============ -->
  <rect x="0" y="720" width="1200" height="80" fill="url(#wood)"/>
  <path d="M 0 720 L 1200 720" stroke="#A98D5E" stroke-width="3"/>
  <g stroke="#B69B6B" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="744" x2="1200" y2="744"/>
    <line x1="0" y1="768" x2="1200" y2="768"/>
    <line x1="0" y1="792" x2="1200" y2="792"/>
  </g>
  <g stroke="#B69B6B" stroke-width="1.5" opacity="0.5">
    <line x1="180" y1="720" x2="170" y2="800"/>
    <line x1="420" y1="720" x2="424" y2="800"/>
    <line x1="680" y1="720" x2="676" y2="800"/>
    <line x1="940" y1="720" x2="944" y2="800"/>
    <line x1="1120" y1="720" x2="1116" y2="800"/>
  </g>

  <!-- Ground shadows -->
  <ellipse cx="830" cy="722" rx="320" ry="18" fill="#6B583A" opacity="0.28"/>

  <!-- ============ BICYCLE ============ -->
  <!-- Rear wheel -->
  <use href="#wheel" x="650" y="652"/>
  <!-- Front wheel -->
  <use href="#wheel" x="1005" y="652"/>

  <!-- Frame tubes -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#A83830" stroke-width="14">
      <line x1="815" y1="652" x2="955" y2="463"/>
      <line x1="815" y1="652" x2="768" y2="476"/>
      <line x1="768" y1="476" x2="955" y2="463"/>
      <line x1="815" y1="652" x2="650" y2="652"/>
      <line x1="650" y1="652" x2="768" y2="476"/>
    </g>
    <g stroke="#E2564D" stroke-width="9">
      <line x1="815" y1="652" x2="955" y2="463"/>
      <line x1="815" y1="652" x2="768" y2="476"/>
      <line x1="768" y1="476" x2="955" y2="463"/>
      <line x1="815" y1="652" x2="650" y2="652"/>
      <line x1="650" y1="652" x2="768" y2="476"/>
    </g>
  </g>

  <!-- Head tube + fork -->
  <g stroke-linecap="round" fill="none">
    <line x1="953" y1="462" x2="963" y2="505" stroke="#7A2B26" stroke-width="13"/>
    <line x1="953" y1="462" x2="963" y2="505" stroke="#E2564D" stroke-width="8"/>
    <path d="M 958 505 L 1005 652 M 968 505 L 1005 652" stroke="#A83830" stroke-width="11"/>
    <path d="M 958 505 L 1005 652 M 968 505 L 1005 652" stroke="#E2564D" stroke-width="7"/>
  </g>

  <!-- Seat post -->
  <line x1="768" y1="476" x2="760" y2="470" stroke="#7A2B26" stroke-width="10" stroke-linecap="round"/>

  <!-- Chainring + crank + pedals -->
  <circle cx="815" cy="652" r="22" fill="#9AA2A8" stroke="#5A626A" stroke-width="2"/>
  <circle cx="815" cy="652" r="14" fill="#C4CBD1"/>
  <circle cx="815" cy="652" r="5" fill="#5A626A"/>
  <g stroke="#3A3F45" stroke-width="5" stroke-linecap="round">
    <line x1="815" y1="652" x2="862" y2="652"/>
    <line x1="815" y1="652" x2="768" y2="652"/>
  </g>
  <!-- Pedals -->
  <g>
    <rect x="850" y="644" width="24" height="9" rx="3" fill="#3A3F45"/>
    <rect x="850" y="644" width="24" height="3" rx="1.5" fill="#6A7279"/>
    <rect x="756" y="644" width="24" height="9" rx="3" fill="#3A3F45"/>
  </g>

  <!-- Chain -->
  <g stroke="#4A5157" stroke-width="3">
    <line x1="815" y1="632" x2="650" y2="643"/>
    <line x1="815" y1="672" x2="650" y2="661"/>
  </g>

  <!-- Handlebar -->
  <g stroke-linecap="round" fill="none">
    <path d="M 953 462 L 940 428 L 902 422" stroke="#7A2B26" stroke-width="11"/>
    <path d="M 953 462 L 940 428 L 902 422" stroke="#E2564D" stroke-width="7"/>
  </g>
  <rect x="886" y="416" width="26" height="11" rx="5.5" fill="#2E3236"/>
  <rect x="938" y="424" width="18" height="9" rx="4.5" fill="#2E3236"/>

  <!-- ============ PELICAN ============ -->
  <!-- Tail feathers (behind body) -->
  <g fill="url(#body)" stroke="#CFC3AC" stroke-width="1">
    <path d="M 618 402 L 556 434 L 600 428 Z"/>
    <path d="M 618 416 L 550 454 L 606 444 Z"/>
    <path d="M 618 430 L 556 474 L 610 462 Z"/>
  </g>
  <g fill="#8F8676">
    <path d="M 566 438 L 556 434 L 600 428 Z" opacity="0.7"/>
    <path d="M 560 458 L 550 454 L 606 444 Z" opacity="0.7"/>
    <path d="M 566 478 L 556 474 L 610 462 Z" opacity="0.7"/>
  </g>

  <!-- Body -->
  <ellipse cx="705" cy="398" rx="100" ry="74" transform="rotate(-8 705 398)" fill="url(#body)" stroke="#CFC3AC" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M 778 352
           C 796 318 826 296 858 292
           L 896 292
           C 906 306 906 330 884 352
           C 860 376 824 400 786 416
           C 772 406 768 380 778 352 Z"
        fill="url(#body)" stroke="#CFC3AC" stroke-width="1.2"/>

  <!-- Head -->
  <ellipse cx="882" cy="300" rx="42" ry="36" fill="url(#body)" stroke="#CFC3AC" stroke-width="1.2"/>

  <!-- Head crest feathers -->
  <g fill="#EFE9DB" stroke="#CFC3AC" stroke-width="0.8">
    <path d="M 846 280 q -12 -10 -2 -16 q 10 2 6 14 Z"/>
    <path d="M 856 272 q -8 -12 2 -18 q 10 4 4 16 Z"/>
  </g>

  <!-- Eye ring + eye -->
  <circle cx="893" cy="290" r="9" fill="#F4D58D"/>
  <circle cx="893" cy="290" r="5.5" fill="#1C2733"/>
  <circle cx="891" cy="288" r="1.8" fill="#FFFFFF"/>

  <!-- Upper beak -->
  <path d="M 914 284
           C 984 292 1032 314 1068 340
           L 1070 344
           C 1038 348 990 340 918 326
           Z" fill="url(#beak)" stroke="#D98A22" stroke-width="1.2"/>
  <!-- Beak ridge line -->
  <path d="M 918 294 C 984 302 1030 320 1066 342" fill="none" stroke="#E8A02E" stroke-width="1.5" opacity="0.7"/>

  <!-- Fish inside pouch (drawn behind translucent pouch) -->
  <g>
    <ellipse cx="958" cy="380" rx="22" ry="10" fill="#6FA8C9" stroke="#4A7B96" stroke-width="1.5" transform="rotate(-8 958 380)"/>
    <path d="M 976 372 L 994 364 L 992 384 Z" fill="#5B8FAC"/>
    <path d="M 948 370 q 3 -4 8 -1" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.6"/>
    <circle cx="942" cy="377" r="2.2" fill="#1C2733"/>
  </g>

  <!-- Gular pouch -->
  <path d="M 916 326
           C 966 332 1012 340 1062 342
           L 1070 345
           L 1058 352
           C 1012 384 956 406 906 403
           C 892 401 888 370 898 350
           Z" fill="url(#pouch)" opacity="0.86" stroke="#C2571C" stroke-width="1.2"/>

  <!-- Folded wing -->
  <path d="M 766 356
           C 726 342 672 352 640 390
           C 624 404 617 424 612 446
           L 624 452 L 642 462 L 658 456 L 676 468 L 694 460 L 714 470
           C 748 462 776 436 786 404
           C 789 386 783 366 766 356 Z"
        fill="url(#wing)" stroke="#B3A78F" stroke-width="1.4"/>
  <!-- Primary feather tips -->
  <g fill="#45423A">
    <path d="M 612 446 L 624 452 L 616 454 Z"/>
    <path d="M 642 462 L 658 456 L 650 464 Z"/>
    <path d="M 676 468 L 694 460 L 686 472 Z"/>
  </g>
  <!-- Wing coverts -->
  <path d="M 748 360 C 714 356 682 372 660 398 C 706 388 744 372 766 358 Z" fill="#F6F1E4" opacity="0.6"/>

  <!-- Saddle (visible under belly) -->
  <path d="M 738 476 Q 762 466 802 472 Q 808 484 800 488 L 742 486 Z" fill="#4A3B32" stroke="#2E241D" stroke-width="1.2"/>

  <!-- Back leg -->
  <path d="M 704 462
           C 714 500 736 535 770 565
           C 786 578 796 605 806 632
           L 812 640"
        fill="none" stroke="#D97A20" stroke-width="11" stroke-linecap="round"/>

  <!-- Front leg -->
  <path d="M 760 460
           C 772 498 792 540 818 575
           C 832 596 846 620 858 636"
        fill="none" stroke="url(#leg)" stroke-width="12" stroke-linecap="round"/>

  <!-- Back foot -->
  <path d="M 800 638 C 810 642 818 644 824 640 C 820 650 810 654 798 650 C 792 646 792 640 800 638 Z" fill="#D97A20"/>
  <g stroke="#C26518" stroke-width="1.5">
    <line x1="802" y1="642" x2="822" y2="642"/>
    <line x1="800" y1="648" x2="820" y2="646"/>
  </g>

  <!-- Front webbed foot -->
  <path d="M 848 632
           C 860 638 872 642 880 638
           C 876 648 864 654 850 650
           C 842 646 840 638 848 632 Z"
        fill="url(#leg)" stroke="#E97824" stroke-width="1.2"/>
  <g stroke="#D96A1C" stroke-width="1.6" stroke-linecap="round">
    <line x1="850" y1="637" x2="878" y2="638"/>
    <line x1="849" y1="644" x2="876" y2="643"/>
    <line x1="850" y1="650" x2="870" y2="647"/>
  </g>

  <!-- ============ MOTION / WIND ============ -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.5">
    <line x1="420" y1="420" x2="500" y2="420" stroke-width="4"/>
    <line x1="400" y1="460" x2="490" y2="460" stroke-width="3"/>
    <line x1="430" y1="510" x2="500" y2="510" stroke-width="3"/>
    <line x1="460" y1="550" x2="520" y2="550" stroke-width="3"/>
  </g>
  <!-- Sand kick behind rear wheel -->
  <g fill="#E8CE8C" opacity="0.55">
    <circle cx="590" cy="705" r="6"/>
    <circle cx="572" cy="714" r="5"/>
    <circle cx="556" cy="708" r="4"/>
    <circle cx="585" cy="692" r="4"/>
    <circle cx="600" cy="716" r="4"/>
  </g>
</svg>
