<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e86c9"/>
      <stop offset="0.45" stop-color="#6fc3ec"/>
      <stop offset="0.75" stop-color="#b8e6f7"/>
      <stop offset="1" stop-color="#fdeec6"/>
    </linearGradient>
    <!-- Sun -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c8"/>
      <stop offset="0.4" stop-color="#ffe98a"/>
      <stop offset="0.75" stop-color="#ffd45c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd45c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#ffd84d"/>
    </radialGradient>
    <!-- Ocean -->
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fce"/>
      <stop offset="0.55" stop-color="#2fa8e0"/>
      <stop offset="1" stop-color="#7fd4ea"/>
    </linearGradient>
    <!-- Sand -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d8a0"/>
      <stop offset="0.4" stop-color="#ecc983"/>
      <stop offset="1" stop-color="#dfb66c"/>
    </linearGradient>
    <linearGradient id="wetsand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa96a"/>
      <stop offset="1" stop-color="#e6c98d"/>
    </linearGradient>
    <!-- Cloud -->
    <radialGradient id="cloud" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Pelican body -->
    <radialGradient id="bodyGrad" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#d8dee2"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3a8"/>
      <stop offset="0.5" stop-color="#6f7a80"/>
      <stop offset="1" stop-color="#4a5459"/>
    </linearGradient>
    <linearGradient id="wingTipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4449"/>
      <stop offset="1" stop-color="#232b2f"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.6" stop-color="#ff9f1a"/>
      <stop offset="1" stop-color="#f28500"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb95e"/>
      <stop offset="1" stop-color="#e8922a"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffab3d"/>
      <stop offset="1" stop-color="#f07c1c"/>
    </linearGradient>
    <!-- Bike frame -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7d66"/>
      <stop offset="1" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="0" y="0" width="1200" height="480" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="930" cy="150" r="150" fill="url(#sunGlow)"/>
  <circle cx="930" cy="150" r="58" fill="url(#sunCore)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <ellipse cx="230" cy="140" rx="70" ry="26"/>
      <ellipse cx="300" cy="128" rx="52" ry="32"/>
      <ellipse cx="175" cy="132" rx="45" ry="22"/>
      <ellipse cx="250" cy="152" rx="80" ry="20"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="560" cy="190" rx="60" ry="22"/>
      <ellipse cx="620" cy="180" rx="42" ry="26"/>
      <ellipse cx="515" cy="184" rx="38" ry="18"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="820" cy="240" rx="55" ry="18"/>
      <ellipse cx="870" cy="232" rx="36" ry="22"/>
      <ellipse cx="780" cy="235" rx="32" ry="15"/>
    </g>
    <g opacity="0.6">
      <ellipse cx="120" cy="230" rx="48" ry="16"/>
      <ellipse cx="165" cy="224" rx="30" ry="18"/>
    </g>
  </g>

  <!-- Seagulls -->
  <g stroke="#4a5a63" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 330 170 q 14 -14 28 0 q 14 -14 28 0"/>
    <path d="M 470 130 q 11 -11 22 0 q 11 -11 22 0"/>
    <path d="M 700 170 q 10 -10 20 0 q 10 -10 20 0"/>
  </g>

  <!-- ================= OCEAN ================= -->
  <rect x="0" y="480" width="1200" height="140" fill="url(#ocean)"/>

  <!-- Distant sun reflection on water -->
  <g opacity="0.5" fill="#ffedb0">
    <rect x="900" y="482" width="70" height="4" rx="2"/>
    <rect x="915" y="490" width="42" height="4" rx="2"/>
    <rect x="920" y="498" width="30" height="4" rx="2"/>
    <rect x="925" y="506" width="22" height="4" rx="2"/>
  </g>

  <!-- Waves / foam lines -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 40 500 q 30 8 60 0 q 30 -8 60 0" stroke-width="4" opacity="0.7"/>
    <path d="M 300 520 q 34 9 68 0 q 34 -9 68 0" stroke-width="4" opacity="0.55"/>
    <path d="M 120 540 q 40 10 80 0 q 40 -10 80 0" stroke-width="5" opacity="0.65"/>
    <path d="M 700 496 q 28 7 56 0 q 28 -7 56 0" stroke-width="4" opacity="0.6"/>
    <path d="M 820 545 q 44 11 88 0 q 44 -11 88 0" stroke-width="5" opacity="0.6"/>
    <path d="M 480 560 q 36 9 72 0 q 36 -9 72 0" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Foam edge where water meets sand -->
  <path d="M 0 620 q 30 -10 60 0 q 30 10 60 0 q 30 -10 60 0 q 30 10 60 0
           q 30 -10 60 0 q 30 10 60 0 q 30 -10 60 0 q 30 10 60 0
           q 30 -10 60 0 q 30 10 60 0 q 30 -10 60 0 q 30 10 60 0
           q 30 -10 60 0 q 30 10 60 0 q 30 -10 60 0 q 30 10 60 0
           q 30 -10 60 0 q 30 10 60 0 q 30 -10 60 0"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- ================= BEACH ================= -->
  <rect x="0" y="620" width="1200" height="180" fill="url(#sand)"/>
  <rect x="0" y="620" width="1200" height="26" fill="url(#wetsand)"/>

  <!-- Lighthouse (right, far) -->
  <g>
    <path d="M 1085 480 L 1100 400 L 1125 400 L 1135 480 Z" fill="#f6f2ea"/>
    <path d="M 1088 480 L 1090 396 L 1100 396 L 1100 480 Z" fill="#e74c3c"/>
    <path d="M 1115 480 L 1115 398 L 1122 398 L 1122 480 Z" fill="#e74c3c"/>
    <rect x="1096" y="382" width="22" height="18" rx="2" fill="#3b4449"/>
    <rect x="1102" y="376" width="10" height="8" fill="#ffe98a"/>
    <circle cx="1107" cy="380" r="5" fill="#fff3b0"/>
    <path d="M 1098 400 L 1098 480 L 1118 480 L 1118 400" fill="none" stroke="#c9c2b4" stroke-width="2"/>
  </g>

  <!-- Palm tree (left) -->
  <g>
    <path d="M 150 700 C 135 640 130 560 160 470 C 168 430 175 415 180 405"
          fill="none" stroke="#a9713d" stroke-width="20" stroke-linecap="round"/>
    <path d="M 150 700 C 135 640 130 560 160 470 C 168 430 175 415 180 405"
          fill="none" stroke="#8a5830" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <g fill="#3f9e5a">
      <path d="M 180 405 C 150 350 110 350 70 380 C 110 380 145 385 180 405 Z"/>
      <path d="M 180 405 C 210 350 260 340 310 365 C 265 375 225 390 180 405 Z"/>
      <path d="M 180 405 C 175 345 200 310 240 285 C 220 320 200 360 180 405 Z"/>
      <path d="M 180 405 C 130 380 100 370 60 385 C 105 380 140 395 180 405 Z"/>
      <path d="M 180 405 C 230 385 270 380 305 400 C 260 395 220 400 180 405 Z"/>
      <path d="M 180 405 C 150 440 130 460 105 480 C 130 445 155 425 180 405 Z"/>
    </g>
    <circle cx="180" cy="405" r="9" fill="#7a4b26"/>
    <circle cx="168" cy="400" r="5" fill="#8a5a30"/>
    <circle cx="190" cy="410" r="5" fill="#8a5a30"/>
  </g>

  <!-- Seashells and starfish -->
  <g>
    <path d="M 330 760 q 12 -18 24 0 q -12 18 -24 0 Z" fill="#f7e7c8" stroke="#d8b98c" stroke-width="2"/>
    <path d="M 342 760 L 342 772 M 336 764 L 348 764" stroke="#d8b98c" stroke-width="1.5"/>
    <path d="M 880 740 l 8 -16 8 16 -8 8 Z" fill="#f08a5d"/>
    <path d="M 960 766 q 10 -14 20 0 q -10 14 -20 0 Z" fill="#e9d3b0" stroke="#cba678" stroke-width="2"/>
  </g>

  <!-- Footprints -->
  <g fill="#cfa66a" opacity="0.5">
    <ellipse cx="240" cy="730" rx="8" ry="13" transform="rotate(18 240 730)"/>
    <ellipse cx="265" cy="742" rx="8" ry="13" transform="rotate(12 265 742)"/>
    <ellipse cx="290" cy="752" rx="8" ry="13" transform="rotate(20 290 752)"/>
  </g>

  <!-- ================= BICYCLE SHADOW ================= -->
  <ellipse cx="640" cy="696" rx="240" ry="16" fill="#000000" opacity="0.18"/>

  <!-- ================= BICYCLE ================= -->
  <!-- Rear wheel -->
  <g>
    <circle cx="520" cy="620" r="70" fill="none" stroke="#2b2f33" stroke-width="13"/>
    <circle cx="520" cy="620" r="63" fill="none" stroke="#d7dde0" stroke-width="2.5"/>
    <circle cx="520" cy="620" r="8" fill="#5a6268"/>
    <g stroke="#8b949a" stroke-width="2" opacity="0.8">
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(0 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(45 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(90 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(135 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(180 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(225 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(270 520 620)"/>
      <line x1="520" y1="620" x2="520" y2="557" transform="rotate(315 520 620)"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="760" cy="620" r="70" fill="none" stroke="#2b2f33" stroke-width="13"/>
    <circle cx="760" cy="620" r="63" fill="none" stroke="#d7dde0" stroke-width="2.5"/>
    <circle cx="760" cy="620" r="8" fill="#5a6268"/>
    <g stroke="#8b949a" stroke-width="2" opacity="0.8">
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(0 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(45 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(90 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(135 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(180 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(225 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(270 760 620)"/>
      <line x1="760" y1="620" x2="760" y2="557" transform="rotate(315 760 620)"/>
    </g>
  </g>

  <!-- Chain -->
  <g stroke="#3b4449" stroke-width="3" fill="none">
    <path d="M 520 620 L 622 612"/>
    <path d="M 520 620 L 622 632"/>
  </g>

  <!-- Crank / chainring -->
  <circle cx="622" cy="622" r="22" fill="none" stroke="#3b4449" stroke-width="5"/>
  <circle cx="622" cy="622" r="6" fill="#3b4449"/>

  <!-- Pedals -->
  <g>
    <line x1="622" y1="622" x2="600" y2="600" stroke="#3b4449" stroke-width="6" stroke-linecap="round"/>
    <rect x="586" y="594" width="28" height="9" rx="4" fill="#2b2f33" transform="rotate(35 600 598)"/>
    <line x1="622" y1="622" x2="644" y2="644" stroke="#3b4449" stroke-width="6" stroke-linecap="round"/>
    <rect x="630" y="638" width="28" height="9" rx="4" fill="#2b2f33" transform="rotate(35 644 642)"/>
  </g>

  <!-- Frame -->
  <g stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 622 622 L 588 492"/>   <!-- seat tube -->
    <path d="M 622 622 L 736 500"/>   <!-- down tube -->
    <path d="M 588 492 L 736 500"/>   <!-- top tube -->
    <path d="M 588 492 L 520 620"/>   <!-- seat stay -->
    <path d="M 622 622 L 520 620"/>   <!-- chain stay -->
    <path d="M 736 500 L 752 532"/>   <!-- fork -->
    <path d="M 752 532 L 760 620"/>   <!-- fork lower -->
    <path d="M 736 500 L 744 484"/>   <!-- head tube -->
  </g>

  <!-- Seat post + saddle -->
  <line x1="588" y1="492" x2="576" y2="468" stroke="#3b4449" stroke-width="7" stroke-linecap="round"/>
  <path d="M 540 464 q 36 -10 70 0 q 4 10 -30 14 q -34 4 -40 -14 Z" fill="#2b2f33"/>

  <!-- Handlebar -->
  <line x1="744" y1="484" x2="738" y2="458" stroke="#3b4449" stroke-width="7" stroke-linecap="round"/>
  <path d="M 706 454 q 40 -14 66 6 q 2 8 -16 12 q -38 8 -50 -18 Z" fill="#2b2f33"/>

  <!-- Basket with fish -->
  <g>
    <path d="M 760 500 L 818 512 L 800 548 L 748 536 Z" fill="#b0783c" opacity="0.95"/>
    <path d="M 760 500 L 818 512" stroke="#8a5a2e" stroke-width="4"/>
    <path d="M 766 510 L 794 518 M 770 524 L 796 530 M 774 536 L 796 541" stroke="#8a5a2e" stroke-width="2.5"/>
    <path d="M 790 514 q 14 -6 26 2 q -10 10 -24 4 Z" fill="#7fb8d8"/>
    <circle cx="812" cy="514" r="2.5" fill="#1f2a30"/>
    <path d="M 790 522 q 8 6 16 2" fill="none" stroke="#4a7a95" stroke-width="2"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <!-- Far leg -->
  <g stroke="url(#legGrad)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 600 440 L 610 560 L 644 644"/>
  </g>
  <g fill="#f07c1c">
    <path d="M 648 642 l -6 14 l 20 0 l -6 -14 Z"/>
  </g>

  <!-- Tail feathers -->
  <g fill="#d8dee2" stroke="#b9c2c8" stroke-width="2">
    <path d="M 500 400 q -30 -6 -42 6 q 16 14 42 0 Z"/>
    <path d="M 502 408 q -32 0 -44 12 q 20 12 44 0 Z"/>
    <path d="M 500 416 q -28 6 -38 16 q 20 10 38 -2 Z"/>
  </g>

  <!-- Body -->
  <ellipse cx="575" cy="385" rx="92" ry="68" fill="url(#bodyGrad)"/>

  <!-- Near wing (folded, over body) -->
  <g>
    <path d="M 535 345
             C 590 330 645 355 655 400
             C 650 435 620 455 580 455
             C 545 455 520 435 520 400
             C 520 380 525 360 535 345 Z" fill="url(#wingGrad)"/>
    <path d="M 535 345 C 575 348 615 362 640 386"
          fill="none" stroke="#8b949a" stroke-width="3" opacity="0.6"/>
    <path d="M 645 385 C 625 410 600 430 570 440"
          fill="none" stroke="#8b949a" stroke-width="3" opacity="0.6"/>
    <!-- feather scallops -->
    <g fill="url(#wingTipGrad)">
      <path d="M 655 400 C 645 415 630 428 610 436 C 625 432 640 418 655 400 Z"/>
      <path d="M 650 408 C 638 422 622 434 604 442 C 620 438 636 424 650 408 Z"/>
      <path d="M 643 416 C 630 428 616 438 598 446 C 614 442 630 430 643 416 Z"/>
    </g>
  </g>

  <!-- Neck -->
  <path d="M 640 345 C 675 330 690 315 700 295"
        fill="none" stroke="#f4f6f7" stroke-width="34" stroke-linecap="round"/>
  <path d="M 640 345 C 675 330 690 315 700 295"
        fill="none" stroke="#eef1f3" stroke-width="34" stroke-linecap="round" opacity="0.4"/>

  <!-- Head -->
  <ellipse cx="703" cy="282" rx="44" ry="36" fill="url(#bodyGrad)"/>

  <!-- Eye -->
  <g>
    <circle cx="716" cy="266" r="7" fill="#2b2f33"/>
    <circle cx="718" cy="264" r="2.6" fill="#ffffff"/>
    <circle cx="713" cy="269" r="1.4" fill="#7fa8b8"/>
  </g>

  <!-- Upper beak -->
  <path d="M 740 262
           C 790 254 828 250 852 250
           C 862 250 864 256 858 262
           C 840 268 800 270 758 274
           L 740 262 Z" fill="url(#beakGrad)"/>
  <path d="M 740 262 C 790 254 828 250 852 250"
        fill="none" stroke="#d97a00" stroke-width="3" opacity="0.7"/>
  <!-- nostril -->
  <ellipse cx="750" cy="260" rx="4" ry="2.4" fill="#d97a00" opacity="0.8"/>

  <!-- Lower beak / pouch -->
  <path d="M 740 274
           C 760 276 780 286 792 304
           C 802 322 800 336 788 340
           C 806 330 816 308 812 284
           C 808 262 782 258 758 266
           L 740 274 Z" fill="url(#pouchGrad)"/>
  <path d="M 740 274 C 762 278 786 292 792 310"
        fill="none" stroke="#d97a00" stroke-width="2.5" opacity="0.6"/>

  <!-- Near leg -->
  <g stroke="url(#legGrad)" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 560 440 L 566 555 L 622 622"/>
  </g>
  <g fill="#f07c1c" stroke="#d96a12" stroke-width="1.5">
    <path d="M 626 622 l -8 16 l 24 0 l -8 -16 Z"/>
    <path d="M 622 638 l -2 8 l 16 0 l -2 -8 Z"/>
  </g>

  <!-- Near wing reaching to handlebar -->
  <g>
    <path d="M 620 350
             C 680 345 715 390 736 452
             C 720 462 700 452 688 432
             C 668 398 650 368 620 350 Z"
          fill="url(#wingGrad)"/>
    <path d="M 620 350 C 675 348 708 392 730 448"
          fill="none" stroke="#8b949a" stroke-width="3" opacity="0.6"/>
    <!-- wingtip grip on handlebar -->
    <g fill="url(#wingTipGrad)">
      <path d="M 736 452 C 724 462 708 454 700 442 C 714 448 726 450 736 452 Z"/>
      <path d="M 730 448 C 720 458 706 452 698 442 C 712 446 722 448 730 448 Z"/>
    </g>
  </g>

</svg>
