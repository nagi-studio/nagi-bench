<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>陨石 · The Meteorite</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #stage canvas { display: block; }

      /* cinematic vignette + letterbox, layered under the player UI */
      #film-frame {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        background:
          linear-gradient(180deg,
            rgba(0,0,0,0.55) 0%,
            rgba(0,0,0,0) 7%,
            rgba(0,0,0,0) 93%,
            rgba(0,0,0,0.55) 100%),
          radial-gradient(ellipse at center,
            rgba(0,0,0,0) 55%,
            rgba(0,0,0,0.42) 100%);
      }
      #fade-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 6;
        background: #000;
        opacity: 0;
      }
      #title-card {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #e9e4d8;
        font-family: "Songti SC", "STSong", "SimSun", ui-serif, serif;
        text-shadow: 0 0 24px rgba(0,0,0,0.9);
        opacity: 0;
      }
      #title-card .zh { font-size: clamp(48px, 9vw, 120px); letter-spacing: 0.35em; font-weight: 600; }
      #title-card .sub { margin-top: 0.7em; font-size: clamp(13px, 1.8vw, 20px); letter-spacing: 0.22em; color: #b7c2cf; }
      #scope-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
        opacity: 0;
        transition: opacity 0.25s linear;
      }
      #scope-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center,
          transparent 0%, transparent 42%, rgba(0,0,0,0.98) 43%, rgba(0,0,0,0.98) 100%);
      }
      #scope-overlay .cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 0; height: 0; }
      #scope-overlay .cross::before, #scope-overlay .cross::after {
        content: ""; position: absolute; background: rgba(210,240,255,0.85); box-shadow: 0 0 6px rgba(210,240,255,0.6);
      }
      #scope-overlay .cross::before { width: 2px; height: 100vh; left: -1px; top: -50vh; }
      #scope-overlay .cross::after { width: 100vw; height: 2px; top: -1px; left: -50vw; }
      #scope-overlay .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 3px; height: 3px; border-radius: 50%; background: #d2f0ff; box-shadow: 0 0 8px #d2f0ff; }
    </style>
    <script type="module" crossorigin src="./assets/index-DVCc8B5M.js"></script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="film-frame"></div>
    <div id="title-card">
      <div class="zh">陨 石</div>
      <div class="sub">改编自《三体Ⅱ·黑暗森林》</div>
    </div>
    <div id="scope-overlay">
      <div class="cross"></div>
      <div class="ring"></div>
    </div>
    <div id="fade-layer"></div>
  </body>
</html>
