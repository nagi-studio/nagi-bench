<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>MAISON ARDENT · Calibre ARD-47 Squelette</title>

<style>
  :root {
    --ivory: #efe8dc;
    --gold: #d4b483;
    --gold-2: #f0ddb8;
    --muted: #9c9488;
    --line: rgba(212, 180, 131, 0.28);
    --panel: rgba(8, 9, 12, 0.62);
    --danger: #c45b4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; color: var(--ivory); overflow: hidden; }
  body { font-family: "Jost", "Noto Serif SC", sans-serif; }
  #stage { position: fixed; inset: 0; z-index: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.dragging { cursor: grabbing; }
  #vignette, #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
  }
  #vignette {
    background:
      radial-gradient(ellipse at 50% 42%, transparent 35%, rgba(0,0,0,0.28) 70%, rgba(0,0,0,0.62) 100%);
  }
  #grain { opacity: 0.045; mix-blend-mode: overlay; background-size: 180px 180px; }
  .hud { position: fixed; z-index: 3; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  #top {
    top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 26px 32px 0;
    pointer-events: none;
  }
  .brand { pointer-events: none; }
  .brand .maison {
    font-family: "Cormorant Garamond", serif;
    letter-spacing: 0.42em;
    font-size: 15px;
    font-weight: 500;
    color: var(--gold-2);
  }
  .brand h1 {
    margin: 6px 0 0;
    font-family: "Noto Serif SC", serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.34em;
  }
  .brand .ref {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .specs { display: flex; gap: 18px; pointer-events: none; }
  .specs div { text-align: right; }
  .specs b {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--ivory);
  }
  .specs span {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--muted);
  }
  #clock {
    margin-top: 14px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.18em;
    font-size: 13px;
    color: var(--gold);
  }
  #beat {
    margin-top: 8px;
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    font-size: 10px; letter-spacing: 0.2em; color: var(--muted);
  }
  #beat i {
    width: 86px; height: 3px; border-radius: 99px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    display: block; transform-origin: 50% 50%;
  }
  #parts {
    left: 26px; top: 118px; bottom: 118px; width: 232px;
    overflow: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: rgba(212,180,131,0.35) transparent;
  }
  #parts::-webkit-scrollbar { width: 6px; }
  #parts::-webkit-scrollbar-thumb { background: rgba(212,180,131,0.35); border-radius: 99px; }
  .cat {
    margin: 14px 0 6px;
    font-size: 10px; letter-spacing: 0.28em; color: var(--gold);
  }
  .cat:first-child { margin-top: 0; }
  button.part {
    width: 100%;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 1px;
    background: transparent;
    border: 0;
    border-left: 1px solid rgba(239,232,220,0.1);
    color: var(--ivory);
    padding: 7px 10px;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s, border-color 0.2s;
  }
  button.part .en {
    font-size: 9px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase;
  }
  button.part .zh { font-family: "Noto Serif SC", serif; font-size: 14px; }
  button.part:hover { background: rgba(255,255,255,0.03); }
  button.part.on {
    border-left-color: var(--gold);
    background: linear-gradient(90deg, rgba(212,180,131,0.14), transparent 80%);
  }
  #detail {
    right: 26px; top: 118px; width: 320px;
    padding: 20px 20px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(16px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.28);
  }
  #detail .kicker {
    font-size: 10px; letter-spacing: 0.26em; color: var(--gold); text-transform: uppercase;
  }
  #detail h2 {
    margin: 6px 0 0;
    font-family: "Noto Serif SC", serif;
    font-weight: 500;
    font-size: 26px;
  }
  #detail .en-name {
    margin-top: 2px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: var(--muted);
    font-size: 16px;
  }
  #detail p.desc {
    margin: 12px 0 0;
    font-size: 13.5px;
    line-height: 1.75;
    color: rgba(239,232,220,0.86);
    font-family: "Noto Serif SC", serif;
    font-weight: 400;
  }
  #detail .row {
    display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
  }
  #detail .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--gold-2);
  }
  #focus-btn, .dock button, .seg button {
    font-family: inherit;
    color: var(--ivory);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(239,232,220,0.14);
    border-radius: 999px;
    cursor: pointer;
  }
  #focus-btn {
    margin-top: 14px;
    padding: 8px 14px;
    letter-spacing: 0.18em;
    font-size: 11px;
  }
  #focus-btn:hover, .dock button:hover, .seg button:hover { border-color: var(--gold); color: var(--gold-2); }
  #focus-btn[disabled] { opacity: 0.35; cursor: default; }
  #dock {
    left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: min(920px, calc(100% - 32px));
  }
  .dock-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .dock button, .seg button {
    padding: 9px 14px;
    letter-spacing: 0.14em;
    font-size: 12px;
    backdrop-filter: blur(12px);
    background: rgba(8,9,12,0.55);
  }
  .dock button.on, .seg button.on {
    background: rgba(212,180,131,0.16);
    border-color: var(--gold);
    color: var(--gold-2);
  }
  .slider {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(239,232,220,0.14);
    background: rgba(8,9,12,0.55);
    backdrop-filter: blur(12px);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .slider input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 110px; height: 2px; background: rgba(239,232,220,0.25); border-radius: 99px; outline: none;
  }
  .slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--gold); cursor: pointer; border: 0;
  }
  #hint {
    position: fixed; z-index: 3; left: 26px; bottom: 22px;
    font-size: 11px; letter-spacing: 0.12em; color: rgba(156,148,136,0.9);
    pointer-events: none;
  }
  #tag {
    position: fixed; z-index: 4; left: 0; top: 0;
    pointer-events: none;
    padding: 7px 10px 8px;
    border-radius: 10px;
    background: rgba(8,9,12,0.78);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    transform: translate(-50%, -140%);
    min-width: 88px;
  }
  #tag[hidden] { display: none; }
  #tag .en { display: block; font-size: 9px; letter-spacing: 0.18em; color: var(--gold); text-transform: uppercase; }
  #tag .zh { font-family: "Noto Serif SC", serif; font-size: 14px; }
  #tag::after {
    content: "";
    position: absolute; left: 50%; bottom: -7px;
    width: 1px; height: 7px; background: var(--gold);
  }
  #loader {
    position: fixed; inset: 0; z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #05060a;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #loader.hide { opacity: 0; visibility: hidden; }
  #loader .maison {
    font-family: "Cormorant Garamond", serif;
    letter-spacing: 0.5em;
    font-size: 18px;
    color: var(--gold-2);
  }
  #loader .bar {
    width: 140px; height: 1px; margin: 22px 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform-origin: center;
    animation: load 1.4s ease-in-out infinite;
  }
  #loader .sub { letter-spacing: 0.32em; font-size: 11px; color: var(--muted); max-width: 70vw; text-align: center; }
  @keyframes load { 50% { transform: scaleX(0.4); opacity: 0.5; } }
  @media (max-width: 980px) {
    #parts {
      left: 12px; right: 12px; top: auto; bottom: 148px; width: auto; height: 78px;
      display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
      padding-bottom: 4px;
    }
    #parts .cat { display: none; }
    button.part { width: auto; min-width: 108px; border-left: 0; border-bottom: 1px solid rgba(239,232,220,0.12); }
    button.part.on { border-bottom-color: var(--gold); }
    #detail { top: 86px; right: 12px; left: 12px; width: auto; max-height: 34vh; overflow: auto; }
    #detail p.desc { font-size: 13px; }
    #top { padding: 16px 14px 0; }
    .specs { display: none; }
    #hint { display: none; }
    .brand h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="grain"></div>

<header id="top" class="hud">
  <div class="brand">
    <div class="maison">MAISON ARDENT</div>
    <h1>炽光</h1>
    <div class="ref">Calibre ARD-47 · Squelette Lumière</div>
  </div>
  <div>
    <div class="specs">
      <div><b>28,800</b><span>VPH</span></div>
      <div><b id="spec-jewels">21</b><span>JEWELS</span></div>
      <div><b>48H</b><span>RESERVE</span></div>
      <div><b>42</b><span>MM</span></div>
    </div>
    <div id="clock">--:--:--</div>
    <div id="beat"><span>BALANCE</span><i id="beat-bar"></i></div>
  </div>
</header>

<nav id="parts" class="hud" aria-label="机芯零件"></nav>

<aside id="detail" class="hud">
  <div class="kicker" id="d-kicker">CALIBRE</div>
  <h2 id="d-title">ARD-47 镂空机芯</h2>
  <div class="en-name" id="d-en">Squelette Lumière</div>
  <p class="desc" id="d-desc"></p>
  <div class="row" id="d-chips"></div>
  <button id="focus-btn" type="button">聚焦此零件</button>
</aside>

<div id="tag" hidden>
  <span class="en" id="tag-en"></span>
  <span class="zh" id="tag-zh"></span>
</div>

<footer id="dock" class="hud">
  <div class="dock-row">
    <button id="btn-explode" type="button">爆炸视图</button>
    <button id="btn-run" type="button" class="on">机芯运转</button>
    <button id="btn-wind" type="button">上链演示</button>
    <button id="btn-spin" type="button">自动旋转</button>
    <button id="btn-reset" type="button">重置视角</button>
  </div>
  <div class="dock-row">
    <label class="slider">分离
      <input id="explode-range" type="range" min="0" max="1" step="0.001" value="0" />
    </label>
    <label class="slider">速率
      <input id="speed-range" type="range" min="0" max="1.4" step="0.01" value="0.32" />
    </label>
    <div class="seg" role="group" aria-label="表壳材质">
      <button type="button" data-finish="steel" class="on">钢</button>
      <button type="button" data-finish="rose">玫瑰金</button>
      <button type="button" data-finish="gold">黄金</button>
    </div>
  </div>
</footer>
<div id="hint">拖拽旋转 · 滚轮缩放 · 悬停识读 · 双击聚焦 · E 爆炸 · 空格暂停</div>

<div id="loader">
  <div class="maison">MAISON ARDENT</div>
  <div class="bar"></div>
  <div class="sub" id="loader-sub">CALIBRE ARD-47</div>
</div>

<script type="importmap">

}

function trackedText(text, {
  w = 1024, h = 256, font = '500 92px "Cormorant Garamond", serif',
  color = '#efe8dc', tracking = 0.22, baseline = 138,
} = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = color;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const chars = [...text];
  const widths = chars.map((ch) => ctx.measureText(ch).width);
  const gap = 92 * tracking * (parseInt(font, 10) / 92);
  const total = widths.reduce((a, b) => a + b, 0) + gap * Math.max(0, chars.length - 1);
  let x = w / 2 - total / 2;
  chars.forEach((ch, i) => {
    ctx.fillText(ch, x + widths[i] / 2, baseline);
    x += widths[i] + gap;
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function circularTextTexture(text) {
  const size = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = 'rgba(236,230,218,0.92)';
  ctx.font = '500 34px "Cormorant Garamond", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const chars = [...text];
  const radius = 438;
  chars.forEach((ch, i) => {
    const a = -Math.PI / 2 + (i / chars.length) * Math.PI * 2;
    ctx.save();
    ctx.translate(size / 2 + Math.cos(a) * radius, size / 2 + Math.sin(a) * radius);
    ctx.rotate(a + Math.PI / 2);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function gearShape(teeth, outerR, rootR, holeR, skew = 0) {
  const shape = new THREE.Shape();
  const step = (Math.PI * 2) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const a0 = a - step * 0.40;
    const a1 = a - step * 0.15 + skew;
    const a2 = a + step * 0.15 + skew;
    const a3 = a + step * 0.34 + skew * 0.25;
    const p = (ang, r) => [Math.cos(ang) * r, Math.sin(ang) * r];
    const pts = [p(a0, rootR), p(a1, outerR), p(a2, outerR), p(a3, rootR)];
    if (i === 0) shape.moveTo(pts[0][0], pts[0][1]);
    else shape.lineTo(pts[0][0], pts[0][1]);
    shape.lineTo(pts[1][0], pts[1][1]);
    shape.lineTo(pts[2][0], pts[2][1]);
    shape.lineTo(pts[3][0], pts[3][1]);
  }
  shape.closePath();
  if (holeR > 0) {
    const h = new THREE.Path();
    h.absarc(0, 0, holeR, 0, Math.PI * 2, true);
    shape.holes.push(h);
  }
  return shape;
}

      p2[0] - (p3[0] - p1[0]) * tension,
      p2[1] - (p3[1] - p1[1]) * tension,
      p2[0], p2[1],
    );
  }
  return s;
}

function annulusShape(outer, inner) {

  const h = new THREE.Path();

  return s;
}

function flatSpiral(turns, r0, r1, width, thick) {
  const segs = Math.floor(turns * 56);
  const positions = [];
  const indices = [];
  const zT = thick / 2;
  const zB = -thick / 2;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const a = t * turns * Math.PI * 2;
    const rm = r0 + (r1 - r0) * t;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const ro = rm + width * 0.5;
    const ri = rm - width * 0.5;
    positions.push(ca * ro, sa * ro, zT, ca * ro, sa * ro, zB, ca * ri, sa * ri, zT, ca * ri, sa * ri, zB);
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 4;
    const b = (i + 1) * 4;
    indices.push(a, a + 2, b, b, a + 2, b + 2);
    indices.push(a + 1, b + 1, a + 3, b + 1, b + 3, a + 3);
    indices.push(a, b, a + 1, a + 1, b, b + 1);
    indices.push(a + 2, a + 3, b + 2, a + 3, b + 3, b + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function verticalSpiral(turns, r0, r1, height, thick) {
  const segs = Math.floor(turns * 40);
  const positions = [];
  const indices = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const a = t * turns * Math.PI * 2;
    const r = r0 + (r1 - r0) * t;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const ox = ca * thick * 0.5;
    const oy = sa * thick * 0.5;
    positions.push(
      ca * r + ox, sa * r + oy, height / 2,
      ca * r + ox, sa * r + oy, -height / 2,
      ca * r - ox, sa * r - oy, height / 2,
      ca * r - ox, sa * r - oy, -height / 2,
    );
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 4;
    const b = (i + 1) * 4;
    indices.push(a, b, a + 1, a + 1, b, b + 1);
    indices.push(a + 2, a + 3, b + 2, a + 3, b + 3, b + 2);
    indices.push(a, a + 2, b, b, a + 2, b + 2);
    indices.push(a + 1, b + 1, a + 3, b + 1, b + 3, a + 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function tubeManual(points, segs, radial, rxFn, ryFn) {
  const curve = new THREE.CatmullRomCurve3(points);
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t).normalize();
    const up = new THREE.Vector3(0, 0, 1);
    const side = new THREE.Vector3().crossVectors(up, tan);
    if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
    side.normalize();
    const bin = new THREE.Vector3().crossVectors(tan, side).normalize();
    const rx = rxFn(t);
    const ry = ryFn(t);
    for (let j = 0; j < radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const cx = Math.cos(a) * rx;
      const sy = Math.sin(a) * ry;
      positions.push(
        p.x + side.x * cx + bin.x * sy,
        p.y + side.y * cx + bin.y * sy,
        p.z + side.z * cx + bin.z * sy,
      );
      uvs.push(j / radial, t);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * radial + j;
      const b = i * radial + ((j + 1) % radial);
      const c = (i + 1) * radial + j;
      const d = (i + 1) * radial + ((j + 1) % radial);
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildWheel(spec, opts) {
  const { x, y, outer, teeth } = spec;
  const holder = hold(x, y, opts.z, opts.explode, opts.id);
  const spin = new THREE.Group();
  spin.userData.phase = opts.phase || 0;
  spin.userData.ratio = opts.ratio || 1;
  spin.userData.sign = opts.sign || 1;
  holder.add(spin);
  const toothH = Math.min(outer * 0.15, (Math.PI * 2 * outer / teeth) * 0.5);
  const rootR = outer - toothH;
  const innerR = opts.spokes ? outer * 0.60 : (opts.inner || outer * 0.22);
  const shape = gearShape(teeth, outer, rootR, innerR, opts.skew || 0);
  if (opts.decorHoles) {
    for (let i = 0; i < opts.decorHoles; i++) {
      const a = (i / opts.decorHoles) * Math.PI * 2;
      const rr = innerR * 0.62;
      const h = new THREE.Path();
      h.absarc(Math.cos(a) * rr, Math.sin(a) * rr, outer * 0.09, 0, Math.PI * 2, true);
      shape.holes.push(h);
    }
  }
  const mesh = new THREE.Mesh(extrudeShape(shape, opts.thick, opts.bevel ?? 0.012), opts.mat);
  mesh.castShadow = true;
  spin.add(mesh);
  if (opts.spokes) {
    const hubR = Math.max(0.26, outer * 0.15);
    const hub = cyl(hubR, opts.thick, opts.mat, 20);
    hub.position.z = opts.thick / 2;
    spin.add(hub);
    const spokeW = Math.max(0.14, outer * 0.05);
    const spokeLen = innerR - hubR + 0.06;
    const mid = (innerR + hubR) / 2;
    for (let i = 0; i < opts.spokes; i++) {
      const a = (i / opts.spokes) * Math.PI * 2;
      const sp = new THREE.Mesh(new THREE.BoxGeometry(spokeW, spokeLen, opts.thick * 0.9), opts.mat);
      sp.position.set(Math.cos(a) * mid, Math.sin(a) * mid, opts.thick / 2);
      sp.rotation.z = a - Math.PI / 2;
      spin.add(sp);
    }
    if (opts.pinion !== false) {
      const pOuter = hubR + 0.48;
      const pMesh = new THREE.Mesh(
        extrudeShape(gearShape(12, pOuter, pOuter * 0.68, 0.1), opts.thick * 0.62, 0),
        mats.steel,
      );
      pMesh.position.z = -opts.thick * 0.38;
      spin.add(pMesh);
    }
  }
  const shaft = cyl(0.08, opts.thick + 0.9, mats.steelPolish, 10);
  shaft.position.z = opts.thick / 2;
  spin.add(shaft);
  tag(holder, opts.id);
  return { holder, spin };
}

function fingerCock(headR, len, width, depth) {

  const tail = new THREE.Mesh(new THREE.BoxGeometry(width, tailLen, depth * 0.94), mats.rhodium);

}

      side * (5.4 + e * 5.1),
      ySign * (14.4 + e * 10.2),

  return pts;
}

function strapMesh(ySign) {
  const segs = 26;
  const radial = 20;
  const halfW = 7.5;
  const halfT = 1.02;
  const positions = [];
  const uvs = [];
  const indices = [];
  const at = (t) => new THREE.Vector3(
    0,
    ySign * (20.6 + t * 30),
    -1.65 + (-3.66 + 1.65) * (1 - Math.cos(t * Math.PI * 0.5)),
  );
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const p = at(t);
    const q = at(Math.min(1, t + 0.02));
    const tan = q.clone().sub(p).normalize();
    const side = new THREE.Vector3(1, 0, 0);
    const bin = new THREE.Vector3().crossVectors(side, tan).normalize();
    const taper = t < 0.08 ? 0.92 + t / 0.08 * 0.08 : (t > 0.92 ? 1 - (t - 0.92) * 0.7 : 1);
    for (let j = 0; j < radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const x = Math.cos(a) * halfW * taper;
      const th = Math.sin(a) * halfT * taper;
      positions.push(p.x + x, p.y + side.y * x + bin.y * th, p.z + bin.z * th);
      uvs.push(j / radial * 2, t * 5);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * radial + j;
      const b = i * radial + ((j + 1) % radial);
      const c = (i + 1) * radial + j;
      const d = (i + 1) * radial + ((j + 1) % radial);
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mats.leather);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function placeCock(id, x, y, rot, headR, len, width, z, explode, jewelR = 0.18) {
  const h = hold(x, y, z, explode, id);
  h.rotation.z = rot;
  const depth = 0.36;
  const cock = fingerCock(headR, len, width, depth);
  h.add(cock);
  const j = makeJewel(jewelR);
  j.position.z = depth + 0.02;
  h.add(j);
  const screw = makeScrew(0.26);
  screw.position.set(0, headR * 0.25 + len, depth + 0.02);
  h.add(screw);
  tag(h, id);
  return h;
}

// ---------- hands ----------
function dauphine(len, w, tail) {
  const s = new THREE.Shape();
  s.moveTo(0, len);
  s.quadraticCurveTo(w, len * 0.64, w * 0.52, len * 0.16);
  s.quadraticCurveTo(w * 0.36, -0.15, w * 0.2, tail);
  s.quadraticCurveTo(0, tail - 0.28, -w * 0.2, tail);
  s.quadraticCurveTo(-w * 0.36, -0.15, -w * 0.52, len * 0.16);
  s.quadraticCurveTo(-w, len * 0.64, 0, len);
  return s;
}
function lumeLeaf(len, w, tail) {
  const s = new THREE.Shape();
  s.moveTo(0, len);
  s.quadraticCurveTo(w, len * 0.6, w * 0.7, len * 0.2);
  s.lineTo(0, tail);
  s.lineTo(-w * 0.7, len * 0.2);
  s.quadraticCurveTo(-w, len * 0.6, 0, len);
  return s;
}

function addHand(id, z, explodeZ, len, width, tail, lumeLen) {
  const holder = hold(0, 0, z, new THREE.Vector3(0, 0, explodeZ), id);
  const spin = new THREE.Group();
  holder.add(spin);
  const body = new THREE.Mesh(extrudeShape(dauphine(len, width, tail), 0.12, 0.02), mats.steelPolish);
  body.castShadow = true;
  const lume = new THREE.Mesh(extrudeShape(lumeLeaf(lumeLen, width * 0.45, len * 0.25), 0.05, 0), mats.lumeHot);
  lume.position.z = 0.1;
  const pipe = cyl(id === 'hour' ? 0.28 : 0.18, 0.45, mats.steelPolish, 16);
  pipe.position.z = -0.18;
  spin.add(body, lume, pipe);
  tag(holder, id);
  return spin;
}

const crystal = hold(0, 0, 0, new THREE.Vector3(0, 0, 13.5), 'crystal');
{
  const R = 16.72;
  const base = 3.78;
  const rise = 0.78;
  const pts = [];
  const steps = 32;
  for (let i = 0; i <= steps; i++) {
    const r = (i / steps) * R;
    const z = base + rise * (1 - (r / R) ** 2);
    pts.push(new THREE.Vector2(r, z));
  }
  pts.push(new THREE.Vector2(R + 0.01, base - 0.22));
  for (let i = steps; i >= 0; i--) {
    const r = (i / steps) * (R - 0.12);
    const z = base - 0.04 + Math.max(0.12, rise - 0.28) * (1 - (r / (R - 0.12)) ** 2);
    pts.push(new THREE.Vector2(r, z));
  }
  const geo = new THREE.LatheGeometry(pts, 120);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mats.sapphire);
  mesh.rotation.x = Math.PI / 2;
  mesh.renderOrder = 6;
  mesh.userData.partId = 'crystal';
  const lip = new THREE.Mesh(new THREE.TorusGeometry(R - 0.02, 0.045, 8, 100), mats.steelPolish);
  lip.position.z = base + 0.05;
  lip.userData.partId = 'crystal';
  crystal.add(mesh, lip);
  focusAnchor.crystal = crystal;
}

// circular legend uses final jewel count
{
  const legend = `·  MAISON ARDENT  ·  CALIBRE ARD-47  ·  ${rubyCount} JEWELS  ·  SWISS MADE  ·  SQUELETTE  `;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(31.2, 31.2),
    new THREE.MeshBasicMaterial({ map: circularTextTexture(legend), transparent: true, depthWrite: false }),
  );
  plane.position.z = 0.46;
  plane.userData.noPick = true;
  plane.raycast = () => {};
  dial.add(plane);
  document.getElementById('spec-jewels').textContent = String(rubyCount);
  const rubyItem = byId.ruby;
  rubyItem.chips = [`${rubyCount} 颗`, '合成红宝石'];
  rubyItem.desc = `这枚机芯共使用 ${rubyCount} 颗合成红宝石。它们托住轮轴、叉轴和摆轴，叉瓦与冲击宝石也是红宝石。盖石配防震簧，用来挡住摆轴在冲击下的位移。点选此项会同时标出全部宝石。`;
}

// ---------- postprocessing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const useBloom = !lite;
const outline = new OutlinePass(new THREE.Vector2(innerWidth, innerHeight), scene, camera);
outline.edgeStrength = 3.2;
outline.edgeGlow = 0.45;
outline.edgeThickness = 1.15;
outline.pulsePeriod = 0;
outline.visibleEdgeColor.set('#e7c98a');
outline.hiddenEdgeColor.set('#6d5a38');
outline.enabled = false;
composer.addPass(outline);
if (useBloom) {
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.16, 0.42, 0.86);
  composer.addPass(bloom);
}
composer.addPass(new OutputPass());
composer.renderTarget1.samples = 4;
composer.renderTarget2.samples = 4;

// ---------- interaction state ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pinned = null;
let hovered = null;
let highlighted = undefined;
let running = !reduceMotion;
let speed = reduceMotion ? 0 : 0.32;
let explodeTarget = 0;
let explodeCurrent = 0;
let windT = 0;
let windAccum = 0;
let camAnim = null;
let dragging = false;
const clock = new THREE.Clock();
let elapsed = 0;

const tagEl = document.getElementById('tag');
const btnExplode = document.getElementById('btn-explode');
const explodeRange = document.getElementById('explode-range');
const speedRange = document.getElementById('speed-range');

function showDetail(id) {
  const item = (id && byId[id]) || OVERVIEW;
  document.getElementById('d-kicker').textContent = item.cat || 'CALIBRE';
  document.getElementById('d-title').textContent = item.zh;
  document.getElementById('d-en').textContent = item.en;
  document.getElementById('d-desc').textContent = item.desc;
  const chips = document.getElementById('d-chips');
  chips.innerHTML = '';
  (item.chips || []).forEach((c) => {
    const s = document.createElement('span');
    s.className = 'chip';
    s.textContent = c;
    chips.appendChild(s);
  });
  document.getElementById('focus-btn').disabled = !id;
  document.querySelectorAll('button.part').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
}

function highlight(id) {
  if (highlighted === id) return;
  highlighted = id;
  outline.enabled = !!id;
  outline.selectedObjects = id ? (outlineSets[id] || []) : [];
  const item = id && byId[id];
  if (item) {
    document.getElementById('tag-en').textContent = item.en;
    document.getElementById('tag-zh').textContent = item.zh;
  }
  document.querySelectorAll('button.part').forEach((b) => b.classList.toggle('on', b.dataset.id === (hovered || pinned)));
  showDetail(hovered || pinned);
}

function placeTag(id) {
  const obj = focusAnchor[id] || (outlineSets[id] && outlineSets[id][0]);
  if (!obj) { tagEl.hidden = true; return; }
  const p = obj.getWorldPosition(new THREE.Vector3());
  p.project(camera);
  if (p.z > 1) { tagEl.hidden = true; return; }
  const x = (p.x * 0.5 + 0.5) * innerWidth;
  const y = (-p.y * 0.5 + 0.5) * innerHeight;
  tagEl.hidden = false;
  const left = Math.min(innerWidth - 80, Math.max(80, x));
  const top = Math.min(innerHeight - 40, Math.max(40, y));
  tagEl.style.transform = `translate(${left}px, ${top}px) translate(-50%, calc(-100% - 16px))`;
}

function pick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(watch.children, true);
  for (const h of hits) {
    if (!h.object.visible || h.object.userData.noPick) continue;
    let id = h.object.userData.partId;
    if (!id) continue;
    if (id === 'crystal' || id === 'caseback') {
      const local = watch.worldToLocal(h.point.clone());
      if (Math.hypot(local.x, local.y) < 15.1) continue;
    }
    return id;
  }
  return null;
}

function pinPart(id, doFocus) {
  pinned = id;
  hovered = null;
  highlight(id);
  tagEl.hidden = true;
  if (doFocus && id) focusPart(id);
}

function focusPart(id) {
  const obj = focusAnchor[id] || (outlineSets[id] && outlineSets[id][0]);
  if (!obj) return;
  const wp = obj.getWorldPosition(new THREE.Vector3());
  const dir = camera.position.clone().sub(controls.target);
  const dist = THREE.MathUtils.clamp(dir.length() * 0.62, 22, 52);
  const toC = wp.clone().add(dir.normalize().multiplyScalar(dist));
  toC.y = Math.max(toC.y, 5.5);
  camAnim = {
    fromC: camera.position.clone(),
    toC,
    fromT: controls.target.clone(),
    toT: wp.clone(),
    t: 0,
    dur: 1.05,
  };
}

function resetView() {
  camAnim = {
    fromC: camera.position.clone(),
    toC: HERO.pos.clone(),
    fromT: controls.target.clone(),
    toT: HERO.target.clone(),
    t: 0,
    dur: 1.15,
  };
}

function setExplode(v, immediate = false) {
  explodeTarget = THREE.MathUtils.clamp(v, 0, 1);
  if (immediate) explodeCurrent = explodeTarget;
  explodeRange.value = String(explodeTarget);
  btnExplode.classList.toggle('on', explodeTarget > 0.5);
  btnExplode.textContent = explodeTarget > 0.5 ? '还原结构' : '爆炸视图';
}

// UI
const partsNav = document.getElementById('parts');
let lastCat = '';
for (const item of CATALOG) {
  if (item.cat !== lastCat) {
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = item.cat;
    partsNav.appendChild(h);
    lastCat = item.cat;
  }
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'part';
  b.dataset.id = item.id;
  b.innerHTML = `<span class="en">${item.en}</span><span class="zh">${item.zh}</span>`;
  b.addEventListener('click', () => pinPart(item.id, true));
  partsNav.appendChild(b);
}
showDetail(null);

document.getElementById('focus-btn').addEventListener('click', () => {
  if (pinned || hovered) focusPart(pinned || hovered);
});
btnExplode.addEventListener('click', () => setExplode(explodeTarget > 0.5 ? 0 : 1));
explodeRange.addEventListener('input', () => setExplode(parseFloat(explodeRange.value), true));
speedRange.addEventListener('input', () => { speed = parseFloat(speedRange.value); });
document.getElementById('btn-run').addEventListener('click', (e) => {
  running = !running;
  e.currentTarget.classList.toggle('on', running);
  e.currentTarget.textContent = running ? '机芯运转' : '机芯已暂停';
});
document.getElementById('btn-spin').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btn-wind').addEventListener('click', () => { windT = 3.1; });
document.getElementById('btn-reset').addEventListener('click', resetView);
document.querySelectorAll('.seg button').forEach((b) => {
  b.addEventListener('click', () => applyFinish(b.dataset.finish));
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) return;
  const id = pick(e.clientX, e.clientY);
  hovered = id;
  if (id) {
    highlight(id);
    placeTag(id);
  } else {
    tagEl.hidden = true;
    highlight(pinned);
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  hovered = null;
  tagEl.hidden = true;
  highlight(pinned);
});
renderer.domElement.addEventListener('pointerdown', () => {
  dragging = true;
  renderer.domElement.classList.add('dragging');
  camAnim = null;
});
addEventListener('pointerup', (e) => {
  const wasDrag = controls && false;
  dragging = false;
  renderer.domElement.classList.remove('dragging');
});
controls.addEventListener('start', () => {
  dragging = true;
  camAnim = null;
  renderer.domElement.classList.add('dragging');
});
controls.addEventListener('end', () => {
  dragging = false;
  renderer.domElement.classList.remove('dragging');
});

let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY, t: performance.now() };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x;
  const dy = e.clientY - downPos.y;
  const dt = performance.now() - downPos.t;
  downPos = null;
  if (dx * dx + dy * dy > 16 || dt > 500) return;
  const id = pick(e.clientX, e.clientY);
  if (id) pinPart(id, false);
  else {
    pinned = null;
    hovered = null;
    tagEl.hidden = true;
    highlight(null);
  }
});
renderer.domElement.addEventListener('dblclick', (e) => {
  const id = pick(e.clientX, e.clientY);
  if (id) pinPart(id, true);
  else resetView();
});

addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('btn-run').click();
  } else if (e.key === 'e' || e.key === 'E') setExplode(explodeTarget > 0.5 ? 0 : 1);
  else if (e.key === 'r' || e.key === 'R') resetView();
  else if (e.key === 'a' || e.key === 'A') document.getElementById('btn-spin').click();
  else if (e.key === 'w' || e.key === 'W') windT = 3.1;
  else if (e.key === 'f' || e.key === 'F') { if (pinned) focusPart(pinned); }
  else if (e.key === '1') applyFinish('steel');
  else if (e.key === '2') applyFinish('rose');
  else if (e.key === '3') applyFinish('gold');
  else if (e.key === 'Escape') {
    pinned = null; hovered = null; tagEl.hidden = true; highlight(null);
  }
});

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

if (!reduceMotion) {
  camAnim = {
    fromC: camera.position.clone(),
    toC: HERO.pos.clone(),
    fromT: controls.target.clone(),
    toT: HERO.target.clone(),
    t: 0,
    dur: 2.35,
  };
} else {
  camera.position.copy(HERO.pos);
  controls.target.copy(HERO.target);
}

const beatBar = document.getElementById('beat-bar');
const clockEl = document.getElementById('clock');
const smoothstep = (t) => t * t * (3 - 2 * t);

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (camAnim) {
    camAnim.t += dt / camAnim.dur;
    const k = smoothstep(Math.min(1, camAnim.t));
    camera.position.lerpVectors(camAnim.fromC, camAnim.toC, k);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
    if (camAnim.t >= 1) camAnim = null;
  }

  explodeCurrent += (explodeTarget - explodeCurrent) * (1 - Math.pow(0.0015, dt));
  if (Math.abs(explodeCurrent - explodeTarget) < 0.0008) explodeCurrent = explodeTarget;
  const e = explodeCurrent;
  for (const m of movers) m.group.position.lerpVectors(m.home, m.exploded, e);
  if (!explodeRange.matches(':active')) explodeRange.value = String(e);

  if (running) {
    const freq = 4 * speed;
    const amp = THREE.MathUtils.degToRad(210);
    const cycles = elapsed * freq;
    const theta = amp * Math.sin(cycles * Math.PI * 2);
    spins.balance.rotation.z = theta;
    spins.hairspring.rotation.z = theta;
    const breathe = 1 - 0.02 * Math.sin(cycles * Math.PI * 2);
    spins.hairspring.scale.set(breathe, breathe, 1);
    const vel = Math.cos(cycles * Math.PI * 2);
    spins.pallet.rotation.z = 0.18 * Math.tanh(vel * 4.5);

    const beats = cycles * 2;
    const step = Math.floor(beats);
    const frac = beats - step;
    const kick = frac < 0.78 ? 0 : smoothstep((frac - 0.78) / 0.22);
    const tooth = (Math.PI * 2) / LAYOUT.escape.teeth;
    spins.escape.rotation.z = (spins.escape.userData.phase || 0) - (step + kick) * tooth;

    const avg = beats * tooth;
    const turn = (name, sign) => {
      const s = spins[name];
      s.rotation.z = (s.userData.phase || 0) + sign * avg * (s.userData.ratio || 0);
    };
    turn('fourth', 1);
    turn('third', -1);
    turn('center', 1);
    turn('barrel', -1);
    beatBar.style.transform = `scaleX(${0.15 + Math.abs(Math.sin(cycles * Math.PI * 2)) * 0.85})`;
  }

  if (windT > 0) {
    const k = Math.min(dt, windT);
    windT -= dt;
    windAccum += k;
    crownSpin.rotation.x += k * 7.5;
    spins.ratchet.rotation.z += k * 5.5;
    spins.mainspring.rotation.z += k * 4.2;
    document.getElementById('btn-wind').classList.toggle('on', windT > 0);
  } else {
    document.getElementById('btn-wind').classList.remove('on');
  }
  if (spins.click) {
    const a = spins.ratchet.rotation.z + spins.barrel.rotation.z;
    const frac = (a / (Math.PI * 2 / 42)) % 1;
    const f = frac < 0 ? frac + 1 : frac;
    spins.click.rotation.z = Math.sin(f * Math.PI) * 0.18;
  }

  const now = new Date();
  const ms = now.getMilliseconds() / 1000;
  const sec = now.getSeconds() + ms;
  const min = now.getMinutes() + sec / 60;
  const hr = (now.getHours() % 12) + min / 60;
  secondSpin.rotation.z = -sec * (Math.PI * 2) / 60;
  minuteSpin.rotation.z = -min * (Math.PI * 2) / 60;
  hourSpin.rotation.z = -hr * (Math.PI * 2) / 12;
  clockEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });

  mats.lume.emissiveIntensity = 0.75 + Math.sin(elapsed * 1.6) * 0.1;
  mats.lumeHot.emissiveIntensity = 1.05 + Math.sin(elapsed * 1.6 + 0.6) * 0.12;

  key.position.x = 16 + Math.sin(elapsed * 0.23) * 5;
  key.position.z = 16 + Math.cos(elapsed * 0.19) * 4;

  if (hovered) placeTag(hovered);

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

window.__dbg = { camera, controls, scene, watch, THREE, crystal, mats, crownSpin, caseMesh };
{
  const view = new URLSearchParams(location.search).get('view');
  if (view === 'move') {
    crystal.visible = false;
    camera.position.set(7.2, 11.6, 8.8);
    controls.target.set(-0.2, 6.4, -2.4);
    camAnim = null;
  } else if (view === 'explode') {
    setExplode(1, true);
    camera.position.set(42, 44, 52);
    controls.target.set(0, 10, -1);
    camAnim = null;
  }
}
animate();
setTimeout(() => loader.classList.add('hide'), 400);

addEventListener('error', (ev) => fail(ev.error || ev.message));
window.addEventListener('unhandledrejection', (ev) => fail(ev.reason));
</script>
