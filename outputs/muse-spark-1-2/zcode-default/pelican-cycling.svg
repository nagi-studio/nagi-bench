<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img">
<title>海边骑自行车的鹈鹕</title>
<desc>一只逼真的鹈鹕戴着头盔在海边沙滩上骑着红色自行车，背景是落日、大海和海鸥</desc>
<defs>
  <!-- 天空渐变 -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6ABDFF"/>
    <stop offset="45%" stop-color="#9ED5FF"/>
    <stop offset="70%" stop-color="#FFE8A3"/>
    <stop offset="100%" stop-color="#FFB07A"/>
  </linearGradient>
  <!-- 海面渐变 -->
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3DB5D8"/>
    <stop offset="30%" stop-color="#2A9DB8"/>
    <stop offset="100%" stop-color="#0E4E6A"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7E2A6"/>
    <stop offset="100%" stop-color="#D9B67A"/>
  </linearGradient>
  <linearGradient id="sunGrad" x1="0.3" y1="0.3" x2="0.7" y2="0.7">
    <stop offset="0%" stop-color="#FFFDE7"/>
    <stop offset="40%" stop-color="#FFF176"/>
    <stop offset="100%" stop-color="#FF6F3C"/>
  </linearGradient>
  <linearGradient id="bikeFrame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FF4D4D"/>
    <stop offset="50%" stop-color="#E10600"/>
    <stop offset="100%" stop-color="#8A0000"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8A8A8A"/>
    <stop offset="25%" stop-color="#EDEDED"/>
    <stop offset="50%" stop-color="#A8A8A8"/>
    <stop offset="75%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#7A7A7A"/>
  </linearGradient>
  <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFB627"/>
    <stop offset="55%" stop-color="#FF8C00"/>
    <stop offset="100%" stop-color="#E85D04"/>
  </linearGradient>
  <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFC971"/>
    <stop offset="100%" stop-color="#FF7A45"/>
  </linearGradient>
  <radialGradient id="pelicanBody" cx="0.4" cy="0.35" r="0.8">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="60%" stop-color="#F2F0E9"/>
    <stop offset="100%" stop-color="#D8D3C4"/>
  </radialGradient>
  <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#B8B5AC"/>
  </linearGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
  </filter>
  <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
  </filter>
</defs>

<!-- 背景 -->
<rect width="1000" height="620" fill="url(#sky)"/>
<!-- 太阳 -->
<circle cx="840" cy="135" r="62" fill="url(#sunGrad)" opacity="0.95"/>
<circle cx="840" cy="135" r="78" fill="#FFD54F" opacity="0.18"/>
<circle cx="840" cy="135" r="100" fill="#FFAB40" opacity="0.12"/>

<!-- 云 -->
<g fill="white" opacity="0.85">
  <ellipse cx="180" cy="105" rx="55" ry="22"/>
  <ellipse cx="210" cy="92" rx="48" ry="18"/>
  <ellipse cx="240" cy="108" rx="38" ry="16"/>
  <ellipse cx="620" cy="85" rx="42" ry="16"/>
  <ellipse cx="645" cy="78" rx="32" ry="12"/>
  <ellipse cx="660" cy="90" rx="28" ry="11"/>
</g>

<!-- 远山岛屿 -->
<path d="M 0 285 Q 140 265 260 285 T 520 290 L 520 310 L 0 310 Z" fill="#0E4E6A" opacity="0.35"/>

<!-- 海面 -->
<rect x="0" y="300" width="1000" height="140" fill="url(#sea)"/>
<!-- 波浪光 -->
<g stroke="white" stroke-linecap="round" fill="none" opacity="0.9">
  <path d="M 40 340 Q 75 330 110 340 T 180 340" stroke-width="2.2" opacity="0.55"/>
  <path d="M 220 365 Q 255 355 290 365 T 360 365" stroke-width="1.8" opacity="0.45"/>
  <path d="M 700 355 Q 730 345 760 355 T 820 355" stroke-width="1.8" opacity="0.5"/>
  <path d="M 560 330 Q 590 320 620 330 T 680 330" stroke-width="2" opacity="0.5"/>
  <path d="M 380 345 Q 410 335 440 345" stroke-width="1.6" opacity="0.4"/>
</g>
<!-- 海面反光 -->
<ellipse cx="840" cy="310" rx="95" ry="18" fill="#FFE082" opacity="0.38"/>
<ellipse cx="840" cy="330" rx="70" ry="10" fill="#FFF8E1" opacity="0.35"/>

<!-- 沙滩 -->
<path d="M 0 438 Q 250 410 520 438 T 1000 445 L 1000 620 L 0 620 Z" fill="url(#sand)"/>
<!-- 沙滩纹理 -->
<g stroke="#C9A86A" stroke-width="1" opacity="0.35" stroke-linecap="round">
  <path d="M 80 520 Q 140 515 200 522"/>
  <path d="M 420 545 Q 480 540 540 548"/>
  <path d="M 700 510 Q 760 505 820 512"/>
  <path d="M 150 560 Q 190 555 230 562"/>
  <path d="M 600 560 Q 640 555 680 562"/>
</g>
<!-- 自行车与鹈鹕阴影 -->
<ellipse cx="500" cy="568" rx="175" ry="18" fill="#000" opacity="0.18"/>

<!-- ========== 自行车 ========== -->
<g id="bicycle" filter="url(#shadow)">
  <!-- 后轮 -->
  <g id="wheel-rear">
    <circle cx="380" cy="485" r="76" fill="none" stroke="#1A1A1A" stroke-width="10"/>
    <circle cx="380" cy="485" r="76" fill="none" stroke="#333" stroke-width="2" opacity="0.9"/>
    <circle cx="380" cy="485" r="68" fill="none" stroke="#E0E0E0" stroke-width="1.2" opacity="0.9"/>
    <!-- 辐条 -->
    <g stroke="#B0B0B0" stroke-width="1.3" opacity="0.9">
      <line x1="380" y1="417" x2="380" y2="553"/>
      <line x1="312" y1="485" x2="448" y2="485"/>
      <line x1="332" y1="437" x2="428" y2="533"/>
      <line x1="332" y1="533" x2="428" y2="437"/>
      <line x1="355" y1="421" x2="405" y2="549"/>
      <line x1="355" y1="549" x2="405" y2="421"/>
    </g>
    <circle cx="380" cy="485" r="9" fill="url(#chrome)" stroke="#555" stroke-width="1.2"/>
    <!-- 轮胎反光 -->
    <path d="M 325 435 A 76 76 0 0 1 395 412" fill="none" stroke="white" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  </g>
  <!-- 前轮 -->
  <g id="wheel-front">
    <circle cx="640" cy="485" r="76" fill="none" stroke="#1A1A1A" stroke-width="10"/>
    <circle cx="640" cy="485" r="76" fill="none" stroke="#333" stroke-width="2" opacity="0.9"/>
    <circle cx="640" cy="485" r="68" fill="none" stroke="#E0E0E0" stroke-width="1.2" opacity="0.9"/>
    <g stroke="#B0B0B0" stroke-width="1.3" opacity="0.9">
      <line x1="640" y1="417" x2="640" y2="553"/>
      <line x1="572" y1="485" x2="708" y2="485"/>
      <line x1="592" y1="437" x2="688" y2="533"/>
      <line x1="592" y1="533" x2="688" y2="437"/>
      <line x1="615" y1="421" x2="665" y2="549"/>
      <line x1="615" y1="549" x2="665" y2="421"/>
    </g>
    <circle cx="640" cy="485" r="9" fill="url(#chrome)" stroke="#555" stroke-width="1.2"/>
    <path d="M 585 435 A 76 76 0 0 1 655 412" fill="none" stroke="white" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- 车架 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 下管 + 上管 + 立管 -->
    <path d="M 465 465 L 575 398 L 425 398 Z" fill="none" stroke="url(#bikeFrame)" stroke-width="11"/>
    <path d="M 425 398 L 380 485" fill="none" stroke="url(#bikeFrame)" stroke-width="10"/>
    <path d="M 575 398 L 640 485" fill="none" stroke="#C40000" stroke-width="9"/>
    <path d="M 465 465 L 380 485" fill="none" stroke="url(#bikeFrame)" stroke-width="9"/>
    <!-- 亮边高光 -->
    <path d="M 425 398 L 465 465 L 575 398" fill="none" stroke="white" stroke-width="1.6" opacity="0.28"/>
  </g>

  <!-- 中轴 / 牙盘 -->
  <circle cx="465" cy="465" r="18" fill="#2B2B2B" stroke="#555" stroke-width="2"/>
  <circle cx="465" cy="465" r="12" fill="none" stroke="#888" stroke-width="1.2"/>
  <circle cx="465" cy="465" r="4" fill="#DDD"/>

  <!-- 链条 -->
  <path d="M 465 465 L 392 482 L 382 492 L 465 482 Z" fill="none" stroke="#777" stroke-width="3" opacity="0.95"/>
  <path d="M 382 492 L 465 482" stroke="#AAA" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 曲柄与脚踏 -->
  <g id="crank">
    <line x1="465" y1="465" x2="495" y2="500" stroke="#222" stroke-width="8" stroke-linecap="round"/>
    <line x1="465" y1="465" x2="435" y2="430" stroke="#222" stroke-width="8" stroke-linecap="round"/>
    <rect x="485" y="495" width="32" height="12" rx="3" fill="#111" stroke="#444" stroke-width="1.2" transform="rotate(-12 501 501)"/>
    <rect x="415" y="422" width="32" height="12" rx="3" fill="#111" stroke="#444" stroke-width="1.2" transform="rotate(-12 431 428)"/>
  </g>

  <!-- 车座 -->
  <path d="M 395 390 Q 425 375 445 395 L 435 405 Q 415 405 395 400 Z" fill="#1A1A1A" stroke="#333" stroke-width="1.5"/>
  <line x1="425" y1="398" x2="430" y2="385" stroke="url(#chrome)" stroke-width="6" stroke-linecap="round"/>

  <!-- 车把 -->
  <g>
    <line x1="575" y1="398" x2="585" y2="365" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>
    <line x1="565" y1="365" x2="605" y2="365" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="565" cy="365" r="7" fill="#111"/>
    <circle cx="605" cy="365" r="7" fill="#111"/>
    <!-- 车铃 -->
    <circle cx="592" cy="355" r="9" fill="url(#chrome)" stroke="#777" stroke-width="1"/>
    <circle cx="592" cy="355" r="3" fill="white" opacity="0.6"/>
  </g>

  <!-- 挡泥板 -->
  <path d="M 320 445 A 76 76 0 0 1 430 415" fill="none" stroke="#E10600" stroke-width="5" opacity="0.9" stroke-linecap="round"/>
  <path d="M 585 415 A 76 76 0 0 1 695 445" fill="none" stroke="#E10600" stroke-width="5" opacity="0.9" stroke-linecap="round"/>

  <!-- 水壶 -->
  <rect x="485" y="410" width="18" height="32" rx="6" fill="#29B6F6" stroke="#0288D1" stroke-width="1.2"/>
  <rect x="485" y="410" width="18" height="10" rx="4" fill="#0288D1"/>
</g>

<!-- ========== 鹈鹕 ========== -->
<g id="pelican" filter="url(#softShadow)">
  <!-- 尾羽 -->
  <g fill="#3A3A3A">
    <ellipse cx="355" cy="420" rx="28" ry="14" transform="rotate(-18 355 420)"/>
    <ellipse cx="345" cy="410" rx="26" ry="10" transform="rotate(-25 345 410)"/>
  </g>
  <!-- 身体主体 -->
  <ellipse cx="430" cy="415" rx="78" ry="58" fill="url(#pelicanBody)" stroke="#CFCAC0" stroke-width="1.2"/>
  <!-- 胸腹羽毛纹理 -->
  <g fill="none" stroke="#D8D3C4" stroke-width="1.1" opacity="0.9" stroke-linecap="round">
    <path d="M 385 405 Q 400 415 385 425"/>
    <path d="M 395 395 Q 410 405 395 415"/>
    <path d="M 405 425 Q 420 435 405 445"/>
    <path d="M 415 405 Q 430 415 415 425"/>
  </g>
  <!-- 翅膀（收拢但张开一点，搭在车把上） -->
  <g>
    <path d="M 455 390 Q 520 365 555 365 Q 545 385 510 400 Q 480 418 445 420 Z" fill="url(#wingGrad)" stroke="#A8A5A0" stroke-width="1.2"/>
    <!-- 飞羽分叉 -->
    <g stroke="#9A9790" stroke-width="1.1" fill="none" opacity="0.8">
      <path d="M 515 372 L 505 398"/>
      <path d="M 530 368 L 520 395"/>
      <path d="M 545 366 L 535 390"/>
    </g>
    <!-- 翅尖黑色 -->
    <path d="M 535 365 Q 555 365 558 372 Q 552 388 535 390 Z" fill="#2B2B2B"/>
  </g>
  <!-- 另一侧翅膀（身体后侧） -->
  <path d="M 395 385 Q 370 395 365 420 Q 380 415 395 400 Z" fill="#E8E6E1" stroke="#CFCAC0" stroke-width="1"/>

  <!-- 腿 -->
  <!-- 左腿（前） -->
  <g>
    <path d="M 430 465 Q 445 485 490 495" fill="none" stroke="#FF7B1A" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
    <path d="M 490 495 L 505 495 L 508 502 L 485 502 Z" fill="#FF7B1A" stroke="#D65A00" stroke-width="1.2"/>
    <!-- 脚蹼纹理 -->
    <path d="M 488 502 L 492 508 M 495 502 L 498 509 M 502 502 L 504 508" stroke="#8A3B00" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- 右腿（后） -->
  <g opacity="0.92">
    <path d="M 418 462 Q 425 445 432 428" fill="none" stroke="#E86E00" stroke-width="7" stroke-linecap="round"/>
    <path d="M 432 428 L 445 425 L 447 432 L 428 434 Z" fill="#E86E00" stroke="#B95000" stroke-width="1"/>
  </g>

  <!-- 脖子 -->
  <path d="M 475 395 Q 495 350 520 305" fill="none" stroke="#FFFEFD" stroke-width="32" stroke-linecap="round"/>
  <path d="M 475 395 Q 495 350 520 305" fill="none" stroke="#E8E0D0" stroke-width="32" stroke-linecap="round" opacity="0.25"/>
  <!-- 脖子阴影 -->
  <path d="M 485 380 Q 500 345 518 315" fill="none" stroke="#D8D3C4" stroke-width="1.2" opacity="0.6"/>

  <!-- 头 -->
  <ellipse cx="540" cy="295" rx="38" ry="36" fill="url(#pelicanBody)" stroke="#CFCAC0" stroke-width="1.1"/>
  <!-- 头顶羽冠 -->
  <path d="M 515 270 Q 505 250 515 240 Q 525 255 530 270 Z" fill="#FFD54F" stroke="#E6A800" stroke-width="1" opacity="0.95"/>
  <path d="M 520 265 Q 512 248 518 238" fill="none" stroke="#FFF8E1" stroke-width="1.2" opacity="0.7"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="545" cy="285" rx="14" ry="15" fill="white" stroke="#B0AAA0" stroke-width="1"/>
    <circle cx="547" cy="287" r="8.5" fill="#1A1A1A"/>
    <circle cx="549" cy="285" r="3.2" fill="white" opacity="0.95"/>
    <circle cx="544" cy="290" r="1.5" fill="#4FC3F7" opacity="0.9"/>
    <!-- 眼睑 -->
    <path d="M 532 278 Q 545 272 558 278" fill="none" stroke="#8D877E" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- 眼周裸皮 -->
  <ellipse cx="545" cy="287" rx="18" ry="19" fill="none" stroke="#FF8C42" stroke-width="1.6" opacity="0.55"/>

  <!-- 喙 -->
  <g>
    <!-- 上喙 -->
    <path d="M 560 285 Q 610 288 660 305 L 665 318 Q 610 312 560 305 Z" fill="url(#beakGrad)" stroke="#B95000" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- 喙尖红点 -->
    <ellipse cx="662" cy="311" rx="5" ry="7" fill="#C62828" opacity="0.9"/>
    <!-- 鼻孔 -->
    <ellipse cx="575" cy="295" rx="4" ry="1.8" fill="#5D2E00" opacity="0.7"/>
    <!-- 喉囊（鹈鹕大囊） -->
    <path d="M 560 305 Q 585 335 610 345 Q 625 350 635 335 Q 595 328 560 305" fill="url(#pouchGrad)" stroke="#E86A2C" stroke-width="1.3"/>
    <path d="M 560 305 Q 575 318 590 330 Q 605 338 625 335" fill="none" stroke="#8A3B00" stroke-width="1" opacity="0.35"/>
    <!-- 下喙 -->
    <path d="M 560 305 L 635 335 L 632 342 Q 585 350 558 312 Z" fill="#FF9F1C" stroke="#B95000" stroke-width="1.1"/>
  </g>

  <!-- 头盔 -->
  <g>
    <path d="M 515 260 Q 540 225 580 245 Q 595 260 590 280 L 512 282 Q 505 270 515 260 Z" fill="#00ACC1" stroke="#00838F" stroke-width="1.5"/>
    <path d="M 515 260 Q 540 225 580 245" fill="none" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <ellipse cx="552" cy="252" rx="18" ry="6" fill="white" opacity="0.28"/>
    <!-- 盔带 -->
    <path d="M 525 282 Q 545 305 565 285" fill="none" stroke="#006064" stroke-width="3" stroke-linecap="round"/>
    <circle cx="532" cy="292" r="3" fill="#333"/>
    <!-- 透气孔 -->
    <ellipse cx="545" cy="265" rx="6" ry="3.5" fill="#006064" opacity="0.9"/>
    <ellipse cx="565" cy="260" rx="5" ry="3" fill="#006064" opacity="0.9"/>
  </g>

  <!-- 墨镜（飞行风镜） -->
  <g opacity="0.92">
    <path d="M 525 283 Q 545 283 565 288 Q 568 295 565 302 Q 545 305 525 298 Z" fill="#111" stroke="#FFD54F" stroke-width="1.5" rx="6"/>
    <rect x="527" y="286" width="38" height="14" rx="6" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <!-- 镜面反光 -->
    <path d="M 530 288 L 538 298" stroke="white" stroke-width="1.8" opacity="0.7" stroke-linecap="round"/>
    <path d="M 550 289 L 556 297" stroke="white" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <!-- 镜带 -->
    <path d="M 525 290 Q 515 292 512 285" fill="none" stroke="#111" stroke-width="2.5"/>
  </g>

  <!-- 翅膀手（抓住车把）-->
  <ellipse cx="582" cy="368" rx="12" ry="8" fill="#FF7B1A" stroke="#B95000" stroke-width="1"/>
  <path d="M 582 368 L 590 365 L 592 370 L 582 372 Z" fill="#FF7B1A"/>

  <!-- 骑行服/小围巾 随风飘 -->
  <path d="M 480 365 Q 470 370 465 385 Q 472 390 480 385 Q 485 375 480 365" fill="#FF3B30" stroke="#B71C1C" stroke-width="1"/>
  <path d="M 465 385 Q 445 395 430 410 Q 435 418 450 410 Q 468 398 472 390 Z" fill="#FF3B30" opacity="0.95"/>
  <path d="M 430 410 Q 420 418 415 430 Q 422 432 430 418 Z" fill="#FF3B30" opacity="0.85"/>

</g>

<!-- 前景沙粒细节 -->
<g fill="#C9A86A" opacity="0.5">
  <circle cx="88" cy="575" r="1.8"/>
  <circle cx="92" cy="578" r="1.2"/>
  <circle cx="750" cy="555" r="1.6"/>
  <circle cx="755" cy="558" r="1"/>
  <circle cx="820" cy="585" r="1.4"/>
</g>

<!-- 海鸥 -->
<g stroke="#2B2B2B" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.75">
  <path d="M 120 165 Q 128 158 136 165 Q 144 158 152 165"/>
  <path d="M 280 135 Q 288 128 296 135 Q 304 128 312 135" opacity="0.6"/>
  <path d="M 700 155 Q 710 148 720 155 Q 730 148 740 155" opacity="0.55"/>
  <path d="M 780 110 Q 788 103 796 110 Q 804 103 812 110" opacity="0.5"/>
</g>

<!-- 速度线 -->
<g stroke="white" stroke-width="2" opacity="0.55" stroke-linecap="round">
  <line x1="280" y1="430" x2="240" y2="430"/>
  <line x1="285" y1="445" x2="250" y2="445" opacity="0.4"/>
  <line x1="718" y1="425" x2="760" y2="425" opacity="0.5"/>
</g>

<!-- 标题文字 -->
<g text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <text x="500" y="48" font-size="26" font-weight="800" fill="white" stroke="#0E4E6A" stroke-width="4" paint-order="stroke" letter-spacing="3">鹈鹕的海边骑行</text>
  <text x="500" y="72" font-size="12.5" fill="white" opacity="0.92" letter-spacing="2">PELICAN RIDING ALONG THE COAST • SUNSET BEACH</text>
</g>

<!-- 轮组转动动画 -->
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<!-- 用 animateTransform 实现更兼容 -->
<g>
  <animateTransform xlink:href="#wheel-rear" attributeName="transform" type="rotate" from="0 380 485" to="360 380 485" dur="0.9s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#wheel-front" attributeName="transform" type="rotate" from="0 640 485" to="360 640 485" dur="0.9s" repeatCount="indefinite"/>
</g>

</svg>
