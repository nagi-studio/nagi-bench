<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>水运仪象台 · 水如何驱动一座报时的天文钟</title>
    <style>
      /* 首屏关键样式内联：脚本还没执行时就能看到片名页 */
      html,body{margin:0;height:100%;background:#070a0f;overflow:hidden}
      #stage{position:fixed;inset:0;overflow:hidden}
      #stage>*{visibility:hidden}
      #stage>#loading,#stage>#title{visibility:visible}
      #loading{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 35%,#1b2530 0%,#0e141c 55%,#07090d 100%);transition:opacity .9s}
      #loading span{position:absolute;left:6vw;bottom:9vh;font:14px/1 "Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;letter-spacing:.4em;color:#e8c47a;opacity:.85}
      #loading.gone{opacity:0;pointer-events:none}
      #title{position:absolute;left:6vw;bottom:17vh;pointer-events:none;z-index:5;font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun","PingFang SC","Microsoft YaHei",serif}
      #title h1{margin:0;font-weight:900;font-size:clamp(40px,7.4vw,108px);letter-spacing:.14em;color:#f3e9d2;text-shadow:0 4px 30px rgba(0,0,0,.8);line-height:1.05}
      #title p{margin:.9em 0 0;font-size:clamp(13px,1.5vw,22px);letter-spacing:.22em;color:#e8c47a;text-shadow:0 2px 10px #000}
      #title .seal{display:inline-block;font-weight:900;font-size:clamp(14px,1.5vw,22px);color:#fff3e2;background:#c8402e;padding:.18em .32em .22em;border-radius:4px;margin-bottom:.9em;box-shadow:0 2px 10px rgba(0,0,0,.5)}
    </style>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
      <svg id="leaders"></svg>
      <div id="labels"></div>
      <div id="vignette"></div>

      <div id="chain" class="hud">
        <span data-s="1">水</span><i>›</i><span data-s="2">水斗</span><i>›</i><span data-s="3">擒纵</span><i>›</i><span data-s="4">枢轮</span><i>›</i><span data-s="5">齿轮·天柱</span><i>›</i><span data-s="6">浑象·浑仪</span><i>›</i><span data-s="7">报时</span>
      </div>
      <div id="note" class="hud"></div>

      <div id="title">
        <div class="seal">宋</div>
        <h1>水运仪象台</h1>
        <p>北宋 · 苏颂、韩公廉 &nbsp;|&nbsp; 公元 1092 年 · 开封</p>
      </div>

      <div id="caption"><div class="step"></div><div class="text"></div></div>

      <div id="endcard">
        <h2>匀速的水 <b>→</b> 等时的"一格" <b>→</b> 天象与时刻</h2>
        <p>九百多年前的水力天文钟 · 画面中的每一次转动都由刚体物理实时算出</p>
        <button id="replay">↻ 重播</button>
      </div>

      <button id="sound">🔇 点击开启声音</button>
      <div id="loading"><span>正在注水 …</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
