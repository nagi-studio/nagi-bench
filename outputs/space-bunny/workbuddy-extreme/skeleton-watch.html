<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skeleton Watch - 镂空机械表</title>
<style>
  :root{
    --gold:#c9a86a;
    --gold-dim:rgba(201,168,106,.34);
    --line:rgba(201,168,106,.20);
    --ink:#e9e6e0;
    --ink-dim:#8d8a85;
    --ink-soft:rgba(233,230,224,.62);
    --panel:rgba(10,11,15,.72);
    --serif:"Didot","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#06070a;overflow:hidden;
    font-family:var(--sans);color:var(--ink)}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0}

  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud > *{pointer-events:auto}

  /* ---------- 左上：标题 ---------- */
  #brand{top:26px;left:28px;max-width:340px}
  #brand .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.34em;
    color:var(--gold);text-transform:uppercase;margin-bottom:10px}
  #brand h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;
    margin:0 0 6px;letter-spacing:.01em}
  #brand h1 small{display:block;font-size:13px;font-family:var(--sans);
    letter-spacing:.26em;color:var(--ink-soft);margin-top:9px;text-transform:uppercase}
  #brand .rule{width:46px;height:1px;background:var(--gold);margin:16px 0 14px;opacity:.7}
  #brand .cal{font-family:var(--mono);font-size:10.5px;line-height:1.85;color:var(--ink-soft);letter-spacing:.04em}

  /* ---------- 左下：机芯信息 / 零件详情 ---------- */
  #panel{bottom:26px;left:28px;width:330px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);padding:18px 18px 16px}
  #panel .cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;
    color:var(--gold);text-transform:uppercase;margin-bottom:9px;min-height:12px}
  #panel h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px;line-height:1.2}
  #panel .en{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px}
  #panel .desc{font-size:12.5px;line-height:1.75;color:var(--ink-soft);margin:0 0 14px;
    min-height:44px;letter-spacing:.01em}
  #panel .specs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;
    border-top:1px solid var(--line);padding-top:12px}
  #panel .specs dt{font-family:var(--mono);font-size:10px;color:var(--gold);
    letter-spacing:.06em;white-space:nowrap}
  #panel .specs dd{margin:0;font-size:11.5px;color:var(--ink-soft);text-align:right}

  /* ---------- 右上：零件清单 ---------- */
  #index{top:26px;right:28px;width:236px;max-height:calc(100% - 210px);
    overflow-y:auto;overflow-x:hidden;padding-right:4px}
  #index::-webkit-scrollbar{width:2px}
  #index::-webkit-scrollbar-thumb{background:var(--gold-dim)}
  #index .hd{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--gold);
    text-transform:uppercase;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  #index button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
    background:none;border:0;border-left:1px solid transparent;padding:6px 0 6px 10px;
    color:var(--ink-soft);font-family:var(--sans);font-size:12px;cursor:pointer;
    transition:color .18s,border-color .18s,background .18s}
  #index button em{font-family:var(--mono);font-size:9px;font-style:normal;
    color:var(--gold);opacity:.5;width:17px;flex:none}
  #index button:hover{color:var(--ink);border-left-color:var(--gold-dim)}
  #index button.on{color:#fff;border-left-color:var(--gold);background:linear-gradient(90deg,rgba(201,168,106,.11),transparent)}

  /* ---------- 底部：控制台 ---------- */
  #dock{bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:22px;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 22px}
  .grp{display:flex;align-items:center;gap:10px}
  .sep{width:1px;height:30px;background:var(--line)}
  .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--gold);
    text-transform:uppercase;white-space:nowrap}
  #dock button{background:none;border:1px solid var(--line);color:var(--ink-soft);
    font-family:var(--sans);font-size:11.5px;padding:7px 14px;cursor:pointer;
    transition:all .18s;white-space:nowrap}
  #dock button:hover{border-color:var(--gold-dim);color:var(--ink)}
  #dock button.on{border-color:var(--gold);color:#0a0b0f;background:var(--gold)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:1px;
    background:var(--gold-dim);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 0 4px rgba(201,168,106,.16)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;
    background:var(--gold);cursor:pointer}

  /* ---------- 悬浮标签 ---------- */
  #tags{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
  .tag{position:absolute;transform:translate(0,-50%);white-space:nowrap;
    font-size:11px;color:var(--ink);letter-spacing:.02em;
    text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .2s}
  .tag.show{opacity:1}
  .tag .n{display:inline-block;font-family:var(--mono);font-size:9px;color:#0a0b0f;
    background:var(--gold);padding:1px 4px;margin-right:7px;vertical-align:1px}
  .tag.pin{transform:translate(0,-50%)}
  .tag .dot{position:absolute;width:5px;height:5px;background:var(--gold);
    border-radius:50%;left:-13px;top:50%;margin-top:-2.5px;
    box-shadow:0 0 0 3px rgba(201,168,106,.18)}
  .tag.pin .dot{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(201,168,106,.18)}
    50%{box-shadow:0 0 0 7px rgba(201,168,106,.05)}}

  /* ---------- 提示 / 载入 ---------- */
  #hint{bottom:104px;left:50%;transform:translateX(-50%);font-family:var(--mono);
    font-size:9.5px;letter-spacing:.18em;color:rgba(233,230,224,.34);text-transform:uppercase;
    text-align:center;white-space:nowrap}
  #boot{position:fixed;inset:0;z-index:40;background:#06070a;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .7s;
    /* 首帧渲染在部分设备上可能耗时较久。遮罩不拦截指针事件，
       使其淡出期间界面仍可操作；元素本身在过渡结束后由脚本移除。 */
    pointer-events:none}
  #boot.done{opacity:0}
  #boot .t{font-family:var(--serif);font-size:22px;letter-spacing:.16em;color:var(--ink)}
  #boot .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--gold);
    text-transform:uppercase}
  #boot .bar{width:132px;height:1px;background:rgba(201,168,106,.2);overflow:hidden;position:relative}
  #boot .bar i{position:absolute;inset:0;background:var(--gold);
    animation:sweep 1.25s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  #boot .err{display:none;max-width:420px;text-align:center;font-size:12.5px;
    line-height:1.8;color:var(--ink-soft);padding:0 24px;user-select:text;cursor:text}
  #boot.failed{pointer-events:auto}
  #boot.failed .bar{display:none}
  #boot.failed .err{display:block}

  @media (max-width:1180px){
    #index{display:none}
    #panel{width:250px}
    #brand h1{font-size:23px}
  }
  @media (max-width:1000px), (max-height:720px){
    /* 空间不足：面板移至左上下沉，控制台独占底部一行，杜绝重叠 */
    #panel{
      bottom:auto;top:132px;left:16px;right:16px;width:auto;max-width:250px;
      padding:12px 13px 11px;max-height:calc(100% - 250px);overflow-y:auto
    }
    #panel h2{font-size:17px}
    #panel .desc{font-size:11.5px;min-height:0;margin-bottom:10px}
    #panel .specs{gap:4px 12px;padding-top:9px}
    #brand{top:14px;left:16px}
    #brand h1{font-size:21px}
    #brand .cal{font-size:9.5px;line-height:1.6}
    #dock{gap:10px;padding:9px 12px;flex-wrap:wrap;max-width:96vw;justify-content:center}
    .sep{display:none}
    #hint{display:none}
  }
  @media (max-width:620px){
    #panel{display:none}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="tags"></div>

<div class="hud" id="brand">
  <div class="kicker">Manufacture Movement</div>
  <h1>镂空机械腕表<small>Skeleton Automatic</small></h1>
  <div class="rule"></div>
  <div class="cal">
    CAL. NB&#8209;S13 &nbsp;/&nbsp; 21 JEWELS<br />
    28,800 A/h &nbsp;·&nbsp; 72 h &nbsp;·&nbsp; SAPPHIRE
  </div>
</div>

<div class="hud" id="panel">
  <div class="cat" id="p-cat">机芯概览 / Movement</div>
  <h2 id="p-zh">手动上链机械机芯</h2>
  <div class="en" id="p-en">Hand-Wound Mechanical Movement</div>
  <p class="desc" id="p-desc"></p>
  <dl class="specs" id="p-specs"></dl>
</div>

<div class="hud" id="index">
  <div class="hd">零件索引 / Components</div>
  <div id="index-list"></div>
</div>

<div class="hud" id="dock">
  <div class="grp">
    <span class="lab">Explode</span>
    <input type="range" id="exp" min="0" max="100" value="0" step="0.5" />
    <span class="lab" id="exp-v" style="width:34px">0%</span>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btn-exp">分解视图</button>
    <button id="btn-flip">翻至背面</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btn-spin" class="on">旋转</button>
    <button id="btn-lab" class="on">标注</button>
    <button id="btn-run" class="on">机芯运转</button>
  </div>
</div>

<div id="hint">拖拽旋转 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; 悬停查看零件 &nbsp;·&nbsp; 点击锁定说明</div>

<div id="boot">
  <div class="t">镂空机械腕表</div>
  <div class="s">Calibre NB&#8209;S13</div>
  <div class="bar"><i></i></div>
  <div class="err" id="boot-err"></div>
</div>

<script>
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot'), m = document.getElementById('boot-err');
    if (b && !b.classList.contains('failed') && m) {
      b.classList.add('failed');
      m.textContent = '渲染初始化失败：' + ((e && e.message) || '未知错误') +
        '。请确认浏览器支持 WebGL2，并可访问 cdn.jsdelivr.net。';
    }
  });
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !window.__watchReady && !b.classList.contains('failed')) {
      b.classList.add('failed');
      document.getElementById('boot-err').textContent =
        '加载时间过长：请检查网络是否可以访问 cdn.jsdelivr.net，并确认浏览器支持 WebGL2。';
    }
  }, 15000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* ==========================================================================
   0. 常量与调色
   ========================================================================== */
const TAU = Math.PI * 2;
const D2R = Math.PI / 180;
const MODEL_SCALE = 0.5;

// 机芯轮系布局：相邻两轮中心距 = 前轮齿顶圆半径 + 后轮小齿(pinion)半径
// center(0,0) r3.20 → third(-3.52,-1.28) r1.85  中心距 3.75 ≈ 3.20+0.50
// third → fourth(-4.51,-3.52) r1.55            中心距 2.45 ≈ 1.85+0.48
// fourth → escape(-3.53,-5.23) r1.00           中心距 1.97 ≈ 1.55+0.42
// barrel(0,3.22) r2.60 → center                中心距 3.22 ≈ 2.60+0.62
const P = {
  barrel:  { x:  0.00, y:  3.22, r: 2.60, rt: 2.60, teeth: 84 },
  center:  { x:  0.00, y:  0.00, r: 3.20, rt: 3.20, teeth: 64 },
  third:   { x: -3.52, y: -1.28, r: 1.85, rt: 1.85, teeth: 56 },
  fourth:  { x: -4.51, y: -3.52, r: 1.55, rt: 1.55, teeth: 50 },
  escape:  { x: -3.53, y: -5.23, r: 0.86, rt: 1.00, teeth: 15 },
  pallet:  { x: -1.89, y: -4.63 },
  balance: { x:  0.00, y: -3.95, r: 2.05 }
};

// 高度层（Z 轴：0 = 时标圈内缘基准面，正向为表盘正面）
const Z = {
  caseBack:   -1.98,
  rotor:      -1.72,
  plate:      -1.18,
  barrelBase: -1.14,
  barrelTop:  -0.62,
  spring:     -0.92,
  wheelLow:   -0.30,   // 番车层（发条盒 / 三番车 齿圈）
  wheelHigh:   0.18,   // 中心轮 / 四番车 层
  pinionLow:  -0.72,   // 小齿层
  roller:      0.06,   // 圆盘钉
  pallet:      0.10,   // 擒纵叉
  hairspring:  0.52,   // 游丝
  bridgeA:     0.72,   // 发条夹板
  bridgeB:     0.80,   // 轮系夹板
  cock:        0.92,   // 摆轮夹板
  chapter:     1.06,   // 时标圈
  indices:     1.14,
  hourHand:    1.30,
  minuteHand:  1.54,
  cap:         1.72,
  crystal:     1.96    // 镜面内表面
};

/* ==========================================================================
   1. 程序化纹理（珍珠纹 / 日内瓦条纹 / 太阳纹 / 拉丝）
   ========================================================================== */
function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h || w;
  return c;
}
function tex(canvas, rx, ry) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 1, ry || rx || 1);
  t.anisotropy = 8;
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

// 珍珠纹：圆形磨砂叠瓦
function perlageCanvas(size, step) {
  const c = cv(size), g = c.getContext('2d');
  g.fillStyle = '#8a8a8a';
  g.fillRect(0, 0, size, size);
  const s = step || size / 26;
  for (let y = -s; y < size + s; y += s * 0.62) {
    for (let x = -s; x < size + s; x += s) {
      const off = (Math.round(y / (s * 0.62)) % 2) * s * 0.5;
      const cx = x + off, cy = y;
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, s * 0.78);
      gr.addColorStop(0, 'rgba(255,255,255,0.30)');
      gr.addColorStop(0.55, 'rgba(150,150,150,0.14)');
      gr.addColorStop(1, 'rgba(40,40,40,0.30)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(cx, cy, s * 0.78, 0, TAU); g.fill();
    }
  }
  return c;
}

// 日内瓦条纹：平行波纹带
function cotesCanvas(size) {
  const c = cv(size), g = c.getContext('2d');
  g.fillStyle = '#8e8e8e';
  g.fillRect(0, 0, size, size);
  const band = size / 13;
  for (let i = 0; i * band < size + band; i++) {
    const gr = g.createLinearGradient(0, i * band, 0, (i + 1) * band);
    gr.addColorStop(0, 'rgba(255,255,255,0.26)');
    gr.addColorStop(0.42, 'rgba(120,120,120,0.10)');
    gr.addColorStop(1, 'rgba(28,28,28,0.34)');
    g.fillStyle = gr;
    g.fillRect(0, i * band, size, band);
  }
  return c;
}

// 太阳纹：中心放射
function soleilCanvas(size) {
  const c = cv(size), g = c.getContext('2d');
  g.fillStyle = '#909090';
  g.fillRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2;
  for (let a = 0; a < 360; a += 1.4) {
    const r = a * D2R;
    g.strokeStyle = a % 2.8 < 1.4 ? 'rgba(255,255,255,0.14)' : 'rgba(24,24,24,0.16)';
    g.lineWidth = 1.15;
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(r) * size, cy + Math.sin(r) * size);
    g.stroke();
  }
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, size * 0.5);
  gr.addColorStop(0, 'rgba(255,255,255,0.24)');
  gr.addColorStop(0.6, 'rgba(255,255,255,0.02)');
  gr.addColorStop(1, 'rgba(0,0,0,0.24)');
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return c;
}

// 细密圆拉丝（用于发条盒盖 / 底盖）
function brushCanvas(size) {
  const c = cv(size), g = c.getContext('2d');
  g.fillStyle = '#8c8c8c';
  g.fillRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2;
  for (let r = 3; r < size * 0.72; r += 1.6) {
    g.strokeStyle = (r % 3.2 < 1.6) ? 'rgba(255,255,255,0.11)' : 'rgba(22,22,22,0.13)';
    g.lineWidth = 0.85;
    g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();
  }
  return c;
}

const TEX = {
  perlage: tex(perlageCanvas(1024, 46), 0.30),
  cotes:   tex(cotesCanvas(1024), 0.22),
  soleil:  tex(soleilCanvas(1024), 1),
  brush:   tex(brushCanvas(1024), 1)
};

/* ==========================================================================
   2. 材质库（每个零件独立实例，便于独立高亮）
   ========================================================================== */
const M = {
  plate: (map, repeat) => new THREE.MeshPhysicalMaterial({
    // 主夹板采用哑光镀铑处理：低金属度 + 高粗糙度，避免形成横贯表盘的镜面亮带
    color: 0x6f747c, metalness: 0.42, roughness: 0.78,
    roughnessMap: map, bumpMap: map, bumpScale: 0.035,
    envMapIntensity: 0.22, specularIntensity: 0.35
  }),
  bridge: (map) => new THREE.MeshPhysicalMaterial({
    // 夹板为日内瓦条纹饰面，同样避免大面积镜面
    color: 0x82878f, metalness: 0.55, roughness: 0.66,
    roughnessMap: map, bumpMap: map, bumpScale: 0.028,
    envMapIntensity: 0.26, clearcoat: 0.10, clearcoatRoughness: 0.42
  }),
  rose: () => new THREE.MeshPhysicalMaterial({
    color: 0xb07d52, metalness: 1, roughness: 0.30, envMapIntensity: 0.70,
    clearcoat: 0.22, clearcoatRoughness: 0.30
  }),
  gold: () => new THREE.MeshPhysicalMaterial({
    color: 0xc09848, metalness: 1, roughness: 0.27, envMapIntensity: 0.76,
    clearcoat: 0.18, clearcoatRoughness: 0.26
  }),
  steel: () => new THREE.MeshPhysicalMaterial({
    // 表壳：哑光拉丝不锈钢。压低金属度以消除内壁形成的横向镜面亮带
    color: 0x8b9098, metalness: 0.58, roughness: 0.62,
    envMapIntensity: 0.30, specularIntensity: 0.45,
    side: THREE.DoubleSide
  }),
  steelS: (map) => new THREE.MeshPhysicalMaterial({
    // 中壳/底盖：哑光拉丝，同样压制镜面
    color: 0x848990, metalness: 0.55, roughness: 0.66,
    roughnessMap: map, bumpMap: map, bumpScale: 0.018, envMapIntensity: 0.26,
    specularIntensity: 0.40, side: THREE.DoubleSide
  }),
  blued: () => new THREE.MeshPhysicalMaterial({
    color: 0x1b3676, metalness: 1, roughness: 0.22, envMapIntensity: 0.80,
    clearcoat: 0.35, clearcoatRoughness: 0.16
  }),
  spring: () => new THREE.MeshPhysicalMaterial({
    color: 0x26478c, metalness: 1, roughness: 0.25, envMapIntensity: 0.72
  }),
  ruby: () => new THREE.MeshPhysicalMaterial({

/* ==========================================================================
   3. 几何工具
   ========================================================================== */
function extrude(shape, depth, opt) {
  const o = Object.assign({
    depth: depth, bevelEnabled: true, bevelThickness: 0.018,
    bevelSize: 0.018, bevelSegments: 1, curveSegments: 8
  }, opt || {});
  const g = new THREE.ExtrudeGeometry(shape, o);
  g.translate(0, 0, -depth / 2);
  return g;
}

// 圆盘齿轮轮廓（梯形齿）
function gearShape(teeth, rOut, rIn, opt) {
  const o = Object.assign({ toothFrac: 0.52, tipFrac: 0.24, flank: 0.16 }, opt || {});
  const s = new THREE.Shape();
  const st = TAU / teeth, h = st / 2;
  for (let i = 0; i < teeth; i++) {
    const a = i * st;
    const P0 = [a - h * 0.99, rIn];
    const P1 = [a - h * (o.toothFrac * 0.5 + o.flank), rIn + (rOut - rIn) * 0.62];
    const P2 = [a - h * o.tipFrac * 0.5, rOut];
    const P3 = [a + h * o.tipFrac * 0.5, rOut];
    const P4 = [a + h * (o.toothFrac * 0.5 + o.flank), rIn + (rOut - rIn) * 0.62];
    const P5 = [a + h * 0.99, rIn];
    if (i === 0) s.moveTo(Math.cos(P0[0]) * P0[1], Math.sin(P0[0]) * P0[1]);
    s.lineTo(Math.cos(P1[0]) * P1[1], Math.sin(P1[0]) * P1[1]);
    s.lineTo(Math.cos(P2[0]) * P2[1], Math.sin(P2[0]) * P2[1]);
    s.lineTo(Math.cos(P3[0]) * P3[1], Math.sin(P3[0]) * P3[1]);
    s.lineTo(Math.cos(P4[0]) * P4[1], Math.sin(P4[0]) * P4[1]);
    s.lineTo(Math.cos(P5[0]) * P5[1], Math.sin(P5[0]) * P5[1]);
    const na = a + st;
    s.absarc(0, 0, rIn, P5[0], na - h * 0.99, false);
  }
  s.closePath();
  return s;
}

// 轮辐镂空（扇形孔 + 圆角）
function sectorHoles(shape, count, rHub, rOut, phase, fillet) {
  const f = fillet || 0.16;
  const st = TAU / count;
  const ah = st * 0.40, ar = st * 0.40;
  for (let i = 0; i < count; i++) {
    const a0 = phase + i * st + ar, a1 = phase + i * st + st - ah;
    const p = new THREE.Path();
    const rO = rOut - f, rI = rHub + f;
    p.absarc(0, 0, rO, a0, a1, false);
    p.absarc(0, 0, rI, a1, a0, true);
    p.closePath();
    shape.holes.push(p);
  }
  return shape;
}

// 瑞士杠杆式擒纵轮：马耳他式棘齿
function escapeShape(teeth, rOut, rIn) {
  const s = new THREE.Shape();
  const st = TAU / teeth;
  const pt = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];
  for (let i = 0; i < teeth; i++) {
    const a = i * st;
    const seq = [
      pt(a, rIn),
      pt(a + st * 0.30, rIn * 1.06),
      pt(a + st * 0.50, rOut * 0.93),
      pt(a + st * 0.63, rOut),
      pt(a + st * 0.80, rOut),
      pt(a + st * 0.86, rOut * 0.80),
      pt(a + st * 0.90, rIn)
    ];
    for (let k = 0; k < seq.length; k++) {
      if (i === 0 && k === 0) s.moveTo(seq[k][0], seq[k][1]);
      else s.lineTo(seq[k][0], seq[k][1]);
    }
  }
  s.closePath();
  return s;
}

// 胶囊（两圆相切带），用作夹板臂、擒纵叉、指针基体
function stadiumShape(ax, ay, bx, by, w) {
  const r = w / 2, dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) || 1e-6;
  const a0 = Math.atan2(dy, dx);
  const s = new THREE.Shape();
  s.absarc(ax, ay, r, a0 + Math.PI / 2, a0 + Math.PI * 1.5, false);
  s.absarc(bx, by, r, a0 - Math.PI / 2, a0 + Math.PI / 2, false);
  s.closePath();
  return s;
}

// 多段胶囊串联成一条有机夹板臂
function armChain(pts, w) {
  const shapes = [];
  for (let i = 0; i < pts.length - 1; i++) {
    shapes.push(stadiumShape(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], w));
  }
  shapes.push(stadiumShape(pts[pts.length - 2][0], pts[pts.length - 2][1],
    pts[pts.length - 1][0], pts[pts.length - 1][1], w * 1.32));
  return shapes;
}

// 阿基米德螺线 -> 游丝 / 主发条
function spiralCurve(r0, r1, turns, height, seg) {
  const n = seg || Math.round(turns * 64);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = t * turns * TAU, r = r0 + (r1 - r0) * t;
    pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, height * (0.35 + 0.65 * t)));
  }
  return new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
}

// 圆柱（轴向朝 +Z）
function cylZ(rt, rb, h, seg, open) {
  const g = new THREE.CylinderGeometry(rt, rb, h, seg || 64, 1, !!open);
  g.rotateX(Math.PI / 2);
  return g;
}

function mesh(geo, mat, pos, z) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos.x || 0, pos.y || 0, 0);
  if (z !== undefined) m.position.z = z;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function buildWheel(key, teeth, spokes, matFn, z, pinionTeeth) {

  const shape = gearShape(teeth, c.rt, c.rt - 0.34, { toothFrac: 0.50, tipFrac: 0.22, flank: 0.17 });
  if (spokes) sectorHoles(shape, spokes, c.rt * 0.26, c.rt - 0.52, 0.26, 0.20);
  const wheel = new THREE.Mesh(extrude(shape, 0.17, { bevelSize: 0.018, bevelThickness: 0.018 }), matFn());
  wheel.position.set(c.x, c.y, z);
  wheel.castShadow = wheel.receiveShadow = true;
  g.add(wheel);

  // 小齿
  const pr = 0.44;
  const pin = new THREE.Mesh(
    extrude(gearShape(pinionTeeth, pr, pr - 0.20, { toothFrac: 0.62, tipFrac: 0.34, flank: 0.12 }), 0.34,
      { bevelSize: 0.014, bevelThickness: 0.014 }),
    M.steel()
  );
  pin.position.set(c.x, c.y, z - 0.30);
  pin.castShadow = true;
  g.add(pin);

  // 轴
  const ax = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 2.0, 14), M.steel());
  ax.rotation.x = Math.PI / 2;

  // 红宝石轴承（上下两颗）
  for (const zz of [z + 0.16, Z.plate + 0.30]) {
    const j = jewelMesh(0.20);
    j.position.set(c.x, c.y, zz);
    g.add(j);
  }

  moving[key] = wheel;
  watchTilt.add(g);
  return wheel;
}

function jewelMesh(r) {
  const g = new THREE.Group();
  const chat = new THREE.Mesh(new THREE.TorusGeometry(r * 1.5, r * 0.42, 10, 26), M.gold());
  g.add(chat);
  const jw = new THREE.Mesh(new THREE.CylinderGeometry(r, r, r * 0.9, 20), M.ruby());

  jw.position.z = r * 0.35;
  g.add(jw);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });

}

/* ==========================================================================
   11. 擒纵叉 + 两枚红宝石瓦
   ========================================================================== */
(function palletFork() {
  const p = P.pallet;
  const g = part('擒纵叉', [p.x, p.y - 0.3, Z.pallet], [-0.8, -2.4, 2.6],
    '瑞士杠杆式擒纵的杠杆，一端嵌两枚红宝石叉瓦，另一端叉口承接摆轮圆盘钉。', [
      ['型式', '瑞士杠杆式'], ['叉瓦', '人造红宝石 ×2'], ['材质', '淬火钢'], ['润滑', '含钻石润滑脂']
    ]);

  const toEsc = Math.atan2(P.escape.y - p.y, P.escape.x - p.x);
  const toBal = Math.atan2(P.balance.y - p.y, P.balance.x - p.x);

  // 叉体：沿 escape 方向伸出的双臂 + 沿 balance 方向的叉尾
  const shape = new THREE.Shape();
  const arm = 0.98, tail = 1.34, wArm = 0.20, wTail = 0.15;
  const ux = Math.cos(toEsc), uy = Math.sin(toEsc);
  const vx = Math.cos(toBal), vy = Math.sin(toBal);
  const pt = (bx, by, off) => {
    // 以到 escape 的方向为局部 x 轴，垂直方向为 y
    return [bx + (-uy) * off, by + (ux) * off];
  };
  const tipA = pt(p.x + ux * arm, p.y + uy * arm, wArm);
  const tipB = pt(p.x + ux * arm, p.y + uy * arm, -wArm);
  const rootA = pt(p.x, p.y, wArm * 1.25);
  const rootB = pt(p.x, p.y, -wArm * 1.25);
  const tailA = [p.x + vx * tail - vx * 0.30 + (-vy) * wTail, p.y + vy * tail - vy * 0.30 + (vx) * wTail];
  const tailB = [p.x + vx * tail - vx * 0.30 - (-vy) * wTail, p.y + vy * tail - vy * 0.30 - (vx) * wTail];
  const forkA = [p.x + vx * tail + (-vy) * (wTail * 2.5), p.y + vy * tail + (vx) * (wTail * 2.5)];
  const forkB = [p.x + vx * tail - (-vy) * (wTail * 2.5), p.y + vy * tail - (vx) * (wTail * 2.5)];
  const notchA = [p.x + vx * (tail - 0.44) + (-vy) * wTail, p.y + vy * (tail - 0.44) + (vx) * wTail];
  const notchB = [p.x + vx * (tail - 0.44) - (-vy) * wTail, p.y + vy * (tail - 0.44) - (vx) * wTail];

  shape.moveTo(rootA[0], rootA[1]);
  shape.lineTo(tipA[0], tipA[1]);
  shape.quadraticCurveTo(p.x + ux * (arm + 0.14) - uy * wArm * 0.2, p.y + uy * (arm + 0.14) + ux * wArm * 0.2,
    tipA[0] + (ux) * 0.16, tipA[1] + (uy) * 0.16);
  shape.lineTo(tipB[0] + (ux) * 0.16, tipB[1] + (uy) * 0.16);
  shape.quadraticCurveTo(p.x + ux * (arm + 0.14) + uy * wArm * 0.2, p.y + uy * (arm + 0.14) - ux * wArm * 0.2,
    tipB[0], tipB[1]);
  shape.lineTo(rootB[0], rootB[1]);
  shape.lineTo(tailB[0], tailB[1]);
  shape.lineTo(notchB[0], notchB[1]);
  shape.lineTo(forkB[0], forkB[1]);
  shape.lineTo(forkA[0], forkA[1]);
  shape.lineTo(notchA[0], notchA[1]);
  shape.lineTo(tailA[0], tailA[1]);
  shape.closePath();

  const fork = new THREE.Mesh(extrude(shape, 0.16, { bevelSize: 0.012, bevelThickness: 0.012 }), M.blued());
  fork.position.z = Z.pallet;
  fork.castShadow = true;
  g.add(fork);

  // 叉瓦
  for (const s of [1, -1]) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.14, 0.15), M.ruby());
    const c = pt(p.x + ux * (arm - 0.10), p.y + uy * (arm - 0.10), s * (wArm + 0.09));
    st.position.set(c[0], c[1], Z.pallet);
    st.rotation.z = toEsc;
    g.add(st);
  }

  const ax = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.4, 12), M.steel());
  ax.rotation.x = Math.PI / 2;
  ax.position.set(p.x, p.y, Z.plate + 0.9);
  g.add(ax);
  const j = jewelMesh(0.13); j.position.set(p.x, p.y, Z.pallet + 0.12); g.add(j);

  moving.pallet = fork;
  watchTilt.add(g);
})();

function bridgePart(name, chains, width, z, anchor, explode, desc, specs, matFn) {
  const g = part(name, anchor, explode, desc, specs);
  const shapes = armChain(chains, width);
  const mats = matFn || (() => M.bridge(TEX.cotes));
  shapes.forEach((s, i) => {
    const m = new THREE.Mesh(
      extrude(s, 0.30, { bevelSize: 0.045, bevelThickness: 0.045, bevelSegments: 2 }),
      mats()
    );
    m.position.z = z - i * 0.0012;   // 微小错层，避免共面 z-fighting
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  });
  watchTilt.add(g);
  return g;
}

(function dial() {

    '悬浮式时标圈，圈上刻有 60 格分钟轨与夜光涂层时标，与机芯完全分离，透视感由此而来。', [

    ]);

  // 时标圈环

  rh.absarc(0, 0, 6.92, 0, TAU, true);

      new THREE.BoxGeometry(0.055, long ? 0.34 : 0.18, 0.05),

      }
      continue;
    }
    const idx = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.80, 0.20), M.gold());
    idx.position.set(Math.cos(a) * 7.42, Math.sin(a) * 7.42, Z.chapter + 0.20);
    idx.rotation.z = a + Math.PI / 2;
    idx.castShadow = true;
    g.add(idx);
    const lm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.56, 0.06), M.lume());
    lm.position.copy(idx.position);
    lm.position.z += 0.11;
    lm.rotation.z = idx.rotation.z;
    g.add(lm);
  }

  watchTilt.add(g);
})();

// 指针（时针 / 分针 / 中央秒针）
(function hands() {
  const mk = (name, len, wide, tail, z, mat, lume, anchor, explode, desc, specs) => {
    const g = part(name, anchor, explode, desc, specs);
    const shape = new THREE.Shape();

function leatherMat() {
  return new THREE.MeshPhysicalMaterial({
    color: 0x3a2317, metalness: 0.0, roughness: 0.78,
    clearcoat: 0.18, clearcoatRoughness: 0.62, envMapIntensity: 0.30,
    sheen: 0.4, sheenColor: 0x6b4a33, sheenRoughness: 0.7
  });

(function strap() {
  const LEN = 13.2, W = 4.15, SEG = 30;
  const mkStrap = (sign) => {
    const g = new THREE.Group();
    // 沿长度方向逐段收窄并向下弯折，形成佩戴弧度
    const pts = [];
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const y = sign * t * LEN;
      const taper = 1 - 0.20 * Math.pow(t, 1.6);          // 末端收窄
      const bend = -Math.pow(t, 1.7) * 3.4 * sign;         // 向后下方弯
      const roll = -t * t * 0.55 * sign;                    // 轻微内卷
      pts.push({ y: y, z: bend, w: W * 0.5 * taper, roll: roll });
    }
    // 逐段构造带厚度的条带
    const positions = [], normals = [], indices = [];
    let vi = 0;
    for (let i = 0; i < SEG; i++) {
      const a = pts[i], b = pts[i + 1];
      const aw = a.w, bw = b.w;
      const ax = -aw, bx = bw;
      // 每段 8 个顶点构成带厚度的盒体截面
      const ring = (p, sgn) => {
        const rx = p.w * sgn;
        const zA = p.z - 0.20 + p.roll;
        const zB = p.z + 0.20 + p.roll;
        return [
          [rx, p.y, zA], [rx, p.y, zB],
          [rx * 0.94, p.y, zB], [rx * 0.94, p.y, zA]
        ];
      };
      const A = ring(a, 1), B = ring(b, 1);
      const A2 = ring(a, -1), B2 = ring(b, -1);
      const quad = (p0, p1, p2, p3) => {
        for (const v of [p0, p1, p2, p3]) { positions.push(v[0], v[1], v[2]); normals.push(0, 0, 1); }
        indices.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
        vi += 4;
      };
      quad(A[0], B[0], B[1], A[1]);   // 上表面
      quad(A2[1], B2[1], B2[0], A2[0]); // 下表面
      quad(A[3], B[3], B2[3], A2[3]); // 右侧
      quad(A2[2], B2[2], B[2], A[2]); // 左侧
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, leatherMat());
    m.castShadow = m.receiveShadow = true;
    g.add(m);

    // 两道缝线
    for (const sx of [-1, 1]) {
      const st = new THREE.Mesh(new THREE.BoxGeometry(0.09, LEN * 0.92, 0.05), M.rose());
      st.position.set(sx * (W * 0.5 - 0.30), sign * LEN * 0.5, -Math.pow(0.5, 1.7) * 3.4 * sign + 0.24);
      st.rotation.x = sign * -0.30;
      g.add(st);
    }
    g.position.set(0, sign * (CASE_R + 0.10), Z.crystal - 1.05);
    return g;
  };
  watchTilt.add(mkStrap(1));
  watchTilt.add(mkStrap(-1));

  // 生耳
  for (const s of [-1, 1]) {
    for (const sx of [-1, 1]) {
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.9, 14), M.steel());
      bar.rotation.z = Math.PI / 2;
      bar.position.set(sx * 2.05, s * (CASE_R + 0.02), Z.crystal - 1.05);
      bar.castShadow = true;
      watchTilt.add(bar);
    }
  }
})();

function applyExplode(v) {
  for (const p of PARTS) {
    p.obj.position.set(
      p.base.x + p.explode.x * v,

      p.base.z + p.explode.z * v

    moving.crystalMat.opacity = Math.max(o, 0.05);
    moving.crystalMat.visible = o > 0.06;
  }
}

/* ==========================================================================
   21. 拾取（射线）
   ========================================================================== */
const ray = new THREE.Raycaster();
ray.params.Line.threshold = 0.12;
const ndc = new THREE.Vector2();
let ptrInside = false;
let downXY = null;

function pickAt(cx, cy) {
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(watch, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.part) o = o.parent;
    if (o && o.userData.part) return o.userData.part;
  }
  return null;
}

renderer.domElement.addEventListener('pointermove', e => {
  ptrInside = true;
  hover(pickAt(e.clientX, e.clientY));
});
renderer.domElement.addEventListener('pointerleave', () => {
  ptrInside = false;
  hover(null);
});
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 5) return;
  const p = pickAt(e.clientX, e.clientY);
  if (p) {
    state.selected = (state.selected === p) ? null : p;
  } else {
    state.selected = null;
  }
  highlight(state.selected);
  if (state.selected) fillPanel(state.selected.name);
  else fillPanel('overview');
});

/* ==========================================================================
   24. 机芯运转
   ========================================================================== */
const clock = new THREE.Clock();
let simT = 0;
const BEAT = 4;   // 4 Hz = 28,800 A/h

// 齿数比：由四番车 50 齿 → 擒纵轮 15 齿，逐级换算角速度
const RATIO = {
  barrel: 1 / 4200,
  center: 1 / 60,      // 中心轮 1 圈/小时
  third: 1 / 8,
  fourth: 1 / 1,       // 四番车 1 圈/分钟（秒针）
  escape: 50 / 15 / 60
};

function animateMech(dt) {
  simT += dt;
  const m = state.running;

  if (moving.barrelDrum) moving.barrelDrum.rotation.z = m ? simT * RATIO.barrel * TAU : 0;
  if (moving.ratchet) moving.ratchet.rotation.z = m ? -simT * RATIO.barrel * TAU : 0;
  if (moving.center) moving.center.rotation.z = m ? -simT * RATIO.center * TAU : 0;
  if (moving.third) moving.third.rotation.z = m ? simT * RATIO.third * TAU : 0;
  if (moving.fourth) moving.fourth.rotation.z = m ? -simT * RATIO.fourth * TAU : 0;
  if (moving.rotor) moving.rotor.rotation.z = -0.6 + (m ? Math.sin(simT * 0.42) * 0.55 : 0);

  if (moving.escape) {
    // 擒纵轮：每 1/(2*BEAT) 秒步进一齿（半齿 12°/步 → 逐齿 24°）
    if (m) {
      const step = Math.PI * 2 / 15;
      const half = 1 / (2 * BEAT);
      const idx = Math.floor(simT / half);
      const f = (simT % half) / half;
      const drop = f < 0.22 ? (f / 0.22) : 1;
      moving.escape.rotation.z = -(idx * step * 0.5 + drop * step * 0.5) + 0;
    } else {
      moving.escape.rotation.z = 0;
    }
  }

  if (moving.pallet) {
    // 擒纵叉：在两个极限角之间往复，锁定段近似静止、释放段快速翻转
    if (m) {
      const ph = simT * BEAT * Math.PI;
      const s = Math.sin(ph);
      const lock = Math.abs(Math.cos(ph));
      moving.pallet.rotation.z = -0.22 * Math.sign(s) * (0.30 + 0.70 * lock);
    } else {
      moving.pallet.rotation.z = 0;
    }
  }

  if (moving.balance) {
    const amp = 270 * D2R;
    moving.balance.rotation.z = m ? Math.sin(simT * BEAT * Math.PI) * amp : 0.62;
  }

  // 指针：真实时间
  if (m) {
    const now = new Date();
    setHands(now.getHours() % 12, now.getMinutes() + now.getSeconds() / 60, now.getSeconds());
  }
}

/* ==========================================================================
   25. 主循环
   ========================================================================== */
let tagTick = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  state.explode += (state.explodeTarget - state.explode) * Math.min(1, dt * 5.2);
  applyExplode(state.explode);

  state.flip += (state.flipTarget - state.flip) * Math.min(1, dt * 4.0);
  watchTilt.rotation.y = state.flip * Math.PI * 2;
  watchTilt.rotation.x = -0.30 + state.flip * Math.PI * 0.12;
  // 底盖视窗仅在翻至背面时显现
  if (moving.caseWindow) moving.caseWindow.visible = state.flip > 0.55;

  if (state.spin && !ptrInside) watchTilt.rotation.z += dt * 0.055;

  animateMech(dt);
  controls.update();

  tagTick += dt;
  if (tagTick > 0.045) { tagTick = 0; updateTags(); }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 首帧就绪
applyExplode(0);
renderer.render(scene, camera);
tick();
window.__watchReady = true;
const boot = document.getElementById('boot');
if (boot) {
  // 淡出由 CSS 过渡完成。移除动作放到过渡之后，
  // 避免首帧渲染阻塞主线程时 setTimeout 被推迟、遮罩长期滞留。
  boot.classList.add('done');
  const drop = () => { if (boot.parentNode) boot.parentNode.removeChild(boot); };
  if (typeof boot.addEventListener === 'function') {
    boot.addEventListener('transitionend', drop, { once: true });
  }
  setTimeout(drop, 1600);
}
</script>
</body>
