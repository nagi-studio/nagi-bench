<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">海边骑车的鹈鹕 · A pelican riding a bicycle by the sea</title>
  <desc id="desc">一只鹈鹕在黄昏的海滨公路上骑一辆老式自行车，腿踩踏板，海浪在身后翻涌，远处有灯塔与海鸥。</desc>

  <defs>
    <!-- 天空 -->
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="470">
      <stop offset="0" stop-color="#1d5f9e"/>
      <stop offset=".34" stop-color="#4f97c9"/>
      <stop offset=".62" stop-color="#9fd0e4"/>
      <stop offset=".84" stop-color="#e8dcc0"/>
      <stop offset="1" stop-color="#f6c88a"/>
    </linearGradient>
    <!-- 落日 -->
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="905" cy="228" r="196">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".98"/>
      <stop offset=".32" stop-color="#ffd98d" stop-opacity=".72"/>
      <stop offset=".68" stop-color="#ffab5e" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <!-- 海面 -->
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="566">
      <stop offset="0" stop-color="#4c86b0"/>
      <stop offset=".30" stop-color="#2f6a95"/>
      <stop offset="1" stop-color="#1c4568"/>
    </linearGradient>
    <!-- 沙滩路面 -->
    <linearGradient id="road" gradientUnits="userSpaceOnUse" x1="0" y1="546" x2="0" y2="800">
      <stop offset="0" stop-color="#e8d5ac"/>
      <stop offset=".26" stop-color="#dcc294"/>
      <stop offset="1" stop-color="#b99a6f"/>
    </linearGradient>
    <!-- 鹈鹕身体 -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="470" y1="330" x2="700" y2="520">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset=".52" stop-color="#f0e8d8"/>
      <stop offset="1" stop-color="#d8cbb4"/>
    </linearGradient>
    <!-- 颈部阴影 -->
    <linearGradient id="neck" gradientUnits="userSpaceOnUse" x1="600" y1="250" x2="700" y2="400">
      <stop offset="0" stop-color="#f7f1e4"/>
      <stop offset="1" stop-color="#ddd0b8"/>
    </linearGradient>
    <!-- 喙 -->
    <linearGradient id="beak" gradientUnits="userSpaceOnUse" x1="430" y1="300" x2="620" y2="350">
      <stop offset="0" stop-color="#f7a83c"/>
      <stop offset=".48" stop-color="#ef8f27"/>
      <stop offset="1" stop-color="#d9751a"/>
    </linearGradient>
    <!-- 喉囊 -->
    <linearGradient id="pouch" gradientUnits="userSpaceOnUse" x1="470" y1="330" x2="610" y2="420">
      <stop offset="0" stop-color="#fbc46a"/>
      <stop offset=".5" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e08a12"/>
    </linearGradient>
    <!-- 自行车车架 -->
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="470" y1="470" x2="810" y2="650">
      <stop offset="0" stop-color="#2f6f6a"/>
      <stop offset=".55" stop-color="#1f5450"/>
      <stop offset="1" stop-color="#153c39"/>
    </linearGradient>
    <!-- 金属高光 -->
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0" stop-color="#f2f5f7"/>
      <stop offset=".45" stop-color="#aab4bd"/>
      <stop offset="1" stop-color="#6d7982"/>
    </linearGradient>
    <!-- 车轮橡胶 -->
    <linearGradient id="tire" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#17181a"/>
    </linearGradient>
    <!-- 羽毛纹理 -->
    <pattern id="feather" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 8 Q4 3 8 8 T16 8" fill="none" stroke="#c9bba1" stroke-width="1.1" opacity=".42"/>
    </pattern>
    <!-- 沙粒 -->
    <pattern id="sand" width="34" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="1.1" fill="#b99a6f" opacity=".45"/>
      <circle cx="22" cy="14" r=".9" fill="#a98a61" opacity=".38"/>
      <circle cx="13" cy="19" r=".7" fill="#c6a87c" opacity=".4"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frameClip"><rect x="0" y="0" width="1200" height="800"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- ===== 天空 ===== -->
    <rect x="0" y="0" width="1200" height="478" fill="url(#sky)"/>
    <circle cx="905" cy="228" r="196" fill="url(#sun)"/>
    <circle cx="905" cy="228" r="46" fill="#fff3cf" opacity=".92"/>

    <!-- 云 -->
    <g fill="#ffffff" opacity=".5">
      <path d="M120 168 q26-30 60-8 q22-28 58-10 q30-6 34 20 q-38 16-76 6 q-46 12-76-8Z"/>
      <path d="M420 96 q20-24 48-6 q18-22 46-8 q24-4 28 16 q-30 12-60 4 q-38 10-62-6Z"/>
      <path d="M700 152 q24-26 54-8 q20-24 50-8 q26-4 30 18 q-34 14-68 6 q-42 10-66-8Z"/>
    </g>

    <!-- 海鸥 -->
    <g stroke="#f4f7f9" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85">
      <path d="M232 176 q14-14 28 0 q14-14 28 0"/>
      <path d="M300 148 q11-11 22 0 q11-11 22 0"/>
      <path d="M180 210 q9-9 18 0 q9-9 18 0"/>
    </g>

    <!-- ===== 远处灯塔 ===== -->
    <g opacity=".92">
      <path d="M1046 404 L1054 300 L1070 300 L1078 404Z" fill="#f2ece0"/>
      <path d="M1052 300 h20 v-12 h-20Z" fill="#d9534f"/>
      <path d="M1046 404 h32 v-10 h-32Z" fill="#cfc6b6"/>
      <rect x="1056" y="272" width="12" height="16" rx="2" fill="#4a4034"/>
      <circle cx="1062" cy="280" r="26" fill="#fff0b8" opacity=".5" filter="url(#soft2)"/>
      <path d="M1062 280 L1200 246 L1200 300Z" fill="#fff3c4" opacity=".26"/>
      <path d="M1062 280 L960 232 L960 320Z" fill="#fff3c4" opacity=".16"/>
    </g>

    <!-- ===== 海 ===== -->
    <rect x="0" y="404" width="1200" height="162" fill="url(#sea)"/>
    <!-- 落日在海面的反光 -->
    <g opacity=".5">
      <path d="M905 404 q-30 46-46 74 h92 q-16-28-46-74Z" fill="#ffd68a" opacity=".5" filter="url(#soft2)"/>
    </g>
    <!-- 波浪 -->
    <g stroke="#cfe6f2" fill="none" stroke-linecap="round" opacity=".55">
      <path d="M-10 430 q40-13 80 0 q40 13 80 0" stroke-width="3.2"/>
      <path d="M150 452 q34-11 68 0 q34 11 68 0" stroke-width="2.6"/>
      <path d="M420 424 q30-10 60 0 q30 10 60 0" stroke-width="2.8"/>
      <path d="M700 446 q38-12 76 0 q38 12 76 0" stroke-width="2.4"/>
      <path d="M980 434 q32-10 64 0 q32 10 64 0" stroke-width="2.6"/>
    </g>
    <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity=".4">
      <path d="M60 478 q30-9 60 0 q30 9 60 0" stroke-width="2.2"/>
      <path d="M520 486 q34-10 68 0 q34 10 68 0" stroke-width="2"/>
      <path d="M860 472 q28-8 56 0 q28 8 56 0" stroke-width="2.2"/>
    </g>

    <!-- 浪花线（海与沙交界） -->
    <path d="M0 552 q60-16 120 0 q60 16 120 0 q60-16 120 0 q60 16 120 0 q60-16 120 0 q60 16 120 0 q60-16 120 0 q60 16 120 0 q60-16 120 0"
          fill="none" stroke="#f4fafc" stroke-width="5" opacity=".82" stroke-linecap="round"/>
    <path d="M0 560 q60-14 120 0 q60 14 120 0 q60-14 120 0 q60 14 120 0 q60-14 120 0 q60 14 120 0 q60-14 120 0 q60 14 120 0 q60-14 120 0"
          fill="none" stroke="#dcecf4" stroke-width="3" opacity=".6" stroke-linecap="round"/>

    <!-- ===== 沙滩路面 ===== -->
    <path d="M0 566 h1200 v234 H0Z" fill="url(#road)"/>
    <rect x="0" y="566" width="1200" height="234" fill="url(#sand)" opacity=".55"/>
    <!-- 路面纹理 -->
    <g stroke="#c9ab7c" fill="none" opacity=".4" stroke-linecap="round">
      <path d="M40 690 q40-8 80 0 q40 8 80 0" stroke-width="2.4"/>
      <path d="M700 726 q44-9 88 0 q44 9 88 0" stroke-width="2.2"/>
      <path d="M980 664 q38-8 76 0 q38 8 76 0" stroke-width="2"/>
      <path d="M180 762 q42-8 84 0 q42 8 84 0" stroke-width="2.6"/>
    </g>

    <!-- 车轮投影 -->
    <ellipse cx="528" cy="700" rx="120" ry="19" fill="#6b5636" opacity=".28" filter="url(#soft)"/>
    <ellipse cx="836" cy="700" rx="120" ry="19" fill="#6b5636" opacity=".28" filter="url(#soft)"/>

    <!-- ================= 自行车 ================= -->
    <g id="bike">
      <!-- 后轮 -->
      <g id="wheel-rear">
        <circle cx="528" cy="616" r="86" fill="none" stroke="url(#tire)" stroke-width="13"/>
        <circle cx="528" cy="616" r="86" fill="none" stroke="#55585c" stroke-width="2.4"/>
        <circle cx="528" cy="616" r="74" fill="none" stroke="#9aa2a8" stroke-width="2" opacity=".85"/>
        <g stroke="#c3cad0" stroke-width="1.9" opacity=".9">
          <path d="M528 616 L528 540"/><path d="M528 616 L528 692"/>
          <path d="M528 616 L466 562"/><path d="M528 616 L590 670"/>
          <path d="M528 616 L590 562"/><path d="M528 616 L466 670"/>
          <path d="M528 616 L455 616"/><path d="M528 616 L601 616"/>
          <path d="M528 616 L478 548"/><path d="M528 616 L578 684"/>
        </g>
        <circle cx="528" cy="616" r="9" fill="url(#chrome)"/>
      </g>

      <!-- 前轮 -->
      <g id="wheel-front">
        <circle cx="836" cy="616" r="86" fill="none" stroke="url(#tire)" stroke-width="13"/>
        <circle cx="836" cy="616" r="86" fill="none" stroke="#55585c" stroke-width="2.4"/>
        <circle cx="836" cy="616" r="74" fill="none" stroke="#9aa2a8" stroke-width="2" opacity=".85"/>
        <g stroke="#c3cad0" stroke-width="1.9" opacity=".9">
          <path d="M836 616 L836 540"/><path d="M836 616 L836 692"/>
          <path d="M836 616 L774 562"/><path d="M836 616 L898 670"/>
          <path d="M836 616 L898 562"/><path d="M836 616 L774 670"/>
          <path d="M836 616 L763 616"/><path d="M836 616 L909 616"/>
          <path d="M836 616 L785 548"/><path d="M836 616 L887 684"/>
        </g>
        <circle cx="836" cy="616" r="9" fill="url(#chrome)"/>
      </g>

      <!-- 车架 -->
      <g stroke="url(#frame)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- 后下叉 -->
        <path d="M528 616 L648 626" stroke-width="11"/>
        <!-- 后上叉 -->
        <path d="M528 616 L676 512" stroke-width="10"/>
        <!-- 立管 -->
        <path d="M676 512 L660 626" stroke-width="11"/>
        <!-- 上管 -->
        <path d="M676 512 L836 560" stroke-width="10"/>
        <!-- 下管 -->
        <path d="M660 626 L836 578" stroke-width="12"/>
        <!-- 前叉 -->
        <path d="M836 578 L836 616" stroke-width="11"/>
        <!-- 座管 -->
        <path d="M676 512 L648 470" stroke-width="10"/>
      </g>
      <!-- 车架高光 -->
      <g stroke="#7fd0c4" fill="none" stroke-linecap="round" opacity=".42">
        <path d="M534 610 L646 620" stroke-width="3.4"/>
        <path d="M668 508 L830 556" stroke-width="3"/>
        <path d="M666 620 L830 574" stroke-width="3.6"/>
      </g>

      <!-- 链条轮与链条 -->
      <circle cx="660" cy="626" r="31" fill="none" stroke="#8f989f" stroke-width="4"/>
      <circle cx="660" cy="626" r="24" fill="none" stroke="#aab3ba" stroke-width="1.8" opacity=".8"/>
      <circle cx="660" cy="626" r="8" fill="url(#chrome)"/>
      <path d="M528 616 L534 622 L660 648" fill="none" stroke="#6f7a82" stroke-width="2.4" opacity=".9"/>
      <path d="M528 616 L526 610 L660 604" fill="none" stroke="#6f7a82" stroke-width="2.4" opacity=".9"/>

      <!-- 曲柄与踏板 -->
      <g id="crank-near">
        <path d="M660 626 L712 664" stroke="#b9c2c8" stroke-width="7" stroke-linecap="round"/>
        <rect x="700" y="658" width="30" height="9" rx="3" fill="#39424a"/>
      </g>
      <g id="crank-far" opacity=".85">
        <path d="M660 626 L608 588" stroke="#8f989f" stroke-width="6.4" stroke-linecap="round"/>
        <rect x="592" y="580" width="28" height="8.5" rx="3" fill="#2c343a"/>
      </g>
      <circle cx="660" cy="626" r="7" fill="#5c666e"/>

      <!-- 车座 -->
      <path d="M620 466 q28-13 56 0 q-8 12-30 12 q-20 0-26-12Z" fill="#3a2a1c"/>
      <path d="M622 462 q28-12 54 0" fill="none" stroke="#5c4530" stroke-width="3"/>

      <!-- 车把 -->
      <path d="M836 560 L838 512" stroke="#4d565e" stroke-width="8" stroke-linecap="round"/>
      <path d="M806 508 q32-10 62 4" fill="none" stroke="url(#chrome)" stroke-width="8" stroke-linecap="round"/>
      <path d="M806 508 q-12-2-18 4" fill="none" stroke="#39424a" stroke-width="7" stroke-linecap="round"/>
      <path d="M868 512 q14 2 18-6" fill="none" stroke="#39424a" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="838" cy="512" rx="9" ry="7" fill="#4d565e"/>

      <!-- 车灯 -->
      <circle cx="872" cy="536" r="9" fill="#ffe9a8" stroke="#8b949b" stroke-width="3"/>
      <circle cx="872" cy="536" r="22" fill="#ffe9a8" opacity=".3" filter="url(#soft2)"/>

      <!-- 后架 -->
      <path d="M520 566 L600 552" stroke="#4d565e" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    </g>

    <!-- ================= 鹈鹕 ================= -->
    <g id="pelican">
      <!-- 远侧腿（后腿） -->
      <g id="leg-far" opacity=".9">
        <path d="M700 512 q10 40-6 66 q-12 20-40 26" fill="none" stroke="#e8a33c" stroke-width="15" stroke-linecap="round"/>
        <path d="M654 604 q-16 12-30 8" fill="none" stroke="#d98f2c" stroke-width="12" stroke-linecap="round"/>
      </g>

      <!-- 身体 -->
      <path d="M596 372 q74-16 128 12 q54 28 52 84 q-2 56-56 76 q-56 20-116 4 q-58-16-62-70 q-4-52 22-84 q10-12 32-22Z"
            fill="url(#body)"/>
      <path d="M596 372 q74-16 128 12 q54 28 52 84 q-2 56-56 76 q-56 20-116 4 q-58-16-62-70 q-4-52 22-84 q10-12 32-22Z"
            fill="url(#feather)"/>
      <!-- 身体下缘阴影 -->
      <path d="M544 470 q-4 52 52 70 q60 16 116-4 q22-8 34-22 q-14 36-56 48 q-62 18-116-4 q-40-18-42-58Z"
            fill="#c9bca2" opacity=".45"/>

      <!-- 尾羽 -->
      <path d="M772 428 q56-14 84 8 q-30 26-74 24 q-22-2-10-32Z" fill="#e4dbc6"/>
      <path d="M778 432 q46-10 70 6" fill="none" stroke="#c9bca2" stroke-width="3"/>

      <!-- 近侧腿（前腿，踩踏板） -->
      <g id="leg-near">
        <path d="M672 498 q22 44 4 74 q-14 22-40 30" fill="none" stroke="#f2b04a" stroke-width="17" stroke-linecap="round"/>
        <!-- 脚掌 -->
        <path d="M636 602 q-22 14-38 8" fill="none" stroke="#e8a33c" stroke-width="13" stroke-linecap="round"/>
        <g fill="none" stroke="#d98f2c" stroke-width="5" stroke-linecap="round">
          <path d="M600 610 l-14 4"/><path d="M600 604 l-13 10"/>
        </g>
      </g>

      <!-- 颈与头 -->
      <path d="M640 372 q-14-46-2-84 q12-38 44-44 q34-6 54 14 q20 20 14 48 q-6 28-34 38 q-30 10-50 40Z"
            fill="url(#neck)"/>
      <!-- 头 -->
      <ellipse cx="706" cy="252" rx="52" ry="42" fill="#fbf7ee"/>
      <!-- 眼睛 -->
      <circle cx="700" cy="238" r="9.5" fill="#fdf6e8"/>
      <circle cx="700" cy="238" r="6.6" fill="#1e1a16"/>
      <circle cx="702" cy="235" r="2.2" fill="#ffffff"/>
      <!-- 眼周裸皮 -->
      <path d="M688 228 q14-8 26 2" fill="none" stroke="#c9b48e" stroke-width="2.4" opacity=".7"/>

      <!-- 喉囊 -->
      <path d="M636 306 q-32 6-46 30 q-10 18 2 32 q14 16 42 8 q30-10 34-40 q3-22-32-30Z"
            fill="url(#pouch)"/>
      <path d="M640 320 q-20 12-24 30" fill="none" stroke="#ffd27a" stroke-width="3" opacity=".5"/>

      <!-- 长喙 -->
      <path d="M664 250 q-64 2-142 22 q-42 10-84 12 q-16 1-16-12 q0-13 16-14 q42-2 84-12 q78-20 142-22 q14-1 14 12 q0 13-14 14Z"
            fill="url(#beak)"/>
      <!-- 喙脊高光 -->
      <path d="M656 256 q-72 4-134 22" fill="none" stroke="#ffc46b" stroke-width="3.4" opacity=".75" stroke-linecap="round"/>
      <!-- 喙尖 -->
      <path d="M438 272 q-16 1-16-12 q0-13 16-14 q10 0 18 2 q-12 10-18 24Z" fill="#d9751a"/>
      <!-- 鼻孔 -->
      <ellipse cx="486" cy="266" rx="6" ry="3.4" fill="#a8560f" opacity=".75"/>
      <!-- 眼后裸皮带 -->
      <path d="M736 234 q26-4 30 10 q4 15-12 22 q-14 6-22-4Z" fill="#d9c49c" opacity=".55"/>

      <!-- 冠羽 -->
      <g stroke="#e6dcc6" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8">
        <path d="M690 214 q-4-20 8-32"/>
        <path d="M704 210 q2-22 16-30"/>
        <path d="M718 212 q10-20 24-24"/>
      </g>

      <!-- 翅膀 -->
      <path d="M606 388 q56-6 92 22 q34 26 24 62 q-10 34-52 38 q-44 4-72-22 q-26-24-16-58 q6-24 24-42Z"
            fill="#e8dfc9" opacity=".92"/>
      <path d="M616 412 q48-4 78 22 q28 24 18 52" fill="none" stroke="#cbbda0" stroke-width="3.4" opacity=".7"/>
      <path d="M612 438 q46-2 72 22" fill="none" stroke="#cbbda0" stroke-width="3" opacity=".6"/>
      <path d="M614 464 q40 0 62 20" fill="none" stroke="#cbbda0" stroke-width="2.6" opacity=".5"/>
      <!-- 初级飞羽 -->
      <path d="M700 508 q34-6 50 10 q-20 18-48 16 q-14-2-2-26Z" fill="#cfc2a8"/>
    </g>

    <!-- 速度线（动感） -->
    <g stroke="#ffffff" stroke-linecap="round" opacity=".34" fill="none">
      <path d="M92 596 q60-8 118 0" stroke-width="3.4"/>
      <path d="M150 636 q52-7 100 0" stroke-width="2.6"/>
      <path d="M60 664 q46-6 88 0" stroke-width="2.4"/>
      <path d="M980 610 q54-7 104 0" stroke-width="3"/>
    </g>
    <!-- 扬尘 -->
    <g fill="#e2cda4" opacity=".42">
      <circle cx="452" cy="706" r="6"/>
      <circle cx="418" cy="718" r="4.4"/>
      <circle cx="486" cy="716" r="5"/>
      <circle cx="386" cy="726" r="3.4"/>
      <circle cx="768" cy="708" r="5"/>
    </g>

    <!-- 前景海草 -->
    <g fill="#3d5a3a" opacity=".85">
      <path d="M22 800 q6-58 22-74 q-6 40 4 74Z"/>
      <path d="M52 800 q10-48 30-60 q-14 32-8 60Z"/>
      <path d="M1136 800 q-8-54-24-70 q8 38-2 70Z"/>
      <path d="M1104 800 q-12-46-32-58 q16 30 10 58Z"/>
    </g>

    <!-- 暗角 -->
    <rect x="0" y="0" width="1200" height="800" fill="none"/>
    <rect x="0" y="0" width="1200" height="800" fill="url(#vig)" opacity=".28"/>
    <defs>
      <radialGradient id="vig" cx="50%" cy="48%" r="76%">
        <stop offset=".55" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#1a1206" stop-opacity=".72"/>
      </radialGradient>
    </defs>
  </g>
</svg>
