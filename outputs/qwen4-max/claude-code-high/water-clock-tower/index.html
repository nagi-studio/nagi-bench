<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水运仪象台 · 一千年前的天文钟</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- 片名 -->
    <div id="title-card" class="overlay">
      <div class="title-seal">北宋 · 元祐三年 · 公元 1088</div>
      <h1>水运仪象台</h1>
      <div class="title-sub">苏颂主持建造 —— 世界上最早的天文钟</div>
    </div>

    <!-- 字幕 -->
    <div id="subtitle-wrap"><div id="subtitle"></div><div id="subnote"></div></div>

    <!-- 3D 标注 -->
    <div id="labels"></div>

    <!-- 角标 -->
    <div id="corner-mark">
      <span class="mark-dot"></span>机械运动 · 物理引擎实时计算
    </div>

    <!-- 片尾 -->
    <div id="end-card" class="overlay">
      <div class="end-line1">水力驱动 · 擒纵调速 · 齿轮传动 · 自动报时</div>
      <div class="end-line2">水运仪象台 —— 现代钟表擒纵器的先驱</div>
      <div class="end-line3">影片时间经压缩 · 全部机械运动由 cannon-es 物理引擎实时解算 · 声音由 Web Audio 程序化合成</div>
      <button id="replay">↻ 再看一遍</button>
    </div>

    <!-- 控制 -->
    <div id="hud">
      <button id="mute" title="声音开关">♪</button>
    </div>
    <div id="sound-hint">点击画面任意处开启声音</div>
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="vignette"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
