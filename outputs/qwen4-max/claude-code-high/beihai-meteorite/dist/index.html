<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>陨石雨 · Meteorite Shower</title>
    <style>
      :root {
        color-scheme: dark;
        --bar: #000;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
      body { font-family: "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; }

      #app { position: fixed; inset: 0; background: #000; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }

      /* Cinematic grade: vignette + faint grain, never interactive */
      #grade {
        position: absolute; inset: 0; pointer-events: none; z-index: 10;
        background:
          radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
        mix-blend-mode: multiply;
      }
      #grain {
        position: absolute; inset: -50%; width: 200%; height: 200%;
        pointer-events: none; z-index: 11; opacity: 0.05;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.6'/></svg>");
        animation: grain 0.6s steps(3) infinite;
      }
      @keyframes grain {
        0% { transform: translate(0,0); }
        33% { transform: translate(-2%,1%); }
        66% { transform: translate(1%,-2%); }
        100% { transform: translate(0,0); }
      }
      @media (prefers-reduced-motion: reduce) { #grain { animation: none; } }

      /* Editorial overlays driven by the timeline */
      #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 15; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 14; }
      #card {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        pointer-events: none; z-index: 16; opacity: 0; color: #f3ead9;
      }
      #card .zh {
        font-size: clamp(40px, 8vw, 104px); letter-spacing: 0.42em; text-indent: 0.42em;
        font-weight: 300; text-shadow: 0 2px 30px rgba(0,0,0,0.9);
      }
      #card .en {
        margin-top: 1.1em; font-size: clamp(11px, 1.5vw, 17px); letter-spacing: 0.5em;
        text-indent: 0.5em; text-transform: uppercase; color: #b9a888; font-weight: 400;
      }
      #card .sub {
        margin-top: 2.4em; font-size: clamp(12px, 1.6vw, 18px); letter-spacing: 0.28em;
        text-indent: 0.28em; color: #8f8676;
      }
      #card .rule { width: 0; height: 1px; background: #6f6450; margin: 1.6em auto 0; transition: none; }

      #ui { position: absolute; inset: 0; z-index: 20; }

      /* Scope reticle overlay for POV shots */
      #scope { position: absolute; inset: 0; z-index: 13; pointer-events: none; opacity: 0; }
      #scope .ring {
        position: absolute; left: 50%; top: 50%; width: 62vmin; height: 62vmin;
        transform: translate(-50%,-50%); border-radius: 50%;
        border: 2px solid rgba(20,24,28,0.9);
        box-shadow: 0 0 0 200vmax rgba(2,3,8,0.92), inset 0 0 60px rgba(0,0,0,0.6);
      }
      #scope .h, #scope .v { position: absolute; background: rgba(15,18,22,0.85); }
      #scope .h { left: 50%; top: 50%; width: 62vmin; height: 1px; transform: translate(-50%,-50%); }
      #scope .v { left: 50%; top: 50%; width: 1px; height: 62vmin; transform: translate(-50%,-50%); }
      #scope .dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: rgba(200,60,50,0.9); transform: translate(-50%,-50%); }
      #scope .mil { position: absolute; left: 50%; top: 50%; width: 1px; height: 8px; background: rgba(15,18,22,0.7); }

      /* Small hint before first play */
      #hint {
        position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
        z-index: 18; color: #cbbfa6; font-size: 14px; letter-spacing: 0.3em; text-indent: 0.3em;
        pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
        text-shadow: 0 2px 8px #000;
      }
      #hint.show { opacity: 0.85; }
    </style>
    <script type="module" crossorigin src="./assets/index-C-1PlJLb.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="grade"></div>
      <div id="grain"></div>
      <div id="flash"></div>
      <div id="scope">
        <div class="ring"></div>
        <div class="h"></div><div class="v"></div>
        <div class="dot"></div>
      </div>
      <div id="fade"></div>
      <div id="card">
        <div class="zh"></div>
        <div class="en"></div>
        <div class="rule"></div>
        <div class="sub"></div>
      </div>
      <div id="hint">点击 ▶ 开始放映</div>
      <div id="ui"></div>
    </div>
  </body>
</html>
