<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALIBRE SQ-88 · 镂空机械腕表 · 交互式 3D 展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a86a; --gold-hi:#e8cf9a; --ink:#e8e6e1; --dim:#8b8f98;
    --panel:rgba(14,16,22,.72); --line:rgba(201,168,106,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#06070b;color:var(--ink);
    font-family:'Inter','Noto Serif SC',serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  /* ---------- vignette & grain ---------- */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(0,0,0,.45) 82%,rgba(0,0,0,.75) 100%)}
  /* ---------- brand ---------- */
  #brand{position:fixed;top:34px;left:40px;z-index:5;pointer-events:none;user-select:none}
  #brand .maison{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.55em;
    color:var(--gold);text-transform:uppercase;margin-bottom:8px}
  #brand h1{font-family:'Cormorant Garamond','Noto Serif SC',serif;font-weight:500;
    font-size:clamp(26px,3.4vw,44px);letter-spacing:.08em;line-height:1.05;color:var(--ink)}
  #brand h1 em{font-style:italic;color:var(--gold-hi)}
  #brand .sub{margin-top:10px;font-family:'Noto Serif SC',serif;font-weight:300;font-size:12.5px;
    letter-spacing:.35em;color:var(--dim)}
  #brand .rule{width:64px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:14px}
  /* ---------- spec strip ---------- */
  #specs{position:fixed;top:38px;right:40px;z-index:5;text-align:right;pointer-events:none;user-select:none}
  #specs .row{font-size:11px;letter-spacing:.22em;color:var(--dim);margin-bottom:7px;text-transform:uppercase}
  #specs .row b{color:var(--gold-hi);font-weight:500;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.1em;margin-right:8px}
  /* ---------- control bar ---------- */
  #controls{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:60px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .btn{appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
    color:var(--ink);font-family:'Noto Serif SC',serif;font-size:12.5px;letter-spacing:.12em;
    padding:9px 16px;border-radius:40px;cursor:pointer;transition:all .25s ease;white-space:nowrap}
  .btn:hover{border-color:var(--gold);color:var(--gold-hi);background:rgba(201,168,106,.08)}
  .btn.active{background:linear-gradient(135deg,rgba(201,168,106,.28),rgba(201,168,106,.12));
    border-color:var(--gold);color:var(--gold-hi)}
  .btn .ico{margin-right:6px;font-size:13px}
  #explodeWrap{display:flex;align-items:center;gap:10px;padding:0 6px;overflow:hidden;
    max-width:0;opacity:0;transition:max-width .5s ease,opacity .4s ease}
  #explodeWrap.open{max-width:220px;opacity:1}
  #explodeWrap label{font-size:10.5px;letter-spacing:.2em;color:var(--dim);white-space:nowrap}
  input[type=range]{-webkit-appearance:none;width:120px;height:2px;background:rgba(201,168,106,.35);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--gold-hi);border:1px solid #6b5426;cursor:pointer;box-shadow:0 0 10px rgba(201,168,106,.6)}
  .sep{width:1px;height:22px;background:rgba(255,255,255,.1)}
  /* ---------- hint ---------- */
  #hint{position:fixed;left:40px;bottom:30px;z-index:5;font-size:11px;color:var(--dim);
    letter-spacing:.14em;line-height:2;pointer-events:none;user-select:none}
  #hint kbd{display:inline-block;border:1px solid rgba(255,255,255,.18);border-radius:4px;
    padding:1px 6px;font-family:inherit;font-size:10px;color:var(--ink);margin-right:4px;background:rgba(255,255,255,.04)}
  /* ---------- tooltip ---------- */
  #tooltip{position:fixed;z-index:8;pointer-events:none;opacity:0;transition:opacity .18s ease;
    transform:translate(-50%,calc(-100% - 18px));background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(14px);border-radius:10px;padding:10px 16px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #tooltip .t{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;color:var(--gold-hi);letter-spacing:.1em}
  #tooltip .e{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11.5px;color:var(--dim);margin-top:2px;letter-spacing:.08em}
  #tooltip .c{font-size:9.5px;color:var(--dim);margin-top:5px;letter-spacing:.25em}
  #tooltip::after{content:'';position:absolute;left:50%;bottom:-5px;width:8px;height:8px;
    transform:translateX(-50%) rotate(45deg);background:var(--panel);
    border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  /* ---------- info panel ---------- */
  #panel{position:fixed;top:50%;right:36px;transform:translateY(-50%) translateX(24px);z-index:6;
    width:308px;max-height:76vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;backdrop-filter:blur(20px);padding:26px 26px 22px;
    box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.2,.8,.2,1)}
  #panel.show{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
  #panel::-webkit-scrollbar{width:4px}
  #panel::-webkit-scrollbar-thumb{background:rgba(201,168,106,.3);border-radius:4px}
  #panel .kicker{font-size:10px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
  #panel h2{font-family:'Noto Serif SC',serif;font-weight:600;font-size:21px;letter-spacing:.06em;color:var(--ink)}
  #panel .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--gold-hi);margin:3px 0 14px;letter-spacing:.05em}
  #panel p{font-family:'Noto Serif SC',serif;font-weight:300;font-size:12.5px;line-height:1.95;color:#b9bcc4;text-align:justify}
  #panel .divider{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:16px 0}
  #panel .spec{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
  #panel .spec span{color:var(--dim);letter-spacing:.1em}
  #panel .spec b{color:var(--gold-hi);font-weight:500;font-family:'Cormorant Garamond',serif;font-size:13.5px;letter-spacing:.05em}
  #panel .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  #panel .chip{font-size:11px;font-family:'Noto Serif SC',serif;letter-spacing:.08em;color:#a9adb6;
    border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 11px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.03)}
  #panel .chip:hover{color:var(--gold-hi);border-color:var(--gold);background:rgba(201,168,106,.1)}
  #panel .back{margin-top:16px;width:100%;text-align:center}
  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:20;background:#06070b;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;transition:opacity 1s ease}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .ring{width:74px;height:74px;border-radius:50%;border:1px solid rgba(201,168,106,.2);
    border-top-color:var(--gold);animation:spin 1.3s linear infinite;position:relative}
  #loader .ring::after{content:'';position:absolute;inset:9px;border-radius:50%;
    border:1px solid rgba(201,168,106,.12);border-bottom-color:var(--gold-hi);animation:spin 2.1s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .t{font-family:'Cormorant Garamond',serif;letter-spacing:.5em;font-size:13px;color:var(--gold);text-transform:uppercase}
  #loader .s{font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:.3em;color:var(--dim)}
  @media (max-width:900px){
    #specs,#hint{display:none}
    #brand{top:20px;left:20px}
    #panel{right:12px;left:12px;width:auto;top:auto;bottom:96px;transform:translateY(12px);max-height:42vh}
    #panel.show{transform:translateY(0)}
    #controls{bottom:14px;padding:9px 12px;gap:6px;max-width:96vw;flex-wrap:wrap;justify-content:center;border-radius:22px}
    .btn{padding:7px 11px;font-size:11px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>

<div id="brand">
  <div class="maison">Atelier Lumière · Genève</div>
  <h1>Calibre <em>Squelette</em> SQ-88</h1>
  <div class="sub">镂空手动上链机芯 · 交互式三维鉴赏</div>
  <div class="rule"></div>
</div>

<div id="specs">
  <div class="row"><b>28,800</b>振次 / 小时</div>
  <div class="row"><b>21</b>红宝石轴承</div>
  <div class="row"><b>72h</b>动力储存</div>
  <div class="row"><b>217</b>机芯零件</div>
</div>

<div id="controls">
  <button class="btn" id="btnExplode"><span class="ico">◈</span>爆炸视图</button>
  <div id="explodeWrap"><label>分解程度</label><input type="range" id="explodeSlider" min="0" max="100" value="0"></div>
  <div class="sep"></div>
  <button class="btn active" id="btnRun"><span class="ico">❚❚</span>机芯运转</button>
  <button class="btn active" id="btnRotate"><span class="ico">⟳</span>自动旋转</button>
  <button class="btn" id="btnNight"><span class="ico">☾</span>夜光模式</button>
  <div class="sep"></div>
  <button class="btn" id="btnReset"><span class="ico">⌂</span>重置视角</button>
</div>

<div id="hint">
  <div><kbd>拖动</kbd>旋转 &nbsp;<kbd>滚轮</kbd>缩放 &nbsp;<kbd>悬停</kbd>零件标签 &nbsp;<kbd>点击</kbd>机芯详解</div>
  <div><kbd>E</kbd>爆炸视图 &nbsp;<kbd>空格</kbd>暂停机芯 &nbsp;<kbd>N</kbd>夜光 &nbsp;<kbd>R</kbd>重置</div>
</div>

<div id="tooltip"><div class="t"></div><div class="e"></div><div class="c">点击查看详解</div></div>

<div id="panel"></div>

<div id="loader">
  <div class="ring"></div>
  <div class="t">Calibre SQ-88</div>
  <div class="s">正在组装机芯 · 217 个零件</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector }       from 'three/addons/objects/Reflector.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. 基础:渲染器 / 场景 / 相机 / 灯光 / 环境
============================================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080d);
scene.fog = new THREE.FogExp2(0x07080d, 0.0085);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 400);
const CAM_HOME = new THREE.Vector3(13, 15, 33);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 15;
controls.maxDistance = 80;
controls.maxPolarAngle = 1.48;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

/* 环境反射:室内摄影棚 HDR(程序生成,无需外部资源) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;
scene.environmentIntensity = 1.0;

/* 奢华腕表摄影布光:主光 + 轮廓光 + 补光 + 顶部柔光 */
const keyLight = new THREE.DirectionalLight(0xfff2df, 2.6);
keyLight.position.set(18, 30, 22);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -32;
keyLight.shadow.camera.right = keyLight.shadow.camera.top = 32;
keyLight.shadow.camera.far = 120;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 6;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9db8ff, 1.5);
rimLight.position.set(-26, 14, -24);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffe9c9, 0.45);
fillLight.position.set(-14, 6, 26);
scene.add(fillLight);

const topSpot = new THREE.SpotLight(0xffffff, 260, 120, 0.5, 0.65, 1.8);
topSpot.position.set(0, 46, 6);
scene.add(topSpot);

/* ============================================================
   1. 程序化纹理:日内瓦波纹 / 鱼鳞纹 / 表盘刻度圈
============================================================ */
function canvasTex(size, draw){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* 日内瓦波纹 Côtes de Genève */
const genevaTex = canvasTex(512, (ctx, S) => {
  const bands = 6, w = S / bands;
  for (let i = 0; i < bands; i++){
    const g = ctx.createLinearGradient(i*w, 0, (i+1)*w, 0);
    g.addColorStop(0, '#f4f6f8'); g.addColorStop(0.45, '#c3c9d2');
    g.addColorStop(0.55, '#aeb5c0'); g.addColorStop(1, '#e9ecf0');
    ctx.fillStyle = g; ctx.fillRect(i*w, 0, w+1, S);
  }
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 900; i++){
    ctx.fillStyle = Math.random() > .5 ? '#fff' : '#5a6068';
    ctx.fillRect(Math.random()*S, Math.random()*S, 1, 6 + Math.random()*20);
  }
});
genevaTex.repeat.set(0.055, 0.055);
genevaTex.rotation = Math.PI / 7; genevaTex.center.set(.5, .5);

/* 鱼鳞纹 Perlage */
const perlageTex = canvasTex(512, (ctx, S) => {
  ctx.fillStyle = '#b9bfc8'; ctx.fillRect(0, 0, S, S);
  const r = 46, step = 38;
  for (let y = 0; y < S + r; y += step)
    for (let x = 0; x < S + r; x += step){
      const ox = (Math.floor(y/step) % 2) * step/2;
      const g = ctx.createRadialGradient(x+ox, y, 4, x+ox, y, r);
      g.addColorStop(0, '#e6e9ee'); g.addColorStop(.6, '#b2b9c3');
      g.addColorStop(.85, '#9aa1ac'); g.addColorStop(1, '#c6ccd5');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+ox, y, r, 0, 7); ctx.fill();
    }
});
perlageTex.repeat.set(0.09, 0.09);

/* 刻度圈:分钟刻度 + 弧形品牌铭文字 */
function drawChapter(ctx, S){
  const cx = S/2, cy = S/2, R = S/2;               // 512px = 16.25 单位
  const u = v => v / 16.25 * R;
  ctx.clearRect(0, 0, S, S);
  ctx.beginPath(); ctx.arc(cx, cy, u(16.24), 0, 7);
  ctx.arc(cx, cy, u(14.4), 0, 7, true);
  ctx.fillStyle = '#101319'; ctx.fill();
  ctx.strokeStyle = 'rgba(201,168,106,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, u(14.42), 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, u(16.2), 0, 7); ctx.stroke();
  for (let i = 0; i < 60; i++){
    const a = i/60 * Math.PI*2, major = i % 5 === 0;
    const r0 = u(major ? 15.62 : 15.85), r1 = u(16.12);
    ctx.strokeStyle = major ? '#e8cf9a' : '#9aa0ab';
    ctx.lineWidth = major ? 5 : 2.2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0);
    ctx.lineTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
    ctx.stroke();
  }
  const arcText = (text, r, mid, spread, font, color, bottom) => {
    ctx.fillStyle = color; ctx.font = font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const n = text.length, dir = bottom ? -1 : 1;
    for (let i = 0; i < n; i++){
      const a = mid + dir * (i - (n-1)/2) * spread;
      ctx.save();
      ctx.translate(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
      ctx.rotate(a + (bottom ? -Math.PI/2 : Math.PI/2));
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
    }
  };
  arcText('SQUELETTE · GENÈVE', u(15.05), Math.PI/2, 0.052, '600 30px Cormorant Garamond, serif', '#c9a86a', true);
}
const chapterTex = canvasTex(1024, drawChapter);
document.fonts.ready.then(() => {              // 字体就绪后重绘铭文
  drawChapter(chapterTex.image.getContext('2d'), 1024);
  chapterTex.needsUpdate = true;
});
chapterTex.wrapS = chapterTex.wrapT = THREE.ClampToEdgeWrapping;

/* ============================================================
   2. 材质库
============================================================ */
const M = {
  steel:    new THREE.MeshPhysicalMaterial({ color:0xd9dde3, metalness:1, roughness:0.16, clearcoat:0.7, clearcoatRoughness:0.12 }),
  steelBrush:new THREE.MeshPhysicalMaterial({ color:0xb9bfc7, metalness:1, roughness:0.34, clearcoat:0.3 }),
  gold:     new THREE.MeshPhysicalMaterial({ color:0xd6b070, metalness:1, roughness:0.2, clearcoat:0.5, clearcoatRoughness:0.15 }),
  brass:    new THREE.MeshPhysicalMaterial({ color:0xd9b36c, metalness:1, roughness:0.27, clearcoat:0.35 }),
  geneva:   new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:1, roughness:0.32, map:genevaTex, clearcoat:0.5, clearcoatRoughness:0.2 }),
  perlage:  new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:1, roughness:0.4, map:perlageTex }),
  blued:    new THREE.MeshPhysicalMaterial({ color:0x1c3f9e, metalness:0.92, roughness:0.22, clearcoat:1, clearcoatRoughness:0.08 }),
  dark:     new THREE.MeshPhysicalMaterial({ color:0x23262e, metalness:0.85, roughness:0.42 }),
  ruby:     new THREE.MeshPhysicalMaterial({ color:0xc01035, metalness:0, roughness:0.06, transmission:0.55, thickness:0.6, ior:1.76,
              clearcoat:1, clearcoatRoughness:0.05, emissive:0x2a0008, attenuationColor:new THREE.Color(0xff2244), attenuationDistance:1.2 }),
  crystal:  new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0, roughness:0.02, transmission:1, thickness:0.5, ior:1.77,
              clearcoat:1, clearcoatRoughness:0.02, transparent:true, envMapIntensity:1.6, specularIntensity:1 }),
  lume:     new THREE.MeshStandardMaterial({ color:0xd8ffe9, emissive:0x8cffc0, emissiveIntensity:1.15, roughness:0.5, metalness:0 }),
  springSteel:new THREE.MeshPhysicalMaterial({ color:0x8f97a4, metalness:1, roughness:0.3 }),
};
const LUME_BASE = 1.15;

/* ============================================================
   3. 几何工具:齿轮 / 螺旋线 / 胶囊夹板 / 螺丝 / 宝石
============================================================ */
function gearShape(rPitch, teeth, toothDepth, o = {}){
  const s = new THREE.Shape();
  const root = rPitch - toothDepth/2, tip = rPitch + toothDepth/2;
  if (teeth > 0){
    const st = Math.PI*2/teeth;
    for (let i = 0; i < teeth; i++){
      const a = i*st;
      if (i === 0) s.moveTo(Math.cos(a)*root, Math.sin(a)*root);
      if (o.pointed){                       // 擒纵轮爪形齿
        s.absarc(0, 0, root, a, a + st*0.5, false);
        s.lineTo(Math.cos(a + st*0.62)*tip, Math.sin(a + st*0.62)*tip);
        s.lineTo(Math.cos(a + st*0.72)*root, Math.sin(a + st*0.72)*root);
      } else {
        s.absarc(0, 0, root, a, a + st*0.42, false);
        s.lineTo(Math.cos(a + st*0.52)*tip, Math.sin(a + st*0.52)*tip);
        s.absarc(0, 0, tip, a + st*0.52, a + st*0.88, false);
        s.lineTo(Math.cos(a + st*0.98)*root, Math.sin(a + st*0.98)*root);
      }
    }
    s.closePath();
  } else s.absarc(0, 0, rPitch, 0, Math.PI*2, false);

  const axle = new THREE.Path();
  axle.absarc(0, 0, o.axle ?? 0.24, 0, Math.PI*2, true);
  s.holes.push(axle);

  if (o.spokes){                            // 辐条镂空
    const rIn = o.hubR ?? 1.0, rOut = root - (o.rim ?? 0.55), n = o.spokes;
    const gap = (o.spokeW ?? 0.5) / ((rIn + rOut)/2);
    for (let k = 0; k < n; k++){
      const a0 = k/n*Math.PI*2 + gap/2, a1 = (k+1)/n*Math.PI*2 - gap/2;
      const p = new THREE.Path();
      p.moveTo(Math.cos(a0)*rOut, Math.sin(a0)*rOut);
      p.absarc(0, 0, rOut, a0, a1, false);
      p.lineTo(Math.cos(a1)*rIn, Math.sin(a1)*rIn);
      p.absarc(0, 0, rIn, a1, a0, true);
      p.closePath();
      s.holes.push(p);
    }
  }
  return s;
}
function extrude(shape, depth, mat, bevel = 0.045){
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel,
    bevelSegments:1, curveSegments:10
  });
  const m = new THREE.Mesh(g, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
class SpiralCurve extends THREE.Curve {
  constructor(r0, r1, turns){ super(); this.r0 = r0; this.r1 = r1; this.turns = turns; }
  getPoint(t){
    const th = t * this.turns * Math.PI * 2;
    const r = this.r0 + (this.r1 - this.r0) * t;
    return new THREE.Vector3(Math.cos(th)*r, Math.sin(th)*r, 0);
  }
}
function capsuleShape(p1, p2, r1, r2){
  const th = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  const s = new THREE.Shape();
  s.absarc(p1.x, p1.y, r1, th + Math.PI/2, th + Math.PI*1.5, false);
  s.absarc(p2.x, p2.y, r2, th + Math.PI*1.5, th + Math.PI/2, false);
  s.closePath();
  return s;
}
function screwMesh(r = 0.34){

  head.rotation.x = Math.PI/2;

  g.add(head, slot);

}

const handsGroup = new THREE.Group();
function dauphineHand(len, wid, z, lumeLen){
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(0, -1.6); s.lineTo(wid, 0); s.lineTo(wid*0.28, len*0.92);
  s.lineTo(0, len); s.lineTo(-wid*0.28, len*0.92); s.lineTo(-wid, 0); s.closePath();
  const body = extrude(s, 0.16, M.steel, 0.05);
  g.add(body);
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.06, len*1.02, 0.1), M.steelBrush);
  ridge.position.set(0, len*0.42, 0.2);
  g.add(ridge);
  const ls = new THREE.Shape();
  ls.moveTo(-wid*0.34, 1.4); ls.lineTo(wid*0.34, 1.4);
  ls.lineTo(wid*0.14, lumeLen); ls.lineTo(-wid*0.14, lumeLen); ls.closePath();
  const lume = extrude(ls, 0.06, M.lume, 0.01);
  lume.position.z = 0.2;
  g.add(lume);
  g.position.z = z;
  return g;
}

function setHighlight(id, on){
  if (!id || !partMeshes[id]) return;
  for (const m of partMeshes[id]){
    if (on){
      if (!m.userData.origMat){
        m.userData.origMat = m.material;
        const hi = m.material.clone();
        if (hi.emissive){
          hi.emissive = hi.emissive.clone().add(new THREE.Color(0x1e3a55));
          hi.emissiveIntensity = Math.max(hi.emissiveIntensity ?? 1, 1);
        }
        m.userData.hiMat = hi;
      }
      m.material = m.userData.hiMat;
    } else if (m.userData.origMat){
      m.material = m.userData.origMat;
    }
  }
}
function refreshHighlights(){
  for (const id in partMeshes) setHighlight(id, false);
  if (selectedId) setHighlight(selectedId, true);
  if (hoverId && hoverId !== selectedId) setHighlight(hoverId, true);
}
function showTooltip(id){
  if (!id){ tooltip.style.opacity = 0; return; }
  const p = PARTS[id];
  tooltip.querySelector('.t').textContent = p.name;
  tooltip.querySelector('.e').textContent = p.en;
  tooltip.style.left = pointerPx.x + 'px';
  tooltip.style.top = pointerPx.y + 'px';
  tooltip.style.opacity = 1;
}
function specRows(list){
  return list.map(([k, v]) => `<div class="spec"><span>${k}</span><b>${v}</b></div>`).join('');

    <div class="kicker">Manufacture Movement</div>
    <h2>机芯概览</h2>
    <div class="en">Calibre SQ-88 · Manual Winding</div>
    <p>一枚完全镂空的手动上链机芯:动力自发条盒释放,经中心轮、三轮、四轮逐级增速,抵达擒纵轮;擒纵叉以每秒八次的节拍切割能量,驱动 4 赫兹摆轮与游丝往复呼吸。悬停任意零件查看名称,点击进入详解,或开启爆炸视图纵览 217 个零件的层叠秩序。</p>
    <div class="divider"></div>
    ${specRows([['机芯型号','CAL. SQ-88'],['振频','28,800 vph · 4 Hz'],['宝石轴承','21 枚'],['动力储存','72 小时'],['零件总数','217'],['打磨','日内瓦波纹 · 鱼鳞纹 · 手工倒角']])}
    <div class="divider"></div>
    <div class="kicker" style="margin-bottom:2px">部件导览</div>
    <div class="chips">${Object.keys(PARTS).map(id => `<span class="chip" data-id="${id}">${PARTS[id].name}</span>`).join('')}</div>`;
  panel.classList.add('show');
}
function showPart(id){
  selectedId = id; refreshHighlights();
  const p = PARTS[id];
  panel.innerHTML = `
    <div class="kicker">Component Detail</div>
    <h2>${p.name}</h2>
    <div class="en">${p.en}</div>
    <p>${p.desc}</p>
    <div class="divider"></div>
    ${specRows(p.specs)}
    <button class="btn back" id="btnBack">← 返回机芯概览</button>`;
  panel.classList.add('show');
  document.getElementById('btnBack').onclick = showOverview;
}
panel.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) showPart(chip.dataset.id);
});

renderer.domElement.addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  pointerPx = { x:e.clientX, y:e.clientY };
});
renderer.domElement.addEventListener('pointerdown', e => { downPx = { x:e.clientX, y:e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPx) return;
  const moved = Math.hypot(e.clientX - downPx.x, e.clientY - downPx.y);
  downPx = null;
  if (moved > 6) return;
  if (hoverId) showPart(hoverId);
  else showOverview();
});
renderer.domElement.addEventListener('pointerleave', () => {
  pointer.set(-2, -2); hoverId = null; showTooltip(null); refreshHighlights();
});

/* ============================================================
   9. 控制条 / 键盘
============================================================ */
let explodeTarget = 0, explodeCur = 0;
let running = true, night = false;
const btnExplode = document.getElementById('btnExplode');
const btnRun = document.getElementById('btnRun');
const btnRotate = document.getElementById('btnRotate');
const btnNight = document.getElementById('btnNight');
const btnReset = document.getElementById('btnReset');
const explodeWrap = document.getElementById('explodeWrap');
const explodeSlider = document.getElementById('explodeSlider');

function setExplode(v, syncSlider = true){
  explodeTarget = THREE.MathUtils.clamp(v, 0, 1);
  const open = explodeTarget > 0.02;
  btnExplode.classList.toggle('active', open);
  explodeWrap.classList.toggle('open', open);
  if (syncSlider) explodeSlider.value = Math.round(explodeTarget * 100);
}
btnExplode.onclick = () => setExplode(explodeTarget > 0.5 ? 0 : 1);
explodeSlider.addEventListener('input', () => setExplode(explodeSlider.value / 100, false));

function setRunning(v){
  running = v;
  btnRun.classList.toggle('active', v);
  btnRun.innerHTML = v ? '<span class="ico">❚❚</span>机芯运转' : '<span class="ico">▶</span>机芯暂停';
}
btnRun.onclick = () => setRunning(!running);

btnRotate.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('active', controls.autoRotate);
};

function setNight(v){
  night = v;
  btnNight.classList.toggle('active', v);
  keyLight.intensity = v ? 0.22 : 2.6;
  rimLight.intensity = v ? 0.35 : 1.5;
  fillLight.intensity = v ? 0.05 : 0.45;
  topSpot.intensity = v ? 20 : 260;
  scene.environmentIntensity = v ? 0.12 : 1.0;
  M.lume.emissiveIntensity = v ? 4.2 : LUME_BASE;
  bloom.strength = v ? 0.95 : 0.32;
  bloom.threshold = v ? 0.5 : 0.88;
  scene.background.set(v ? 0x020308 : 0x07080d);
  scene.fog.color.set(v ? 0x020308 : 0x07080d);
  fade.material.opacity = v ? 1 : 1;
  dust.material.opacity = v ? 0.12 : 0.32;
}
btnNight.onclick = () => setNight(!night);

function resetView(){
  controls.autoRotate = true;
  btnRotate.classList.add('active');
  const from = camera.position.clone(), to = CAM_HOME.clone();
  const t0 = performance.now();
  (function tween(){
    const k = Math.min((performance.now() - t0) / 900, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from, to, e);
    controls.target.lerp(new THREE.Vector3(0, 1.2, 0), e * 0.2 + 0.02);
    if (k < 1) requestAnimationFrame(tween);
  })();
}
btnReset.onclick = resetView;

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key.toLowerCase()){
    case 'e': setExplode(explodeTarget > 0.5 ? 0 : 1); break;
    case ' ': e.preventDefault(); setRunning(!running); break;
    case 'n': setNight(!night); break;
    case 'r': resetView(); break;
    case 'escape': showOverview(); break;
  }
});

/* ============================================================
   10. 动画主循环
   擒纵节拍:8 拍/秒;摆轮 4Hz ±270°;轮系按真实传动比
============================================================ */
const clock = new THREE.Clock();
let simT = 0;
const W = {                                    // 各轮角速度(rad/s)
  barrel: 0.0375, center: -0.21, third: 0.87, fourth: -Math.PI*2/60
};
const easeStep = x => x*x*(3 - 2*x);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (running) simT += dt;

  /* --- 擒纵与调速机构 --- */
  const beatF = simT * 8;                      // 8 拍/秒
  const beat = Math.floor(beatF), frac = beatF - beat;
  const snap = easeStep(Math.min(frac / 0.14, 1));
  spins.escape.rotation.z = -(beat + snap) * (Math.PI / 15);
  const osc = Math.sin(Math.PI * beatF);       // 摆轮相位,过零点=节拍
  spins.balance.rotation.z = 4.71 * osc;       // ±270°
  spins.pallet.rotation.z = 0.17 * Math.tanh(4.5 * osc);
  const breathe = 1 - 0.055 * osc;             // 游丝呼吸
  spins.hairspring.scale.set(breathe, breathe, 1);
  spins.hairspring.rotation.z = 0.06 * osc;

  /* --- 轮系 --- */
  spins.barrel.rotation.z = simT * W.barrel;
  spins.center.rotation.z = simT * W.center;
  spins.third.rotation.z = simT * W.third;
  spins.fourth.rotation.z = simT * W.fourth;

  /* --- 指针:真实本地时间 --- */
  const now = new Date();
  const sec = now.getSeconds() + now.getMilliseconds()/1000;
  const min = now.getMinutes() + sec/60;
  const hr = (now.getHours() % 12) + min/60;
  minuteHand.rotation.z = -min/60 * Math.PI*2;
  hourHand.rotation.z = -hr/12 * Math.PI*2;
  spins.smallseconds.rotation.z = -sec/60 * Math.PI*2;

  /* --- 爆炸视图(阻尼缓动) --- */
  explodeCur += (explodeTarget - explodeCur) * Math.min(dt * 4.5, 1);
  const ex = easeStep(THREE.MathUtils.clamp(explodeCur, 0, 1));
  for (const { group, base, dir } of explodeGroups)
    group.position.set(base.x, base.y, base.z + dir * ex);

  /* --- 悬浮呼吸 + 微尘 --- */
  watch.position.y = 1.4 + Math.sin(t * 0.55) * 0.3;
  watch.rotation.z = Math.sin(t * 0.3) * 0.015;
  dust.rotation.y = t * 0.012;

  /* --- 射线拾取 --- */
  if (pointer.x > -1.5){
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(interactive, false);
    // 表镜透明:优先拾取其后的机芯零件,表镜可经"部件导览"选中
    let hit = hits.find(h => h.object.userData.partId !== 'crystal') ?? hits[0];
    const id = hit ? hit.object.userData.partId : null;
    if (id !== hoverId){
      hoverId = id;
      refreshHighlights();
      renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
    }
    showTooltip(id);
  }

  controls.update();
  composer.render();
}

/* ============================================================
   11. 启动
============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

showOverview();
animate();
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById('loader').classList.add('gone');
  setTimeout(() => document.getElementById('loader').remove(), 1200);
}));
</script>
