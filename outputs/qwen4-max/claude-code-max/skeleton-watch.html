<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MERIDIAN · Calibre M-8800 Squelette — 交互式镂空机械腕表</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23d4af7a' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%23d4af7a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4af7a; --gold-hi:#f0d9ae; --gold-dim:rgba(212,175,122,.35);
    --bg:#050608; --ink:#e9e7e2; --muted:#8d929c; --panel:rgba(13,15,19,.78);
    --serif:'Playfair Display','Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;
    --sans:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  #stage canvas.pick{cursor:pointer}

  /* ---------- overlay chrome ---------- */
  .ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .ui > *{pointer-events:auto}

  header{position:absolute;top:26px;left:32px;pointer-events:none}
  header .brand{font-family:var(--serif);font-size:26px;letter-spacing:.42em;color:var(--gold-hi);font-weight:600}
  header .brand em{font-style:normal;color:var(--gold)}
  header .sub{margin-top:7px;font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
  header .rule{margin-top:10px;width:180px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

  #clockbox{position:absolute;top:28px;right:32px;text-align:right;pointer-events:none}
  #clock{font-family:var(--serif);font-size:30px;color:var(--ink);letter-spacing:.08em;font-variant-numeric:tabular-nums}
  #clockbox .chip{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.22em;color:var(--gold);
    border:1px solid var(--gold-dim);border-radius:99px;padding:4px 12px;background:rgba(212,175,122,.05)}

  /* ---------- info panel ---------- */
  #panel{position:absolute;top:104px;right:32px;width:322px;max-height:calc(100vh - 230px);overflow-y:auto;
    background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(212,175,122,.22);border-radius:14px;padding:22px 22px 18px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    transition:opacity .35s ease, transform .35s ease;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
  #panel::-webkit-scrollbar{width:4px}
  #panel::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px}
  #panel.hidden{opacity:0;transform:translateX(24px);pointer-events:none}
  #panel .kicker{font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
  #panel h2{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--gold-hi);line-height:1.25}
  #panel .en{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin:3px 0 12px}
  #panel p.desc{font-size:12.5px;line-height:1.85;color:#c9ccd3;font-weight:300;margin-bottom:14px}
  #panel .specs{border-top:1px solid rgba(212,175,122,.18)}
  #panel .specs .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11.5px}
  #panel .specs .k{color:var(--muted);letter-spacing:.06em;white-space:nowrap}
  #panel .specs .v{color:var(--ink);text-align:right;font-weight:400}
  #panel .close{position:absolute;top:12px;right:14px;width:26px;height:26px;border:none;background:none;
    color:var(--muted);font-size:16px;cursor:pointer;border-radius:6px;line-height:1}
  #panel .close:hover{color:var(--gold-hi);background:rgba(212,175,122,.1)}
  #reserve{margin-top:14px}
  #reserve .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:6px}
  #reserve .bar{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  #reserve .fill{height:100%;width:92%;border-radius:3px;background:linear-gradient(90deg,#8a6a3f,var(--gold-hi));
    transition:width 1.2s cubic-bezier(.22,1,.36,1)}
  #panel .back{margin-top:14px;width:100%;padding:8px 0;font-size:11px;letter-spacing:.2em;color:var(--gold);
    background:rgba(212,175,122,.07);border:1px solid var(--gold-dim);border-radius:8px;cursor:pointer}
  #panel .back:hover{background:rgba(212,175,122,.16);color:var(--gold-hi)}

  /* ---------- control bar ---------- */
  #controls{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:9px;
    padding:9px 11px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(212,175,122,.2);border-radius:99px;box-shadow:0 18px 44px rgba(0,0,0,.5)}
  #controls button{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:99px;cursor:pointer;
    border:1px solid transparent;background:transparent;color:#b9bec7;font-size:12px;letter-spacing:.08em;
    font-family:var(--sans);transition:all .25s ease;white-space:nowrap}
  #controls button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #controls button:hover{color:var(--gold-hi);background:rgba(212,175,122,.09)}
  #controls button.active{color:#0b0c0e;background:linear-gradient(135deg,var(--gold-hi),var(--gold));
    border-color:rgba(255,255,255,.25);box-shadow:0 4px 18px rgba(212,175,122,.35)}
  #controls button kbd{font-size:9px;color:inherit;opacity:.55;border:1px solid currentColor;border-radius:3px;padding:0 3px;font-family:var(--sans)}

  #hint{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.22em;
    color:var(--muted);pointer-events:none;text-align:center;transition:opacity 1s ease}
  #hint.dim{opacity:.35}

  /* ---------- tooltip & labels ---------- */
  #tooltip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .18s ease;
    background:rgba(10,12,16,.9);border:1px solid var(--gold-dim);border-radius:8px;padding:7px 12px;
    backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #tooltip .zh{font-size:13px;color:var(--gold-hi);letter-spacing:.1em}
  #tooltip .en{font-size:10px;color:var(--muted);font-style:italic;font-family:var(--serif);margin-top:1px}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:0;
    transition:opacity .3s ease;will-change:transform}
  .lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(212,175,122,.9);flex:none}
  .lbl .line{width:26px;height:1px;background:linear-gradient(90deg,var(--gold),rgba(212,175,122,.25));flex:none}
  .lbl .txt{font-size:11px;letter-spacing:.14em;color:#d8dbe1;background:rgba(10,12,16,.72);
    border:1px solid rgba(212,175,122,.25);padding:3px 9px;border-radius:6px;backdrop-filter:blur(6px);white-space:nowrap}
  .lbl:hover .txt{color:var(--gold-hi);border-color:var(--gold)}
  .lbl.off{opacity:0;pointer-events:none}

  #toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(8px);z-index:40;opacity:0;
    background:rgba(10,12,16,.92);border:1px solid var(--gold-dim);color:var(--gold-hi);
    padding:10px 22px;border-radius:99px;font-size:12px;letter-spacing:.16em;pointer-events:none;
    transition:all .4s cubic-bezier(.22,1,.36,1);box-shadow:0 12px 32px rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;transition:opacity .9s ease}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .mono{font-family:var(--serif);font-size:30px;letter-spacing:.5em;color:var(--gold-hi);padding-left:.5em}
  #loader .ring{width:54px;height:54px;border-radius:50%;border:1px solid rgba(212,175,122,.18);
    border-top-color:var(--gold);animation:spin 1.1s linear infinite}
  #loader .msg{font-size:11px;letter-spacing:.3em;color:var(--muted)}
  @keyframes spin{to{transform:rotate(360deg)}}

  #err{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:var(--bg);
    color:var(--muted);font-size:13px;letter-spacing:.1em;text-align:center;line-height:2;padding:24px}

  @media (max-width:820px){
    header{top:16px;left:18px}
    header .brand{font-size:19px}
    header .sub{font-size:9px}
    #clockbox{top:16px;right:18px}
    #clock{font-size:21px}
    #panel{top:auto;bottom:96px;left:14px;right:14px;width:auto;max-height:38vh;padding:16px 18px}
    #controls{bottom:14px;gap:5px;padding:7px 8px;max-width:96vw;flex-wrap:wrap;justify-content:center;border-radius:22px}
    #controls button{padding:7px 10px;font-size:11px}
    #controls button kbd{display:none}
    #hint{display:none}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="ui">
  <header>
    <div class="brand">MERI<em>DIAN</em></div>
    <div class="sub">Calibre M-8800 Squelette · 镂空机械腕表</div>
    <div class="rule"></div>
  </header>

  <div id="clockbox">
    <div id="clock">--:--:--</div>
    <div class="chip">28 800 A/h · 4 Hz</div>
  </div>

  <aside id="panel">
    <button class="close" id="panelClose" title="关闭">✕</button>
    <div id="panelBody"></div>
  </aside>

  <div id="hint">拖动旋转 · 滚轮缩放 · 悬停 / 点击零件查看详情</div>

  <nav id="controls">
    <button id="btnExplode"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>爆炸视图<kbd>E</kbd></button>
    <button id="btnLume"><svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4 6.5 6.5 0 0 0 20 13.5z"/></svg>夜光模式<kbd>L</kbd></button>
    <button id="btnSpin" class="active"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>自动旋转<kbd>␣</kbd></button>
    <button id="btnLabels"><svg viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9V4z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg>零件标注<kbd>T</kbd></button>
    <button id="btnInfo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.2"/></svg>机芯信息</button>
    <button id="btnReset"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M6 10v10h12V10"/></svg>重置视角<kbd>R</kbd></button>
  </nav>
</div>

<div id="labels"></div>
<div id="tooltip"><div class="zh"></div><div class="en"></div></div>
<div id="toast"></div>

<div id="loader">
  <div class="mono">MERIDIAN</div>
  <div class="ring"></div>
  <div class="msg" id="loaderMsg">正在组装机芯 · ASSEMBLING CALIBRE</div>
</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector }       from 'three/addons/objects/Reflector.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   MERIDIAN · Calibre M-8800 Squelette
   A fully procedural skeleton mechanical watch.
   Every wheel, spring, jewel and bridge is generated in code.
   ================================================================ */

const TAU = Math.PI * 2;
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut   = t => 1-Math.pow(1-t,3);

/* ---------------- renderer / scene / camera ---------------- */
const stage = document.getElementById('stage');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
}catch(e){
  const err=document.getElementById('err');
  err.style.display='flex';
  err.innerHTML='很抱歉，您的浏览器或设备不支持 WebGL。<br>请使用最新版 Chrome / Edge / Safari 打开本页面。';
  throw e;
}
const DPR = Math.min(window.devicePixelRatio||1, 1.8);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050608);
scene.fog = new THREE.FogExp2(0x050608, 0.02);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 120);
const HOME_POS = V3(3.4, 1.5, 7.3), HOME_TGT = V3(0, 0, 0.15);
camera.position.set(-7.5, 4.2, 13.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3.4; controls.maxDistance = 16;
controls.minPolarAngle = 0.12; controls.maxPolarAngle = 1.62;
controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
controls.enablePan = false;

/* ---------------- environment & lights ---------------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const keyLight = new THREE.SpotLight(0xfff1dd, 140, 0, 0.55, 0.65, 2);
keyLight.position.set(6, 8.5, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 3; keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0003; keyLight.shadow.normalBias = 0.02;
scene.add(keyLight, keyLight.target);

const rimLight = new THREE.DirectionalLight(0x8fb7ff, 2.6);
rimLight.position.set(-7, 3.5, -6); scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffd9b0, 0.55);
fillLight.position.set(-4, -2, 5); scene.add(fillLight);

const dialKick = new THREE.SpotLight(0xffffff, 30, 0, 0.4, 0.8, 2);
dialKick.position.set(-4.5, 2.5, 6.5); scene.add(dialKick, dialKick.target);

/* ---------------- procedural textures ---------------- */
function canvasTex(size, draw, srgb=true){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
/* Côtes de Genève — diagonal Geneva stripes */
const cotesCanvas = document.createElement('canvas'); cotesCanvas.width = cotesCanvas.height = 512;
{
  const g = cotesCanvas.getContext('2d');
  g.fillStyle = '#c9d0d8'; g.fillRect(0,0,512,512);
  g.save(); g.translate(256,256); g.rotate(-Math.PI/7); g.translate(-400,-400);
  for(let i=0;i<14;i++){
    const x = i*64;
    const grad = g.createLinearGradient(x,0,x+64,0);
    grad.addColorStop(0,'#b4bcc6'); grad.addColorStop(.45,'#e2e8ee');
    grad.addColorStop(.55,'#eef2f6'); grad.addColorStop(1,'#aeb6c1');
    g.fillStyle = grad; g.fillRect(x,0,64,800);
  }
  g.restore();
}
const cotesMap  = new THREE.CanvasTexture(cotesCanvas); cotesMap.colorSpace = THREE.SRGBColorSpace;
const cotesData = new THREE.CanvasTexture(cotesCanvas);
[cotesMap,cotesData].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1.6,1.6);
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); });

/* Perlage — overlapping circular graining */
const perlCanvas = document.createElement('canvas'); perlCanvas.width = perlCanvas.height = 512;
{
  const g = perlCanvas.getContext('2d');
  g.fillStyle = '#c2c9d2'; g.fillRect(0,0,512,512);
  for(let y=0;y<10;y++) for(let x=0;x<10;x++){
    const cx=x*56+(y%2?28:0), cy=y*56;
    const grad=g.createRadialGradient(cx-10,cy-10,4,cx,cy,42);
    grad.addColorStop(0,'#e8edf2'); grad.addColorStop(.7,'#b8c0ca'); grad.addColorStop(1,'#9aa3af');
    g.fillStyle=grad; g.beginPath(); g.arc(cx,cy,42,0,TAU); g.fill();
  }
}
const perlMap  = new THREE.CanvasTexture(perlCanvas); perlMap.colorSpace = THREE.SRGBColorSpace;
const perlData = new THREE.CanvasTexture(perlCanvas);
[perlMap,perlData].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1.4,1.4);
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); });

/* chapter ring printing */
const chapterTex = canvasTex(1024,(g,S)=>{
  const cx=S/2, px=S/2/1.72;
  g.clearRect(0,0,S,S);
  for(let i=0;i<60;i++){
    const a=i/60*TAU, five=i%5===0;
    const r0=(five?1.565:1.615)*px, r1=1.685*px;
    g.strokeStyle = five ? '#e8d5b0' : 'rgba(220,225,232,.85)';
    g.lineWidth = five ? 5 : 2;
    g.beginPath();
    g.moveTo(cx+Math.sin(a)*r0, cx-Math.cos(a)*r0);
    g.lineTo(cx+Math.sin(a)*r1, cx-Math.cos(a)*r1);
    g.stroke();
  }
  g.fillStyle='#e6d3ac'; g.textAlign='center';
  g.font='600 30px Georgia,serif';
  g.fillText('M E R I D I A N', cx, cx-1.475*px);
  g.font='400 17px Georgia,serif'; g.fillStyle='rgba(220,225,232,.8)';
  g.fillText('GENÈVE', cx, cx-1.40*px+14);
  g.font='400 15px Georgia,serif';
  g.fillText('SWISS', cx-0.30*px, cx+1.545*px);
  g.fillText('MADE',  cx+0.30*px, cx+1.545*px);
});

/* small-seconds subdial printing */
const subdialTex = canvasTex(256,(g,S)=>{
  const cx=S/2, px=S/2/0.35;
  g.clearRect(0,0,S,S);
  for(let i=0;i<60;i++){
    const a=i/60*TAU, five=i%5===0;
    g.strokeStyle = five?'#e8d5b0':'rgba(215,220,228,.7)';
    g.lineWidth = five?3:1.4;
    const r0=(five?0.27:0.295)*px, r1=0.325*px;
    g.beginPath();
    g.moveTo(cx+Math.sin(a)*r0, cx-Math.cos(a)*r0);
    g.lineTo(cx+Math.sin(a)*r1, cx-Math.cos(a)*r1);
    g.stroke();
  }
  g.fillStyle='#dcc9a4'; g.font='600 21px Georgia,serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('60', cx, cx-0.205*px);
  g.fillText('30', cx, cx+0.215*px);
  g.fillText('15', cx+0.215*px, cx);
  g.fillText('45', cx-0.215*px, cx);
});

/* engraved bridge text decals (canvas aspect matches the plane) */
function textDecal(lines, w, h){
  const cw=512, ch=Math.max(96,Math.round(512*h/w));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const g=c.getContext('2d');
  g.clearRect(0,0,cw,ch);
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba(56,62,72,.95)';
  const n=lines.length;
  lines.forEach((txt,i)=>{
    const fs=n===1?ch*0.40:ch*0.28;
    g.font=`600 ${Math.round(fs)}px Georgia,serif`;
    g.fillText(txt, cw/2, ch/2+(i-(n-1)/2)*ch*0.46);
  });
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* backdrop studio glow */

/* ================================================================
   GEOMETRY HELPERS
   ================================================================ */
function cylZ(r, h, mat, seg=28){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.rotation.x = Math.PI/2; return m;
}
function annulusShape(rOut, rIn){
  const s = new THREE.Shape(); s.absarc(0,0,rOut,0,TAU,false);
  const hole = new THREE.Path(); hole.absarc(0,0,rIn,0,TAU,true);
  s.holes.push(hole); return s;
}
function extrude(shape, depth, bevel=0.008, mat=MAT.steel, curveSeg=10){
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled:bevel>0, bevelThickness:bevel, bevelSize:bevel,
    bevelSegments:2, curveSegments:curveSeg, steps:1
  });
  geo.translate(0,0,-depth/2);
  return new THREE.Mesh(geo, mat);
}
/* toothed gear outline (approximate involute) */
function gearShape(rTip, teeth, module, holeR){
  const depth = 2.3*module, rRoot = rTip-depth, p = TAU/teeth;
  const s = new THREE.Shape();
  for(let i=0;i<teeth;i++){
    const a = i*p;
    const pts = [
      [rRoot, a-0.50*p],[rRoot, a-0.28*p],[rTip, a-0.155*p],
      [rTip,  a+0.155*p],[rRoot, a+0.28*p],[rRoot, a+0.50*p]
    ];
    pts.forEach(([r,ang],j)=>{
      const x=Math.cos(ang)*r, y=Math.sin(ang)*r;
      if(i===0&&j===0) s.moveTo(x,y); else s.lineTo(x,y);
    });
  }
  s.closePath();
  if(holeR>0){ const h=new THREE.Path(); h.absarc(0,0,holeR,0,TAU,true); s.holes.push(h); }
  return s;
}
/* club-tooth escape wheel */
function escapeShape(rTip, teeth, holeR){
  const rRoot=rTip*0.68, p=TAU/teeth, s=new THREE.Shape();
  for(let i=0;i<teeth;i++){
    const a=i*p;
    const pts=[[rRoot,a],[rTip,a+0.055*p],[rTip*0.965,a+0.20*p],[rRoot,a+0.27*p],[rRoot,a+p]];
    pts.forEach(([r,ang],j)=>{
      const x=Math.cos(ang)*r,y=Math.sin(ang)*r;
      if(i===0&&j===0)s.moveTo(x,y);else s.lineTo(x,y);
    });
  }
  s.closePath();
  const h=new THREE.Path(); h.absarc(0,0,holeR,0,TAU,true); s.holes.push(h);
  return s;
}
/* spiral ribbon — real flat mainspring / hairspring strip */
function spiralRibbon(r0, r1, turns, height, thick, samples=260){
  const pos=[], idx=[];
  for(let i=0;i<samples;i++){
    const t=i/(samples-1), th=t*turns*TAU, r=r0+(r1-r0)*t;
    const c=Math.cos(th), s=Math.sin(th);
    const ri=r-thick/2, ro=r+thick/2;
    pos.push(ri*c,ri*s,-height/2,  ro*c,ro*s,-height/2,  ro*c,ro*s,height/2,  ri*c,ri*s,height/2);
  }
  for(let i=0;i<samples-1;i++){
    const a=i*4, b=(i+1)*4;
    for(let e=0;e<4;e++){
      const e2=(e+1)%4;
      idx.push(a+e, b+e, b+e2,  a+e, b+e2, a+e2);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return geo;
}
function capsuleShape(p1, p2, w){
  const a=Math.atan2(p2.y-p1.y, p2.x-p1.x), s=new THREE.Shape();
  s.absarc(p1.x,p1.y,w/2, a+Math.PI/2, a-Math.PI/2, true);
  s.absarc(p2.x,p2.y,w/2, a-Math.PI/2, a+Math.PI/2, true);
  s.closePath(); return s;
}
function splineShape(pts){
  const s=new THREE.Shape(); s.moveTo(pts[0][0],pts[0][1]);
  s.splineThru(pts.slice(1).map(p=>new THREE.Vector2(p[0],p[1])));
  s.closePath(); return s;
}
function roundedRect(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h); s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r); s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}

const pickMeshes = [];
function registerPart(id, info, roots){
  const meshes=[];
  roots.forEach(root=>root.traverse(o=>{
    if(o.isMesh){
      o.material = o.material.clone();
      o.userData.partId = id;
      if(o.material.emissive){
        o.userData.be = o.material.emissive.getHex();
        o.userData.bi = o.material.emissiveIntensity;
      }
      meshes.push(o); pickMeshes.push(o);
    }
  }));
  const anchor = new THREE.Object3D();
  parts.set(id, { meshes, info, anchor, hl:0, wasHl:false });
  return anchor;
}
function jewelAt(parent, x,y,z, r=0.05){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const chaton=new THREE.Mesh(new THREE.TorusGeometry(r*1.45, r*0.42, 10, 26), MAT.goldSoft);
  const ruby=cylZ(r, 0.024, MAT.ruby, 20); ruby.position.z=0.004;
  g.add(chaton, ruby); parent.add(g); return g;
}
function screwAt(parent, x,y,z, r=0.045){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const head=cylZ(r, 0.022, MAT.blued, 20);
  const slot=new THREE.Mesh(new THREE.BoxGeometry(r*1.7, r*0.28, 0.006), MAT.dark);
  slot.position.z=0.012; slot.rotation.z=Math.random()*Math.PI;
  g.add(head,slot); parent.add(g); return g;
}
function pillar(parent, x,y, z0,z1, r=0.06){
  const p=cylZ(r, z1-z0, MAT.steelBr, 16);
  p.position.set(x,y,(z0+z1)/2); parent.add(p); return p;
}

/* ================= GEAR TRAIN ================= */
function makeWheel({rTip, teeth, module=0.017, thick=0.05, rimW=0.06, spokes=5,
                    hubR=0.06, hubH=0.09, mat=MAT.steelHi, pinion=null, arborLen=0.3, arborZ=0}){
  const g=new THREE.Group();
  const rRoot=rTip-2.3*module;
  const ring=extrude(gearShape(rTip,teeth,module,rRoot-rimW), thick, 0.006, mat, 8);
  g.add(ring);
  for(let k=0;k<spokes;k++){
    const a=k/spokes*TAU;
    const len=rRoot-rimW-hubR+0.02;
    const sp=new THREE.Mesh(new THREE.BoxGeometry(len,0.052,thick*0.8), mat);
    sp.position.set(Math.cos(a)*(hubR+len/2-0.01), Math.sin(a)*(hubR+len/2-0.01), 0);
    sp.rotation.z=a; g.add(sp);
  }
  const hub=cylZ(hubR,hubH,mat,20); g.add(hub);
  const arbor=cylZ(0.022,arborLen,MAT.steelBr,12); arbor.position.z=arborZ; g.add(arbor);
  if(pinion){
    const pg=extrude(gearShape(pinion.r,pinion.teeth,module,0), pinion.h??0.07, 0.005, MAT.steel, 8);
    pg.position.z=pinion.z; g.add(pg);
  }
  return g;
}

function swordHand(len, w, tail, lumeFrac=0.62){
  const g=new THREE.Group();
  const s=new THREE.Shape();
  s.moveTo(-w,-tail); s.lineTo(-w*0.8,len*0.72); s.lineTo(0,len);
  s.lineTo(w*0.8,len*0.72); s.lineTo(w,-tail); s.closePath();
  const body=extrude(s,0.022,0.009,MAT.gold,8); g.add(body);
  const ls=new THREE.Shape();
  const lw=w*0.42, l0=len*0.16, l1=len*(0.16+lumeFrac*0.72);
  ls.moveTo(-lw,l0); ls.lineTo(-lw*0.7,l1*0.92); ls.lineTo(0,l1);
  ls.lineTo(lw*0.7,l1*0.92); ls.lineTo(lw,l0); ls.closePath();
  const lume=extrude(ls,0.012,0.003,MAT.lume,6);
  lume.position.z=0.017; lume.userData.lume=true; g.add(lume);
  return g;
}

const raycaster=new THREE.Raycaster();

let pointerPx={x:0,y:0}, downPx=null, pointerInside=false, pointerDirty=false;
renderer.domElement.addEventListener('pointermove',e=>{
  pointerInside=true; pointerDirty=true;
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  pointerPx={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('pointerleave',()=>{ pointerInside=false; });
renderer.domElement.addEventListener('pointerdown',e=>{ downPx={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',()=>{ downPx=null; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPx) return;
  const dx=e.clientX-downPx.x, dy=e.clientY-downPx.y;
  downPx=null;
  if(dx*dx+dy*dy>36) return;
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  const id=pickAt();
  selectPart(id===selectedId?null:id);
});
function pickAt(){
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(pickMeshes,false);
  if(!hits.length) return null;
  // prefer internal parts over the crystal covering them
  for(const h of hits){
    const id=h.object.userData.partId;
    if(id && id!=='crystal') return id;
  }
  return hits[0].object.userData.partId||null;
}

  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime,uVig,uGrain; varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      float d=length(vUv-vec2(0.5));
      c.rgb*=1.0-uVig*smoothstep(0.38,0.86,d);
      c.rgb+=(rand(vUv*fract(uTime*0.37)+fract(uTime))-0.5)*uGrain;
      gl_FragColor=c;
    }`
});
composer.addPass(gradePass);

function updateHands(){
  const now=new Date();
  const ms=now.getMilliseconds()/1000;
  const s=now.getSeconds()+ms;
  const m=now.getMinutes()+s/60;
  const h=(now.getHours()%12)+m/60;
  // mechanical seconds: 8 micro-steps per second
  const beats=s*8, frac=beats-Math.floor(beats);
  const q=(Math.floor(beats)+easeOut(Math.min(frac/0.3,1)))/8;
  const secA=-q/60*TAU;
  secondsGroup.rotation.z=secA;
  fourthWheel.rotation.z=secA;
  const minA=-m/60*TAU;
  minuteHand.rotation.z=minA;
  centerWheel.rotation.z=minA;
  hourHand.rotation.z=-h/12*TAU;
  thirdWheel.rotation.z=simTime*TAU/480+0.26;
  barrelGroup.rotation.z=simTime*TAU/21600+0.1;
  mainspringGroup.rotation.z=barrelGroup.rotation.z;
  clockEl.textContent=now.toTimeString().slice(0,8);
  return secA;
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  simTime+=dt; frameCount++;
  const t=simTime;

  /* tweens */
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    const k=easeInOut(Math.min(tw.t/tw.dur,1));
    tw.v.lerpVectors(tw.from,tw.to,k);
    if(tw.t>=tw.dur) tweens.splice(i,1);
  }
  controls.update();

  /* floating watch */
  watch.position.y=Math.sin(t*0.5)*0.05;
  watch.rotation.z=Math.sin(t*0.23)*0.008;

  /* gear train & hands */
  updateHands();

  /* escapement choreography — 4 Hz balance, 8 beats/s */
  const phase=t*TAU*4;
  balanceGroup.rotation.z=4.9*Math.sin(phase);
  const breathe=1+0.09*Math.sin(phase);
  hairspringGroup.scale.set(breathe,breathe,1);
  palletGroup.rotation.z=palletBaseAngle+0.165*Math.tanh(3.6*Math.sin(phase));
  const beats=t*8, bi=Math.floor(beats), bf=beats-bi;
  const stepEase=easeOut(Math.min(bf/0.22,1));
  escapeWheel.rotation.z=(bi+stepEase)*(Math.PI/15)+0.12;

  /* winding */
  if(wind>0){
    wind=Math.max(0,wind-dt/1.4);
    crownGroup.rotation.x+=dt*14*Math.sin(wind*Math.PI);
    const ms=1-0.05*Math.sin(wind*Math.PI);
    mainspringGroup.scale.set(ms,ms,1);
  }

  /* explode */
  const eTarget=exploded?1:0;
  if(Math.abs(explodeT-eTarget)>0.0005){
    explodeT=THREE.MathUtils.damp(explodeT,eTarget,4.2,dt);
    const e=easeInOut(clamp(explodeT,0,1));
    explodeItems.forEach(it=>it.obj.position.lerpVectors(it.base,it.base.clone().add(it.offset),e));
  }

  /* night / lume transition */
  const nTarget=night?1:0;
  if(Math.abs(nightT-nTarget)>0.001){
    nightT=THREE.MathUtils.damp(nightT,nTarget,3.5,dt);
    keyLight.intensity=lerp(140,7,nightT);
    rimLight.intensity=lerp(2.6,0.5,nightT);
    fillLight.intensity=lerp(0.55,0.08,nightT);
    dialKick.intensity=lerp(30,2,nightT);
    bloom.strength=lerp(0.32,0.95,nightT);
    bloom.threshold=lerp(0.82,0.45,nightT);
    renderer.toneMappingExposure=lerp(1.12,1.0,nightT);
    scene.background.setHex(0x050608).lerp(new THREE.Color(0x020304),nightT);
    scene.fog.color.copy(scene.background);
    watch.traverse(o=>{
      if(o.isMesh && o.material.envMapIntensity!==undefined){
        o.material.envMapIntensity=(o.material.userData.baseEnv??1)*lerp(1,0.22,nightT);
      }
    });
  }

  /* hover picking (throttled: every other frame, only when the pointer moved) */
  if(pointerInside && !downPx && pointerDirty && (frameCount&1)===0){
    pointerDirty=false;
    const id=pickAt();
    if(id!==hoverId){
      hoverId=id;
      renderer.domElement.classList.toggle('pick',!!id);
      if(id){
        tooltip.querySelector('.zh').textContent=INFO[id].zh;
        tooltip.querySelector('.en').textContent=INFO[id].en;
        tooltip.style.opacity=1;
      } else tooltip.style.opacity=0;
    }
  } else if(!pointerInside && hoverId){
    hoverId=null; tooltip.style.opacity=0; renderer.domElement.classList.remove('pick');
  }
  if(hoverId){
    tooltip.style.left=Math.min(pointerPx.x+16,innerWidth-170)+'px';
    tooltip.style.top=Math.min(pointerPx.y+18,innerHeight-70)+'px';
  }

  /* part highlighting */
  parts.forEach((p,id)=>{
    const target=(id===hoverId||id===selectedId)?1:0;
    p.hl=THREE.MathUtils.damp(p.hl,target,10,dt);
    if(p.hl<0.002 && !p.wasHl) return;
    p.wasHl=p.hl>=0.002;
    p.meshes.forEach(m=>{
      const mat=m.material;
      if(!mat.emissive) return;
      const base=tmpColor.setHex(m.userData.be??0);
      if(m.userData.lume){
        mat.emissive.copy(base);
        mat.emissiveIntensity=(m.userData.bi??0.3)+2.5*nightT+p.hl*0.7;
      } else {
        mat.emissive.copy(base).lerp(HL_COLOR,p.hl*0.8);
        mat.emissiveIntensity=(m.userData.bi??1)+p.hl*0.5;
      }
    });
  });
  /* lume baseline when no highlight active */
  watch.traverse(o=>{
    if(o.isMesh && o.userData.lume){
      const p=parts.get(o.userData.partId);
      if(!p || p.hl<0.002) o.material.emissiveIntensity=0.3+2.5*nightT;
    }
  });

  /* labels projection */
  if(labelsOn){
    labelEls.forEach((el,id)=>{
      const p=parts.get(id);
      p.anchor.getWorldPosition(wp);
      const dist=wp.distanceTo(camera.position);
      wp.project(camera);
      if(wp.z>1 || Math.abs(wp.x)>1.1 || Math.abs(wp.y)>1.1){
        el.style.opacity=0; el.style.pointerEvents='none'; return;
      }
      el.style.opacity=clamp(1.6-dist/14,0.25,1);
      el.style.pointerEvents='auto';
      const x=(wp.x*0.5+0.5)*innerWidth, y=(-wp.y*0.5+0.5)*innerHeight;
      el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(4px,-50%)`;
    });
  }

  /* dust drift */
  const dust=scene.getObjectByName('dust');
  if(dust){ dust.rotation.y+=dt*0.012; dust.position.y=Math.sin(t*0.1)*0.2; }

  gradePass.uniforms.uTime.value=t;
  composer.render();

  if(!booted){
    booted=true; window.__booted=true;
    setTimeout(()=>{
      document.getElementById('loader').classList.add('gone');
      setTimeout(()=>$('hint').classList.add('dim'),9000);
    },450);
  }
}
animate();

/* ---------------- resize ---------------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>

<script>
/* CDN failure notice (classic script: runs even if the module fails to load) */
setTimeout(function(){
  if(!window.__booted){
    var m=document.getElementById('loaderMsg');
    if(m) m.textContent='加载缓慢…请确认网络可访问 cdn.jsdelivr.net';
  }
},12000);
</script>
</body>
