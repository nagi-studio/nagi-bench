<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>海边骑自行车的鹈鹕</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fd9"/>
      <stop offset="0.7" stop-color="#a8dcf4"/>
      <stop offset="1" stop-color="#e8f8fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3ec"/>
      <stop offset="0.3" stop-color="#2fa8cc"/>
      <stop offset="1" stop-color="#0d5b8a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dba8"/>
      <stop offset="1" stop-color="#d4a86a"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#ffe680" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5dbe0"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9c24a"/>
      <stop offset="1" stop-color="#ef8a22"/>
    </linearGradient>
    <g id="wheel" fill="none">
      <circle r="60" stroke="#222" stroke-width="8"/>
      <circle r="54" stroke="#aab1b8" stroke-width="3"/>
      <path stroke="#d3d8dd" stroke-width="1.2" d="M0 0L54 0M0 0L46.8 27M0 0L27 46.8M0 0L0 54M0 0L-27 46.8M0 0L-46.8 27M0 0L-54 0M0 0L-46.8-27M0 0L-27-46.8M0 0L0-54M0 0L27-46.8M0 0L46.8-27"/>
      <circle r="6" fill="#555" stroke="none"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="310" fill="url(#sky)"/>
  <circle cx="640" cy="95" r="110" fill="url(#sun)"/>
  <circle cx="640" cy="95" r="36" fill="#fff3b0"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="150" cy="95" rx="60" ry="22"/>
    <ellipse cx="190" cy="78" rx="40" ry="24"/>
    <ellipse cx="115" cy="98" rx="38" ry="16"/>
    <ellipse cx="470" cy="60" rx="50" ry="18"/>
    <ellipse cx="500" cy="48" rx="30" ry="20"/>
  </g>

  <!-- 海鸥 -->
  <g fill="none" stroke="#2b3a4a" stroke-width="2.5" stroke-linecap="round">
    <path d="M360 150 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M410 128 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M300 175 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- 大海 -->
  <rect y="300" width="800" height="130" fill="url(#sea)"/>
  <g fill="#fff6c8" opacity="0.5">
    <ellipse cx="640" cy="318" rx="60" ry="2.5"/>
    <ellipse cx="640" cy="332" rx="40" ry="2"/>
    <ellipse cx="640" cy="346" rx="25" ry="1.8"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.55">
    <path d="M60 330 q15 -8 30 0 t30 0" stroke-width="2"/>
    <path d="M520 325 q15 -8 30 0 t30 0" stroke-width="2"/>
    <path d="M300 352 q20 -10 40 0 t40 0 t40 0" stroke-width="2.5"/>
    <path d="M80 378 q20 -10 40 0 t40 0" stroke-width="2.5"/>
    <path d="M600 365 q18 -9 36 0 t36 0" stroke-width="2.5"/>
  </g>

  <!-- 沙滩 -->
  <path d="M0 410 Q200 392 400 405 T800 398 L800 600 L0 600 Z" fill="url(#sand)"/>
  <path d="M0 410 Q200 392 400 405 T800 398" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M0 422 Q200 406 400 418 T800 412" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <g fill="#b98a4e" opacity="0.35">
    <circle cx="90" cy="470" r="2"/>
    <circle cx="40" cy="545" r="2.5"/>
    <circle cx="560" cy="575" r="2"/>
    <circle cx="610" cy="490" r="2"/>
    <circle cx="760" cy="560" r="2.5"/>
    <circle cx="200" cy="580" r="2"/>
  </g>

  <!-- 海边阳伞 -->
  <path d="M700 345 L700 480" stroke="#8d6e4f" stroke-width="4" stroke-linecap="round"/>
  <path d="M655 345 Q700 292 745 345 Q722 352 700 345 Q678 352 655 345 Z" fill="#e8453c"/>
  <path d="M700 295 Q690 320 678 345 Q690 349 700 345 Z" fill="#ffffff" opacity="0.85"/>

  <!-- 地面阴影、车辙、扬起的沙尘、速度线 -->
  <ellipse cx="370" cy="526" rx="190" ry="14" fill="#5a3b1a" opacity="0.25"/>
  <g fill="none" stroke="#b08a52" stroke-width="4" opacity="0.3" stroke-linecap="round">
    <path d="M250 522 C180 525 90 527 0 528"/>
    <path d="M480 522 C380 524 200 527 0 534"/>
  </g>
  <g fill="#f5e7c4" opacity="0.7">
    <circle cx="195" cy="505" r="9"/>
    <circle cx="170" cy="515" r="12"/>
    <circle cx="135" cy="508" r="8"/>
    <circle cx="110" cy="520" r="6"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M120 280 H190"/>
    <path d="M100 300 H180"/>
    <path d="M125 322 H200"/>
  </g>

  <!-- 后轮 -->
  <use href="#wheel" transform="translate(250 458)"/>
  <circle cx="250" cy="458" r="10" fill="none" stroke="#888" stroke-width="3"/>
  <circle cx="335" cy="445" r="17" fill="none" stroke="#8b8b8b" stroke-width="3"/>
  <path d="M250 448 L335 428 M250 468 L335 462" stroke="#3a3a3a" stroke-width="2" fill="none"/>

  <!-- 车架 -->
  <g fill="none" stroke="#e4572e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 458 L335 445"/>
    <path d="M250 458 L300 345"/>
    <path d="M335 445 L300 345"/>
    <path d="M300 345 L448 340"/>
    <path d="M335 445 L445 380"/>
    <path d="M448 340 L445 380"/>
    <path d="M445 380 L480 458"/>
    <path d="M448 340 L462 300"/>
  </g>
  <path d="M462 300 Q478 292 492 300" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>

  <!-- 坐垫 -->
  <path d="M282 340 Q300 330 318 338 L316 346 Q300 350 284 346 Z" fill="#222"/>

  <!-- 远侧曲柄与脚踏 -->
  <path d="M335 445 L312 424" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M300 424 L324 422" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- 远侧腿 -->
  <path d="M300 336 Q296 380 310 420" fill="none" stroke="#c07f2c" stroke-width="7" stroke-linecap="round"/>
  <path d="M300 420 L326 414 L330 424 L304 428 Z" fill="#c07f2c"/>

  <!-- 尾羽 -->
  <path d="M244 300 L212 318 L222 330 L252 322 Z" fill="#8c8377"/>

  <!-- 身体 -->
  <path d="M238 300 C240 262 275 238 318 244 C350 250 368 275 364 305 C360 330 336 344 300 342 C268 340 236 326 238 300 Z" fill="url(#feather)"/>

  <!-- 翅膀 -->
  <path d="M326 258 C296 250 258 264 230 306 C266 298 302 292 338 284 C340 274 334 264 326 258 Z" fill="#7d7468"/>
  <path d="M300 268 Q280 285 250 300 M316 272 Q296 290 262 304" fill="none" stroke="#5a5147" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <!-- 脖子 -->
  <path d="M350 262 C372 232 362 208 388 192" fill="none" stroke="#cfd4d8" stroke-width="34" stroke-linecap="round"/>
  <path d="M350 262 C372 232 362 208 388 192" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>

  <!-- 头 -->
  <ellipse cx="394" cy="186" rx="24" ry="19" fill="url(#feather)"/>

  <!-- 嘴与喉囊 -->
  <path d="M410 184 Q460 190 508 202 Q514 208 506 212 L410 198 Z" fill="url(#beak)"/>
  <path d="M410 198 L506 212 C500 240 470 258 440 254 C420 250 412 228 410 198 Z" fill="#f3a13a" stroke="#c76f1c" stroke-width="1.5"/>
  <path d="M410 198 L506 212" stroke="#b8621a" stroke-width="2"/>
  <path d="M440 188 L470 194" stroke="#b8621a" stroke-width="1.5" opacity="0.6"/>

  <!-- 头盔 -->
  <path d="M370 180 Q372 160 394 160 Q414 162 416 180 Q394 176 370 180 Z" fill="#e53935"/>
  <path d="M384 176 Q400 170 416 174" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <circle cx="402" cy="188" r="5" fill="#f8f3c8" stroke="#333" stroke-width="1"/>
  <circle cx="403" cy="188" r="2.6" fill="#111"/>
  <circle cx="404" cy="187" r="0.9" fill="#ffffff"/>

  <!-- 伸向车把的翅膀（手） -->
  <path d="M330 268 Q380 262 420 290 Q448 300 466 298" fill="none" stroke="#7d7468" stroke-width="13" stroke-linecap="round"/>
  <circle cx="466" cy="298" r="7" fill="#6d6459"/>

  <!-- 前轮 -->
  <use href="#wheel" transform="translate(480 458)"/>

  <!-- 近侧曲柄、脚踏、腿与脚 -->
  <path d="M335 445 L358 468" stroke="#6b6b6b" stroke-width="6" stroke-linecap="round"/>
  <path d="M348 470 L372 470" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 334 Q340 380 352 462" fill="none" stroke="#f0a13c" stroke-width="8" stroke-linecap="round"/>
  <path d="M346 466 Q360 456 376 462 Q380 470 370 473 L346 474 Z" fill="#f0a13c"/>
</svg>
