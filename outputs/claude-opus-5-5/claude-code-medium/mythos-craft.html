.panel .sub{color:#c8b8ff;letter-spacing:3px;margin:4px 0 16px}
button{font-family:inherit;cursor:pointer;background:#6b6b6b;color:#fff;border:2px solid #000;box-shadow:inset -2px -3px 0 #444,inset 2px 2px 0 #aaa;padding:7px 16px;font-size:15px;margin:3px;text-shadow:1px 1px 0 #333}

.help{color:#bbb;font-size:13px;line-height:1.8;margin-top:12px}

<script type="module">
import * as THREE from 'three';

/*GEN-BEGIN*/
// =====================================================================
//  基础工具
// =====================================================================
const CS = 16, CH = 128, SEA = 32;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
let WSEED = 1337;
function hash2(x,z,s){
  let h=(Math.imul(x|0,0x27d4eb2d)^Math.imul(z|0,0x165667b1)^Math.imul((s+WSEED)|0,0x9e3779b1))|0;
  h=Math.imul(h^(h>>>15),0x85ebca6b); h=Math.imul(h^(h>>>13),0xc2b2ae35); h^=h>>>16;
  return (h>>>0)/4294967296;
}
function hash3(x,y,z,s){return hash2((x|0)+Math.imul(y|0,0x3504f333),(z|0)^Math.imul(y|0,0x1f1f1f1f),s);}

// =====================================================================
//  柏林噪声 (Improved Perlin Noise)
// =====================================================================
function Perlin(seed){
  const R=mulberry32(seed),p=new Uint8Array(512),q=[];
  for(let i=0;i<256;i++)q[i]=i;
  for(let i=255;i>0;i--){const j=(R()*(i+1))|0;const t=q[i];q[i]=q[j];q[j]=t;}
  for(let i=0;i<512;i++)p[i]=q[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  const g2=(h,x,y)=>{switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;}};
  const g3=(h,x,y,z)=>{const hh=h&15,u=hh<8?x:y,v=hh<4?y:(hh===12||hh===14?x:z);return((hh&1)?-u:u)+((hh&2)?-v:v);};
  return {
    n2(x,y){let X=Math.floor(x),Y=Math.floor(y);x-=X;y-=Y;X&=255;Y&=255;const u=fade(x),v=fade(y);const A=p[X]+Y,B=p[X+1]+Y;
      return lerp(lerp(g2(p[A],x,y),g2(p[B],x-1,y),u),lerp(g2(p[A+1],x,y-1),g2(p[B+1],x-1,y-1),u),v);},
    n3(x,y,z){let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;
      const u=fade(x),v=fade(y),w=fade(z);const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
      return lerp(lerp(lerp(g3(p[AA],x,y,z),g3(p[BA],x-1,y,z),u),lerp(g3(p[AB],x,y-1,z),g3(p[BB],x-1,y-1,z),u),v),
                  lerp(lerp(g3(p[AA+1],x,y,z-1),g3(p[BA+1],x-1,y,z-1),u),lerp(g3(p[AB+1],x,y-1,z-1),g3(p[BB+1],x-1,y-1,z-1),u),v),w);}
  };
}
function fbm(P,x,y,oct){let s=0,a=1,f=1,n=0;for(let i=0;i<oct;i++){s+=P.n2(x*f,y*f)*a;n+=a;a*=0.5;f*=2.03;}return s/n;}
let NP=[];

// =====================================================================
//  方块定义
// =====================================================================
const BLOCK_DEFS = [
 ['air','空气',null,{solid:0,opaque:0}],
 ['grass','草方块',{t:'grass_top',s:'grass_side',b:'dirt'}],
 ['dirt','泥土','dirt'],
 ['stone','石头','stone'],
 ['cobble','圆石','cobble'],
 ['sand','沙子','sand'],
 ['log','橡木原木',{t:'log_top',s:'log_side',b:'log_top'}],
 ['leaves','橡树树叶','leaves',{opaque:0,leafy:1}],
 ['planks','橡木木板','planks'],
 ['glass','玻璃','glass',{opaque:0}],
 ['water','水','water',{solid:0,opaque:0,liquid:1}],
 ['snow','雪块','snow'],
 ['snowgrass','雪地',{t:'snow',s:'snow_side',b:'dirt'}],
 ['bedrock','基岩','bedrock'],
 ['brick','红砖','brick'],
 ['marble','大理石','marble'],
 ['pillar','大理石柱',{t:'pillar_top',s:'pillar_side',b:'pillar_top'}],
 ['gold','金块','gold',{emit:0.2}],
 ['crystal','紫晶','crystal',{emit:0.55}],
 ['glowstone','萤石','glowstone',{emit:1}],
 ['obsidian','黑曜石','obsidian'],
 ['portal','异界传送门','portal',{solid:0,opaque:0,emit:0.95}],
 ['bone','龙骨',{t:'bone_top',s:'bone_side',b:'bone_top'}],
 ['mossy','苔石','mossy_cobble'],
 ['sandstone','砂岩',{t:'sandstone_top',s:'sandstone_side',b:'sandstone_top'}],
 ['lava','熔岩','lava',{solid:0,opaque:0,liquid:2,emit:1}],
 ['jade','翡翠玉石','jade'],
 ['lacquer','朱漆木','lacquer'],
 ['rooftile','琉璃瓦','roof_tile'],
 ['mushred','红菇伞','mush_red'],
 ['mushstem','菇柄','mush_stem'],
 ['mushblue','幽光菇伞','mush_blue',{emit:0.8}],
 ['yggbark','世界树皮',{t:'ygg_top',s:'ygg_bark',b:'ygg_top'}],
 ['goldleaves','金色神叶','gold_leaves',{opaque:0,leafy:1,emit:0.45}],
 ['ice','冰','ice'],
 ['magicgrass','仙境草',{t:'magic_top',s:'magic_side',b:'dirt'}],
 ['lantern','灯笼','lantern',{emit:1}],
 ['bookshelf','书架',{t:'planks',s:'bookshelf',b:'planks'}],
 ['coalore','煤矿石','coal_ore'],
 ['goldore','金矿石','gold_ore'],
 ['crystalore','晶矿石','crystal_ore',{emit:0.25}],
 ['stonebrick','石砖','stonebrick'],
 ['tallgrass','草丛','tallgrass',{solid:0,opaque:0,cross:1}],
 ['rose','红花','flower_red',{solid:0,opaque:0,cross:1}],
 ['dandelion','黄花','flower_yellow',{solid:0,opaque:0,cross:1}],
 ['glowflower','月光花','glow_flower',{solid:0,opaque:0,cross:1,emit:0.9}],
 ['cactus','仙人掌',{t:'cactus_top',s:'cactus_side',b:'cactus_top'}],
 ['spruceleaves','云杉树叶','spruce_leaves',{opaque:0,leafy:1}],
 ['rune','符文石','rune',{emit:0.5}],
 ['cloud','云块','cloud'],
 ['birch','白桦原木',{t:'log_top',s:'birch',b:'log_top'}],
 ['purpleroof','紫晶瓦','purple_roof'],
 ['chiseled','雕纹砂岩','chiseled'],
 ['magma','岩浆块','magma',{emit:0.6}],
 ['mossybrick','苔石砖','mossy_brick'],
 ['darkplanks','深色木板','dark_planks'],
 ['cherryleaves','樱花树叶','cherry_leaves',{opaque:0,leafy:1}],
 ['rb_red','赤色彩晶','rb_red',{emit:0.35}],
 ['rb_orange','橙色彩晶','rb_orange',{emit:0.35}],
 ['rb_yellow','黄色彩晶','rb_yellow',{emit:0.35}],
 ['rb_green','绿色彩晶','rb_green',{emit:0.35}],
 ['rb_blue','蓝色彩晶','rb_blue',{emit:0.35}],
 ['rb_violet','紫色彩晶','rb_violet',{emit:0.35}],
 ['spruce','云杉原木',{t:'log_top',s:'spruce_side',b:'log_top'}],
];
const I={}; BLOCK_DEFS.forEach((b,i)=>I[b[0]]=i);
const NB=BLOCK_DEFS.length;
const SOLID=new Uint8Array(256),OPAQUE=new Uint8Array(256),LIQUID=new Uint8Array(256),CROSS=new Uint8Array(256),LEAFY=new Uint8Array(256),SHADE=new Uint8Array(256);
const EMIT=new Float32Array(256);
BLOCK_DEFS.forEach((b,i)=>{const o=b[3]||{};SOLID[i]=o.solid??1;OPAQUE[i]=o.opaque??1;LIQUID[i]=o.liquid||0;CROSS[i]=o.cross||0;LEAFY[i]=o.leafy||0;EMIT[i]=o.emit||0;SHADE[i]=(OPAQUE[i]||LEAFY[i])?1:0;});
const RB=[I.rb_red,I.rb_orange,I.rb_yellow,I.rb_green,I.rb_blue,I.rb_violet];
const FT=new Uint16Array(256*6); // 每个方块六个面的贴图索引（渲染层填充）

// =====================================================================
//  地形：柏林噪声高度 + 生物群系 + 浮空岛
// =====================================================================
const BIO={plains:0,forest:1,desert:2,taiga:3,snow:4,magic:5};
const BIO_NAME=['平原','森林','沙漠','针叶林','雪峰','仙境'];
function columnInfo(x,z){
  const c=fbm(NP[0],x*0.0021,z*0.0021,4);
  const w=Math.exp(-(x*x+z*z)/(280*280)); // 出生点附近：保证是平缓的大陆
  const d=fbm(NP[1],x*0.012,z*0.012,3);
  const rg=1-Math.abs(fbm(NP[2],x*0.0055,z*0.0055,3))*2.2;
  const mt=smooth(0.02,0.28,c)*(1-0.75*w);
  let h=SEA+3+lerp(c,Math.max(c*0.5,0.1+c*0.3),w)*42+d*7+Math.pow(clamp(rg,0,1),2.2)*mt*50;
  h=Math.floor(clamp(h,4,CH-30));
  const t=fbm(NP[3],x*0.0016,z*0.0016,2), m=fbm(NP[4],x*0.0016+40,z*0.0016-40,2), mg=fbm(NP[5],x*0.0022,z*0.0022,3);
  let b;
  if(h>SEA+44) b=BIO.snow;
  else if(mg>0.2) b=BIO.magic;
  else if(t>0.12&&m<0.02) b=BIO.desert;
  else if(t<-0.15) b=BIO.taiga;
  else if(m>0.06) b=BIO.forest;
  else b=BIO.plains;
  return {h,b};
}
function surfaceOf(h,b){
  if(h<SEA) return h>=SEA-5?I.sand:(h&1?I.dirt:I.sand);
  if(b===BIO.snow) return I.snow;
  if(b===BIO.desert) return I.sand;
  if(h<=SEA+1&&b!==BIO.taiga) return I.sand;
  if(h>SEA+38) return I.stone;
  if(b===BIO.taiga) return I.snowgrass;
  if(b===BIO.magic) return I.magicgrass;
  return I.grass;
}
function islandInfo(x,z){
  const m=fbm(NP[6],x*0.0065,z*0.0065,3);
  if(m<0.24) return null;
  const k=clamp((m-0.24)*5,0,1);
  const cy=90+fbm(NP[7],x*0.004,z*0.004,2)*14;
  const top=Math.floor(cy+k*4+fbm(NP[1],x*0.05,z*0.05,2)*2);
  const bot=Math.floor(cy-Math.pow(k,0.6)*20-hash2(x,z,77)*2.5);
  if(top-bot<1) return null;
  return {top,bot};
}

// ---------------- 树木与植被 ----------------
function treeOak(put,x,y,z,r,log=I.log,leaf=I.leaves){
  const h=4+Math.floor(r*3),top=y+h-1;
  for(let dy=-2;dy<=1;dy++){const rad=dy>=0?1:2;
    for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
      if(Math.abs(dx)===rad&&Math.abs(dz)===rad&&(dy===1||hash3(x+dx,top+dy,z+dz,5)<0.5))continue;
      if(dy===1&&Math.abs(dx)+Math.abs(dz)>1)continue;
      put(x+dx,top+dy,z+dz,leaf,1);}}
  for(let i=0;i<h;i++)put(x,y+i,z,log,0);
}
function treeSpruce(put,x,y,z,r){
  const h=7+Math.floor(r*5),top=y+h;
  const pat=[0,1,1,2,1,2,3,2,3,2];
  for(let i=0;i<pat.length&&top-i>y+1;i++){const rad=pat[i],yy=top-i;
    for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){if(Math.abs(dx)+Math.abs(dz)>rad+(rad>1?1:0))continue;put(x+dx,yy,z+dz,I.spruceleaves,1);}}
  for(let i=0;i<h;i++)put(x,y+i,z,I.spruce,0);
}
function treeMushroom(put,x,y,z,r,blue){
  const h=5+Math.floor(r*4),cap=blue?I.mushblue:I.mushred,top=y+h;
  for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++){const ax=Math.abs(dx),az=Math.abs(dz);
    if(ax===3&&az===3)continue;
    if(ax<=2&&az<=2&&!(ax===2&&az===2))put(x+dx,top,z+dz,cap,1);
    if(ax===3||az===3){put(x+dx,top-1,z+dz,cap,1);put(x+dx,top-2,z+dz,cap,1);}}
  for(let i=0;i<h;i++)put(x,y+i,z,I.mushstem,0);
}
function treeMagic(put,x,y,z,r,leaf){
  const h=5+Math.floor(r*3),top=y+h;
  for(let dx=-3;dx<=3;dx++)for(let dy=-2;dy<=2;dy++)for(let dz=-3;dz<=3;dz++){
    if(dx*dx+dy*dy*2+dz*dz<=8+hash3(x+dx,top+dy,z+dz,6)*4)put(x+dx,top+dy,z+dz,(leaf===I.goldleaves&&hash3(x+dx,top+dy,z+dz,7)<0.03)?I.glowstone:leaf,1);}
  for(let i=0;i<h;i++)put(x,y+i,z,leaf===I.cherryleaves?I.spruce:I.birch,0);
}
function treeCactus(put,x,y,z,r){const h=1+Math.floor(r*3);for(let i=0;i<h;i++)put(x,y+i,z,I.cactus,0);}

// =====================================================================
//  神话建筑：建造器
// =====================================================================
const gh=(x,z)=>columnInfo(Math.round(x),Math.round(z)).h;
class SB{
  constructor(){this.m=new Map();}
  set(x,y,z,id){x=Math.round(x);y=Math.round(y);z=Math.round(z);if(y<1||y>=CH)return;
    const k=(x>>4)+','+(z>>4);let a=this.m.get(k);if(!a){a=[];this.m.set(k,a);}a.push((x&15)|((z&15)<<4)|(y<<8),id);}
  box(x0,y0,z0,x1,y1,z1,id){if(x0>x1)[x0,x1]=[x1,x0];if(y0>y1)[y0,y1]=[y1,y0];if(z0>z1)[z0,z1]=[z1,z0];

// 平整地基：顶层方块、向下填充地基、向上清空
function pad(B,cx,cz,r,fy,top,round,clearH,found){
  for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){
    if(round&&dx*dx+dz*dz>(r+0.5)*(r+0.5))continue;
    const x=cx+dx,z=cz+dz,g=gh(x,z);
    const ctop=Math.min(CH-1,fy+clearH,Math.max(g,fy)+14);
    for(let y=fy+1;y<=ctop;y++)B.set(x,y,z,0);
    B.set(x,fy,z,top);
    for(let y=fy-1;y>g&&y>fy-45;y--)B.set(x,y,z,found);
  }
}

// ---- 1. 诸界之门广场（出生点）----

  B.set(cx,y0+7,sz,I.marble);B.set(cx,y0+8,sz,I.gold);

function buildWorldTree(B,cx,cz){

  const br=[];
  for(let k=0;k<8;k++){const a=k*2.4+hash2(cx,cz,40+k),hb=fy+27+k*3.2,L=11+hash2(cx,cz,50+k)*8;
    const ex=cx+Math.cos(a)*L,ez=cz+Math.sin(a)*L,ey=hb+5+L*0.35;br.push([hb,ex,ey,ez]);blob(Math.round(ex),Math.round(ey)+2,Math.round(ez),6+hash2(cx,cz,60+k)*2,0.6);}
  blob(cx,fy+H+3,cz,12,0.55);

  for(let k=0;k<9;k++){const a=k*2*Math.PI/9+hash2(cx,cz,70+k),L=13+hash2(cx,cz,80+k)*6;
    const ex=cx+Math.cos(a)*L,ez=cz+Math.sin(a)*L,ey=gh(ex,ez)-1;
    B.line(cx+Math.cos(a)*2,fy+4,cz+Math.sin(a)*2,ex,ey,ez,1.5,I.yggbark);}
  for(const [hb,ex,ey,ez] of br)B.line(cx,hb,cz,ex,ey,ez,1.2,I.yggbark);

const RANDOM_TYPES=['worldTree','pagoda','pyramid','dragon','wizardTower','portalRuin','stoneCircle','crystalSpires','statue','skyTemple'];
const FORCED={'0,0':'spawn','1,0':'worldTree','-1,0':'pagoda','0,-1':'skyTemple','0,1':'pyramid','1,1':'dragon','-1,-1':'wizardTower','1,-1':'statue','-1,1':'crystalSpires','2,0':'stoneCircle','-2,0':'portalRuin'};
const REG=100,MAXR=70;
const regionCache=new Map();
function regionDesc(rx,rz){
  const k=rx+','+rz;let d=regionCache.get(k);if(d!==undefined)return d;
  let type=FORCED[k],x,z;
  if(type){x=Math.round(rx*REG*0.8);z=Math.round(rz*REG*0.8);}
  else{if(hash2(rx,rz,500)<0.85)type=RANDOM_TYPES[Math.floor(hash2(rx,rz,501)*RANDOM_TYPES.length)];
    x=rx*REG+Math.round((hash2(rx,rz,502)-0.5)*28);z=rz*REG+Math.round((hash2(rx,rz,503)-0.5)*28);}
  d=type?{type,x,z,r:STYPES[type].r,name:STYPES[type].name,built:null}:null;
  regionCache.set(k,d);return d;
}
function structBlocks(d){if(!d.built){const B=new SB();STYPES[d.type].fn(B,d.x,d.z);d.built=B.m;}return d.built;}
const regionOf=v=>Math.floor((v+REG/2)/REG);

//  区块生成
// =====================================================================
const edits=new Map(); // 玩家修改：chunkKey -> Map(index -> id)
function generateChunk(cx,cz){
  const data=new Uint8Array(CS*CS*CH),X0=cx*CS,Z0=cz*CS;
  const tops=new Int16Array(256),bios=new Uint8Array(256);
  for(let lz=0;lz<16;lz++)for(let lx=0;lx<16;lx++){
    const x=X0+lx,z=Z0+lz,ci=columnInfo(x,z),h=ci.h,b=ci.b,col=lx+(lz<<4);
    tops[col]=h;bios[col]=b;
    const top=surfaceOf(h,b);
    let fill=I.dirt,fd=3;
    if(top===I.sand){fill=I.sand;fd=4;}else if(top===I.stone||top===I.snow){fill=I.stone;fd=0;}
    const cold=b===BIO.taiga||b===BIO.snow,desert=b===BIO.desert;
    const ymax=Math.max(h,SEA);
    for(let y=0;y<=ymax;y++){
      let id;
      if(y===0||(y<=2&&hash3(x,y,z,1)<0.5))id=I.bedrock;
      else if(y>h)id=(y===SEA&&cold)?I.ice:I.water;
      else if(y===h)id=top;
      else if(y>h-1-fd)id=fill;
      else if(desert&&y>h-9)id=I.sandstone;
      else{const r=hash3(x,y,z,2);id=I.stone;
        if(r<0.011&&y<80)id=I.coalore;else if(r<0.0155&&y<36)id=I.goldore;else if(r<0.0185&&y<22)id=I.crystalore;}
      if(id!==I.bedrock&&y>3&&y<h-3&&!(h<SEA+3&&y>h-8)){
        const v=NP[8].n3(x*0.042,y*0.065,z*0.042)+NP[3].n3(x*0.1,y*0.1,z*0.1)*0.3;
        if(v>0.4)id=y<=8?I.lava:0;
      }
      data[col+(y<<8)]=id;
    }
    const is=islandInfo(x,z);
    if(is&&is.bot>ymax+4){for(let y=is.bot;y<=is.top&&y<CH;y++){
      data[col+(y<<8)]=y===is.top?I.magicgrass:y>is.top-3?I.dirt:(hash3(x,y,z,3)<0.035?I.crystalore:I.stone);}}
  }
  const put=(x,y,z,id,soft)=>{const lx=x-X0,lz=z-Z0;if(lx<0||lx>15||lz<0||lz>15||y<1||y>=CH)return;const i=lx+(lz<<4)+(y<<8);
    if(soft){const o=data[i];if(o&&!CROSS[o])return;}data[i]=id;};
  // 树木（含边缘外 3 格，保证跨区块完整）
  for(let z=Z0-3;z<Z0+19;z++)for(let x=X0-3;x<X0+19;x++){
    const r=hash2(x,z,11);
    if(r<0.045){const ci=columnInfo(x,z),h=ci.h;if(h>SEA){const top=surfaceOf(h,ci.b),r2=hash2(x,z,12),b=ci.b;
      if(top===I.grass||top===I.snowgrass||top===I.magicgrass){
        if(b===BIO.forest&&r<0.04){if(r2<0.65)treeOak(put,x,h+1,z,r2);else treeOak(put,x,h+1,z,r2,I.birch,I.leaves);}
        else if(b===BIO.plains&&r<0.0045)treeOak(put,x,h+1,z,r2);
        else if(b===BIO.taiga&&r<0.03)treeSpruce(put,x,h+1,z,r2);
        else if(b===BIO.magic&&r<0.022){if(r<0.011)treeMushroom(put,x,h+1,z,r2,r2<0.5);else treeMagic(put,x,h+1,z,r2,r2<0.5?I.cherryleaves:I.goldleaves);}
      }else if(top===I.sand&&b===BIO.desert&&r<0.006)treeCactus(put,x,h+1,z,r2);}}
    const r3=hash2(x,z,13);
    if(r3<0.012){const is=islandInfo(x,z);if(is&&is.bot>Math.max(columnInfo(x,z).h,SEA)+4)treeMagic(put,x,is.top+1,z,hash2(x,z,14),r3<0.006?I.goldleaves:I.cherryleaves);}
  }
  // 花草
  for(let lz=0;lz<16;lz++)for(let lx=0;lx<16;lx++){
    const x=X0+lx,z=Z0+lz,col=lx+(lz<<4),h=tops[col],b=bios[col],r=hash2(x,z,15);
    let y=h+1;
    const ground=data[col+(h<<8)];
    let id=0;
    if(ground===I.grass){if(r<0.02)id=I.rose;else if(r<0.04)id=I.dandelion;else if(r<(b===BIO.plains?0.24:0.13))id=I.tallgrass;}
    else if(ground===I.magicgrass){if(r<0.05)id=I.glowflower;else if(r<0.15)id=I.tallgrass;}
    else if(ground===I.snowgrass&&r<0.04)id=I.tallgrass;
    if(id&&y<CH&&data[col+(y<<8)]===0)data[col+(y<<8)]=id;
    // 浮空岛花草
    for(let yy=CH-2;yy>h+4;yy--){const g=data[col+(yy<<8)];if(g===I.magicgrass){if(data[col+((yy+1)<<8)]===0){const r2=hash2(x,z,16);if(r2<0.05)data[col+((yy+1)<<8)]=I.glowflower;else if(r2<0.16)data[col+((yy+1)<<8)]=I.tallgrass;}break;}if(g)break;}
  }
  // 神话建筑
  const ra=regionOf(X0-MAXR),rb=regionOf(X0+15+MAXR),sa=regionOf(Z0-MAXR),sb=regionOf(Z0+15+MAXR);
  const ck=cx+','+cz;
  for(let rz=sa;rz<=sb;rz++)for(let rx=ra;rx<=rb;rx++){
    const d=regionDesc(rx,rz);if(!d)continue;
    if(d.x+d.r<X0||d.x-d.r>X0+15||d.z+d.r<Z0||d.z-d.r>Z0+15)continue;
    const list=structBlocks(d).get(ck);if(!list)continue;
    for(let i=0;i<list.length;i+=2)data[list[i]]=list[i+1];
  }
  const ed=edits.get(ck);if(ed)for(const [i,id] of ed)data[i]=id;
  let maxY=0;
  for(let y=CH-1;y>=0&&!maxY;y--){const o=y<<8;for(let i=0;i<256;i++)if(data[o+i]){maxY=y;break;}}
  return {cx,cz,data,maxY};
}

const FACES=[

const AOC=[0.42,0.62,0.8,1.0];
const UVE=0.0004;
function meshChunk(nb,nbMax){
  const C=nb[4];

const P={x:0.5,y:90,z:6.5,vx:0,vy:0,vz:0,yaw:0,pitch:0,onGround:false,fly:false,inWater:false,headWater:0,needGround:true,bob:0};
const PW=0.3,PH=1.8,EYE=1.62;
const keys={};
function overlap(px,py,pz){
  const x0=Math.floor(px-PW),x1=Math.floor(px+PW),y0=Math.floor(py),y1=Math.floor(py+PH-0.001),z0=Math.floor(pz-PW),z1=Math.floor(pz+PW);

}
function moveAxis(ax,d){
  if(!d)return false;P[ax]+=d;if(!overlap(P.x,P.y,P.z))return false;
  if(ax==='y'){if(d<0)P.y=Math.floor(P.y)+1;else P.y=Math.floor(P.y+PH)-PH-0.001;}
  else if(ax==='x'){if(d>0)P.x=Math.floor(P.x+PW)-PW-0.001;else P.x=Math.floor(P.x-PW)+1+PW+0.001;}
  else{if(d>0)P.z=Math.floor(P.z+PW)-PW-0.001;else P.z=Math.floor(P.z-PW)+1+PW+0.001;}
  return true;
}

function updatePlayer(dt){
  const here=chunks.get(ckey(Math.floor(P.x)>>4,Math.floor(P.z)>>4));
  if(!here)return;
  if(P.needGround){P.y=topSolid(Math.floor(P.x),Math.floor(P.z))+1.01;P.vy=0;P.needGround=false;}
  if(overlap(P.x,P.y,P.z)&&!P.fly){P.y=Math.floor(P.y)+1;}
  const fb=getBlock(Math.floor(P.x),Math.floor(P.y+0.4),Math.floor(P.z));
  P.inWater=LIQUID[fb]>0;
  const hb=getBlock(Math.floor(P.x),Math.floor(P.y+EYE),Math.floor(P.z));P.headWater=LIQUID[hb];
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  let wx=-sy*f+cy*s,wz=-cy*f-sy*s;const wl=Math.hypot(wx,wz);if(wl>0){wx/=wl;wz/=wl;}
  const sprint=keys.ShiftLeft&&!P.fly&&f>0;
  let speed=P.fly?16:P.inWater?2.6:sprint?6.4:4.3;
  if(LIQUID[fb]===2)speed*=0.5;
  const acc=P.fly||P.onGround?14:P.inWater?6:3.5,k=1-Math.exp(-dt*acc);
  P.vx+=(wx*speed-P.vx)*k;P.vz+=(wz*speed-P.vz)*k;
  if(P.fly){P.vy+=(((keys.Space?1:0)-(keys.ShiftLeft?1:0))*11-P.vy)*(1-Math.exp(-dt*10));}
  else if(P.inWater){P.vy-=11*dt;P.vy=Math.max(P.vy,-3.2);if(keys.Space)P.vy=Math.min(P.vy+32*dt,4.2);P.vy*=Math.exp(-dt*1.5);}
  else{P.vy-=28*dt;P.vy=Math.max(P.vy,-55);if(keys.Space&&P.onGround){P.vy=8.6;P.onGround=false;}}
  const dx=P.vx*dt,dy=P.vy*dt,dz=P.vz*dt,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz))/0.3));
  let hitH=false,hitY=false;

  if(hitY){if(P.vy<0)P.onGround=true;P.vy=0;}else P.onGround=false;
  if(P.fly&&P.onGround&&!keys.Space){/* 落地仍保持飞行 */}

  if(hitH&&P.onGround&&wl>0&&!P.fly&&!P.inWater){const tx=P.x+wx*0.4,tz=P.z+wz*0.4;if(overlap(tx,P.y+0.05,tz)&&!overlap(tx,P.y+1.05,tz)&&!overlap(P.x,P.y+1.05,P.z)){P.vy=8.2;P.onGround=false;}}

  if(P.y<-30){P.needGround=true;P.vy=0;}
  const moving=Math.hypot(P.vx,P.vz);

  camera.position.set(P.x,P.y+EYE+(P.fly?0:Math.sin(P.bob*2)*0.04),P.z);

}

function raycast(maxD){
  const o=camera.position,d=new THREE.Vector3();camera.getWorldDirection(d);
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=Math.sign(d.x),sy=Math.sign(d.y),sz=Math.sign(d.z);
  const tdx=d.x?Math.abs(1/d.x):1e30,tdy=d.y?Math.abs(1/d.y):1e30,tdz=d.z?Math.abs(1/d.z):1e30;
  let tx=d.x>0?(x+1-o.x)*tdx:d.x<0?(o.x-x)*tdx:1e30,ty=d.y>0?(y+1-o.y)*tdy:d.y<0?(o.y-y)*tdy:1e30,tz=d.z>0?(z+1-o.z)*tdz:d.z<0?(o.z-z)*tdz:1e30;
  let nx=0,ny=0,nz=0,t=0;
  for(let i=0;i<64;i++){
    const b=getBlock(x,y,z);if(b&&!LIQUID[b])return {x,y,z,b,nx,ny,nz};
    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=tdx;nx=-sx;ny=0;nz=0;}
    else if(ty<tz){y+=sy;t=ty;ty+=tdy;nx=0;ny=-sy;nz=0;}
    else{z+=sz;t=tz;tz+=tdz;nx=0;ny=0;nz=-sz;}
    if(t>maxD)return null;
  }
  return null;
}

  else{face(FT[id*6+3],20/16,-10/16,20/16,10/16,4,12,0);face(FT[id*6+5],20/16,10/16,0,24/16,4,12,0.22);face(FT[id*6+1],20/16,-10/16,0,24/16,24,22,0.42);}
  return iconCache[id]=c.toDataURL();}
const HOTBAR=[I.grass,I.dirt,I.stone,I.cobble,I.planks,I.log,I.glass,I.glowstone,I.marble];
let sel=0;
const hotbarEl=document.getElementById('hotbar'),bname=document.getElementById('bname');
let bnameT=0;
function drawHotbar(){hotbarEl.innerHTML='';HOTBAR.forEach((id,i)=>{const d=document.createElement('div');d.className='slot'+(i===sel?' sel':'');d.innerHTML=`<span>${i+1}</span><img src="${icon(id)}">`;hotbarEl.appendChild(d);});
  bname.textContent=BLOCK_DEFS[HOTBAR[sel]][1];bname.style.opacity=1;bnameT=2;setHand(HOTBAR[sel]);}
function selectSlot(i){sel=(i+9)%9;drawHotbar();}
const invEl=document.getElementById('inv'),invGrid=document.getElementById('invgrid'),invTip=document.getElementById('invtip');
for(let id=1;id<NB;id++){const d=document.createElement('div');d.innerHTML=`<img src="${icon(id)}">`;d.title=BLOCK_DEFS[id][1];
  d.onmouseenter=()=>invTip.textContent=BLOCK_DEFS[id][1];d.onclick=()=>{HOTBAR[sel]=id;drawHotbar();invTip.textContent='已放入快捷栏 '+(sel+1)+'：'+BLOCK_DEFS[id][1];};invGrid.appendChild(d);}
let invOpen=false;
function openInv(){invOpen=true;invEl.style.display='flex';document.exitPointerLock();}
function closeInv(){invOpen=false;invEl.style.display='none';canvas.requestPointerLock();}
document.getElementById('invclose').onclick=closeInv;

// =====================================================================
//  菜单、输入
// =====================================================================
const overlay=document.getElementById('overlay');
let locked=false;
const toastEl=document.getElementById('toast');let toastT=0;
function toast(s){toastEl.textContent=s;toastEl.style.opacity=1;toastT=1.6;}
function startPlay(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}canvas.requestPointerLock();}
document.getElementById('play').onclick=startPlay;
canvas.addEventListener('click',()=>{if(!locked&&!invOpen)startPlay();});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;
  overlay.style.display=(locked||invOpen||loading)?'none':'flex';if(locked){invEl.style.display='none';invOpen=false;}});
const rdb=document.getElementById('rdbtns');
function drawRd(){rdb.innerHTML='';for(const r of [4,6,8,10,12]){const b=document.createElement('button');b.textContent=r;if(r===renderDist)b.className='on';b.onclick=()=>{renderDist=r;drawRd();};rdb.appendChild(b);}}
drawRd();
const SEED=(()=>{const m=location.search.match(/seed=(-?\d+)/);return m?(+m[1]|0):20261112;})();
document.getElementById('seedv').textContent=SEED;
document.getElementById('newworld').onclick=()=>{location.search='?seed='+((Math.random()*1e9)|0);};
const tpl=document.getElementById('tplist');
for(const k of Object.keys(FORCED)){const [rx,rz]=k.split(',').map(Number);const type=FORCED[k];const b=document.createElement('button');b.textContent=STYPES[type].name;
  b.onclick=()=>{const d=regionDesc(rx,rz),tp=STYPES[type].tp;P.x=d.x+tp[0]+0.5;P.z=d.z+tp[1]+0.5;P.yaw=tp[2];P.pitch=type==='skyTemple'?0:0.12;P.needGround=true;P.vx=P.vy=P.vz=0;startPlay();toast('✦ '+STYPES[type].name);};tpl.appendChild(b);}

addEventListener('keydown',e=>{
  if(e.code==='KeyE'&&!e.repeat){if(invOpen)closeInv();else if(locked)openInv();return;}
  if(e.code==='Escape'&&invOpen){invOpen=false;invEl.style.display='none';overlay.style.display='flex';return;}
  if(!locked)return;
  keys[e.code]=true;
  if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=9)selectSlot(n-1);}
  if(e.code==='KeyF'&&!e.repeat){P.fly=!P.fly;P.vy=0;toast(P.fly?'飞行模式：开启':'飞行模式：关闭');}
  if(e.code==='KeyH'&&!e.repeat){hudHidden=!hudHidden;document.querySelectorAll('.hud').forEach(el=>{if(el.id!=='tint')el.style.visibility=hudHidden?'hidden':'visible';});}
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
let hudHidden=false;
document.addEventListener('mousemove',e=>{if(!locked)return;P.yaw-=e.movementX*0.0022;P.pitch=clamp(P.pitch-e.movementY*0.0022,-1.55,1.55);});
addEventListener('wheel',e=>{if(locked)selectSlot(sel+(e.deltaY>0?1:-1));},{passive:true});
const mouse={l:false,r:false,cd:0};
canvas.addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0){mouse.l=true;mouse.cd=0;}if(e.button===2){mouse.r=true;mouse.cd=0;}if(e.button===1){const h=raycast(6);if(h&&h.b!==I.bedrock){HOTBAR[sel]=h.b;drawHotbar();}}});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

function doActions(dt){
  const hit=raycast(6);
  if(hit){hl.visible=true;hl.position.set(hit.x+0.5,hit.y+0.5,hit.z+0.5);}else hl.visible=false;
  mouse.cd-=dt;if(mouse.cd>0||!hit)return;
  if(mouse.l&&hit.b!==I.bedrock){
    setBlock(hit.x,hit.y,hit.z,0);burst(hit.x,hit.y,hit.z,hit.b);sfx('break');
    const up=getBlock(hit.x,hit.y+1,hit.z);if(CROSS[up])setBlock(hit.x,hit.y+1,hit.z,0);
    mouse.cd=0.22;swing=1;
  }else if(mouse.r){
    const id=HOTBAR[sel];let x=hit.x+hit.nx,y=hit.y+hit.ny,z=hit.z+hit.nz;
    if(CROSS[hit.b]){x=hit.x;y=hit.y;z=hit.z;}
    const cur=getBlock(x,y,z);
    if((cur===0||LIQUID[cur]||CROSS[cur])&&y>0&&y<CH){
      const inter=SOLID[id]&&x+1>P.x-PW&&x<P.x+PW&&y+1>P.y&&y<P.y+PH&&z+1>P.z-PW&&z<P.z+PW;
      if(!inter&&!(CROSS[id]&&!SOLID[getBlock(x,y-1,z)])){setBlock(x,y,z,id);sfx('place');swing=1;}
    }
    mouse.cd=0.22;
  }
}

// =====================================================================
//  昼夜循环
// =====================================================================
let dayTime=0.06;const DAY_LEN=600;
const cTopDay=new THREE.Color(0.33,0.58,1.0),cTopNight=new THREE.Color(0.01,0.015,0.05),cHorDay=new THREE.Color(0.68,0.82,1.0),cHorNight=new THREE.Color(0.03,0.04,0.09),cSunset=new THREE.Color(1.0,0.52,0.28);
const tmpC=new THREE.Color();
function updateSky(dt){
  dayTime=(dayTime+dt/DAY_LEN*(keys.KeyT&&locked?40:1))%1;
  const a=dayTime*Math.PI*2,sd=new THREE.Vector3(Math.cos(a),Math.sin(a),0.25).normalize();
  const dl=smooth(-0.12,0.25,sd.y),day=0.13+0.87*dl;
  const set=Math.exp(-Math.pow(sd.y/0.2,2));
  skyU.uTop.value.copy(cTopNight).lerp(cTopDay,dl);
  skyU.uHor.value.copy(cHorNight).lerp(cHorDay,dl).lerp(cSunset,set*0.55);
  skyU.uSun.value.copy(sd);skyU.uGlow.value.setRGB(1,0.75,0.45).multiplyScalar(0.25+set*0.8);
  const fc=U.uFogColor.value;
  if(P.headWater===1){fc.setRGB(0.08,0.22,0.5).multiplyScalar(0.4+0.6*day);U.uFogNear.value=1;U.uFogFar.value=26;}
  else if(P.headWater===2){fc.setRGB(0.9,0.3,0.05);U.uFogNear.value=0;U.uFogFar.value=4;}
  else{fc.copy(skyU.uHor.value);const far=renderDist*16-6;U.uFogFar.value=far;U.uFogNear.value=far*0.55;}
  scene.fog.color.copy(fc);scene.fog.near=U.uFogFar.value*1.2;scene.fog.far=U.uFogFar.value*3.2;
  U.uDay.value=day;U.uHand.value=0.22+0.6*(1-dl);U.uTime.value+=dt;
  const cp=camera.position;
  sky.position.copy(cp);stars.position.copy(cp);stars.material.opacity=clamp(1-dl*1.6,0,1);
  sun.position.copy(cp).addScaledVector(sd,600);sun.lookAt(cp);
  moon.position.copy(cp).addScaledVector(sd,-600);moon.lookAt(cp);
  clouds.position.set(cp.x,CH+14,cp.z);
  cloudTex.offset.set((cp.x+U.uTime.value*1.5)/CLOUD_PERIOD,-cp.z/CLOUD_PERIOD);
  clouds.material.color.setScalar(0.25+0.75*day);
  handMat.color.setScalar(Math.max(day,0.45));
  const tint=document.getElementById('tint');
  if(P.headWater===1){tint.style.background='rgba(20,60,160,0.35)';tint.style.opacity=1;}
  else if(P.headWater===2){tint.style.background='rgba(255,90,0,0.6)';tint.style.opacity=1;}
  else tint.style.opacity=0;
  return day;
}

// =====================================================================
//  HUD
// =====================================================================
const infoEl=document.getElementById('info'),lmEl=document.getElementById('landmark');
let fps=0,fpsAcc=0,fpsN=0,hudT=0;
const ARROWS=['↑','↖','←','↙','↓','↘','→','↗'];
function updateHUD(dt){
  fpsAcc+=dt;fpsN++;hudT-=dt;
  if(bnameT>0){bnameT-=dt;if(bnameT<=0)bname.style.opacity=0;}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.style.opacity=0;}
  if(hudT>0)return;hudT=0.25;fps=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;
  const ci=columnInfo(Math.floor(P.x),Math.floor(P.z));
  const bio=ci.h<SEA?'海洋':BIO_NAME[ci.b];
  const hh=(dayTime*24+6)%24,tm=String(Math.floor(hh)).padStart(2,'0')+':'+String(Math.floor((hh%1)*60)).padStart(2,'0');
  infoEl.textContent=`神域方块 MYTHCRAFT   FPS ${fps}\n坐标  X ${P.x.toFixed(1)}  Y ${P.y.toFixed(1)}  Z ${P.z.toFixed(1)}\n群系  ${bio}    时间 ${tm}\n区块  ${chunks.size}  视距 ${renderDist}   ${P.fly?'✈ 飞行':''}`;
  const rx0=regionOf(P.x),rz0=regionOf(P.z);let best=null,bd=1e9;
  for(let rz=rz0-2;rz<=rz0+2;rz++)for(let rx=rx0-2;rx<=rx0+2;rx++){const d=regionDesc(rx,rz);if(!d)continue;const dd=Math.hypot(d.x-P.x,d.z-P.z);if(dd<bd){bd=dd;best=d;}}
  if(best){const dx=best.x-P.x,dz=best.z-P.z,ta=Math.atan2(-dx,-dz);let rel=ta-P.yaw;rel=Math.atan2(Math.sin(rel),Math.cos(rel));
    const idx=((Math.round(rel/(Math.PI/4))%8)+8)%8;
    lmEl.textContent=bd<best.r*0.8?`✦ 你正位于：${best.name} ✦`:`🧭 最近的神迹：${best.name} · ${Math.round(bd)} 米 ${ARROWS[idx]}`;}
}

// =====================================================================
//  主循环
// =====================================================================
let loading=true;const lbar=document.getElementById('lbar'),ltext=document.getElementById('ltext');
initGen(SEED);
drawHotbar();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  updateChunks();
  if(loading){
    const pcx=Math.floor(P.x/16),pcz=Math.floor(P.z/16);let need=0,done=0;
    for(const [dx,dz,d2] of OFFS){if(d2>9)break;need++;const c=chunks.get(ckey(pcx+dx,pcz+dz));if(c&&c.meshed)done++;}
    lbar.style.width=(done/need*100)+'%';ltext.textContent=`区块 ${done}/${need}`;
    if(done>=need){loading=false;document.getElementById('loading').style.display='none';overlay.style.display=locked?'none':'flex';updatePlayer(0);}
  }
  if(!loading&&(locked||P.needGround))updatePlayer(dt);
  else camera.position.set(P.x,P.y+EYE,P.z),camera.rotation.set(P.pitch,P.yaw,0);
  updateSky(dt);
  if(locked)doActions(dt);else hl.visible=false;
  swing=Math.max(0,swing-dt*5);
  hand.position.set(0.62,-0.52-Math.sin(swing*Math.PI)*0.1,-0.95+Math.sin(swing*Math.PI)*0.12);
  hand.rotation.set(0.12-Math.sin(swing*Math.PI)*0.7,0.75,0);
  updateParts(dt);
  updateHUD(dt);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
