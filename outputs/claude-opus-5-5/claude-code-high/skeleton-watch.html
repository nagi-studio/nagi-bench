<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURÈLE · Calibre AU‑28S Squelette — 交互式 3D 镂空机械表</title>
<style>
  :root{
    --gold:#c9a86a; --gold2:#ead6a8; --ink:#ebe6da; --mute:#8e897e;
    --glass:rgba(13,14,17,.62); --line:rgba(201,168,106,.18); --line2:rgba(255,255,255,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#040405;color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;outline:none}
  .serif{font-family:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Cormorant Garamond","Times New Roman",serif}

  /* ---------- Brand ---------- */
  #brand{position:fixed;left:36px;top:30px;z-index:5;pointer-events:none}
  #brand .logo{font-size:32px;letter-spacing:.44em;color:var(--gold2);font-weight:400}
  #brand .sub{margin-top:6px;font-size:10.5px;letter-spacing:.34em;color:var(--mute);text-transform:uppercase}
  #brand .line{width:70px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:16px 0 12px}
  #brand .model{font-size:13px;letter-spacing:.14em;color:#cfc7b5}
  #brand .model2{font-size:12px;letter-spacing:.08em;color:var(--mute);margin-top:5px}
  #brand .casesel{pointer-events:auto;display:flex;align-items:center;gap:10px;margin-top:18px;font-size:10.5px;letter-spacing:.24em;color:var(--mute)}
  #brand .casesel .seg{background:rgba(13,14,17,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

  /* ---------- Panel ---------- */
  #panel{position:fixed;right:22px;top:22px;bottom:22px;width:352px;z-index:6;
    background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
    border:1px solid var(--line);border-radius:16px;overflow-y:auto;overflow-x:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
  #panel::-webkit-scrollbar{width:6px}
  #panel::-webkit-scrollbar-thumb{background:rgba(201,168,106,.25);border-radius:3px}
  .sec{padding:20px 22px;border-bottom:1px solid var(--line2)}
  .sec:last-child{border-bottom:none}
  .sec-title{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.24em;color:var(--gold)}
  .sec-title span{font-size:10px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
  .calibre{font-size:30px;letter-spacing:.08em;color:#f4efe3;margin:12px 0 2px}
  .calibre-sub{font-size:11.5px;color:var(--mute);letter-spacing:.1em}
  dl.specs{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin-top:16px;font-size:12.5px}
  dl.specs dt{color:var(--mute);white-space:nowrap}
  dl.specs dd{color:#e9e3d4;text-align:right}
  .live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .live-item{background:rgba(255,255,255,.025);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
  .live-item span{display:block;font-size:10.5px;color:var(--mute);letter-spacing:.12em}
  .live-item b{display:block;margin-top:4px;font-weight:500;font-size:16px;color:#f3ecdd;font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .live-item.wide{grid-column:1 / -1}
  .pr-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
  .pr-bar i{display:block;height:100%;width:70%;background:linear-gradient(90deg,#8a6b33,var(--gold2));border-radius:2px;transition:width .3s}
  #spark{width:100%;height:54px;display:block;margin-top:6px}

  #partSec{display:none}
  #partSec.show{display:block;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .part-name{font-size:22px;color:#f6f0e2;margin-top:12px;letter-spacing:.04em}
  .part-en{font-size:12px;color:var(--gold);letter-spacing:.18em;margin-top:4px;text-transform:uppercase}
  .part-desc{font-size:13px;line-height:1.85;color:#c9c2b3;margin-top:12px}
  .part-actions{display:flex;gap:8px;margin-top:16px}
  .mini{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:rgba(201,168,106,.06);color:var(--gold2);
    font:inherit;font-size:12px;letter-spacing:.12em;cursor:pointer;transition:.2s}
  .mini:hover{background:rgba(201,168,106,.18);color:#fff}

  .cat{margin-top:14px}
  .cat h4{font-size:10.5px;letter-spacing:.24em;color:var(--mute);font-weight:400;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:#d6cfbf;
    font:inherit;font-size:12px;cursor:pointer;transition:.18s}
  .chip:hover{border-color:rgba(201,168,106,.5);color:#fff}
  .chip.on{background:rgba(201,168,106,.2);border-color:rgba(201,168,106,.65);color:#fff6e2}

  /* ---------- Dock ---------- */
  #dock{position:fixed;bottom:22px;left:calc((100vw - 374px)/2);transform:translateX(-50%);z-index:7;
    display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px;background:var(--glass);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.5);width:max-content;max-width:calc(100vw - 420px);flex-wrap:wrap;justify-content:center}
  .btn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid transparent;
    background:transparent;color:#d9d2c2;font:inherit;font-size:12.5px;letter-spacing:.06em;cursor:pointer;white-space:nowrap;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.06);color:#fff}
  .btn.on{background:linear-gradient(180deg,rgba(201,168,106,.3),rgba(201,168,106,.12));border-color:rgba(201,168,106,.55);color:#fff4da}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
  .btn kbd{font-family:inherit;font-size:9.5px;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
  .sep{width:1px;height:22px;background:var(--line2);margin:0 2px}
  .seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:2px;border:1px solid var(--line2)}
  .seg button{padding:6px 10px;border:none;border-radius:999px;background:transparent;color:#bdb5a5;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;transition:.2s}
  .seg button:hover{color:#fff}
  .seg button.on{background:rgba(201,168,106,.25);color:#fff4da}
  .speed{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);padding:0 6px;white-space:nowrap}
  .speed b{color:#f0e8d6;font-weight:500;width:44px;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(255,255,255,.15));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#f3e2bc;border:2px solid #8a6b33;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#f3e2bc;border:2px solid #8a6b33;cursor:pointer}

  /* ---------- Tooltip & labels ---------- */
  #tip{position:fixed;left:0;top:0;z-index:9;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    padding:9px 14px 8px;border-radius:10px;background:rgba(10,10,12,.82);border:1px solid rgba(201,168,106,.45);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;transition:opacity .18s}
  #tip .t1{font-size:13.5px;color:#fff5de;letter-spacing:.05em}
  #tip .t2{font-size:10px;color:var(--gold);letter-spacing:.2em;margin-top:2px;text-transform:uppercase}
  #tip .t3{font-size:10px;color:var(--mute);margin-top:4px}
  #labels{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s}
  #labels.show{opacity:1}
  #leaders{position:absolute;inset:0;width:100%;height:100%}
  .tag{position:absolute;left:0;top:0;padding:3px 9px;border-radius:6px;font-size:11px;letter-spacing:.06em;white-space:nowrap;
    color:#f1e9d6;background:rgba(10,10,12,.72);border:1px solid rgba(201,168,106,.35);pointer-events:auto;cursor:pointer;transition:background .15s,border-color .15s}
  .tag:hover,.tag.hot{background:rgba(201,168,106,.3);border-color:rgba(234,214,168,.9)}

  #hint{position:fixed;left:36px;bottom:30px;z-index:5;font-size:11px;letter-spacing:.14em;color:#6f6a60;pointer-events:none;line-height:1.9}
  #hint b{color:#9d9585;font-weight:400}

  #bPanel{display:none;position:fixed;right:16px;top:16px;z-index:8;width:40px;height:40px;border-radius:50%;
    background:var(--glass);border:1px solid var(--line);color:var(--gold2);font-size:17px;cursor:pointer;backdrop-filter:blur(14px)}

  /* ---------- Loader ---------- */
  #loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#121317 0%,#050506 70%);transition:opacity 1.2s ease}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(201,168,106,.15);border-top-color:var(--gold);animation:spin 1.1s linear infinite}
  #loader .lname{margin-top:26px;font-size:24px;letter-spacing:.5em;color:var(--gold2);padding-left:.5em}
  #loader .msg{margin-top:12px;font-size:12px;letter-spacing:.2em;color:var(--mute)}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:1680px){ #hint{display:none} }
  @media (max-width:1100px){
    #panel{transform:translateX(calc(100% + 40px));opacity:0}
    #panel.open{transform:none;opacity:1}
    #bPanel{display:block}
    #dock{left:50%;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center;border-radius:18px}
    #hint{display:none}
  }
  @media (max-width:640px){
    #brand{left:18px;top:18px} #brand .logo{font-size:22px} #brand .line,#brand .model2{display:none}
    #panel{left:10px;right:10px;width:auto;top:70px;bottom:auto;max-height:55vh}
    .speed input{width:70px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"><svg id="leaders"></svg></div>

<header id="brand">
  <div class="logo serif">AURÈLE</div>
  <div class="sub">Haute Horlogerie · Genève</div>
  <div class="line"></div>
  <div class="model serif">Squelette — Calibre AU‑28S</div>
  <div class="model2">手动上链全镂空腕表 · 42 mm</div>
  <div class="casesel"><span>表壳</span>
    <div class="seg" id="cases">
      <button data-c="steel" class="on">精钢</button><button data-c="rose">玫瑰金</button><button data-c="dlc">黑 DLC</button>
    </div>
  </div>
</header>

<button id="bPanel" title="信息面板">ⓘ</button>

<aside id="panel">
  <section class="sec" id="partSec">
    <div class="sec-title">零件详情 <span>Component</span></div>
    <div class="part-name" id="pName"></div>
    <div class="part-en" id="pEn"></div>
    <div class="part-desc" id="pDesc"></div>
    <dl class="specs" id="pSpecs"></dl>
    <div class="part-actions">
      <button class="mini" id="pFocus">聚焦零件</button>
      <button class="mini" id="pClose">关闭</button>
    </div>
  </section>

  <section class="sec">
    <div class="sec-title">机芯档案 <span>Movement</span></div>
    <div class="calibre serif">AU‑28S</div>
    <div class="calibre-sub">SQUELETTE · REMONTAGE MANUEL</div>
    <dl class="specs" id="mSpecs"></dl>
    <div class="live">
      <div class="live-item"><span>摆轮角度</span><b id="lBal">0°</b></div>
      <div class="live-item"><span>擒纵节拍</span><b id="lBeat">0</b></div>
      <div class="live-item"><span>机芯时间</span><b id="lTime">--:--:--</b></div>
      <div class="live-item"><span>动力储存</span><b id="lPR">70%</b><div class="pr-bar"><i id="lPRbar"></i></div></div>
      <div class="live-item wide"><span>摆轮振荡曲线 · 4 Hz · 振幅 270°</span><canvas id="spark"></canvas></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-title">零件目录 <span>Components</span></div>
    <div id="catalog"></div>
  </section>
</aside>

<div id="dock">
  <button class="btn" id="bExplode" title="快捷键 E"><svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></svg>爆炸视图</button>
  <button class="btn" id="bLabels" title="快捷键 L"><svg viewBox="0 0 24 24"><path d="M4 7h9l4 5-4 5H4z"/></svg>标签</button>
  <button class="btn" id="bNight" title="快捷键 N"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>夜光</button>
  <button class="btn" id="bRotate" title="快捷键 A"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>旋转</button>
  <button class="btn" id="bWind" title="快捷键 W"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>上链</button>
  <span class="sep"></span>
  <div class="seg" id="views">
    <button data-v="hero" class="on">¾</button><button data-v="front">正面</button><button data-v="side">侧面</button><button data-v="back">背面</button>
  </div>
  <span class="sep"></span>
  <div class="speed">速度<input type="range" id="speed" min="0" max="1" step="0.001" value="1"><b id="speedVal">1.00×</b></div>
  <button class="btn" id="bPause" title="暂停 (空格)">❚❚</button>
</div>

<div id="tip"><div class="t1"></div><div class="t2"></div><div class="t3">点击查看详情</div></div>
<div id="hint"><b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>右键</b> 平移<br><b>悬停</b> 识别零件 · <b>点击</b> 查看详情 · <b>双击</b> 聚焦</div>

<div id="loader"><div class="ring"></div><div class="lname serif">AURÈLE</div><div class="msg">正在装配机芯…</div></div>

<script>
  setTimeout(function(){
    if(!window.__watchReady){
      var m=document.querySelector('#loader .msg');
      if(m) m.textContent = window.__watchBooted ? '仍在渲染，请稍候…' : 'Three.js 加载失败，请检查网络连接后刷新页面。';
    }
  }, 15000);
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

window.__watchBooted = true;

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const v2 = (x, y) => new THREE.Vector2(x, y);
const polar = (c, r, a) => v2(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r);
const isWide = () => innerWidth > 1100;

function circleIntersect(p1, r1, p2, r2) {
  const d = p1.distanceTo(p2);
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const ex = (p2.x - p1.x) / d, ey = (p2.y - p1.y) / d;
  const mx = p1.x + a * ex, my = p1.y + a * ey;
  return [v2(mx - h * ey, my + h * ex), v2(mx + h * ey, my - h * ex)];
}
function makeCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* =====================================================================
   Renderer / scene / camera
   ===================================================================== */
const stage = $('#stage');
const PR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 1500);
camera.position.set(-60, 28, 150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.9;
controls.minDistance = 28;
controls.maxDistance = 175;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 0, 0);

function applyViewOffset() {
  const shift = isWide() ? 186 : 0;
  camera.aspect = innerWidth / innerHeight;
  if (shift) camera.setViewOffset(innerWidth, innerHeight, shift, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
applyViewOffset();

/* ---------- Studio environment (softboxes → PMREM) ---------- */
function buildEnvironment() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.MeshBasicMaterial({ color: 0x040405, side: THREE.BackSide })));
  const panel = (w, h, x, y, z, intensity, color = 0xffffff) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(46, 16, 0, 34, 8, 5.5);                 // overhead softbox
  panel(9, 46, -36, 6, 16, 5.0, 0xfff0da);      // left warm strip
  panel(9, 46, 36, 2, 6, 4.2, 0xdce7ff);        // right cool strip
  panel(40, 12, 0, 6, 42, 2.4, 0xfff6ea);       // frontal diffuser
  panel(26, 26, 14, 16, -40, 2.6, 0xe6eeff);    // back rim
  panel(80, 10, 0, -34, 0, 0.35, 0xffe7c8);     // floor bounce
  panel(6, 6, -20, 22, 38, 9.0);                // small specular kicker
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(env, 0.03).texture;
  pmrem.dispose();
  return tex;
}
scene.environment = buildEnvironment();

/* ---------- Background ---------- */
{
  const c = makeCanvas(1024), g = c.getContext('2d');
  const rg = g.createRadialGradient(512, 440, 10, 512, 520, 760);
  rg.addColorStop(0, '#1d1e23'); rg.addColorStop(0.32, '#101115'); rg.addColorStop(0.7, '#060608'); rg.addColorStop(1, '#020203');
  g.fillStyle = rg; g.fillRect(0, 0, 1024, 1024);
  const id = g.getImageData(0, 0, 1024, 1024);
  for (let i = 0; i < id.data.length; i += 4) { const n = (Math.random() - 0.5) * 3; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; }
  g.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

/* =====================================================================
   Procedural textures (perlage, Côtes de Genève, circular graining…)
   ===================================================================== */
function tex(canvas, { srgb = true, repeat = null, rot = 0, offset = null } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  if (offset) t.offset.set(offset[0], offset[1]);
  t.rotation = rot; t.anisotropy = maxAniso;
  return t;

function wheelAssembly(parent, pos, o) {
  const spin = new THREE.Group(); spin.position.set(pos.x, pos.y, 0); parent.add(spin);

  addMesh(slab(shape, o.z[0], o.z[1], o.bevel ?? 0.045, 1), [o.mat || M.gold, o.side || M.goldPolish], spin);
  addMesh(cylZ((o.hub ?? 0.8) * 0.72, o.z[0] - 0.07, o.z[1] + 0.07, 28), M.goldPolish, spin);
  if (o.pinion) { const p = o.pinion; addMesh(slab(new THREE.Shape(gearOutline(p.r, p.n, p.r * 0.34, 'pin')), p.z[0], p.z[1], 0.025, 1), [M.steel, M.steel], spin); }
  if (o.arbor) addMesh(cylZ(0.14, o.arbor[0], o.arbor[1], 14), M.steel, spin);
  return spin;
}

let camTween = null;
function tweenCamera(pos, target, dur = 1.8) {

  const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(t0));
  const s1 = new THREE.Spherical().setFromVector3(pos.clone().sub(t1));

  controls.enabled = false;
}
const _sph = new THREE.Spherical();
function updateCamTween() {
  if (!camTween) return;
  const { t0, t1, s0, s1, dth, start, dur } = camTween;
  const k = easeInOut(clamp((performance.now() - start) / dur));
  controls.target.lerpVectors(t0, t1, k);
  _sph.set(lerp(s0.radius, s1.radius, k), lerp(s0.phi, s1.phi, k), s0.theta + dth * k);
  camera.position.setFromSpherical(_sph).add(controls.target);

}
const sphPos = (r, polDeg, azDeg, target = new THREE.Vector3()) => new THREE.Vector3().setFromSpherical(new THREE.Spherical(r, polDeg * DEG, azDeg * DEG)).add(target);
const VIEWS = {

const spark = $('#spark'), sctx = spark.getContext('2d'), sparkBuf = new Float32Array(160);

function drawSpark() {

  if (spark.width !== w * PR) { spark.width = w * PR; spark.height = h * PR; }
  sctx.setTransform(PR, 0, 0, PR, 0, 0); sctx.clearRect(0, 0, w, h);

/* =====================================================================
   Animation loop
   ===================================================================== */
const clock = new THREE.Clock();
const FREQ = 4, AMP = 270 * DEG, LOCK = 7 * DEG, ESC_STEP = TAU / 30;
const startEpoch = Date.now();
let tSim = 0, lastWind = 0, ratchetAngle = 0;
const r4 = R.pE / R.fourth, r3 = r4 * (R.p4 / R.third), rc = r3 * (R.p3 / R.center), rb = rc * (R.cPin / R.barrel);
const $bal = $('#lBal'), $beat = $('#lBeat'), $time = $('#lTime'), $pr = $('#lPR'), $prb = $('#lPRbar');
const _v = new THREE.Vector3(), _c = new THREE.Vector3();
let frameN = 0;

function updateMovement(dt) {
  const th = AMP * Math.sin(TAU * FREQ * tSim);
  balInner.rotation.z = th;
  hairUpdate(th);
  palletInner.rotation.z = -LOCK * clamp(th / 0.35, -1, 1);
  const beat = 2 * FREQ * tSim, k = Math.floor(beat), fr = beat - k;
  const esc = (k + easeOutBack(clamp(fr / 0.14))) * ESC_STEP;
  escapeSpin.rotation.z = esc;
  fourthSpin.rotation.z = -esc * r4;
  thirdSpin.rotation.z = esc * r3;
  centerSpin.rotation.z = -esc * rc;
  barrelSpin.rotation.z = esc * rb;

  const now = performance.now();
  const winding = now < state.windUntil;
  if (!winding && lastWind) toggleBtn('#bWind', false);
  lastWind = winding ? 1 : 0;
  if (winding) { ratchetAngle -= dt * 1.1; crownSpin.rotation.x += dt * 5.5; state.power = Math.min(1, state.power + dt * 0.14); }
  else state.power = Math.max(0, state.power - dt * state.speed * (state.paused ? 0 : 1) / (72 * 3600));
  ratchetSpin.rotation.z = ratchetAngle;
  crownWheelSpin.rotation.z = -ratchetAngle * (4.0 / 2.2);
  const tp = TAU / 44, f = ((-ratchetAngle % tp) + tp) % tp / tp;
  clickPawl.rotation.z = 0.12 * Math.sin(f * Math.PI) * (winding ? 1 : 0);

  // hands & motion works (time follows the simulated movement)
  const d = new Date(startEpoch + tSim * 1000);
  const s = d.getSeconds() + Math.floor(d.getMilliseconds() / 125) / 8;
  const m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
  secondsHand.spin.rotation.z = -s / 60 * TAU;
  minuteHand.spin.rotation.z = -m / 60 * TAU;
  hourHand.spin.rotation.z = -h / 12 * TAU;
  hourWheelSpin.rotation.z = hourHand.spin.rotation.z;
  cannonSpin.rotation.z = minuteHand.spin.rotation.z;
  minuteWheelSpin.rotation.z = -minuteHand.spin.rotation.z * (0.6 / 2.2);

  // telemetry
  sparkBuf[sparkIdx] = th / AMP; sparkIdx = (sparkIdx + 1) % sparkBuf.length;
  if ((frameN & 1) === 0) {
    $bal.textContent = `${(th / DEG).toFixed(0)}°`;
    $beat.textContent = k.toLocaleString();
    const pad = x => String(x).padStart(2, '0');
    $time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    $pr.textContent = `${Math.round(state.power * 100)}%  · ${Math.round(state.power * 72)} h`;
    $prb.style.width = `${state.power * 100}%`;
    drawSpark();
  }
}

function updateExplode(dt) {
  if (state.explode !== state.explodeTarget) {
    const dir = Math.sign(state.explodeTarget - state.explode);
    state.explode = clamp(state.explode + dir * dt / 1.9);
  }
  for (const ex of explodables) {
    const p = easeInOut(clamp((state.explode - ex.delay) / 0.7));
    ex.obj.position.copy(ex.base).addScaledVector(ex.off, p);
  }
}

function updateNight(dt) {
  if (Math.abs(state.night - state.nightTarget) < 1e-4) return;
  state.night = lerp(state.night, state.nightTarget, 1 - Math.exp(-dt * 3.2));
  if (Math.abs(state.night - state.nightTarget) < 0.002) state.night = state.nightTarget;
  const k = state.night;
  for (const m of allMats) m.envMapIntensity = m.userData.env * (1 - 0.93 * k);
  for (const [l, i] of LIGHTS) l.intensity = i * (1 - 0.93 * k);
  uvLight.intensity = 0.35 * k;
  M.lume.emissiveIntensity = 0.05 + 4.2 * k;
  M.lume.color.copy(LUME_DAY).multiplyScalar(1 - 0.6 * k);
  bloom.strength = 0.22 + 0.95 * k; bloom.radius = 0.45 + 0.2 * k;
  scene.backgroundIntensity = 1 - 0.75 * k;
  M.print.color.setScalar(1 - 0.85 * k);
  floorGlow.material.opacity = 0.45 * (1 - k);
}

function updateLabels() {
  if (!state.labels) return;
  watch.getWorldPosition(_c).project(camera);
  const cx = (_c.x + 1) / 2 * innerWidth, cy = (1 - _c.y) / 2 * innerHeight;
  let i = 0;
  for (const [id, t] of Object.entries(tagEls)) {
    anchorWorld(id, _v).project(camera);
    const vis = _v.z < 1;
    const ax = (_v.x + 1) / 2 * innerWidth, ay = (1 - _v.y) / 2 * innerHeight;
    let dx = ax - cx, dy = ay - cy, L = Math.hypot(dx, dy);
    if (L < 20) { const a = -0.9 + i * 0.5; dx = Math.cos(a); dy = Math.sin(a); L = 1; }
    dx /= L; dy /= L;
    const len = 58 + (i % 3) * 16;
    const ex = ax + dx * len, ey = ay + dy * len, hx = ex + (dx >= 0 ? 16 : -16);
    t.line.setAttribute('points', `${ax},${ay} ${ex},${ey} ${hx},${ey}`);
    t.dot.setAttribute('cx', ax); t.dot.setAttribute('cy', ay);
    const w = t.d.offsetWidth;
    t.d.style.transform = `translate(${dx >= 0 ? hx + 3 : hx - w - 3}px, ${ey - 11}px)`;
    t.d.style.display = t.line.style.display = t.dot.style.display = vis ? '' : 'none';
    i++;
  }
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  frameN++;
  if (!state.paused) tSim += dt * state.speed;
  updateMovement(dt);
  updateExplode(dt);
  updateNight(dt);
  updateCamTween();
  watch.position.y = Math.sin(performance.now() * 0.00055) * 0.35;
  controls.update();
  const now = performance.now();
  if (needPick && now - lastPick > 40 && !camTween) { needPick = false; lastPick = now; pick(); }
  if (state.hover) { tip.style.left = tipX + 'px'; tip.style.top = (tipY - 16) + 'px'; }
  updateLabels();
  composer.render(dt);
  if (!window.__watchReady) {
    window.__watchReady = true;
    setTimeout(() => $('#loader').classList.add('hide'), 250);
    const [p, t] = VIEWS.hero(); tweenCamera(p, t, 3.2);
  }
}

addEventListener('resize', () => {
  applyViewOffset();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  floor.getRenderTarget().setSize(Math.round(innerWidth * PR * 0.5), Math.round(innerHeight * PR * 0.5));
});

applyCase('steel');
frame();
</script>
</body>
