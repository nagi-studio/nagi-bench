<script type="module">
import * as THREE from 'three';

/* ======================= 常量 & 随机 ======================= */
const CS = 16, H = 160, SEA = 32, RD = 8;
const SEED = 1337;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function hash3(x,y,z){return hash2(x+Math.imul(y,7919),z-Math.imul(y,104729),y*31+7);}

/* ======================= 柏林噪声 ======================= */
const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(t,a,b)=>a+t*(b-a);
function g2(h,x,y){switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;}}

class Perlin{

    for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
    this.p=new Uint16Array(512);for(let i=0;i<512;i++)this.p[i]=p[i&255];}
  n2(x,y){const p=this.p;const fx=Math.floor(x),fy=Math.floor(y);x-=fx;y-=fy;const X=fx&255,Y=fy&255;
    const u=fade(x),v=fade(y),a=p[X]+Y,b=p[X+1]+Y;

    return lerp(w,lerp(v,lerp(u,g3(p[AA],x,y,z),g3(p[BA],x-1,y,z)),lerp(u,g3(p[AB],x,y-1,z),g3(p[BB],x-1,y-1,z))),
      lerp(v,lerp(u,g3(p[AA+1],x,y,z-1),g3(p[BA+1],x-1,y,z-1)),lerp(u,g3(p[AB+1],x,y-1,z-1),g3(p[BB+1],x-1,y-1,z-1))));}

const nA=new Perlin(SEED),nB=new Perlin(SEED+1),nC=new Perlin(SEED+2),nD=new Perlin(SEED+3),nE=new Perlin(SEED+4),nF=new Perlin(SEED+5);

const hCache=new Map();
function terrainH(x,z){
  const k=x*100003+z; const c0=hCache.get(k); if(c0!==undefined) return c0;
  const c=nA.fbm(x*0.0025,z*0.0025,4)*1.6;
  const d=nB.fbm(x*0.013+50,z*0.013+50,4);

/* ======================= 程序化像素材质 ======================= */

const T={};TILES.forEach((n,i)=>T[n]=i);

const atlasCanvas=document.createElement('canvas');atlasCanvas.width=AW;atlasCanvas.height=16;
(function paint(){
  const ctx=atlasCanvas.getContext('2d');const img=ctx.createImageData(AW,16);const D=img.data;
  const cl=v=>Math.max(0,Math.min(255,v|0));

  const G=(x,y)=>{const i=(y*AW+tile*16+x)*4;return [D[i],D[i+1],D[i+2]];};
  let R=mulberry32(42);
  const V=(c,v)=>{const k=(R()-.5)*2*v;return [c[0]+k,c[1]+k,c[2]+k];};
  const all=f=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++)f(x,y);};
  const vor=(n)=>{const pts=[];for(let i=0;i<n;i++)pts.push([R()*16,R()*16,R()]);
    return (x,y)=>{let d1=99,d2=99,id=0;for(let i=0;i<n;i++){let dx=Math.abs(x+.5-pts[i][0]),dy=Math.abs(y+.5-pts[i][1]);dx=Math.min(dx,16-dx);dy=Math.min(dy,16-dy);const d=Math.sqrt(dx*dx+dy*dy);if(d<d1){d2=d1;d1=d;id=i;}else if(d<d2)d2=d;}return {e:d2-d1,v:pts[id][2]};};};

  const stone=()=>all((x,y)=>{const r=R();S(x,y,r<.08?[98,98,100]:r<.13?[152,152,152]:V([126,126,126],18));});
  const cobble=(base)=>{const f=vor(11);all((x,y)=>{const q=f(x,y);if(q.e<1.1)S(x,y,V([70,70,72],10));else{const s=base+q.v*40+(q.e<2?-12:0)+(x+y<q.e*3?8:0);S(x,y,V([s,s,s],10));}});};
  const P={
    grass_top(){all((x,y)=>S(x,y,R()<.12?[68,128,40]:V([98,162,58],28)));},
    dirt,
    grass_side(){dirt();for(let x=0;x<16;x++){const d=3+(R()<.5)+(R()<.3);for(let y=0;y<d;y++)S(x,y,V([96,158,56],24));if(R()<.4)S(x,d,[70,120,40]);}},
    stone,
    sand(){all((x,y)=>S(x,y,R()<.08?[200,186,140]:V([222,208,162],14)));},
    water(){all((x,y)=>{const w=(x+y*2+Math.floor(Math.sin(y*0.8)*2)+32)%9===0;S(x,y,w?[110,160,240]:V([44,96,206],14),w?200:175);});},
    log_side(){all((x,y)=>{const s=(x%4===0)?-25:((x*7)%5)*4;S(x,y,R()<.1?[70,55,35]:V([104+s,80+s*.8,50+s*.5],10));});},
    log_top(){all((x,y)=>{const d=Math.hypot(x-7.5,y-7.5);if(d>6.6)S(x,y,V([92,72,44],10));else S(x,y,V(Math.floor(d*1.1)%2?[184,148,94]:[152,120,72],8));});},
    leaves(){all((x,y)=>{if(R()<.17)S(x,y,[0,0,0],0);else S(x,y,R()<.15?[90,170,60]:V([52,120,38],30));});},
    planks(){const seam=[3,11,7,14];all((x,y)=>{const b=y>>2;let c=V([166+b*4,132+b*3,80],10);if(y%4===3)c=[112,86,50];else if(x===seam[b])c=[120,92,56];else if(R()<.08)c=[146,114,66];S(x,y,c);});},
    cobble(){cobble(110);},
    glass(){all((x,y)=>{const edge=x===0||y===0||x===15||y===15;const glint=(x-y===5&&x>6&&x<11)||(x-y===3&&x>3&&x<6);if(edge)S(x,y,[200,228,240]);else if(glint)S(x,y,[255,255,255],230);else S(x,y,[200,235,255],35);});},
    gold(){all((x,y)=>{let c=V([246,204,58],16);if(x===0||y===0)c=[255,244,150];else if(x===15||y===15)c=[196,146,24];else if(R()<.05)c=[255,255,200];S(x,y,c);});},
    obsidian(){all((x,y)=>{const r=R();S(x,y,r<.08?[64,42,96]:r<.11?[112,82,156]:V([22,16,36],10));});},
    crystal(){all((x,y)=>{const f=((x+y)%6<3)?1.1:0.82;let c=[110*f,226*f,255];if((x-y+16)%7===0)c=[235,255,255];S(x,y,V(c,10));});},
    quartz(){all((x,y)=>{let c=V([236,232,224],7);if(x===0||y===0||x===15||y===15)c=[214,208,196];S(x,y,c);});},
    lava(){all((x,y)=>{const v=(Math.sin(x*0.8+y*0.35)*Math.cos(y*0.7-x*0.25)+1)/2+(R()-.5)*.25;S(x,y,[255,90+v*150,20+v*40]);});},
    snow(){all((x,y)=>S(x,y,R()<.1?[218,228,245]:V([245,250,255],6)));},
    snow_side(){dirt();for(let x=0;x<16;x++){const d=3+(R()<.5)+(R()<.4);for(let y=0;y<d;y++)S(x,y,V([244,248,255],6));}},
    bedrock(){all((x,y)=>S(x,y,R()<.5?V([46,46,46],12):V([108,108,108],25)));},
    brick(){all((x,y)=>{const row=y>>2,off=row%2?4:0;if(y%4===3||(x+off)%8===7)S(x,y,V([182,172,160],8));else S(x,y,V([152,64,48],18));});},
    portal(){all((x,y)=>{const a=Math.atan2(y-7.5,x-7.5),d=Math.hypot(x-7.5,y-7.5);const v=Math.sin(a*3+d*1.3);S(x,y,[140+v*70,40+v*20,225],205);});},
    bone(){all((x,y)=>{let c=V([232,226,200],10);if(x===3||x===12)c=[208,200,172];if((y===2||y===13)&&x>3&&x<12)c=[216,210,184];S(x,y,c);});},
    redwood(){all((x,y)=>{let c=V([176,34,30],14);if(x%4===0)c=[140,22,20];if(y===0||y===15)c=[224,172,44];S(x,y,c);});},
    jade(){all((x,y)=>{const v=Math.sin(x*0.6+Math.sin(y*0.5)*2.2+y*0.2);S(x,y,v>0.75?V([156,232,192],8):V([66,170,120],14));});},
    roof(){all((x,y)=>{const row=y>>2,xo=row%2?2:0,lx=(x+xo)%4,ly=y%4;let c=[230,178,48];if(ly===3||lx===0)c=[150,98,20];else if(ly===0)c=[255,220,110];S(x,y,V(c,8));});},
    moss(){cobble(105);all((x,y)=>{if(Math.sin(x*0.9)+Math.cos(y*0.7)+R()>1.15)S(x,y,V([72,122,50],18));});},
    glow(){const f=vor(9);all((x,y)=>{const q=f(x,y);S(x,y,q.e<1?[160,110,50]:V(q.v>.5?[255,226,130]:[236,170,70],14));});},
    mush(){all((x,y)=>S(x,y,V([196,32,30],14)));[[3,3],[11,5],[6,11],[13,13],[1,9]].forEach(([cx,cy])=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(Math.hypot(x-cx,y-cy)<1.7)S(x,y,[240,236,226]);});},
    stem(){all((x,y)=>S(x,y,V([222,212,190],9)));},
    cactus_side(){all((x,y)=>{let c=V([82,142,50],14);if(x%4===0)c=[52,100,34];if(R()<.04)c=[236,232,190];S(x,y,c);});},
    cactus_top(){all((x,y)=>{const d=Math.hypot(x-7.5,y-7.5);S(x,y,d>6?[52,100,34]:V(d<2?[150,190,90]:[96,156,60],10));});},
    gold_ore(){stone();for(let i=0;i<6;i++){const cx=2+R()*12|0,cy=2+R()*12|0;S(cx,cy,[252,220,90]);S(cx+1,cy,[220,170,40]);S(cx,cy+1,[255,240,150]);}},
    crystal_ore(){stone();for(let i=0;i<6;i++){const cx=2+R()*12|0,cy=2+R()*12|0;S(cx,cy,[120,240,255]);S(cx+1,cy,[60,180,230]);S(cx,cy+1,[220,255,255]);}},

  ctx.putImageData(img,0,0);

const atlas=new THREE.CanvasTexture(atlasCanvas);

/* ======================= 方块定义 ======================= */
const B={AIR:0,GRASS:1,DIRT:2,STONE:3,SAND:4,WATER:5,LOG:6,LEAVES:7,PLANKS:8,COBBLE:9,GLASS:10,GOLD:11,OBSIDIAN:12,CRYSTAL:13,QUARTZ:14,LAVA:15,SNOW:16,BEDROCK:17,BRICK:18,PORTAL:19,BONE:20,REDWOOD:21,JADE:22,ROOF:23,MOSS:24,GLOW:25,MUSH:26,STEM:27,CACTUS:28,GOLDORE:29,CRYORE:30};

def(14,'石英','quartz');def(15,'岩浆','lava',0,0,{solid:false,emit:true,liquid:true});def(16,'雪地','snow','snow_side','dirt');def(17,'基岩','bedrock');
def(18,'砖块','brick');def(19,'星界传送门','portal',0,0,{solid:false,see:true,trans:true,emit:true});def(20,'龙骨','bone');def(21,'朱漆木','redwood');
def(22,'玉石','jade');def(23,'琉璃瓦','roof');def(24,'苔石','moss');def(25,'萤石','glow',0,0,{emit:true});def(26,'红菇块','mush');def(27,'菇柄','stem');

/* ======================= 结构写入器 ======================= */
class Writer{

    for(let y=ya;y<=yb;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)this.set(x,y,z,id);}
  disk(cx,y,cz,r,id){const rr=(r+0.4)*(r+0.4);
    const xa=Math.max(Math.floor(cx-r-1),this.x0),xb=Math.min(Math.ceil(cx+r+1),this.x1),za=Math.max(Math.floor(cz-r-1),this.z0),zb=Math.min(Math.ceil(cz+r+1),this.z1);
    for(let x=xa;x<=xb;x++)for(let z=za;z<=zb;z++){const dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<=rr)this.set(x,y,z,id);}}
  sphere(cx,cy,cz,r,id,onlyAir){const rr=(r+0.3)*(r+0.3);
    const xa=Math.max(Math.floor(cx-r-1),this.x0),xb=Math.min(Math.ceil(cx+r+1),this.x1),za=Math.max(Math.floor(cz-r-1),this.z0),zb=Math.min(Math.ceil(cz+r+1),this.z1);
    if(xa>xb||za>zb)return;
    for(let x=xa;x<=xb;x++)for(let z=za;z<=zb;z++)for(let y=Math.floor(cy-r-1);y<=Math.ceil(cy+r+1);y++){const dx=x-cx,dy=y-cy,dz=z-cz;
      if(dx*dx+dy*dy+dz*dz<=rr){if(onlyAir)this.setAir(x,y,z,id);else this.set(x,y,z,id);}}}
  line(a,b,r,id){const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);const n=Math.max(1,Math.ceil(d*1.6));
    for(let i=0;i<=n;i++){const t=i/n,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t,z=a[2]+(b[2]-a[2])*t;

const leafFn=(x,y,z)=>hash3(x,y,z)<0.025?B.GLOW:B.LEAVES;

function island(w,cx,cy,cz,R,seed){
  for(let x=Math.max(cx-R-1,w.x0);x<=Math.min(cx+R+1,w.x1);x++)for(let z=Math.max(cz-R-1,w.z0);z<=Math.min(cz+R+1,w.z1);z++){
    const r=Math.hypot(x-cx,z-cz),edge=R*(0.82+0.18*nE.n2(x*0.15+seed,z*0.15));if(r>edge)continue;
    const t=1-r/edge,depth=Math.floor(Math.pow(t,0.6)*R*0.9+1+hash2(x,z,seed)*2.5);
    for(let y=cy-depth;y<=cy;y++)w.set(x,y,z,y===cy?B.GRASS:y>cy-3?B.DIRT:(hash3(x,y,z)<0.04?B.CRYORE:B.STONE));
    if(r<R*0.6&&hash2(x,z,seed+5)<0.05){const L=2+Math.floor(hash2(x,z,seed+6)*5);for(let k=1;k<=L;k++)w.set(x,cy-depth-k,z,B.CRYSTAL);}
  }
}
function tower(w,x,y0,z,r,y1,wall,roof){
  for(let y=y0;y<=y1;y++){w.disk(x,y,z,r,wall);if(y>y0)w.disk(x,y,z,r-1,B.AIR);
    if((y-y0)%5===3){w.set(x+r,y,z,B.GLASS);w.set(x-r,y,z,B.GLASS);w.set(x,y,z+r,B.GLASS);w.set(x,y,z-r,B.GLASS);}}
  w.disk(x,y1-6,z,r-1,B.PLANKS);w.set(x,y1-7,z,B.GLOW);
  let k=0;for(let rr=r+1;rr>0;rr-=0.55,k++)w.disk(x,y1+1+k,z,rr,roof);
  w.box(x,y1+1+k,z,x,y1+3+k,z,B.GOLD);
  return y1+4+k;
}

  const feet=getBlock(Math.floor(P.x),Math.floor(P.y+0.2),Math.floor(P.z)),body=getBlock(Math.floor(P.x),Math.floor(P.y+1),Math.floor(P.z));
  const inW=(BL[feet]&&BL[feet].liquid)||(BL[body]&&BL[body].liquid);
  if(P.fly){const sp=keys.ControlLeft?40:16;P.vx=wx*sp;P.vz=wz*sp;P.vy=((keys.Space?1:0)-(keys.ShiftLeft?1:0))*sp;}
  else{let sp=keys.ShiftLeft?7.2:4.6;if(inW)sp*=0.55;const k=Math.min(1,dt*(P.ground?14:inW?6:3));
    P.vx+=(wx*sp-P.vx)*k;P.vz+=(wz*sp-P.vz)*k;
    if(inW){P.vy-=10*dt;P.vy*=Math.pow(0.15,dt);if(keys.Space)P.vy=Math.min(P.vy+30*dt,3.8);P.vy=Math.max(P.vy,-4);}
    else{P.vy-=28*dt;P.vy=Math.max(P.vy,-55);if(keys.Space&&P.ground)P.vy=8.6;}}
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(P.vx),Math.abs(P.vy),Math.abs(P.vz))*dt/0.3));const sdt=dt/n;
  P.ground=false;for(let i=0;i<n;i++){move(0,P.vx*sdt);move(1,P.vy*sdt);move(2,P.vz*sdt);}
  if(P.y<-30){P.y=gH(Math.floor(P.x),Math.floor(P.z))+3;P.vy=0;}
}
function raycast(ox,oy,oz,dx,dy,dz,max){
  let x=Math.floor(ox),y=Math.floor(oy),z=Math.floor(oz);const sx=Math.sign(dx),sy=Math.sign(dy),sz=Math.sign(dz);
  const tdx=dx?Math.abs(1/dx):Infinity,tdy=dy?Math.abs(1/dy):Infinity,tdz=dz?Math.abs(1/dz):Infinity;
  let tx=dx?(sx>0?x+1-ox:ox-x)*tdx:Infinity,ty=dy?(sy>0?y+1-oy:oy-y)*tdy:Infinity,tz=dz?(sz>0?z+1-oz:oz-z)*tdz:Infinity;
  let nx=0,ny=0,nz=0,t=0;
  while(t<=max){const id=getBlock(x,y,z);if(id&&!BL[id].liquid)return{x,y,z,nx,ny,nz,id};
    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=tdx;nx=-sx;ny=0;nz=0;}else if(ty<tz){y+=sy;t=ty;ty+=tdy;nx=0;ny=-sy;nz=0;}else{z+=sz;t=tz;tz+=tdz;nx=0;ny=0;nz=-sz;}}
  return null;}

/* ======================= 物品栏 ======================= */
const PAL=[B.GRASS,B.DIRT,B.STONE,B.COBBLE,B.PLANKS,B.LOG,B.GLASS,B.BRICK,B.QUARTZ,B.GOLD,B.CRYSTAL,B.GLOW,B.JADE,B.REDWOOD,B.ROOF,B.OBSIDIAN,B.LEAVES,B.SAND,B.SNOW,B.BONE,B.MOSS,B.MUSH,B.WATER,B.LAVA,B.PORTAL];
let sel=0;const hb=document.getElementById('hotbar');
PAL.forEach((id,i)=>{const s=document.createElement('div');s.className='s';const cv=document.createElement('canvas');cv.width=cv.height=16;
  cv.getContext('2d').drawImage(atlasCanvas,BL[id].tex[1]*16,0,16,16,0,0,16,16);s.appendChild(cv);if(i<9){const n=document.createElement('span');n.className='n';n.textContent=i+1;s.appendChild(n);}hb.appendChild(s);});
function updHB(){[...hb.children].forEach((e,i)=>e.classList.toggle('sel',i===sel));document.getElementById('bname').textContent=BL[PAL[sel]].name;}updHB();

/* ======================= 输入 ======================= */
const ov=document.getElementById('overlay');let locked=false;
ov.addEventListener('click',()=>renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;ov.style.display=locked?'none':'flex';});
document.addEventListener('mousemove',e=>{if(!locked)return;P.yaw-=e.movementX*0.0022;P.pitch-=e.movementY*0.0022;P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch));});
let tpI=-1;
document.addEventListener('keydown',e=>{keys[e.code]=true;if(!locked)return;
  if(e.code.startsWith('Digit')){const n=+e.code.slice(5)-1;if(n>=0&&n<9){sel=n;updHB();}}
  if(e.code==='KeyF'){P.fly=!P.fly;P.vy=0;}
  if(e.code==='KeyT'){tpI=(tpI+1)%LM.length;const L=LM[tpI],p=L.tp();P.x=p[0];P.y=p[1];P.z=p[2];P.vx=P.vy=P.vz=0;
    P.yaw=Math.atan2(-(L.x-P.x),-(L.z-P.z));toast('✦ 传送至：'+L.name);}
  if(['Space','ControlLeft'].includes(e.code))e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('wheel',e=>{if(!locked)return;sel=(sel+(e.deltaY>0?1:-1)+PAL.length)%PAL.length;updHB();});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('mousedown',e=>{if(!locked)return;
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);const h=raycast(camera.position.x,camera.position.y,camera.position.z,dir.x,dir.y,dir.z,7);if(!h)return;
  if(e.button===0){if(h.id!==B.BEDROCK)setBlock(h.x,h.y,h.z,0);}
  else if(e.button===1){const i=PAL.indexOf(h.id);if(i>=0){sel=i;updHB();}}
  else if(e.button===2){const x=h.x+h.nx,y=h.y+h.ny,z=h.z+h.nz;const t=getBlock(x,y,z);if(t&&!BL[t].liquid)return;
    const id=PAL[sel];if(SOLID[id]&&x+1>P.x-HW&&x<P.x+HW&&y+1>P.y&&y<P.y+PH&&z+1>P.z-HW&&z<P.z+HW)return;setBlock(x,y,z,id);}});
let toastT=0;function toast(s){const b=document.getElementById('bname');b.textContent=s;toastT=2.5;}

/* ======================= 主循环 ======================= */
const hud=document.getElementById('hud'),loading=document.getElementById('loading'),waterOv=document.getElementById('water');
const ARW=['↑','↗','→','↘','↓','↙','←','↖'];
let last=performance.now(),fps=0,fc=0,ft=0,time=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();let dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  fc++;ft+=dt;if(ft>=0.5){fps=Math.round(fc/ft);fc=0;ft=0;}
  const pcx=Math.floor(P.x/16),pcz=Math.floor(P.z/16);
  updateChunks(pcx,pcz,7);
  const here=chunks.get(ck(pcx,pcz));
  const ready=here&&here.meshed;loading.style.display=ready?'none':'block';
  if(ready){if(!P.placed){while(collide(P.x,P.y,P.z))P.y++;P.placed=true;}physics(dt);}
  camera.position.set(P.x,P.y+EYE,P.z);camera.rotation.set(P.pitch,P.yaw,0);
  const eyeB=getBlock(Math.floor(P.x),Math.floor(P.y+EYE),Math.floor(P.z));
  const under=eyeB===B.WATER,inLava=eyeB===B.LAVA;waterOv.style.display=(under||inLava)?'block':'none';waterOv.style.background=inLava?'rgba(255,90,0,.6)':'rgba(30,70,200,.35)';
  if(under){scene.fog.color.set(0x1e4ab0);scene.fog.near=1;scene.fog.far=28;}else{scene.fog.color.copy(SKY);scene.fog.near=RD*16*0.45;scene.fog.far=RD*16-6;}
  sun.position.set(P.x+400,P.y+500,P.z-600);sun.lookAt(camera.position);
  clouds.position.set(P.x,150,P.z);ctex.offset.set((P.x+time*3)/500,-P.z/500);
  hl.visible=false;
  if(locked){const dir=new THREE.Vector3();camera.getWorldDirection(dir);const h=raycast(camera.position.x,camera.position.y,camera.position.z,dir.x,dir.y,dir.z,7);if(h){hl.visible=true;hl.position.set(h.x+0.5,h.y+0.5,h.z+0.5);}}
  if(toastT>0){toastT-=dt;if(toastT<=0)updHB();}
  let best=null,bd=1e9;for(const L of LM){const d=Math.hypot(L.x-P.x,L.z-P.z);if(d<bd){bd=d;best=L;}}
  let diff=Math.atan2(-(best.x-P.x),-(best.z-P.z))-P.yaw;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  const arrow=ARW[((Math.round(-diff/(Math.PI/4))%8)+8)%8];
  hud.textContent=`神域方块 Mythcraft   FPS ${fps}\nXYZ ${P.x.toFixed(1)} / ${P.y.toFixed(1)} / ${P.z.toFixed(1)}\n区块 ${pcx},${pcz}  已加载 ${chunks.size}${P.fly?'   [飞行]':''}\n最近奇观：${best.name} ${arrow} ${Math.round(bd)}m\n按 T 传送巡游所有奇观`;
  renderer.render(scene,camera);
}
loop();
</script>
