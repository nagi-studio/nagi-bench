<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8e8"/>
      <stop offset="0.6" stop-color="#bfe0f7"/>
      <stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7fb8"/>
      <stop offset="1" stop-color="#3fb6c9"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dca5"/>
      <stop offset="1" stop-color="#d9b77a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d6d0"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e6df"/>
      <stop offset="0.6" stop-color="#9a9a94"/>
      <stop offset="1" stop-color="#3b3b3b"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b25a"/>
      <stop offset="1" stop-color="#d9772e"/>
    </linearGradient>
  </defs>

  <!-- Sky & sun -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="640" cy="110" r="90" fill="url(#sun)"/>
  <circle cx="640" cy="110" r="38" fill="#fff6c8"/>

  <!-- Clouds -->
  <g fill="#fff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="80" rx="55" ry="18"/><ellipse cx="180" cy="68" rx="35" ry="20"/><ellipse cx="120" cy="72" rx="28" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="420" cy="55" rx="45" ry="14"/><ellipse cx="445" cy="46" rx="28" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="25s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Distant gulls -->
  <g stroke="#333" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 120 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M350 100 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- Sea -->
  <rect y="240" width="800" height="110" fill="url(#sea)"/>
  <path d="M560 240 L720 240 L660 300 Z" fill="#fff6c8" opacity="0.25"/>
  <g stroke="#e8f8ff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M40 265 q15 -6 30 0 t30 0">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></path>
    <path d="M380 280 q15 -6 30 0 t30 0">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/></path>
    <path d="M620 300 q15 -6 30 0 t30 0"/>
    <path d="M200 310 q15 -6 30 0 t30 0"/>
  </g>
  <!-- Sailboat -->
  <g transform="translate(250,232)">
    <path d="M0 8 L40 8 L34 16 L6 16 Z" fill="#6b3f22"/>
    <path d="M20 8 L20 -30 L38 4 Z" fill="#fff"/>
    <path d="M18 8 L18 -22 L4 4 Z" fill="#f2f2f2"/>
  </g>

  <!-- Foam line & beach -->
  <path d="M0 345 Q100 330 200 345 T400 345 T600 345 T800 345 L800 500 L0 500 Z" fill="url(#sand)"/>
  <path d="M0 345 Q100 330 200 345 T400 345 T600 345 T800 345" stroke="#fff" stroke-width="5" fill="none" opacity="0.85">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M0 345 Q100 330 200 345 T400 345 T600 345 T800 345;M0 350 Q100 338 200 350 T400 350 T600 350 T800 350;M0 345 Q100 330 200 345 T400 345 T600 345 T800 345"/>
  </path>
  <!-- Boardwalk path -->
  <rect y="430" width="800" height="14" fill="#b88a55"/>
  <g stroke="#8d6538" stroke-width="2">
    <line x1="0" y1="437" x2="800" y2="437"/>
  </g>
  <!-- Shells -->
  <ellipse cx="90" cy="470" rx="6" ry="4" fill="#f7c9b8"/>
  <ellipse cx="700" cy="475" rx="5" ry="3" fill="#fff"/>
  <!-- Palm -->
  <g transform="translate(720,430)">
    <path d="M0 0 Q-10 -90 10 -170" stroke="#7a5230" stroke-width="10" fill="none"/>
    <g fill="#2f8f3a">
      <path d="M10 -170 Q-50 -190 -80 -140 Q-40 -170 10 -165Z"/>
      <path d="M10 -170 Q60 -200 90 -150 Q50 -175 10 -165Z"/>
      <path d="M10 -170 Q-20 -220 -60 -210 Q-20 -200 10 -168Z"/>
      <path d="M10 -170 Q40 -225 80 -215 Q40 -205 10 -168Z"/>
    </g>
  </g>

  <!-- ====== Pelican on bicycle (whole group bobs) ====== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.6s" repeatCount="indefinite"/>
    <!-- shadow -->
    <ellipse cx="370" cy="440" rx="150" ry="8" fill="#000" opacity="0.2"/>

    <!-- Wheels -->
    <g id="wheels" fill="none">
      <g transform="translate(270,375)">
        <circle r="62" stroke="#222" stroke-width="7"/>
        <circle r="56" stroke="#777" stroke-width="2"/>
        <g stroke="#bbb" stroke-width="1.5">
          <line x1="-56" y1="0" x2="56" y2="0"/><line x1="0" y1="-56" x2="0" y2="56"/>
          <line x1="-40" y1="-40" x2="40" y2="40"/><line x1="-40" y1="40" x2="40" y2="-40"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <circle r="5" fill="#555"/>
      </g>
      <g transform="translate(470,375)">
        <circle r="62" stroke="#222" stroke-width="7"/>
        <circle r="56" stroke="#777" stroke-width="2"/>
        <g stroke="#bbb" stroke-width="1.5">
          <line x1="-56" y1="0" x2="56" y2="0"/><line x1="0" y1="-56" x2="0" y2="56"/>
          <line x1="-40" y1="-40" x2="40" y2="40"/><line x1="-40" y1="40" x2="40" y2="-40"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <circle r="5" fill="#555"/>
      </g>
    </g>

    <!-- Frame -->
    <g stroke="#d6332f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M270 375 L355 375 L330 300 Z"/>
      <path d="M355 375 L445 300 L330 300"/>
      <path d="M470 375 L440 280"/>
    </g>
    <!-- Handlebar -->
    <path d="M440 280 L436 266 Q450 258 462 268" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Seat -->
    <path d="M330 300 L326 288" stroke="#333" stroke-width="5"/>
    <path d="M305 286 Q325 280 345 286 L340 292 L310 292 Z" fill="#222"/>
    <!-- Basket with fish -->
    <g transform="translate(450,285)">
      <path d="M10 -5 Q30 -25 48 -10" fill="#9fb0bf" stroke="#4d5f6e" stroke-width="2"/>
      <circle cx="40" cy="-14" r="2" fill="#222"/>
      <path d="M0 -6 L52 -6 L46 22 L6 22 Z" fill="#c99a5b" stroke="#8a6232" stroke-width="2"/>
      <path d="M3 4 L49 4 M5 13 L47 13" stroke="#8a6232" stroke-width="1.5"/>
    </g>

    <!-- Back leg (behind) + rotating crank -->
    <g transform="translate(355,375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-24" stroke="#444" stroke-width="5"/>
        <line x1="0" y1="0" x2="0" y2="24" stroke="#444" stroke-width="5"/>
        <rect x="-9" y="-28" width="18" height="6" fill="#222"/>
        <rect x="-9" y="22" width="18" height="6" fill="#222"/>
      </g>
      <circle r="12" fill="none" stroke="#666" stroke-width="3"/>
    </g>
    <!-- Chain -->
    <path d="M355 363 L270 371 M355 387 L270 379" stroke="#555" stroke-width="2"/>

    <!-- Legs (orange webbed) animate with pedal -->
    <g stroke="#e58a2e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M325 270 L350 330 L355 351">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M325 270 L350 330 L355 351;M325 270 L370 335 L379 375;M325 270 L350 360 L355 399;M325 270 L335 330 L331 375;M325 270 L350 330 L355 351"/>
      </path>
    </g>
    <path d="M345 351 L365 351 L360 357 L350 357 Z" fill="#e58a2e">
      <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
        values="0 0;24 24;0 48;-24 24;0 0"/>
    </path>

    <!-- Tail -->
    <path d="M285 245 L240 255 L250 240 L238 232 L290 225 Z" fill="#555"/>
    <!-- Body -->
    <ellipse cx="335" cy="235" rx="62" ry="45" fill="url(#body)" stroke="#bdbdb5" stroke-width="1.5"/>
    <!-- Wing (gently flapping) -->
    <path d="M300 210 Q345 195 375 225 Q360 260 300 262 Q270 250 268 235 Z" fill="url(#wing)" stroke="#555" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 300 220;-6 300 220;0 300 220" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g stroke="#444" stroke-width="1" fill="none" opacity="0.6">
      <path d="M290 245 Q320 248 350 238"/><path d="M285 235 Q315 238 345 228"/>
    </g>
    <!-- Wing tip holding handlebar -->
    <path d="M365 228 Q410 245 440 270" stroke="#3b3b3b" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M370 215 Q395 175 380 140 Q372 120 388 108" stroke="#f5f3ee" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M370 215 Q395 175 380 140" stroke="#c9a46a" stroke-width="5" fill="none" opacity="0.5"/>
    <!-- Head -->
    <ellipse cx="395" cy="100" rx="24" ry="19" fill="#fff"/>
    <path d="M378 86 Q395 75 412 86 Q398 82 380 92 Z" fill="#f7e27a"/>
    <!-- Bill + pouch -->
    <path d="M410 95 L505 112 Q512 116 504 119 L412 108 Z" fill="#e9a347" stroke="#a8632a" stroke-width="1"/>
    <path d="M412 108 L504 119 Q470 160 425 140 Q410 128 412 108 Z" fill="url(#pouch)" stroke="#a8632a" stroke-width="1">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
        values="M412 108 L504 119 Q470 160 425 140 Q410 128 412 108 Z;M412 108 L504 119 Q470 168 423 145 Q408 130 412 108 Z;M412 108 L504 119 Q470 160 425 140 Q410 128 412 108 Z"/>
    </path>
    <path d="M500 113 Q512 118 506 124" stroke="#c0392b" stroke-width="3" fill="none"/>
    <!-- Eye -->
    <circle cx="402" cy="96" r="5.5" fill="#f4d9a0"/>
    <circle cx="403" cy="96" r="3" fill="#111">
      <animate attributeName="r" values="3;3;0.3;3" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="404" cy="95" r="1" fill="#fff"/>
    <!-- Scarf -->
    <path d="M370 200 Q385 210 398 198" stroke="#2a62c9" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M372 203 L340 196 L345 208 Z" fill="#2a62c9">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
        values="M372 203 L340 196 L345 208 Z;M372 203 L336 204 L344 214 Z;M372 203 L340 196 L345 208 Z"/>
    </path>
  </g>

  <!-- Speed lines -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="160" y1="230" x2="210" y2="230"><animate attributeName="x1" values="200;150;200" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="140" y1="300" x2="200" y2="300"><animate attributeName="x1" values="190;130;190" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="170" y1="360" x2="200" y2="360"/>
  </g>
</svg>
