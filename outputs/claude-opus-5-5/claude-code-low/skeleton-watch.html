/* ---------- renderer / scene ---------- */

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6, 9, 26);

controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 9; controls.maxDistance = 50;
controls.target.set(0,0.5,0);

/* lights: studio softbox style */
const key = new THREE.DirectionalLight(0xfff1dd, 2.6);
key.position.set(8,14,10); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.0004; key.shadow.normalBias=0.02;
Object.assign(key.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50});
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8ff, 1.4); rim.position.set(-12,6,-10); scene.add(rim);
const fill = new THREE.SpotLight(0xffe2b8, 60, 40, 0.5, 0.8); fill.position.set(-8,12,12); scene.add(fill);
const amb = new THREE.HemisphereLight(0x404050, 0x050505, 0.4); scene.add(amb);

/* reflective floor */
const floor = new THREE.Mesh(new THREE.CircleGeometry(60,96),
  new THREE.MeshPhysicalMaterial({color:0x0b0b0d,metalness:0.6,roughness:0.28,clearcoat:1,clearcoatRoughness:0.08}));
floor.rotation.x = -Math.PI/2; floor.position.y = -4.2; floor.receiveShadow = true; scene.add(floor);

/* ---------- materials ---------- */
const M = {
  roseGold: new THREE.MeshPhysicalMaterial({color:0xe8b49a,metalness:1,roughness:0.18,clearcoat:0.4}),
  roseBrushed: new THREE.MeshPhysicalMaterial({color:0xd9a48a,metalness:1,roughness:0.34}),
  steel: new THREE.MeshPhysicalMaterial({color:0xd8dbe0,metalness:1,roughness:0.16}),
  rhodium: new THREE.MeshPhysicalMaterial({color:0xc9ccd2,metalness:1,roughness:0.24,clearcoat:0.3}),
  anthracite: new THREE.MeshPhysicalMaterial({color:0x3a3c42,metalness:1,roughness:0.3}),
  gold: new THREE.MeshPhysicalMaterial({color:0xf2cf7c,metalness:1,roughness:0.2}),
  brass: new THREE.MeshPhysicalMaterial({color:0xe0b866,metalness:1,roughness:0.26}),
  blued: new THREE.MeshPhysicalMaterial({color:0x1f3fa8,metalness:0.9,roughness:0.18,clearcoat:1,iridescence:0.6}),
  ruby: new THREE.MeshPhysicalMaterial({color:0xd0103a,metalness:0,roughness:0.05,transmission:0.6,thickness:0.3,ior:1.76,clearcoat:1,emissive:0x300008}),
  lume: new THREE.MeshStandardMaterial({color:0xe8f5e0,emissive:0x7dffb0,emissiveIntensity:0.25,roughness:0.6}),
  crystal: new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:0,transmission:1,thickness:0.4,ior:1.77,
    transparent:true,opacity:1,clearcoat:1,clearcoatRoughness:0,specularIntensity:1,envMapIntensity:1.4,side:THREE.DoubleSide,depthWrite:false}),
  hairspring: new THREE.MeshPhysicalMaterial({color:0xd0d6e6,metalness:1,roughness:0.2}),
  mainspring: new THREE.MeshPhysicalMaterial({color:0x8090b0,metalness:1,roughness:0.22}),
};

/* ---------- helpers ---------- */
const watch = new THREE.Group(); scene.add(watch);
watch.rotation.x = -Math.PI/2 + 0.0; // dial faces up (+y)
const parts = [];           // pickable records
const explodeTargets = [];  // {obj, base, off}
const pickables = [];

function register(obj, info, layer){
  obj.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true; o.userData.part = info; pickables.push(o);} });
  if(info) parts.push({obj,info});
  explodeTargets.push({obj, base:obj.position.z, off:layer});
  return obj;
}
function shadowAll(o){o.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true;}});}

function circlePath(r,cx=0,cy=0,cw=false,seg=48){
  const p = new THREE.Path();
  for(let i=0;i<=seg;i++){const a=(cw?-1:1)*i/seg*Math.PI*2; const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i?p.lineTo(x,y):p.moveTo(x,y);}
  return p;
}
function extrude(shape, depth, bevel=0.02){
  const g = new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:bevel>0,bevelThickness:bevel,bevelSize:bevel,bevelSegments:2,curveSegments:24});
  g.translate(0,0,-depth/2); return g;
}

/* gear with true teeth and skeletonised spokes */
function gearGeometry(R, teeth, thick, spokes=5, hub=0.18, rimW=0.12){
  const s = new THREE.Shape(); const td = R*0.09 + 0.02;
  const N = teeth*4;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2; const ph=i%4; const r = (ph===1||ph===2)? R : R-td;
    const aa = a + (ph===1? 0.15: ph===2? -0.15:0)*(Math.PI*2/teeth)/2;
    const x=Math.cos(aa)*r,y=Math.sin(aa)*r; i?s.lineTo(x,y):s.moveTo(x,y);
  }
  const inner = R-td-rimW;
  if(spokes>0 && inner>hub+0.08){
    const sw = Math.min(0.09, inner*0.18);
    for(let k=0;k<spokes;k++){
      const a0=k/spokes*Math.PI*2, a1=(k+1)/spokes*Math.PI*2;
      const h=new THREE.Path(); const seg=20;
      const dHub = Math.asin(Math.min(0.9,sw/(hub+0.06))), dRim=Math.asin(Math.min(0.9,sw/inner));
      for(let i=0;i<=seg;i++){const a=a0+dRim+(a1-a0-2*dRim)*i/seg; const x=Math.cos(a)*inner,y=Math.sin(a)*inner; i?h.lineTo(x,y):h.moveTo(x,y);}
      for(let i=seg;i>=0;i--){const a=a0+dHub+(a1-a0-2*dHub)*i/seg; h.lineTo(Math.cos(a)*(hub+0.06),Math.sin(a)*(hub+0.06));}
      s.holes.push(h);
    }
  }
  s.holes.push(circlePath(0.05,0,0,true,16));
  return extrude(s, thick, 0.008);
}
function makeGear(R,teeth,thick,mat,spokes=5){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(gearGeometry(R,teeth,thick,spokes), mat));
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,thick*6,16), M.steel); pin.rotation.x=Math.PI/2; g.add(pin);
  if(R>0.4){ // pinion
    const pn = new THREE.Mesh(gearGeometry(Math.max(0.14,R*0.22),8,thick*1.4,0), M.steel); pn.position.z = -thick*1.4; g.add(pn);
  }
  return g;
}
function jewel(x,y,z,r=0.09){
  const g=new THREE.Group();
  const chaton=new THREE.Mesh(new THREE.CylinderGeometry(r*1.9,r*1.9,0.05,32),M.gold); chaton.rotation.x=Math.PI/2; g.add(chaton);
  const j=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.1,0.08,32),M.ruby); j.rotation.x=Math.PI/2; j.position.z=0.02; g.add(j);
  const hole=new THREE.Mesh(new THREE.CylinderGeometry(r*0.3,r*0.3,0.09,12),M.anthracite); hole.rotation.x=Math.PI/2; hole.position.z=0.03; g.add(hole);
  g.position.set(x,y,z); return g;
}
function screw(x,y,z,r=0.1){
  const g=new THREE.Group();
  const h=new THREE.Mesh(new THREE.SphereGeometry(r,24,12,0,Math.PI*2,0,Math.PI/2),M.blued); h.rotation.x=Math.PI/2; g.add(h);
  const slot=new THREE.Mesh(new THREE.BoxGeometry(r*2.1,r*0.25,r*0.6),new THREE.MeshStandardMaterial({color:0x05070f,roughness:.8})); slot.position.z=r*0.6; g.add(slot);
  g.position.set(x,y,z); g.rotation.z=Math.random()*Math.PI; return g;
}
/* bridge: thick stroke connecting points, with round pads */
function bridgeShape(points, width, padR){
  // union approximation: build convex outline path through pads using hull of capsule segments
  const pts=[];
  points.forEach(p=>{for(let i=0;i<24;i++){const a=i/24*Math.PI*2;pts.push(new THREE.Vector2(p[0]+Math.cos(a)*(p[2]||padR),p[1]+Math.sin(a)*(p[2]||padR)));}});
  for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1];
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L*width/2,ny=dx/L*width/2;
    for(let t=0;t<=1;t+=0.1){pts.push(new THREE.Vector2(a[0]+dx*t+nx,a[1]+dy*t+ny),new THREE.Vector2(a[0]+dx*t-nx,a[1]+dy*t-ny));}}
  return pts;
}
function capsuleBridge(points,width,padR,depth,mat,holes=[]){
  // build as merged meshes: pads + bars (visually unified, fast)
  const g=new THREE.Group();
  points.forEach(p=>{
    const s=new THREE.Shape(); s.absarc(0,0,p[2]||padR,0,Math.PI*2,false);
    const m=new THREE.Mesh(extrude(s,depth,0.03),mat); m.position.set(p[0],p[1],0); g.add(m);
  });
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
    const s=new THREE.Shape(); s.moveTo(0,-width/2); s.lineTo(L,-width/2); s.lineTo(L,width/2); s.lineTo(0,width/2);
    const m=new THREE.Mesh(extrude(s,depth*0.96,0.03),mat); m.position.set(a[0],a[1],0); m.rotation.z=Math.atan2(dy,dx); g.add(m);
  }
  return g;
}

/* ---------- CASE ---------- */
const R_CASE = 5.2;
const caseGroup = new THREE.Group();
{
  const prof=[ [4.55,-1.1],[5.0,-1.1],[5.25,-0.9],[5.38,-0.4],[5.4,0.2],[5.3,0.65],[5.05,0.85],[4.75,0.85] ].map(p=>new THREE.Vector2(p[0],p[1]));
  const mid=new THREE.Mesh(new THREE.LatheGeometry(prof,160),M.roseGold);
  mid.rotation.x=Math.PI/2; caseGroup.add(mid);
  // bezel

  const bezel=new THREE.Mesh(new THREE.LatheGeometry(bz,160),M.roseGold); bezel.rotation.x=Math.PI/2; caseGroup.add(bezel);

  [[-1.9,1],[1.9,1],[-1.9,-1],[1.9,-1]].forEach(([x,s])=>{

    // stitching

      [-1.5,1.5].forEach(xx=>{const dd=d.clone(); const yy=k*0.33; dd.position.set(xx,s*(6.6+yy),-0.03-Math.pow(yy/5,2)*1.6); caseGroup.add(dd);});}
  });
  // crown
  const crownG=new THREE.Group();
  const cr=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.7,36,1),M.roseGold);
  crownG.add(cr);
  for(let i=0;i<36;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.66,0.08),M.roseBrushed);const a=i/36*Math.PI*2;f.position.set(Math.cos(a)*0.62,0,Math.sin(a)*0.62);crownG.add(f);}
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.5,20),M.roseGold); stem.position.y=-0.5; crownG.add(stem);
  const cab=new THREE.Mesh(new THREE.SphereGeometry(0.3,24,12,0,Math.PI*2,0,Math.PI/3),M.blued); cab.position.y=0.2; crownG.add(cab);
  crownG.rotation.z=-Math.PI/2; crownG.position.set(5.85,0,0); caseGroup.add(crownG);
  caseGroup.userData.crown = crownG;
}
register(caseGroup,{zh:'18K 玫瑰金表壳',en:'CASE · 5N ROSE GOLD',d:'三件式表壳，镜面抛光与拉丝交替处理，表冠镶嵌蓝宝石凸圆面，防水 50 米。'},0);
watch.add(caseGroup);

/* case-back sapphire + crystal */
const crystal=new THREE.Mesh(new THREE.SphereGeometry(9,96,24,0,Math.PI*2,0,0.53),M.crystal);
crystal.rotation.x=Math.PI/2; crystal.position.z=1.25-9*Math.cos(0.53)+ -0.0; crystal.renderOrder=10;

watch.add(crystalG);

/* ---------- DIAL RING / CHAPTER RING ---------- */
const dialG=new THREE.Group();
{
  const s=new THREE.Shape(); s.absarc(0,0,4.62,0,Math.PI*2,false); s.holes.push(circlePath(3.9,0,0,true,128));
  const ring=new THREE.Mesh(extrude(s,0.08,0.01),new THREE.MeshPhysicalMaterial({color:0x1b1c20,metalness:.6,roughness:.35,clearcoat:1}));
  dialG.add(ring);
  const rehaut=new THREE.Mesh(new THREE.CylinderGeometry(4.62,4.62,0.35,128,1,true),M.rhodium); rehaut.rotation.x=Math.PI/2; rehaut.position.z=0.17; dialG.add(rehaut);
  for(let i=0;i<60;i++){
    const a=i/60*Math.PI*2, five=i%5===0;

      const lu=new THREE.Mesh(new THREE.BoxGeometry(0.11,(i%15===0?0.62:0.48)-0.1,0.06),M.lume); lu.position.z=0.03;
      ix.add(frame,lu); if(i%15===0){const f2=frame.clone(),l2=lu.clone();f2.position.x=0.28;l2.position.x=0.28;ix.add(f2,l2);ix.children.forEach(c=>c.position.x-=0.14);}

    } else {
      const t=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.16,0.02),M.rhodium);
      t.position.set(Math.sin(a)*4.48,Math.cos(a)*4.48,0.05); t.rotation.z=-a; dialG.add(t);
      const dot=new THREE.Mesh(new THREE.CircleGeometry(0.028,10),M.lume); dot.position.set(Math.sin(a)*4.3,Math.cos(a)*4.3,0.045); dialG.add(dot);
    }
  }
}
dialG.position.z=0.55;

/* ---------- HANDS ---------- */
function makeHand(len, w, tail, lumeLen){
  const g=new THREE.Group();
  const s=new THREE.Shape();
  s.moveTo(-w*0.35,-tail); s.lineTo(w*0.35,-tail); s.lineTo(w/2,0); s.lineTo(w/2*0.9,len*0.86); s.lineTo(0,len); s.lineTo(-w/2*0.9,len*0.86); s.lineTo(-w/2,0); s.closePath();
  const inner=new THREE.Path(); const iw=w*0.32; inner.moveTo(-iw,len*0.86-lumeLen); inner.lineTo(iw,len*0.86-lumeLen); inner.lineTo(iw*0.8,len*0.84); inner.lineTo(-iw*0.8,len*0.84); inner.closePath();
  s.holes.push(inner);
  g.add(new THREE.Mesh(extrude(s,0.05,0.01),M.roseGold));
  const ls=new THREE.Shape(inner.getPoints());
  const lm=new THREE.Mesh(extrude(ls,0.04,0),M.lume); lm.position.z=0.01; g.add(lm);
  const hubM=new THREE.Mesh(new THREE.CylinderGeometry(w*0.9,w*0.9,0.08,32),M.roseGold); hubM.rotation.x=Math.PI/2; g.add(hubM);
  return g;
}

function escapeGeometry(R){
  const s=new THREE.Shape(); const n=20;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, a2=(i+0.72)/n*Math.PI*2, a3=(i+0.82)/n*Math.PI*2;
    const p0=[Math.cos(a)*R*0.72,Math.sin(a)*R*0.72];
    const p1=[Math.cos(a2)*R,Math.sin(a2)*R], p2=[Math.cos(a3)*R*0.97,Math.sin(a3)*R*0.97];
    if(i===0) s.moveTo(...p0); else s.lineTo(...p0);
    s.lineTo(...p1); s.lineTo(...p2);
  }
  s.closePath();
  for(let k=0;k<4;k++){const h=new THREE.Path();const a0=k/4*Math.PI*2+0.18,a1=(k+1)/4*Math.PI*2-0.18;
    for(let i=0;i<=12;i++){const a=a0+(a1-a0)*i/12;i?h.lineTo(Math.cos(a)*R*0.6,Math.sin(a)*R*0.6):h.moveTo(Math.cos(a)*R*0.6,Math.sin(a)*R*0.6);}
    for(let i=12;i>=0;i--){const a=a0+0.15+(a1-a0-0.3)*i/12;h.lineTo(Math.cos(a)*R*0.2,Math.sin(a)*R*0.2);} s.holes.push(h);}
  return extrude(s,0.08,0.005);
}

/* ---------- interaction ---------- */
const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2(); const tip=document.getElementById('tip');
let hovered=null, locked=null;
const highlightMats=new Map();
function setHighlight(info,on){
  pickables.forEach(m=>{ if(m.userData.part===info){
    if(on){ if(!highlightMats.has(m)){highlightMats.set(m,m.material); const c=m.material.clone(); c.emissive=new THREE.Color(0xffc070); c.emissiveIntensity=0.35; m.material=c;} }
    else if(highlightMats.has(m)){ m.material.dispose(); m.material=highlightMats.get(m); highlightMats.delete(m);} }});
}
function showPart(info){
  document.getElementById('part').innerHTML=`<h3>${info.zh}</h3><div class="en">${info.en}</div><p>${info.d}</p>`;
}
function pick(e){
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables.filter(p=>p.visible && p.material!==M.crystal && p.userData.part),false);
  // skip crystal unless only crystal
  let h=hits.find(x=>x.object.userData.part.en!=='SAPPHIRE CRYSTAL')||hits[0];
  return h?h.object.userData.part:null;
}
renderer.domElement.addEventListener('pointermove',e=>{
  const info=pick(e);
  if(info!==hovered){ if(hovered&&hovered!==locked) setHighlight(hovered,false); hovered=info; if(info) setHighlight(info,true); }
  if(info){tip.style.opacity=1; tip.innerHTML=`${info.zh}<small>${info.en}</small>`; tip.style.left=e.clientX+16+'px'; tip.style.top=e.clientY+14+'px'; renderer.domElement.style.cursor='pointer'; if(!locked) showPart(info);}
  else {tip.style.opacity=0; renderer.domElement.style.cursor='grab';}
});
let downPos=null;
renderer.domElement.addEventListener('pointerdown',e=>downPos=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos||Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>4) return;
  const info=pick(e);
  if(locked&&locked!==info) setHighlight(locked,false);
  locked=info; if(info){setHighlight(info,true);showPart(info);}
});

$('bExplode').onclick=()=>{explodeTarget=explodeTarget?0:1;$('bExplode').classList.toggle('on',!!explodeTarget);$('bExplode').textContent=explodeTarget?'组装视图':'爆炸视图';};
$('bRotate').onclick=()=>{controls.autoRotate=!controls.autoRotate;$('bRotate').classList.toggle('on',controls.autoRotate);};
$('bCrystal').onclick=()=>{crystalG.visible=!crystalG.visible;$('bCrystal').classList.toggle('on',!crystalG.visible);$('bCrystal').textContent=crystalG.visible?'隐藏表镜':'显示表镜';};
let flipTarget=0,flip=0;
$('bBack').onclick=()=>{flipTarget=flipTarget?0:Math.PI;$('bBack').classList.toggle('on',!!flipTarget);};
let night=0,nightTarget=0;
$('bLight').onclick=()=>{nightTarget=nightTarget?0:1;$('bLight').classList.toggle('on',!!nightTarget);};

/* ---------- post ---------- */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.5,0.88); composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

/* ---------- animation ---------- */
const clock=new THREE.Clock(); const ampEl=$('amp');
const F=4; // Hz balance
let t0=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=(performance.now()-t0)/1000;

  explode+= (explodeTarget-explode)*Math.min(1,dt*3.2);
  const ee=explode<0.001?0:explode; applyExplode(ee*ee*(3-2*ee));
  flip+=(flipTarget-flip)*Math.min(1,dt*2.5);
  watch.rotation.y=flip;
  night+=(nightTarget-night)*Math.min(1,dt*2.5);
  key.intensity=2.6*(1-night*0.93); fill.intensity=60*(1-night*0.95); rim.intensity=1.4*(1-night*0.8);
  scene.environmentIntensity!==undefined && (scene.environmentIntensity=1-night*0.9);
  M.lume.emissiveIntensity=0.25+night*2.4; bloom.strength=0.35+night*0.9;

  // balance: harmonic oscillation 270° amplitude
  const amp=THREE.MathUtils.degToRad(270+Math.sin(t*0.3)*8);
  const ph=t*F*Math.PI; // F/2 full cycles: 4Hz = 8 beats/s => 4 oscillations
  balanceSpin.rotation.z=Math.sin(ph*2)*amp*0.5*1.0;
  hairspring.scale.setScalar(1+Math.sin(ph*2)*0.035); hairspring.rotation.z=-balanceSpin.rotation.z*0.15;
  ampEl.textContent=Math.round(THREE.MathUtils.radToDeg(amp))+'°';
  // beats: 8 per second -> escape wheel steps
  const beats=t*8; const b=Math.floor(beats), f=beats-b;
  const step=b+Math.min(1,f*6)*(1-Math.pow(1-Math.min(1,f*6),3)); // quick snap
  escapeW.rotation.z=-step*(Math.PI*2/40);
  palletG.rotation.z=palletBaseRot+((b%2)? 1:-1)*0.13*(1-Math.pow(1-Math.min(1,f*6),3))*1 + ((b%2)?-0.13:0.13)*0 ;
  const pal=((b%2)?1:-1)*0.13; palletG.rotation.z=palletBaseRot+ pal;
  // gear train ratios (escape 1 rev = 5s visual)
  const er=escapeW.rotation.z;
  fourthW.rotation.z=-er/7.5; thirdW.rotation.z=er/7.5*0.9/0.95*1.3; centerW.rotation.z=-er/60;
  barrelG.rotation.z=er/400; ratchet.rotation.z=-er/400*1.5; crownWheel.rotation.z=er/400*3;

  // hands: real time, seconds stepping at 8/s
  const now=new Date(); const s=now.getSeconds()+Math.floor(now.getMilliseconds()/125)/8;
  const m=now.getMinutes()+s/60, h=(now.getHours()%12)+m/60;
  secHand.rotation.z=-s/60*Math.PI*2; minHand.rotation.z=-m/60*Math.PI*2; hourHand.rotation.z=-h/12*Math.PI*2;

  controls.update();
  composer.render();
}
document.getElementById('loading').style.opacity=0; setTimeout(()=>document.getElementById('loading').remove(),1000);
animate();
</script>
</body>
</html>
