<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水运仪象台 · 一部 30 秒的物理科普短片</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="fade"></div>
      <div id="labels"></div>
      <div id="chain"></div>
      <div id="title">
        <div class="big">水运仪象台</div>
        <div class="small">北宋 · 苏颂、韩公廉 · 1088—1092 年 · 汴京</div>
        <div class="tag">一座以水为动力、自动报时的天文钟楼</div>
      </div>
      <div id="caption">
        <div class="row"><span class="step"></span><span class="head"></span></div>
        <div class="body"></div>
      </div>
      <div id="recap">
        <div class="flow">
          <span>水流恒定</span><i>→</i><span>壶满变重</span><i>→</i><span>格叉称重</span><i>→</i><span>天关放行一格</span><i>→</i><span>齿轮传动</span><i>→</i><span>木人报时</span>
        </div>
        <div class="note">以水的重量"计量"时间——这套擒纵机构比欧洲最早的机械钟早约两百年。</div>
      </div>
      <div id="corner">机械运动由物理引擎实时计算 · 片中时间已加速</div>
      <div id="start" class="screen">
        <div class="panel">
          <div class="seal">苏颂</div>
          <h1>水运仪象台</h1>
          <p>它如何靠水驱动，又如何按时报时？</p>
          <button id="play" type="button">▶ 播放短片（约 30 秒，请开启声音）</button>
          <p class="hint">纯浏览器运行 · 物理引擎实时演算 · 声音全部程序合成</p>
        </div>
      </div>
      <div id="end" class="screen hidden">
        <div class="panel">
          <h2>水 → 重量 → 擒纵 → 齿轮 → 报时</h2>
          <p>机器仍在运转：可以拖动鼠标自由观察，滚轮缩放。</p>
          <div class="btns">
            <button id="replay" type="button">↻ 重播</button>
            <button id="explore" type="button">⌖ 自由观察</button>
          </div>
        </div>
      </div>
      <button id="backBtn" class="hidden" type="button">↻ 重播短片</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
