<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>陨石子弹 · Meteor Bullets</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage canvas {
        display: block;
      }
      /* Cinematic letterbox + overlay cards */
      .film-letterbox {
        position: absolute;
        left: 0;
        right: 0;
        height: 7vh;
        background: #000;
        z-index: 15;
        pointer-events: none;
      }
      .film-letterbox.top { top: 0; }
      .film-letterbox.bottom { bottom: 0; }
      #film-cards {
        position: absolute;
        inset: 0;
        z-index: 18;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .film-card {
        color: #d8cdb4;
        text-align: center;
        opacity: 0;
        transition: opacity 0.1s linear;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.9);
      }
      .film-card .zh {
        font-size: clamp(34px, 5.2vw, 72px);
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        font-weight: 700;
      }
      .film-card .en {
        margin-top: 1.1em;
        font-size: clamp(12px, 1.3vw, 17px);
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        color: #8f8875;
      }
      .film-card .sub {
        margin-top: 2.2em;
        font-size: clamp(12px, 1.4vw, 18px);
        letter-spacing: 0.2em;
        color: #a99f86;
      }
      .film-card.caption {
        position: absolute;
        left: 7%;
        bottom: 15%;
        text-align: left;
      }
      .film-card.caption .sub {
        margin-top: 0;
        font-size: clamp(13px, 1.5vw, 19px);
        color: #cfc5ab;
        border-left: 3px solid #a99f86;
        padding-left: 0.7em;
      }
      .ab-cinematic-subtitle { bottom: 96px !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="film-letterbox top"></div>
    <div class="film-letterbox bottom"></div>
    <div id="film-cards"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
