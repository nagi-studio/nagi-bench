<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Calibre NSG-01 · 镂空机械表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@200;300;400;500&family=Noto+Serif+SC:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d8b173;
    --gold-dim:#a8874f;
    --ink:#07080b;
    --text:#e9e6df;
    --muted:#8d909a;
    --line:rgba(255,255,255,.09);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:#040507;
    color:var(--text);
    font-family:"Inter","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
    user-select:none;
    cursor:grab;
  }
  body.dragging{ cursor:grabbing; }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; }

  /* ---------- photographic overlays ---------- */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(ellipse 62% 55% at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 72%, rgba(0,0,0,.72) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 74%, rgba(0,0,0,.45));
  }
  #grain{
    position:fixed; inset:-50%; pointer-events:none; z-index:6; opacity:.035;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 1.2s steps(4) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(0,0)}
  }

  /* ---------- header ---------- */
  header{
    position:fixed; top:30px; left:36px; z-index:10; pointer-events:none;
  }
  .brand{
    font-size:10px; letter-spacing:.55em; text-transform:uppercase;
    color:var(--gold); opacity:.92; margin-bottom:12px;
    display:flex; align-items:center; gap:10px;
  }
  .brand::before{ content:""; width:26px; height:1px; background:var(--gold); opacity:.6; }
  h1{
    margin:0; font-family:"Cormorant Garamond","Noto Serif SC",serif;
    font-weight:300; font-size:clamp(22px,2.6vw,34px); letter-spacing:.14em;
    color:#f2efe8; text-shadow:0 4px 30px rgba(0,0,0,.8);
  }
  h1 em{ font-style:normal; color:var(--gold); }
  .sub{
    margin-top:9px; font-size:10.5px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- info panel ---------- */
  #panel{
    position:fixed; right:30px; top:50%; transform:translateY(-50%);
    width:296px; z-index:10; padding:22px 22px 20px;
    border-radius:18px;
    background:linear-gradient(160deg, rgba(22,24,30,.62), rgba(10,11,15,.72));
    backdrop-filter:blur(20px) saturate(1.25);
    -webkit-backdrop-filter:blur(20px) saturate(1.25);
    border:1px solid var(--line);
    box-shadow:0 30px 70px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
    transition:opacity .5s, transform .5s;
  }
  .p-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .p-head h2{
    margin:0; font-family:"Cormorant Garamond",serif; font-weight:400;
    font-size:19px; letter-spacing:.12em; color:#f4f1ea;
  }
  .p-head .cal{ font-size:9.5px; letter-spacing:.2em; color:var(--gold); }
  .p-sub{ font-size:10px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }
  .rule{ height:1px; background:linear-gradient(90deg,var(--gold),rgba(216,177,115,.05)); margin:16px 0 14px; opacity:.5; }

  .spec{ display:grid; grid-template-columns:1fr auto; gap:7px 10px; font-size:11.5px; }
  .spec dt{ color:var(--muted); letter-spacing:.08em; font-weight:300; }
  .spec dd{ margin:0; text-align:right; color:#e6e2d8; font-variant-numeric:tabular-nums; letter-spacing:.04em; }
  .spec dd b{ color:var(--gold); font-weight:500; }

  .live{ margin-top:16px; padding-top:14px; border-top:1px dashed rgba(255,255,255,.09); }
  .live-row{ display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-bottom:9px; }
  .live-row span{ color:var(--muted); letter-spacing:.08em; }
  .live-row strong{ font-weight:400; letter-spacing:.14em; color:#f3efe6; font-variant-numeric:tabular-nums; }
  .beat{
    width:7px; height:7px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 10px var(--gold); display:inline-block; margin-left:7px; vertical-align:middle;
  }
  .bar{ height:4px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:2px; }
  .bar i{
    display:block; height:100%; width:100%; border-radius:3px;
    background:linear-gradient(90deg,#8c6a34,var(--gold) 60%,#ffe6b8);
    box-shadow:0 0 12px rgba(216,177,115,.6);
    transition:width .4s linear;
  }

  /* ---------- toolbar ---------- */
  #toolbar{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex; gap:9px; flex-wrap:wrap; justify-content:center;
    padding:8px; border-radius:999px;
    background:rgba(12,13,18,.55);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);
    box-shadow:0 18px 50px -12px rgba(0,0,0,.8);
  }
  .btn{
    appearance:none; border:1px solid transparent; background:transparent;
    color:#cfcdc6; font-family:inherit; font-size:11px; letter-spacing:.14em;
    padding:10px 17px; border-radius:999px; cursor:pointer;
    transition:all .28s cubic-bezier(.4,0,.2,1); white-space:nowrap;
  }
  .btn:hover{ color:#fff; background:rgba(255,255,255,.06); }
  .btn.on{
    color:#1a1206; background:linear-gradient(180deg,#f0d09a,var(--gold));
    box-shadow:0 0 22px rgba(216,177,115,.45); font-weight:500;
  }
  .btn.on:hover{ background:linear-gradient(180deg,#ffe2b4,#e6bd7d); }
  .btn:disabled{ opacity:.45; cursor:default; }

  #hint{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
    z-index:10; font-size:10px; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(200,198,192,.55); pointer-events:none; white-space:nowrap;
    transition:opacity .8s;
  }

  /* ---------- labels ---------- */
  #labels{ position:fixed; inset:0; z-index:8; pointer-events:none; }
  #leaders{ position:fixed; inset:0; z-index:7; pointer-events:none; overflow:visible; }
  .lbl{ position:absolute; width:0; height:0; }
  .lbl .dot{
    position:absolute; left:-3.5px; top:-3.5px; width:7px; height:7px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 0 3px rgba(216,177,115,.18), 0 0 12px rgba(216,177,115,.9);
    animation:pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  .lbl .card{
    position:absolute; transform:translate(-50%,-50%);
    min-width:96px; max-width:190px; padding:8px 11px 9px;
    border-radius:10px; border:1px solid rgba(216,177,115,.35);
    border-left:2px solid var(--gold);
    background:linear-gradient(160deg, rgba(24,25,31,.92), rgba(12,13,17,.94));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 14px 34px -10px rgba(0,0,0,.9);
    animation:pop .4s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{ from{ opacity:0; transform:translate(-50%,-50%) scale(.86);} to{opacity:1; transform:translate(-50%,-50%) scale(1);} }
  .lbl b{ display:block; font-size:11.5px; font-weight:500; letter-spacing:.1em; color:#f6f1e6; }
  .lbl em{ display:block; font-style:normal; font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-top:3px; }
  .lbl i{ display:block; font-style:normal; font-size:9.5px; line-height:1.5; color:var(--muted); margin-top:5px; }

  /* ---------- loader ---------- */
  #loader{
    position:fixed; inset:0; z-index:40; background:#040507;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    transition:opacity 1s ease .2s, visibility 1s;
  }
  #loader.gone{ opacity:0; visibility:hidden; }
  .ring{ width:52px; height:52px; position:relative; }
  .ring::before,.ring::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:1px solid transparent; border-top-color:var(--gold);
    animation:spin 1.15s cubic-bezier(.5,.15,.5,.85) infinite;
  }
  .ring::after{ inset:9px; border-top-color:rgba(216,177,115,.35); animation-duration:1.7s; animation-direction:reverse; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #loader p{
    margin:0; font-size:10px; letter-spacing:.45em; text-transform:uppercase;
    color:var(--muted);
  }
  #loader .lg{ font-family:"Cormorant Garamond",serif; font-size:15px; letter-spacing:.3em; color:var(--gold); margin-bottom:-8px; }

  @media (max-width:820px){
    #panel{ display:none; }
    header{ top:20px; left:20px; }
    #toolbar{ bottom:18px; gap:6px; padding:6px; }
    .btn{ padding:9px 12px; font-size:10px; letter-spacing:.08em; }
    #hint{ display:none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<svg id="leaders" xmlns="http://www.w3.org/2000/svg"></svg>

<header>
  <div class="brand">Maison Nagi</div>
  <h1>镂空 <em>·</em> 机械之心</h1>
  <div class="sub">Calibre NSG-01 &nbsp;/&nbsp; Skeleton Tourbillon&nbsp;Free</div>
</header>

<aside id="panel">
  <div class="p-head">
    <h2>Calibre NSG-01</h2>
    <span class="cal">手动上链</span>
  </div>
  <div class="p-sub">机芯规格 / Movement</div>
  <div class="rule"></div>

  <dl class="spec">
    <dt>类型</dt><dd>镂空 · 手动</dd>
    <dt>振频</dt><dd><b>28,800</b> vph</dd>

</div>

<div id="loader">
  <div class="lg">CALIBRE NSG-01</div>
  <div class="ring"></div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =======================================================================
   0.  CONSTANTS & TINY HELPERS
   ======================================================================= */
const TAU = Math.PI * 2;
const $  = (s) => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const easeInOut = (t) => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

// watch is built with the dial facing +Y; shape-space (x, y) maps to world (x, z) as y = -z
const S = (x,z) => [x, -z];

// Key movement layout, world (x, z)
const POS = {
  center : [ 0.00,  0.00],
  barrel : [-0.86,  0.32],
  third  : [ 0.62, -0.28],
  fourth : [ 0.672, 0.237],
  escape : [ 0.457, 0.611],
  pallet : [ 0.202, 0.770],
  balance: [ 0.00,  1.10]
};
const R = { barrel:0.52, center:0.40, third:0.28, fourth:0.24, escape:0.19, balance:0.30 };

const Y = {                 // vertical stack
  plate:   0.22,
  gear:    0.335,
  barrelDrum: 0.31,
  bridge:  0.44,
  cock:    0.60,
  balance: 0.50,
  chapter: 0.58,
  hourHand:0.70,
  minHand: 0.755,
  cap:     0.80,
  crystal: 0.90
};

/* =======================================================================
   1.  RENDERER / SCENE / CAMERA
   ======================================================================= */
const app = $('#app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(33, window.innerWidth/window.innerHeight, 0.1, 200);
const CAM_HOME = new THREE.Vector3(3.45, 6.55, 5.15);
camera.position.copy(CAM_HOME).multiplyScalar(2.35);
camera.position.y += 2.0;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.42, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.72;
controls.enablePan = false;
controls.minDistance = 4.6;
controls.maxDistance = 17;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = 1.46;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

/* =======================================================================
   2.  STUDIO ENVIRONMENT  (procedural HDR light-boxes)
   ======================================================================= */
function buildEnvironment(){
  const envScene = new THREE.Scene();
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(60, 24, 16),
    new THREE.MeshBasicMaterial({ color:0x05060a, side:THREE.BackSide })
  );
  envScene.add(shell);

  const panel = (w,h,pos,rot,hex,intensity) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({
        color:new THREE.Color(hex).multiplyScalar(intensity),
        side:THREE.DoubleSide
      })
    );
    m.position.set(pos[0],pos[1],pos[2]);
    m.rotation.set(rot[0],rot[1],rot[2]);
    envScene.add(m);
  };

  panel(16, 11, [-10, 15,  6], [-Math.PI/2.5, 0,  Math.PI/9],  0xffffff, 2.35); // key softbox
  panel(13,  9, [ 14,  6,  2], [0, -Math.PI/2.2, 0],          0xbcd4ff, 0.62); // cool fill
  panel(11,  7, [ -3,  7,-15], [0,  0, 0],                    0xfff0dd, 1.05); // warm rim
  panel(26, 26, [  0,-10,  0], [Math.PI/2, 0, 0],             0x1c2836, 0.18); // floor bounce
  panel( 8, 14, [ 13,  4, -9], [0, -Math.PI/2.4, 0],          0xffe0b8, 0.55); // kicker
  panel(42, 42, [  0, 26,  0], [ Math.PI/2, 0, 0],             0xffffff, 0.24); // broad top fill
  panel(22, 14, [  0,  9, 20], [ 0, Math.PI, 0],               0xdfe8ff, 0.20); // front fill

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt = pmrem.fromScene(envScene, 0.028);
  const tex = rt.texture;
  pmrem.dispose();
  envScene.traverse(o => { if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  return tex;
}
const envMap = buildEnvironment();
scene.environment = envMap;

/* =======================================================================
   3.  MATERIALS
   ======================================================================= */
const M = {
  steel: new THREE.MeshPhysicalMaterial({
    color:0xd9dde4, metalness:1, roughness:0.085, envMapIntensity:0.92,
    clearcoat:0.25, clearcoatRoughness:0.18, side:THREE.DoubleSide
  }),
  steelBrush: new THREE.MeshPhysicalMaterial({
    color:0x6f7681, metalness:0.9, roughness:0.44, envMapIntensity:0.62,
    anisotropy:0.85, anisotropyRotation:Math.PI/2, side:THREE.DoubleSide
  }),
  rhodium: new THREE.MeshPhysicalMaterial({
    color:0xe4e8ef, metalness:0.92, roughness:0.26, envMapIntensity:1.0,
    side:THREE.DoubleSide
  }),
  darkSteel: new THREE.MeshPhysicalMaterial({
    color:0x5b626d, metalness:1, roughness:0.3, envMapIntensity:0.68,
    side:THREE.DoubleSide
  }),
  gold: new THREE.MeshPhysicalMaterial({
    color:0xd9a45c, metalness:0.95, roughness:0.18, envMapIntensity:1.0,
    clearcoat:0.35, clearcoatRoughness:0.15, side:THREE.DoubleSide
  }),
  rose: new THREE.MeshPhysicalMaterial({
    color:0xe2a985, metalness:0.95, roughness:0.16, envMapIntensity:1.08,
    clearcoat:0.3, side:THREE.DoubleSide
  }),
  blued: new THREE.MeshPhysicalMaterial({
    color:0x1a3a78, metalness:1, roughness:0.2, envMapIntensity:0.98,
    clearcoat:0.7, clearcoatRoughness:0.12, side:THREE.DoubleSide
  }),
  black: new THREE.MeshPhysicalMaterial({
    color:0x0e1014, metalness:0.85, roughness:0.22, envMapIntensity:0.72,
    clearcoat:1, clearcoatRoughness:0.08, side:THREE.DoubleSide
  }),
  ruby: new THREE.MeshPhysicalMaterial({
    color:0xa90f2c, metalness:0, roughness:0.05, envMapIntensity:1.25,
    clearcoat:1, clearcoatRoughness:0.03,
    emissive:0x3d0410, emissiveIntensity:0.55, side:THREE.DoubleSide
  }),
  sapphire: new THREE.MeshPhysicalMaterial({
    color:0xffffff, metalness:0, roughness:0.015,
    transmission:1, thickness:0.42, ior:1.77,
    envMapIntensity:0.68,
    transparent:true, opacity:1, side:THREE.DoubleSide,
    attenuationColor:new THREE.Color(0xdfeaff), attenuationDistance:6
  }),
  lume: new THREE.MeshStandardMaterial({
    color:0xbdf4ff, emissive:0x6fe4ff, emissiveIntensity:1.7,
    roughness:0.55, metalness:0, side:THREE.DoubleSide
  }),
  lumeGold: new THREE.MeshStandardMaterial({
    color:0xcfe9f0, emissive:0x63d8f5, emissiveIntensity:1.5,
    roughness:0.5, metalness:0, side:THREE.DoubleSide
  })
};
/* ---- haute-horlogerie finishing maps (procedural, no external assets) ---- */
function finishingTexture(kind){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  if(kind === 'cotes'){
    x.fillStyle = '#666'; x.fillRect(0,0,512,512);
    const band = 512/12;
    for(let i=0;i<512;i+=band){
      const g = x.createLinearGradient(0,i,0,i+band);
      g.addColorStop(0,'#242424'); g.addColorStop(0.45,'#a8a8a8');
      g.addColorStop(0.55,'#8a8a8a'); g.addColorStop(1,'#242424');
      x.fillStyle = g; x.fillRect(0,i,512,band+1);
    }
  } else { // perlage
    x.fillStyle = '#5c5c5c'; x.fillRect(0,0,512,512);
    const r = 44, step = r*1.32;
    for(let yy=-r; yy<512+r; yy+=step){
      const row = Math.round((yy+r)/step);
      for(let xx=-r; xx<512+r; xx+=step){
        const off = (row%2) ? step*0.5 : 0;
        const g = x.createRadialGradient(xx+off,yy,0, xx+off,yy,r);
        g.addColorStop(0,'#b4b4b4'); g.addColorStop(0.62,'#7d7d7d');
        g.addColorStop(1,'#3d3d3d');
        x.fillStyle = g; x.beginPath(); x.arc(xx+off,yy,r,0,7); x.fill();
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(kind === 'cotes' ? 1.0 : 1.8, kind === 'cotes' ? 1.0 : 1.8);
  t.colorSpace = THREE.NoColorSpace;
  t.anisotropy = 4;
  return t;
}
M.plate = new THREE.MeshPhysicalMaterial({
  color:0x9aa1ab, metalness:0.92, roughness:0.95,
  roughnessMap:finishingTexture('perlage'), envMapIntensity:0.72,

function radialTexture(size, stops){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  for(const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

   6.  GEOMETRY FACTORIES
   ======================================================================= */
function smoothShape(pts, samples=10){
  const v = pts.map(p => new THREE.Vector3(p[0], p[1], 0));
  const curve = new THREE.CatmullRomCurve3(v, true, 'catmullrom', 0.5);
  const n = v.length * samples;
  const s = new THREE.Shape();
  for(let i=0;i<=n;i++){
    const q = curve.getPoint(i/n);
    if(i===0) s.moveTo(q.x,q.y); else s.lineTo(q.x,q.y);
  }
  s.closePath();
  return s;
}
function circleHole(shape, x, y, r){
  const h = new THREE.Path();
  h.absarc(x, y, r, 0, TAU, true);
  shape.holes.push(h);
  return shape;
}
function extrudeY(shape, depth, mat, bevel=0.008){
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled:bevel>0, bevelThickness:bevel, bevelSize:bevel,
    bevelSegments:2, curveSegments:26, steps:1
  });
  geo.rotateX(-Math.PI/2);
  geo.computeVertexNormals();
  return mesh(geo, mat);
}
function discShape(radius){
  const s = new THREE.Shape();
  s.absarc(0,0,radius,0,TAU,false);
  return s;
}

/* -- gear shape: trapezoidal teeth + optional spoke holes --------------- */
function gearShape({ teeth, radius, toothDepth=0.055, hole=0.05, spokes=0, spokeR=0.06, spokeDist=0.55, style='normal' }){
  const rTip  = radius + toothDepth*0.5;
  const rRoot = radius - toothDepth*0.5;
  const s = new THREE.Shape();
  const seg = 8;
  const total = teeth * seg;
  for(let i=0;i<total;i++){
    const a = i/total * TAU;
    const p = (i % seg)/seg;
    let r;
    if(style === 'escape'){
      // saw-tooth / club-tooth escapement profile
      r = p < 0.72 ? rRoot + (rTip-rRoot)*Math.pow(p/0.72, 1.5) : rTip - (rTip-rRoot)*((p-0.72)/0.28);
    } else {
      if(p < 0.26) r = rRoot;
      else if(p < 0.40) r = rRoot + (rTip-rRoot)*((p-0.26)/0.14);
      else if(p < 0.62) r = rTip;
      else if(p < 0.76) r = rTip - (rTip-rRoot)*((p-0.62)/0.14);
      else r = rRoot;
    }
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    if(i===0) s.moveTo(x,y); else s.lineTo(x,y);
  }
  s.closePath();
  if(hole > 0) circleHole(s, 0, 0, hole);
  for(let k=0;k<spokes;k++){
    const a = k/spokes * TAU + Math.PI/spokes;
    circleHole(s, Math.cos(a)*radius*spokeDist, Math.sin(a)*radius*spokeDist, spokeR);
  }
  return s;
}
function makeGear(opts){
  const g = extrudeY(gearShape(opts), opts.thickness ?? 0.05, opts.material ?? M.gold);
  return g;
}

/* -- hands --------------------------------------------------------------- */
function handShape(len, w, tail=0.16, window=true){
  const s = new THREE.Shape();
  s.moveTo(-w, -tail);
  s.lineTo( w, -tail);
  s.quadraticCurveTo( w*1.18, len*0.42,  w*0.72, len*0.74);
  s.quadraticCurveTo( w*0.42, len*0.94, 0, len);
  s.quadraticCurveTo(-w*0.42, len*0.94, -w*0.72, len*0.74);
  s.quadraticCurveTo(-w*1.18, len*0.42, -w, -tail);
  s.closePath();
  if(window){
    const h = new THREE.Path();
    const ww = w*0.52, l0 = tail*0.35, l1 = len*0.70;
    h.moveTo(-ww, l0);
    h.lineTo( ww, l0);
    h.quadraticCurveTo( ww*1.1, l1*0.55, ww*0.55, l1);
    h.quadraticCurveTo(0, l1*1.10, -ww*0.55, l1);
    h.quadraticCurveTo(-ww*1.1, l1*0.55, -ww, l0);
    h.closePath();
    s.holes.push(h);
  }
  return s;
}
function lumeShape(len, w, tail=0.16){
  const ww = w*0.5, l0 = tail*0.35, l1 = len*0.68;
  const s = new THREE.Shape();
  s.moveTo(-ww, l0);
  s.lineTo( ww, l0);
  s.quadraticCurveTo( ww*1.06, l1*0.55, ww*0.5, l1);
  s.quadraticCurveTo(0, l1*1.06, -ww*0.5, l1);
  s.quadraticCurveTo(-ww*1.06, l1*0.55, -ww, l0);
  s.closePath();
  return s;
}
function makeHand(len, w, mat){
  const g = new THREE.Group();
  const frame = extrudeY(handShape(len,w), 0.014, mat, 0.003);
  frame.position.y = 0.014;
  const lume = extrudeY(lumeShape(len,w), 0.012, M.lume, 0.002);
  lume.position.y = 0.004;
  const boss = mesh(new THREE.CylinderGeometry(w*1.5, w*1.6, 0.03, 24), mat);
  boss.position.y = 0.012;
  g.add(frame, lume, boss);
  return g;
}

/* -- spiral curve for springs ------------------------------------------- */
class SpiralCurve extends THREE.Curve {
  constructor(r0, r1, turns, y=0, dir=1){
    super();
    this.r0=r0; this.r1=r1; this.turns=turns; this.y=y; this.dir=dir;
  }
  getPoint(t, target = new THREE.Vector3()){
    const a = this.dir * t * TAU * this.turns;
    const r = this.r0 + (this.r1 - this.r0) * t;
    return target.set(Math.cos(a)*r, this.y, Math.sin(a)*r);
  }
}

}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10,-10);
let hovered = null, pinned = null;
const labelLayer = $('#labels');
const leaderSvg = $('#leaders');
const labels = new Map();

function ensureLabel(part){
  if(labels.has(part)) return labels.get(part);
  const el = document.createElement('div');
  el.className = 'lbl';
  el.innerHTML = `<span class="dot"></span>
    <div class="card"><b>${part.cn}</b><em>${part.en}</em><i>${part.desc||''}</i></div>`;
  labelLayer.appendChild(el);
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('stroke','rgba(216,177,115,.45)');
  line.setAttribute('stroke-width','1');
  leaderSvg.appendChild(line);
  const rec = { el, card:el.querySelector('.card'), line, off:[0,0] };
  labels.set(part, rec);
  return rec;
}

function highlight(part, on){
  part.hovered = on;
  part.object.traverse(o => {
    if(!o.isMesh) return;
    if(on){
      if(!o.userData._origEm){
        o.userData._origEm = o.material.emissive ? o.material.emissive.clone() : null;
        o.userData._origEmI = o.material.emissiveIntensity ?? 1;
      }
      if(o.material.emissive){
        o.material.emissive.setHex(0xffc76a);
        o.material.emissiveIntensity = 1.55;
      }
    } else if(o.userData._origEm){
      o.material.emissive.copy(o.userData._origEm);
      o.material.emissiveIntensity = o.userData._origEmI;
    }
  });
}

function pickAt(clientX, clientY){
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(PICKABLE, false);
  for(const h of hits){
    const p = h.object._part;
    if(!p) continue;
    // the sapphire crystal covers the whole dial: look straight through it
    // and select the movement part sitting just behind the glass
    if(p.id === 'crystal'){
      let behind = null;
      for(const h2 of hits){
        const p2 = h2.object._part;
        if(p2 && p2.id !== 'crystal' && h2.distance - h.distance < 1.5){
          if(!behind || h2.distance < behind.distance) behind = h2;
        }
      }
      return behind ? behind.object._part : p;
    }
    return p;
  }
  return null;
}

let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => {
  downPos = { x:e.clientX, y:e.clientY };
  document.body.classList.add('dragging');
});
renderer.domElement.addEventListener('pointerup', e => {
  document.body.classList.remove('dragging');
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos = null;
  if(moved > 6) return;
  const p = pickAt(e.clientX, e.clientY);
  if(pinned === p){
    pinned = null;
    if(hovered !== p) highlight(p, false);
  } else if(p){
    if(pinned && pinned !== hovered) highlight(pinned, false);
    pinned = p;
    highlight(p, true);
  } else {
    if(pinned && pinned !== hovered) highlight(pinned, false);
    pinned = null;
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  document.body.classList.remove('dragging');
});

const _v = new THREE.Vector3();
function updateLabels(){
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const anyExplode = explodeK > 0.06;
  for(const p of PARTS){
    const show = p.hovered || p.pinned || (anyExplode && p.major && explodeK > 0.35);
    if(!show){
      const rec = labels.get(p);
      if(rec){ rec.el.style.display = 'none'; rec.line.style.display = 'none'; }
      continue;
    }
    const rec = ensureLabel(p);
    p.object.getWorldPosition(_v);
    _v.add(p.labelOffset);
    _v.project(camera);
    if(_v.z > 1){ rec.el.style.display='none'; rec.line.style.display='none'; continue; }
    const sx = (_v.x*0.5+0.5)*window.innerWidth;
    const sy = (-_v.y*0.5+0.5)*window.innerHeight;

    let dx = sx - cx, dy = sy - cy;
    const dl = Math.hypot(dx,dy) || 1;
    dx /= dl; dy /= dl;
    const reach = 92 + Math.min(46, dl*0.05);
    const lx = dx*reach, ly = dy*reach;

    rec.el.style.display = 'block';
    rec.el.style.left = sx + 'px';
    rec.el.style.top  = sy + 'px';
    rec.card.style.left = lx + 'px';
    rec.card.style.top  = ly + 'px';
    rec.line.style.display = 'block';
    rec.line.setAttribute('x1', sx); rec.line.setAttribute('y1', sy);
    rec.line.setAttribute('x2', sx+lx); rec.line.setAttribute('y2', sy+ly);
  }
}

renderer.domElement.addEventListener('pointermove', e => {
  const p = pickAt(e.clientX, e.clientY);
  if(p !== hovered){
    if(hovered && hovered !== pinned) highlight(hovered, false);
    hovered = p;
    if(hovered) highlight(hovered, true);
    renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
  }
});

function applyLume(){
  const boost = lumeOn ? 1 : 0;
  for(const m of LUME_MATS){
    const base = m.userData.base ?? 1.5;
    m.emissiveIntensity = base * boost + lumeCharge * base * 1.9;
  }
  if(mirrorRoot) mirrorRoot.traverse(o => {
    if(o.isMesh && o.userData.isLume && o.material.emissive){
      const base = o.material.userData.base ?? 1.5;
      o.material.emissiveIntensity = base * boost + lumeCharge * base * 1.9;
    }
  });
}

const clock = new THREE.Clock();
let T = 0;
let mirrorAccum = 0;
const balanceFreq = 2.0;         // visual oscillation frequency
const balanceAmp  = 2.35;        // radians

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;

  /* ---- camera intro ---- */
  if(camAnim){
    camAnim.t = Math.min(1, camAnim.t + dt/2.6);
    const e = easeInOut(camAnim.t);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    if(camAnim.t >= 1) camAnim = null;
  }

  /* ---- explode easing ---- */
  explodeK += (explodeTarget - explodeK) * Math.min(1, dt*4.2);
  if(Math.abs(explodeTarget - explodeK) < 0.0015) explodeK = explodeTarget;
  for(const p of PARTS){
    p.object.position.copy(p.base).addScaledVector(p.explode, explodeK);
  }

  /* ---- gear train ---- */
  for(const g of ANIM.gears){
    if(g.mesh) g.mesh.rotation.y += g.speed * dt;
  }
  // subtle continuous motion on the escape wheel (stepped beats)
  if(ANIM.escape){
    const beat = Math.floor(T * 8) / 8;
    ANIM.escape.rotation.y = -beat * 0.9;
  }

  /* ---- balance wheel + hairspring ---- */
  const phase = T * TAU * balanceFreq;
  const balAngle = balanceAmp * Math.sin(phase);
  if(ANIM.balance){
    ANIM.balance.rotation.y = balAngle;
    if(ANIM.hairspring){
      ANIM.hairspring.rotation.y = balAngle * 0.55;
      const s = 1 + 0.035 * Math.sin(phase + 1.1);
      ANIM.hairspring.scale.set(s, 1, s);
    }
  }
  /* ---- pallet fork ---- */
  if(ANIM.pallet){
    const flip = Math.tanh(7 * Math.sin(phase * 2));
    ANIM.pallet.rotation.y = -2.05 + flip * 0.19;
  }

  /* ---- real-time hands ---- */
  const now = new Date();
  const sec  = now.getSeconds() + now.getMilliseconds()/1000;
  const min  = now.getMinutes() + sec/60;
  const hr   = (now.getHours()%12) + min/60;
  if(ANIM.hands.minute) ANIM.hands.minute.rotation.y = -min/60 * TAU;
  if(ANIM.hands.hour)   ANIM.hands.hour.rotation.y   = -hr/12 * TAU;
  if(ANIM.hands.second){
    const sTick = Math.floor(sec);
    const frac  = sec - sTick;
    const eased = 1 - Math.pow(1-frac, 7);
    ANIM.hands.second.rotation.y = -((sTick + eased)/60) * TAU;
  }

  /* ---- power reserve & winding ---- */
  if(winding > 0){
    winding = Math.max(0, winding - dt);
    const k = Math.sin((1.6-winding)*26) * (winding>0?1:0);
    if(ANIM.crown) ANIM.crown.rotation.x += dt*9;
    if(ANIM.barrelArbor) ANIM.barrelArbor.rotation.y += dt*7;
    if(ANIM.spring) ANIM.spring.rotation.y += dt*3.2;
  } else {
    power = Math.max(0, power - dt * 0.012);
  }
  // spring slowly unwinds
  if(ANIM.spring && winding<=0){
    ANIM.spring.rotation.y -= dt*0.006;
    const tight = 0.97 + power/100 * 0.05;
    ANIM.spring.scale.set(tight,1,tight);
  }

  /* ---- lume charge decay ---- */
  if(lumeCharge > 0){
    lumeCharge = Math.max(0, lumeCharge - dt*1.6);
    applyLume();
  }

  /* ---- reflection sync ---- */
  mirrorAccum += dt;
  if(mirrorRoot && mirrorAccum > 1/45){
    mirrorAccum = 0;
    syncMirror(watch, mirrorRoot);
  }

  /* ---- UI ---- */
  updateHUD(now);

  controls.update();
  composer.render();
  updateLabels();
}

function syncMirror(a,b){
  b.position.copy(a.position);
  b.quaternion.copy(a.quaternion);
  b.scale.copy(a.scale);
  for(let i=0;i<a.children.length;i++){
    if(a.children[i] && b.children[i]) syncMirror(a.children[i], b.children[i]);
  }
}

/* ---- HUD update (throttled) ---- */
let hudAcc = 0;
const clockTxt = $('#clockTxt'), pwTxt = $('#pwTxt'), pwBar = $('#pwBar'),
      beatDot = $('#beatDot'), ampTxt = $('#ampTxt');
function updateHUD(now){
  hudAcc += 1;
  if(hudAcc % 6 !== 0) return;
  const pad = n => String(n).padStart(2,'0');
  clockTxt.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const hours = power/100 * 72;
  pwTxt.textContent = hours.toFixed(1) + ' h';
  pwBar.style.width = power + '%';
  const beat = Math.abs(Math.sin(T * TAU * balanceFreq));
  beatDot.style.opacity = (0.18 + beat*0.82).toFixed(2);
  beatDot.style.transform = `scale(${(0.7 + beat*0.6).toFixed(2)})`;
  ampTxt.textContent = '±' + Math.round(255 + Math.sin(T*0.7)*15) + '°';
}

/* =======================================================================
   13.  GO
   ======================================================================= */
// warm up shaders so the first frames are smooth
renderer.compile(scene, camera);
animate();

// fade the loader
setTimeout(() => {
  $('#loader').classList.add('gone');
}, 700);

// fade the hint after first interaction
let hintFaded = false;
const fadeHint = () => {
  if(hintFaded) return;
  hintFaded = true;
  const h = $('#hint');
  h.style.opacity = '0';
};
window.addEventListener('pointerdown', fadeHint, { once:true });
window.addEventListener('wheel', fadeHint, { once:true, passive:true });

</script>
