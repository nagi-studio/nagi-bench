<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>北海 · 陨石</title>
    <script type="module" crossorigin src="./assets/film.js"></script>
  </head>
  <body>
    <div id="stage"></div>

    <!-- cinematic frame: hard letterbox bars, vignette, subtle grain -->
    <div id="frame">
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div id="vignette"></div>
      <div id="grain"></div>
      <div id="scan"></div>
    </div>

    <!-- title / credit cards -->
    <div id="card">
      <div class="card-inner">
        <div class="card-main" id="card-main"></div>
        <div class="card-sub" id="card-sub"></div>
      </div>
    </div>

    <!-- subtitle band, fixed bottom-centre -->
    <div id="subtitle" aria-live="polite"><span id="subtitle-text"></span></div>

    <!-- black transition curtain -->
    <div id="curtain"></div>

    <!-- boot / loading -->
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">北 海 · 陨 石</div>
        <div class="boot-sub">程序化体素电影</div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
        <div class="boot-status" id="boot-status">正在生成世界…</div>
      </div>
    </div>

    <!-- unobtrusive sound hint, never blocks playback -->
    <div id="sound-hint">点击任意处开启声音 · 空格暂停 · ← → 跳转 · R 重播</div>

    <!-- optional diagnostic HUD (H) -->
    <div id="hud">
      <span id="hud-time">00:00 / 00:00</span>
      <span id="hud-shot">—</span>
    </div>
    <div id="progress"><i id="progress-fill"></i></div>

  </body>
</html>
